artistBio: |
  Virgil Abloh hired him to paint a Nike mural at a Boys and Girls Club in
  Chicago. He painted the NBA All-Star broadcast team — Ernie, Shaq, Kenny, and
  Charles — during All-Star Weekend.

  Max Sansing came up through Chicago's graffiti crews DC5, RK, and CYA before
  entering the Gallery 37 Center for the Arts youth program and spending two
  years at the American Academy of Art. His style fuses street art dynamism with
  photorealistic technique — large-scale portraits of African Americans
  celebrating identity and community, in oil, acrylic, spray paint, and enamel
  on wood panels, canvas, and aluminum.

  His client list includes Nike, the Chicago Fire FC ("Stand For Chicago" mural
  in South Loop), and celebrity portraits of Barack Obama, Kris Bryant, Walter
  Payton, and Fred Hampton. He has shown at Thinkspace Projects in LA, POW! WOW!
  Hawaii, and Scope Miami Beach.

  For SHINE 2023, he painted in St. Petersburg.

searchBio: |
  Virgil Abloh hired him to paint a Nike mural at a Boys and Girls Club in
  Chicago. He painted the NBA All-Star broadcast team — Ernie, Shaq, Kenny, and
  Charles — during All-Star Weekend.

  Max Sansing was born and raised on the South Side of Chicago, in the Avalon
  Park neighborhood, by two artistic parents. His mother was an art teacher. His
  father, Ellis Sansing, worked for the Chicago Transit Authority. Ellis would
  take young Max along on errands, riding the Red Line at 79th Street and using
  his work-issued skeleton key to unlock the motorman's cab so they could ride
  in the operator seats with unobstructed views of Chicago's neighborhoods. That
  experience is the source of the skeleton key motif Sansing later embedded in
  his work — keys as metaphors for new pathways and doors waiting to be
  unlocked.

  He started tagging at 14, painting under expressways and on permission walls
  where graffiti writers had property-owner consent. He worked through markers,
  rollers, specialty caps, and aerosol cans, and joined three of Chicago's most
  prominent graffiti crews: Def Con 5 (DC5), the Recking Krew (RK), and the
  Criminal Young Artists Crew (CYA). As a teenager he signed up for the Gallery
  37 Center for the Arts Program, sponsored by the City of Chicago Department of
  Cultural Affairs, which hired artistically-inclined youth as summer
  apprentices. He taught himself oil painting, then enrolled at the American
  Academy of Art in Chicago, attending the private school for two years of
  formal training. He graduated from Kenwood Academy. He has also studied
  graphic design for two years, and describes his murals as a "gumbo" of
  graffiti, graphic design, and portraiture.

  His distinct aesthetic fuses the color-drenched dynamism of street art with
  the technical elegance of photorealism. Large-scale portraits of African
  Americans dominate his catalog, often rendered in midnight blue, emerald
  green, red, or purple skin tones — a humanist gesture meant to push viewers
  past the surface of color. Flames lick the tops of heads as a reminder to hold
  tight to passions and ambitions. Streaks of paint decorate cheeks. Keys hang
  at the necks of figures. He works in oil, acrylic, spray paint, vinyl paint,
  ball-point ink, and enamel on wood panels, canvas, and aluminum.

  Commissions and clients include Nike, the Chicago Fire FC (the "Stand For
  Chicago" mural in the South Loop, part of a program promoting locals who give
  back), and Virgil Abloh, who tapped him alongside Nike in February to paint a
  large mural installation at one of the Boys and Girls Clubs of Chicago —
  specifically the Dr. Martin Luther King Jr. Boys and Girls Club at 2950 W.
  Washington Blvd. on the West Side, where the gym mural is titled "The City is
  Yours." NBA All-Star Weekend in Chicago commissioned him to paint the NBA on
  TNT broadcast crew: Ernie Johnson Jr., Shaquille O'Neal, Kenny Williams, and
  Charles Barkley. Celebrity portrait subjects include President Barack Obama,
  Chicago Cubs third baseman Kris Bryant, Hall of Fame Chicago Bears running
  back Walter Payton, and Fred Hampton, Chairman of the Illinois Chapter of the
  Black Panther Party.

  Named Chicago murals include "Where Shall We Go?" (2017) at the Horween
  Leather Company on North Elston Avenue in Bucktown, showing a woman in a
  purple motorcycle helmet with a key floating above her hand; "Cheers" (2017)
  on the exterior of CH Distillery in Pilsen; "Equals, We" (2017) at 51st Street
  and South Calumet Avenue in Bronzeville; "Soaring Minds" (2018) at Michele
  Clark Magnet High School in South Austin on the West Side; "New Frontier, Same
  Old Nine" (2019) on the 1800 block of East 79th Street, painted with Kayla
  Mahaffey, showing a woman in a helmet, Bulls jersey, and cape; and "Culture is
  Power" at 79th Street and East End Avenue, set against a purple backdrop with
  five figures meant to convey family. Sepia at Woodlawn Works is among his
  projects with the Chicago Public Art Group. Damon Reed, a fellow muralist, has
  known him for more than 20 years. Jon Pounds, former director of the Chicago
  Public Art Group, has spoken about his work.

  Beyond Chicago, his murals reach Denver, Texas, Florida, Boston, Michigan, and
  Indiana. Gallery exhibition history with Thinkspace Projects in Los Angeles
  includes the solo show "Lost & Found" in the Main Room (2020), with works
  "Recovered," "Soldier On," "Eyes Forward," "Join Me," "I'll Be Waiting Right
  Here When Ya Find Me," "Give Me A Moment," "Feather Weight," "Keygen," and
  "Rapture (Same Ole Love)" — the last featuring Anita Baker in the background
  as a nod to the R&B he grew up hearing in the 1980s. Other Thinkspace shows
  include "Across the Pond" (2022, "When You See It"), "UNITY" at Volery Gallery
  in Dubai (2022, "Dark & Lovely"), "15 Years of Thinkspace" (2019, "Feels Like
  A Monday"), Scope Miami Beach 2019 ("Tunnel Vision II"), Moniker 2019 12x12s
  ("Tunnel Vision I"), POW! WOW! Hawai'i 2019 ("Wind Proof"), the POW! WOW! Long
  Beach group exhibition (2019, "The Point" — a portrait of Jean Baptiste Point
  Du Sable, recognized as the Founder of Chicago), and LAX / SFO Pt. III (2019,
  "My Walk About"). He has shown in Chicago, New York, and Miami.

  For SHINE 2023, he painted on the north-facing exterior wall of Trinity
  Lutheran Church in St. Petersburg, completed last week of October as
  documented by the Tampa Bay Times. He is involved with numerous youth programs
  that expand arts opportunities in underserved Chicago areas. Website:
  maxsansing.com. Instagram: @maxsansing.

searchMuralDescription: |
  A multi-story portrait on the north face of Trinity Lutheran Church depicting
  a young Black woman gazing outward with quiet intensity. Her face is rendered
  in photorealistic detail with warm brown skin tones, while her body dissolves
  into swirling, psychedelic layers of green, turquoise, purple, and gold —
  evoking geode cross-sections and topographic forms. A large hibiscus flower in
  peach and violet blooms at her shoulder, and deep blue flowers anchor the
  bottom of the composition. A red archway silhouette with palm trees appears
  within the flowing forms, and a bird silhouette flies above. A SHINE plaque is
  visible at the base.

