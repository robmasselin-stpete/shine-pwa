searchMuralDescription: |
  A photorealistic great horned owl rendered in detailed gray, brown, and cream
  tones dominates the wall. The owl faces forward with piercing orange-amber
  eyes. Behind it, a military-style star emblem in dark gray and radiating
  sunburst stripes in teal, coral, and orange fan outward against a warm orange
  background. Signed "Vitale Broz" in a small blue tag at lower left.

