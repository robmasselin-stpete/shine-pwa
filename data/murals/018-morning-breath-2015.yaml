searchMuralDescription: |
  Only a narrow vertical slice of Morning Breath's 2015 SHINE mural remains
  visible, sandwiched between a blue-painted building at 2044 and a newer white
  structure built in 2019 that obscured most of the original work. The surviving
  fragment shows their signature style on a golden-yellow background — bold
  black hand-lettering reading "WARNING," "UNSIGHTLY CROOKED," "A WICKED
  EYEFUL!," "PANIC," "Have a SECOND LOOK," and "SIGNS YOU NEED MONEY." A
  grinning skull, all-seeing eye, and the "Morning Breath" nameplate at top are
  still intact. A barber pole stands in front of the adjacent storefront. The
  address 2044 is visible on the blue building to the left, with a palm tree
  partially blocking the lower portion of the remaining mural.

