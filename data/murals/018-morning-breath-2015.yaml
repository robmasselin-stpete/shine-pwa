artistBio: |
  They met at Think Skateboards in San Francisco in 1996. They have designed
  over a hundred album covers since.

  Doug Cunningham and Jason Noto are Morning Breath Inc., a Brooklyn-based
  design studio they formalized in 2002. Cunningham studied at the Academy of
  Art University in San Francisco. Their style pulls from 1950s-1980s Americana
  — comics, Mad magazine, punk rock, hip-hop, heavy metal, and skateboard
  graphics — rendered in limited color palettes with bold lines.

  The client list is absurd: Foo Fighters, Kanye West, Jay-Z, Eminem, Slayer,
  Queens of the Stone Age, AFI. Brands: Vans, Adidas, Ray-Ban, Absolut Vodka,
  MTV, KFC (a full restaurant redesign). They won the Grammy for Best Recording
  Package in 2021 for Desert Sessions Vols. 11 and 12 — a Josh Homme project
  with a mix-and-match booklet and sticker set. They have published two
  monographs: The Early Bird (2007) and By the Skin of Our Teeth (HarperCollins,
  2016).

  Their SHINE 2015 mural on Central Avenue is mostly hidden behind new
  construction — only a narrow vertical slice survives. They returned for SHINE
  2019 with a 101-foot-wide piece at 250 Dr. MLK Jr. Street North in their
  signature black-white-and-red style: open lips, aviator sunglasses, a smiling
  devil face.

searchBio: |
  They met at Think Skateboards in San Francisco in 1996. They have designed
  over a hundred album covers since.

  Doug Cunningham and Jason Noto started together as the in-house design
  department at Think, a small skateboard company in San Francisco. That is
  where they developed the shared visual language and collaborative approach
  that still defines their work. In 2002 they formalized the partnership as
  Morning Breath, Inc., a boutique design studio based in Brooklyn, New York.
  Cunningham studied at the Academy of Art University in San Francisco.

  The studio is multidisciplinary. What started in skateboarding culture quickly
  expanded into music packaging, apparel, advertising, and poster design, plus
  an extensive body of personal and gallery work. The aesthetic pulls from 1950s
  through 1980s Americana — comics, Mad magazine, punk rock, hip-hop, heavy
  metal, and skateboard graphics — rendered in limited color palettes with bold
  lines. The blend of retro themes and fonts with a modern punk twist produces
  clean, bright, often funny work.

  The client list runs across music, fashion, and global brands. Music: Foo
  Fighters, Kanye West, Jay-Z, Eminem, Slayer, Queens of the Stone Age, AFI.
  Brands: Vans, Adidas, Ray-Ban, Absolut Vodka, MTV, Pepsi, and KFC, where they
  handled a full restaurant redesign. The album-packaging output alone passes
  one hundred covers.

  In 2021 they won the Grammy Award for Best Recording Package for Desert
  Sessions Vols. 11 and 12, the Josh Homme project credited to The Desert
  Sessions. The package is built around a mix-and-match booklet and sticker set.
  The award is presented by the National Academy of Recording Arts and Sciences
  to the art directors of the winning album — Cunningham and Noto in this case —
  and sits in a category whose recent winners include Jonathan Barnbrook for
  David Bowie's Blackstar (2017), Willo Perron for St. Vincent's Masseduction
  (2019), and Charli XCX, Brent David Freaney and Imogene Strauss for Brat
  (2025).

  They have published two monographs. The Early Bird came out in 2007. By the
  Skin of Our Teeth: The Art and Design of Morning Breath was released by
  HarperCollins in 2017 (with a 2016 imprint date) as a comprehensive look at
  the studio's work and creative evolution. The Daily Beast covered the book in
  December 2017 in a piece by Sarah Rogers titled "Inside the Work of Morning
  Breath, A Pop-Art Design Duo."

  The studio has been featured in numerous design publications and Cunningham
  and Noto have been invited to speak about and present their work
  internationally. They continue to divide their time between commercial
  assignments and personal and gallery projects.

  In St. Petersburg they have painted twice for the SHINE Mural Festival. Their
  2015 piece on Central Avenue is mostly hidden now behind new construction —
  only a narrow vertical slice survives. They returned for SHINE 2019 with a
  101-foot-wide mural at 250 Dr. MLK Jr. Street North, executed in their
  signature black, white, and red palette: open lips, aviator sunglasses, and a
  smiling devil face.

