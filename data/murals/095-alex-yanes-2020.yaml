artistBio: |
  This wall is one fish in eighteen hand-cut panels. He calls it "Rise Above" —
  for the Biscayne Bay he grew up on and the sea level rising over it.

  Alex Yanes is a Miami-born, Cuban-American artist who went full-time in 2006.
  His work pulls from the skateboard, tattoo, hip-hop, and rock cultures he grew
  up in during 80s and 90s Miami — bright color, bold graphic forms, characters
  with personality. He has been a staple in Wynwood and has shown at galleries
  in Los Angeles, New York, Chicago, San Francisco, Detroit, Philadelphia,
  London, Paris, Berlin, Australia, and Japan.

  For SHINE 2020, he made "Rise Above" at the St. Pete Museum of History — a
  multi-level installation of eighteen precisely hand-cut, hand-painted panels
  that combine into a displaced fish. The piece was commissioned through Sea
  Walls, the public-art arm of PangeaSeed Foundation, which partnered with SHINE
  in 2020 to focus the festival on ocean conservation. He grew up on his dad's
  boat in Biscayne Bay — dolphins, manatees, sea turtles — and now takes his
  daughters to the same spots, watching the ecosystem disappear.

searchBio: |
  This wall is one fish in eighteen hand-cut panels. He calls it "Rise Above" —
  for the Biscayne Bay he grew up on and the sea level rising over it.

  Alex Yanes is a Miami-born, Cuban-American artist who decided to pursue art
  full-time in 2006. His work draws from the skateboard, tattoo, hip-hop, and
  rock cultures of 80s and 90s Miami — vibrant color, bold characters, an
  autobiographical thread that traces his decades in the city. He has been a
  staple in Miami's Wynwood arts district and has shown at galleries in Los
  Angeles, New York, Chicago, San Francisco, Detroit, Philadelphia, London,
  Paris, Berlin, Australia, and Japan.

  For SHINE Mural Festival 2020, he created "Rise Above" at the St. Petersburg
  Museum of History (335 2nd Ave NE). It is a multi-level installation of
  eighteen precisely hand-cut, hand-painted panel pieces that combine into the
  image of a displaced fish. The hand-painted panels are intended to mimic an
  intricate jigsaw puzzle, representing the interconnection of factors that
  comprise the cause and effects of sea-level rise. The piece was commissioned
  through the Sea Walls program, which collaborated with SHINE in 2020. Sea
  Walls is the public-art arm of PangeaSeed Foundation, an organization that
  uses ARTivism to raise awareness about ocean conservation issues.

  In his artist statement for "Rise Above," Yanes writes about growing up on his
  dad's boat in Biscayne Bay surrounded by dolphins, manatees, and sea turtles,
  and now taking his two daughters to the same spots and watching the ecosystem
  decline. He cites destructive erosion, coastal and inland flooding,
  agricultural runoff, toxic algae blooms, and massive fish kills as the visible
  consequences he has watched accumulate over the last decade. The title "Rise
  Above" frames the response — collectively cutting fossil fuels and limiting
  carbon emissions to reduce the impact.

  Website: alexyanes.com. Instagram: @alexyanes. The "Rise Above" installation
  is documented on the Sea Walls site at seawalls.org/mural/rise-above/.

