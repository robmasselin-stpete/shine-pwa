artistBio: |
  Florida pulled five St. Pete street murals in summer 2025 under SB 1662 —
  Progressive Pride, Black History Matters, Fluid Structures, Common Ground,
  Crossway Crux. The Love Thy Neighbor Project responded by painting free murals
  on private property, where the state can't reach. This is one of them.

  Zac "Lyko" Shaffer co-led the project in August 2025 with Jazzy Erickson,
  alongside founder Michelle Sasha of ArtFluent Creatives. His piece is a
  Florida nature scene — a mockingbird, magnolia blossoms, a golden orange, and
  zebra longwing butterflies on a sky-blue background. Quieter than the murals
  the state removed, but the gesture is the same.

  Lyko is a St. Petersburg-based multi-media artist working under the brand Lyko
  Creations.

searchBio: |
  Zac "Lyko" Shaffer — Lyko Creations — is a St. Petersburg-based multi-media
  artist.

  In August 2025 he co-led the Love Thy Neighbor Project with Jazzy Erickson, a
  community mural initiative founded by Michelle Sasha of ArtFluent Creatives.
  The project painted free inclusivity murals on private properties in St.
  Petersburg as a response to Florida's removal of public street murals — five
  St. Pete murals (Progressive Pride, Black History Matters, Fluid Structures,
  Common Ground, Crossway Crux) were removed by FDOT under SB 1662 (signed by
  Gov. DeSantis, June 2025).

  This mural was painted in 2025 — a Florida nature scene with a mockingbird,
  magnolia blossoms, a golden orange, and zebra longwing butterflies. Not an
  official SHINE Origins 2025 piece.

  Instagram: @lyko.creations. Website: lykocreations.com.

searchMuralDescription: |
  A panoramic Florida nature scene on a blue cinder block wall. On the left, a
  gray-and-white mockingbird perches on a dark branch. At center, green magnolia
  leaves and a white magnolia blossom frame a large golden-orange citrus fruit.
  On the right, two zebra longwing butterflies with black and white striped
  wings flutter near the foliage. The palette is naturalistic — sky blue
  background, rich greens, and warm gold — celebrating Florida's native wildlife
  and flora.

