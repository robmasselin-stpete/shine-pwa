searchMuralDescription: |
  A vibrant retro-style mural framed by a painted trompe-l'oeil wooden frame
  with visible grain and nail heads. On the left, a pin-up cowgirl with brown
  curls, a red cowboy hat, and a studded red bustier smiles confidently. On the
  right, a cowboy in blue jeans and hat swings a lasso while riding a green
  alligator through a tropical Florida landscape — palm trees, hibiscus flowers,
  a sandy beach, and a warm sunset sky. "Ride 'em Cowboy" is lettered in bold
  cursive across the top center. The Vitale Bros signature is visible at the
  bottom left. The whole piece has a classic Americana postcard feel with a
  distinctly Florida twist.

