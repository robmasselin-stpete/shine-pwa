artistBio: |
  Osiris Rain studied painting in Florence and apprenticed on Odd Nerdrum's
  farm in Norway. For SHINE 2026 he brings that classical training to a
  modernist landmark: St. Pete's 1961 "Round Bank," the ceary school. At 16 he
  left high school for the Angel Academy of Art in Florence. In 2005, at 19,
  he was one of 13 painters picked from more than 500 applicants to apprentice
  with Nerdrum. He spent years in film, rigging sets and then painting
  scenery, and turned to murals when North Carolina cut its film incentives.

  His studio describes the work as classical realism, layered abstraction and
  symbolic geometry. "It's usually emotion first," he has said of his figures,
  "and then I design the movement or pose around it."

  In Longmont, Colorado, "Architecture of Time" wraps all four sides of a
  parking deck, 5,000 square feet of aerosol by the city's count, a job he won
  through a national call that drew more than 100 submissions. In Charlotte's
  NoDa neighborhood he painted his lotus mural "Bloom" over his own Stella
  Artois ad in 2017, at his own expense, and painted it back after a crew
  covered it by mistake in 2022. "Hitchhikers," a Route 66 tribute he painted
  with Emily Ding in Springfield, Missouri, won National Silver and Regional
  Gold at the 2026 National Mural Awards. He has also painted in Catalonia and
  Utah.

  He has a St. Pete history already. He met the muralist Marcus Debie at a
  mural festival here in 2018, and in 2025 the two painted facing walls in
  South Salt Lake, Utah. Back in Charlotte he founded the North Carolina
  Academy of Art, co-founded the Can Jam CLT mural festival, and co-founded
  and manages the TAOH Outdoor Gallery, a legal graffiti park in NoDa.

  The Skyline Building went up in 1961 for Security Federal Savings and Loan,
  designed by the Peruvian-born modernist W.A. Sarmiento. Locals called it the
  Round Bank, and for years its sixth floor held the Skyline Room restaurant.
  For SHINE 2026, the festival's twelfth year, he is painting bands on the
  building.

searchBio: |
  '[0fOsiris Rain studied painting in Florence and apprenticed on Odd
  Nerdrum's farm in Norway. For SHINE 2026 he brings that classical training
  to a modernist landmark: St. Pete's 1961 "Round Bank," the circular Skyline
  Building on Dr. MLK Jr. Street North.

  In Longmont, Colorado, one Osiris Rain mural spans twelve faces of a parking
  deck and wraps all four sides. That's 5,000 square feet of aerosol, by the
  city's count, and he won the job through a national call that drew more than
  100 submissions. "Architecture of Time" (2026) wraps the Hotel Longmont
  parking structure at 321 Kimbark Street, with its most prominent section
  facing east toward the Longmont Civic Center. His statement for it: "Much
  like architecture gives form to physical space, the symbols, patterns and
  narratives woven throughout the composition create a structure for
  collective memory." The city's selection ran from blind review to three
  semi-finalists who presented in public, then a community panel.

  The training underneath is classical. He was born in 1986 and grew up in
  Waxhaw, North Carolina, on a ten-acre homestead, studied painting with a
  private tutor from elementary school, and dropped out of high school in his
  junior year to take classes at the Angel Academy of Art in Florence, Italy.
  He left home at 17 to study art in Italy, Canada and Norway. He has said he
  ran out of money about six months into Florence, so the training there was
  brief. In 2005, at 19, he was one of 13 painters, picked from more than 500
  applicants, to apprentice with the Norwegian painter Odd Nerdrum, a summer
  at Nerdrum's farm and studio in Stavern, Norway. The most important thing he
  took from Nerdrum, he told Southwest Art, was "the importance of empathy in
  painting." Southwest Art profiled him as an emerging artist in its July 2014
  issue. Before murals took over he worked in film, first rigging sets and
  later as a scenic painter, where the murals "tended to be time-period
  specific"; in 2012 he was on the set of "Iron Man 3" in Wilmington. When
  North Carolina cut its film incentives he turned to murals, painting signs
  for local businesses in the first year.

  His 2015 painting "An Unbearable Darkness," a Caravaggio-like study of his
  father, hangs in MEAM, the European Museum of Modern Art in Barcelona. His
  studio also lists the National Portrait Gallery in London among the places
  his work has been collected or shown. He has been featured in Fine Art
  Connoisseur, Southwest Art, Juxtapoz, The Huffington Post and Queen City
  Nerve, by his studio's list.

  His own studio describes the work as classical realism, layered abstraction
  and symbolic geometry, used to explore history, identity, memory and the
  bond between people and place. "It's usually emotion first," he told
  Creative Loafing in 2012, "and then I design the movement or pose around
  it." In 2017 he told Creative Loafing he had become "obsessed with these
  black-and-white figurative pieces, accented by really bold touches of
  color." In Matthews, North Carolina, a 2021 wall outside the Loyalist Market
  on North Trade Street folds the town's farming past into abstraction, with
  what the market's owner describes as a mother cow and her calves. "It's
  meant to be playful," he said. "It's meant to bring energy to the area."

  In Charlotte's NoDa neighborhood, at North Davidson and 35th Street, Stella
  Artois hired him in 2017 to paint a promotional mural. Shortly before he
  started he broke his ankle skateboarding, so he painted it from a ladder in
  a cast, July 15 to 21, through a heat index he put at about 115 degrees.
  When the six-month lease ended he painted his lotus mural "Bloom" over the
  ad, a symbol of rebirth and renewal. "I repainted the entire thing on my own
  dime, so that it could be a neighborhood piece as opposed to an
  advertisement," he told the Charlotte Observer. It was "a staple," he said,
  until a painting crew hired to cover a different mural on the building
  covered it by mistake in 2022. "The entire wall was completely painted,
  nobody had any idea what happened," he told WBTV. He painted it back, lotus
  kept, rather than redo the old piece exactly.

  "Hitchhikers," a Route 66 tribute he painted with Emily Ding at Birthplace
  Plaza in downtown Springfield, Missouri, during the Overlay Art and Culture
  Festival, won National Silver and Region 5 Gold at the 2026 National Mural
  Awards. At the 2024 National Mural Awards he took Bronze in Region 1, New
  England, for "From It Sprung the Commonwealth," a wall in Worcester,
  Massachusetts. His studio also lists a 2024 Charlotte URBIES People's Choice
  Award and a 2024 Best in the Nest award, both for the TAOH Outdoor Gallery.
  Other public work includes a Vernon Grant mural for the York County
  Library's Rock Hill branch in South Carolina in 2022, and walls in Kansas
  City and South Salt Lake, Utah. His studio's client list includes Charlotte
  Douglas International Airport, Charlotte Mecklenburg Library, the City of
  Kansas City, Boys and Girls Clubs of America, Meta, Under Armour, Credit
  Karma, Sierra Nevada and Stella Artois. In 2019 he painted "Dogfather" in
  Navarcles, Catalonia, with the local artist Osirisencolor, whom he met on
  Instagram because they share a name. In Charlotte, Bisnow reported in 2018
  that future residents of the NOVEL Stonewall Station apartments were asking
  for units that looked onto his courtyard mural. He met the muralist Marcus
  Debie at a mural festival in St. Petersburg, Florida, in 2018; in 2025 the
  two painted "The Space Between," facing walls of a parking garage at the
  Bowers Residences in South Salt Lake, Utah, for the city's Mural Fest, built
  around the bowerbird.

  Back in Charlotte he founded the North Carolina Academy of Art, co-founded
  the Can Jam CLT mural festival, and co-founded the TAOH Outdoor Gallery with
  fellow muralists Sydney Duarte and Treazy Treaz, a legal graffiti park in
  NoDa he got off the ground with a city grant and now manages. TAOH stands
  for The Awakening of Humanity. The park sits at 2200 North Brevard Street
  beside the light rail and held its grand opening in September 2024. The idea
  came from Barcelona's Jardins de les Tres Xemeneies, which he visited in
  2019. He remembers having to "run through this trainyard more times than I
  ever wanted to" as a young graffiti writer. A sign at the entrance tells the
  artists who use the walls now: "Imagine your artwork as a sandcastle."

  The Skyline Building went up in 1961 for Security Federal Savings and Loan,
  designed by the Peruvian-born modernist W.A. Sarmiento, who designed
  hundreds of banks after the war. Rumored to take its cue from Frank Lloyd
  Wright's Guggenheim, its seven-story round tower shocked the neighbors in
  Woodlawn and Crescent Heights. Locals called it the Round Bank. Children who
  opened savings accounts there got a coin bank shaped like the building, and
  from 1962 its sixth floor was the Skyline Room, known for its views of Tampa
  Bay; it later became Jay Galbraith's Penthouse Restaurant and Lounge. Grow
  Financial Credit Union was its most recent tenant.

  For SHINE 2026, the festival's twelfth year, Osiris Rain is painting bands
  on the main building of Skyline Campus, 2600 Dr. MLK Jr. Street North.

