artistBio: |
  Jimmy Breen and Anthony Freese were co-founders of Wax & Hive, a design studio based in St. Petersburg. Both graduated from the USF St. Petersburg graphic design program and collectively had over two decades of professional experience in illustration and graphic design. Their client list included Cardi B, Blake Shelton, Bloomin' Brands, and Hunger & Thirst Group. Breen was also a Senior Illustrator at Warner Music Group, creating artwork for the Grateful Dead, Michael Bublé, Green Day, and Bruno Mars. The two were fixtures in St. Pete's creative scene and known for bold, graphic, pop-art-influenced illustration work that blended tattoo culture, vintage signage, and clean design. They painted "Lucky You" for SHINE 2019 and also completed an interior courtyard mural for the 1701 Central apartment building's 2020 grand opening. Jimmy Breen passed away unexpectedly on June 20, 2022, at the age of 37. He is remembered as one of St. Pete's most prolific and beloved muralists.

muralDescription: |
  An 18-by-42-foot mural on the parking garage of the 1701 Central apartment building, facing I-275 North and visible to highway traffic. The piece is a 3-by-5 grid of panels depicting good luck symbols from cultures around the world, inspired by the idea that "we're all lucky to live in Saint Pete." Each panel features a bold graphic illustration rendered in a pink, blue, yellow, black, and red color scheme. The symbols include: "Good Luck" in black cursive script, a Lincoln penny, a pair of dice, crossed fingers, an anchor, a ladybug, an Italian cornicello on a chain, a Japanese maneki-neko (beckoning cat), a yellow smiley face, a Chinese lucky bat, an anatomical heart, a horseshoe pointing up, a shooting star, a bird on a branch, a hamsa hand with an evil eye, and a four-leaf clover. The style is clean, graphic, and pop-art-influenced with bold black outlines and limited flat color fills.

