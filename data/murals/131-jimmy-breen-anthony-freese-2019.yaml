searchMuralDescription: |
  An 18-by-42-foot mural on the parking garage of the 1701 Central apartment
  building, facing I-275 North and visible to highway traffic. The piece is a
  3-by-5 grid of panels depicting good luck symbols from cultures around the
  world, inspired by the idea that "we're all lucky to live in Saint Pete." Each
  panel features a bold graphic illustration rendered in a pink, blue, yellow,
  black, and red color scheme. The symbols include: "Good Luck" in black cursive
  script, a Lincoln penny, a pair of dice, crossed fingers, an anchor, a
  ladybug, an Italian cornicello on a chain, a Japanese maneki-neko (beckoning
  cat), a yellow smiley face, a Chinese lucky bat, an anatomical heart, a
  horseshoe pointing up, a shooting star, a bird on a branch, a hamsa hand with
  an evil eye, and a four-leaf clover. The style is clean, graphic, and
  pop-art-influenced with bold black outlines and limited flat color fills.

