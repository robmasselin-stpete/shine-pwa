artistBio: |
  Jimmy Breen designed artwork for the Grateful Dead, Michael Bublé, Green Day,
  and Bruno Mars. He died on June 20, 2022. He was 37.

  Breen and Anthony Freese co-founded Wax & Hive, a design studio in St.
  Petersburg. Breen graduated from the USF St. Petersburg graphic design
  program. Together they had over two decades of combined experience in
  illustration and graphic design. Breen was a Senior Illustrator at Warner
  Music Group. Freese kept the studio going.

  Their style is bold, graphic, pop-art-influenced — tattoo culture meets
  vintage signage meets clean design. Their client list ran from Cardi B and
  Blake Shelton to Bloomin' Brands and Hunger & Thirst Group. They were fixtures
  in St. Pete's creative scene.

  For SHINE 2019 they painted "Lucky You" on the parking garage of the 1701
  Central apartment building, facing I-275 — eighteen by forty-two feet, a grid
  of good luck symbols including a horseshoe, a four-leaf clover, a shooting
  star, a ladybug, and a smiley face. The premise: "we're all lucky to live in
  Saint Pete." They followed it with an interior courtyard mural for the
  building's 2020 grand opening.

  Breen is remembered as one of St. Pete's most prolific and beloved muralists.

