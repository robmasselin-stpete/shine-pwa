artistBio: |
  Nicole Salgar is a Cuban-Colombian visual artist and muralist who grew up in Miami. She attended Design & Architecture Senior High (DASH), then headed to New York City to study fashion design at the Fashion Institute of Technology, earning her bachelor's degree with a focus on tailoring. She spent about seven years in the fashion industry designing for Ralph Lauren and other major labels before pivoting to art full-time. Her mural career kicked off in 2013 with a collaboration on the Centre-Fuge Public Art Project on Manhattan's Lower East Side, and she went on to co-found NS/CB studio, producing research-driven murals across the U.S. and internationally. Her style draws on Latin American folk art, indigenous imagery, mythology, cinema, and the cultures she encounters while traveling — she gravitates toward vivid colors with contrasting accents and often paints large-scale female portraits that function as "gatekeepers to other dimensions," blending surreal and symbolic elements into figurative work. Through residencies and festivals, she has painted walls in Israel, Mexico, Spain, Cuba, Puerto Rico, and across the United States. Her commercial client list includes Starbucks, Absolut, Tanqueray, Steve Madden, Lululemon, and Bacardi. She painted "Viaje Despierto" at Disney Springs for Hispanic Heritage Month in 2024, and in 2025 was one of thirteen artists selected to paint directly on the gallery walls of the Dali Museum in St. Petersburg for their first-ever murals exhibition, "Outside In: New Murals Inspired by Dali." She relocated from Miami to St. Petersburg in December 2023.

muralDescription: |
  A large-scale mural covering the entire side wall of Cimco Tile in a striking limited palette of muted reds, teals, greens, and pinks. The left side features a photorealistic portrait of a young woman gazing directly at the viewer with an intense, contemplative expression. Her face is rendered in soft green and warm tones, with horizontal red striped shadows — like light through blinds — falling across her forehead and the wall behind her. Lush tropical leaves in deep reds and teals frame her face and extend across the right side of the wall, interwoven with chain-link fence imagery and bold geometric red shapes. A large flower blooms on the far right, wrapping around the building's roll-up door. Signed "ns" on the left side. The piece explores themes of parallel dimensions and transformation, with the subject serving as a gatekeeper between worlds.

