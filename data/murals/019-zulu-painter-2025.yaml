artistBio: |
  He calls them "Mindful Murals." He wants to grow art everywhere.

  Carlos Culbertson — Zulu Painter — is a native West Virginian who started
  pursuing art at age eight. He holds a degree in fine arts painting and now
  works out of a studio at the ArtsXchange on 22nd Street South. He paints in
  acrylic and spray paint, favors reclaimed materials, and has worked as a
  scenic artist for Disney on Ice, the Science Channel, HSN, and SeaWorld Parks
  and Entertainment.

  His mural projects span the country: Denver, Chattanooga, Atlanta, Austin,
  Miami, Las Vegas, Los Angeles, Kansas City, Flint, and Binghamton, New York —
  where he painted "Cultivate Kindness," a 40-foot mural with West Side Middle
  School students. In St. Pete, he painted murals at CASA Family Justice Center
  on Arlington Ave (domestic violence survivor themes) and a portrait of Betty
  Reid Soskin at the Florida Botanical Gardens in Largo.

  He is a four-time SHINE artist — "Moon Beam Dream 2" in 2016, "Legacy" with
  Thirst in 2017, "Wisdom, Growth, Progress" in 2018, and the AMIKids wall in
  2024. He received a St. Pete Arts Alliance Muse Award in 2022. He also
  collaborated with Reid Jenkins and Iboms on "Imagine Gas Plant and Laurel
  Park" at Campbell Park Recreational Center.

searchBio: |
  He calls them "Mindful Murals." He wants to grow art everywhere.

  Carlos Culbertson — Zulu Painter — is a native West Virginian who started
  pursuing art at elementary school age and never looked back. He holds a degree
  in fine arts painting and works out of his studio at the ArtsXchange in St.
  Petersburg, located at 515 22nd Street South, Studio 111, St. Petersburg, FL
  33712. He works in acrylic and spray paint, favors reclaimed materials, and
  produces work across traditional mediums, body paint, special effects, and
  scenic art.

  His scenic art client list includes The Science Channel, Disney on Ice, Home
  Shopping Network (HSN), SeaWorld Parks and Entertainment, and a series of
  national ad campaigns. He has also served as a Representative Artist for Visit
  Florida, the state's tourism agency.

  His mural work spans the country: Denver, Chattanooga, Atlanta, Austin, Miami,
  Las Vegas, Los Angeles, Kansas City, Flint, Sanford (FL), Jacksonville, and
  Binghamton, New York. In Binghamton he painted "Spread Love" — an
  approximately 40-foot mural on the M&T Bank building at 68 Exchange Street —
  using Golden Paintworks Mural & Theme Paint and Kobra Spray Paint. The mural
  depicts the butterfly effect of good deeds: watering a single rose creates the
  outlines of others. He was presented with a certificate of recognition for the
  piece by Broome County executive Brian Garner. He has painted at Paint Memphis
  2019, the 2018 Colorado Black Arts Festival, the 48 Hour Mural Competition in
  Jacksonville, Florida (September 29, 2023), the HULAWEEN Spirit of Suwannee
  Lake Music and Art Festival, and the Art With Me Art and Music Festival in
  Miami.

  In St. Petersburg, he painted the murals at the CASA Family Justice and
  Support Centers on First Avenue North — work dedicated to domestic violence
  survivor themes, including a depiction of a woman with an outstretched hand
  among bright geometric patterns, flowers, children, and a mother. As Painter
  described it, "The CASA Mural is a mural dedicated to the idea of a helping
  hand. CASA helps children and families to have a safe environment — so I
  wanted the mural to depict that." For the 2024 Pinellas African American
  Heritage Celebration on February 24 at the Florida Botanical Gardens (12520
  Ulmerton Road, Largo), he was selected as the representative artist and
  painted a likeness of Betty Reid Soskin — the Black woman who served as a
  100-year-old Park Ranger for the National Park Service before retiring in
  2022. Children at the event helped complete a section of the canvas designed
  for that purpose.

  He is a four-time SHINE Mural Festival artist: "Moon Beam Dream 2" in 2016,
  "Legacy" with Thirst in 2017, "Wisdom, Growth, Progress" in 2018 as part of
  his 22nd Street Legacy series, and the AMIKids wall in 2024. He returned to
  SHINE for SHINE Origins 2025, painting at 31st Street and 7th Avenue South
  alongside Elizabeth Barenis, Amy Volpe, Karel Garcia, Brain the Genius,
  Jenipher Chandley, and Rebekah Lazaridis. He also collaborated with Reid
  Jenkins and Iboms on "Imagine Gas Plant and Laurel Park" at Campbell Park
  Recreational Center.

  In 2022 he received a St. Petersburg Arts Alliance Muse Award, alongside
  fellow 2022 honorees Matthew McGee, Gloria Muñoz, David and Becky Ramsey, Chad
  Mize, and Matthew Walker. The ceremony was held March 4, 2022 at the Morean
  Center for Clay in the Warehouse Arts District, hosted by Paul Wilborn and
  Eugenie Bondurant. He has also been recognized with a 2021 Business Arts
  Award, was a winner of the 2021 UF Big Idea Competition, has been published in
  a Springer Scientific Journal, and was featured in the Innovate Gainesville
  Book.

  His SHINE Festival murals are featured in the St. Petersburg Arts Alliance's
  accessible audio tour, including the 22nd Street Legacy series ("Wisdom,
  Growth, Progress") and "Moonbeam Dreams." He has spoken about his motivation
  in framing public art as a community gesture: "Public art has the immediate
  opportunity to affect the community. It requires no fee to enter, is open year
  round and flash photography is allowed. Everyone can enjoy public art." He has
  also said his goal with the Betty Reid Soskin mural and his work generally is
  for children to see "artists and Park Rangers that look like them."

  His studio is open Monday through Friday, 9am to 6pm. Contact:
  info@zulupainter.com, 727-768-4737. Website: zulupainter.com. Instagram:
  @zulupainter1. Facebook: facebook.com/ZULUPAINTER1.

searchMuralDescription: |
  A vibrant mural on a cinder block wall blending multiple styles. The left side
  features a photorealistic portrait of a young Black woman in profile against a
  houndstooth pattern with a boombox rendered in grayscale. The center and right
  side shift to a cartoon aesthetic — a wild-eyed character with a mischievous
  grin faces off against a massive green alligator with bared teeth, set against
  a turquoise geometric diamond pattern and black-and-white checkerboard.
  Colorful polka dots in orange, pink, and yellow punctuate the composition.
  Signed "zulupainter.com" in the lower right.

