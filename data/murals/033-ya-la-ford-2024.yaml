artistBio: |
  Ya La'Ford is a multidisciplinary artist working between Tampa Bay and
  New York. She holds an MFA from the Art Institute of Boston and a Juris
  Doctor from the University of Florida — a rare combination that informs
  her approach to large-scale public art commissions. Her geometric,
  pattern-driven murals and installations have earned projects with Nike,
  the NBA, and a piece honoring Maya Angelou, with permanent work at the
  Boston Public Library and the Dr. Carter G. Woodson African American
  Museum in St. Petersburg.

  In addition to painting, she teaches and maintains an active studio
  practice spanning installation, sculpture, and fine art. She has
  participated in the SHINE Mural Festival multiple times, and her bold
  use of interlocking geometric forms has become a recognizable part of
  St. Pete's downtown mural landscape.

muralDescription: |
  A large heart shape on a dark charcoal wall, filled entirely with
  intricate orange geometric line patterns — angular, interlocking shapes
  that create a dense, woven texture within the heart. "Love Shines" is
  written across the center in flowing white cursive script. The Ya La'ford
  signature and @yalaford tag appear below the heart, and an orange Smith &
  Associates Real Estate plaque sits at the lower right.

