artistBio: |
  Tes One co-founded the SHINE Mural Festival. The Vitale Bros have been
  painting Tampa Bay walls since 1992. In 2020, they started painting together.

  Up & Over is Leon "Tes One" Bedore and the Vitale Brothers — Johnny, Paul, and
  crew. Tes One started tagging at fourteen in 1992, came up through the
  Pinellas County Center for the Arts at Gibbs High School, and built a career
  spanning Nike, L'Oreal, Absolut Vodka, Toyota, The New Yorker, Architectural
  Digest, and the Brooklyn Nets. In 2012 he curated "Leave a Message" at the
  Morean Arts Center — the show that planted the seed for SHINE. He co-founded
  the festival in 2015. His thirty-year retrospective "Good Intentions" showed
  at the Morean in 2022, and he was featured in the Dali Museum's "Outside In"
  exhibition in 2025.

  Together, their style merges Tes One's bold graphic design and typography with
  the Vitale Bros' figurative realism and pop culture sensibility. Their
  wraparound mural at the building now branded DFCU Financial in downtown St.
  Pete (originally painted for First Citrus Bank) is a local landmark. They have
  also painted for the Tampa Bay Buccaneers and Duke Energy.

  For SHINE's 10th anniversary in 2024, they painted at 2214 2nd Ave North — a
  full-circle moment: the festival's founder painting alongside the city's most
  prolific muralists.

searchBio: |
  Tes One co-founded the SHINE Mural Festival. The Vitale Bros have been
  painting Tampa Bay walls since 1992. In September 2020, they started painting
  together under the name Up & Over.

  Leon "Tes One" Bedore (born c. 1977) started tagging at fourteen in 1992 and
  came up through the Pinellas County Center for the Arts at Gibbs High School.
  He built a career spanning Nike, L'Oreal, Absolut Vodka, Toyota, The New
  Yorker, Architectural Digest, MTV, and the Brooklyn Nets. In 2012 he curated
  "Leave a Message" at the Morean Arts Center — the show that planted the seed
  for what became the SHINE Mural Festival. He co-founded and co-curated the
  inaugural festival in 2015, which brought 17 murals to downtown and has since
  produced nearly 170. His thirty-year retrospective "Good Intentions" showed at
  the Morean in 2022. He was featured in the Dali Museum's "Outside In"
  exhibition in 2025. Awards include Urban Excellence Social Impact Award (Tampa
  Downtown Partnership, 2017), Arts Ambassador Award (St. Petersburg Arts
  Alliance, 2016), and Best Public Art and Best Art Festival (Best of the Bay,
  2015). Featured in Juxtapoz Magazine, Flair Magazine, and Designing Obama.

  The Vitale Brothers — Johnny, Paul, and crew including Nick and Jason Kekllas,
  Bruce Statton, and Jake Gerow — have been painting since 1992. Their warehouse
  studio hosted legendary art and music shows in the late 1990s that helped
  build St. Pete's arts scene. Clients include the Tampa Bay Rays, Tampa Bay
  Buccaneers, and L'Oreal SalonCentric.

  Together as Up & Over (tagline: "STAY UP & GET OVER™"), they operate as a
  Tampa Bay-based mural studio serving Tampa, St. Petersburg, Clearwater,
  Orlando, Dunedin, Largo, Ft. Lauderdale, and Miami. The studio's portfolio at
  upandovermurals.com spans community, commercial, and residential public art.
  Documented projects include "Viva Tampa" ("an epic mural collage dedicated to
  Tampa Bay"), "Immaculate" (a depiction of the Immaculate Heart of Mary at St.
  Petersburg Catholic High School), "Begin Anywhere" (Seminole Heights floral
  piece — "the flowers of tomorrow are in the seeds of today"), "Sauvignon"
  (Sauvignon Wine Locker, downtown St. Pete), DPR Construction (Tampa Heights),
  "Transcendance" (Port Everglades, Terminal 25, Celebrity Edge VIP lounge), the
  Tampa Bay Buccaneers (two murals featuring Chris Godwin and Tom Brady, the
  2021 Super Bowl champions), "Clean Current" (Mahaffey Theater for Duke
  Energy), DFCU Financial (downtown St. Pete — the botanical-brushstrokes
  wraparound previously branded as First Citrus Bank), "Bloom" (Axio at Carillon
  in Feather Sound — described by the studio as the largest mural in Tampa Bay),
  "Mother Earth" (The Artisan, Dunedin), "Colossal" (Historic Kenwood), "Dream
  Big" (Tampa Bay), and a SalonCentric headquarters package. The stated client
  list also includes Accenture, the Tampa Foundation, Facebook, Visit Tampa Bay,
  and Starbucks. The studio's stated mission is to "create art that resonates
  with its surroundings and connects with the people who experience it."

  For SHINE's 10th anniversary in 2024, Up & Over painted at 2214 2nd Ave North.
  Instagram: @upandovermurals. Website: upandovermurals.com. Contact:
  hello@upandovermurals.com / (813) 370-0870.

searchMuralDescription: |
  A towering abstract geometric mural spanning the full height of the Modera
  apartment building — roughly five stories. Bold, interlocking organic shapes
  in saturated primary and secondary colors — red, teal, orange, yellow, deep
  blue, maroon, and white — overlap and flow across the facade. The forms are
  rounded and architectural, somewhere between hard-edge abstraction and
  biomorphic design, with circles nested inside flowing vertical bands. The
  color relationships are carefully balanced, creating a sense of depth and
  movement. The scale dominates the block and is visible from several streets
  away.

