artistBio: |
  Up & Over is the collaboration between Leon "Tes One" Bedore and the Vitale
  Bros, formed around 2020. Tes One has been painting in St. Pete since 1992,
  starting as a graffiti writer before building a career that blends
  traditional art with graphic design for clients like Nike, L'Oreal, Absolut
  Vodka, and Architectural Digest. In 2012 he curated the "Leave a Message"
  show at the Morean Arts Center, which planted the seed for what became the
  SHINE Mural Festival in 2015 — he co-founded and co-curated the inaugural
  festival that brought 17 murals to downtown and has since produced nearly
  170. He had a full career retrospective at the Morean in 2022 and was
  featured in the Dali Museum's "Outside In" exhibition in 2025. The Vitale
  Bros — Johnny, Paul, and Joey Vitale — have been painting together since
  1992, starting with hand-lettered signs and storefront windows. Their
  warehouse studio hosted legendary art and music shows in the late '90s
  that helped build St. Pete's arts scene before it boomed. Together as Up
  & Over, they've painted murals for the Tampa Bay Buccaneers, Duke Energy,
  and First Citrus Bank. This SHINE 2024 piece marks a full-circle moment:
  the festival's founder painting alongside the city's most prolific
  muralists for the 10th anniversary.

muralDescription: |
  A towering abstract geometric mural spanning the full height of the Modera
  apartment building — roughly five stories. Bold, interlocking organic shapes
  in saturated primary and secondary colors — red, teal, orange, yellow, deep
  blue, maroon, and white — overlap and flow across the facade. The forms are
  rounded and architectural, somewhere between hard-edge abstraction and
  biomorphic design, with circles nested inside flowing vertical bands. The
  color relationships are carefully balanced, creating a sense of depth and
  movement. The scale dominates the block and is visible from several streets
  away.

