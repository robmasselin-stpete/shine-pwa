artistBio: |
  This wall looks like it could have been on Dr. MLK Jr. Street since 1955.
  Every sign on it is hand-painted, and brand new.

  Jeff Williams is a St. Petersburg native who founded Sun Signs & Lettering in
  2015. He was a leather engraver before he was a sign painter, and came to the
  trade by way of house painting — using leftover paint after long days on the
  job to make work of his own. He taught himself lettering in 2012 after
  watching the documentary "Sign Painters." The 1930s showcard aesthetic stuck.
  His style draws from 1930s-40s showcards, mid-century design, 1950s
  advertising, and American Traditional tattoo flash — clean, legible
  letterforms with intentional negative space. He runs his shop the way one
  would have run in 1955.

  He painted signage at Sunken Gardens, working with the site's archivist, and
  lettered a mini truck for Disney Springs. He has been featured on WEDU Arts
  Plus (PBS) and Fox 13. For SHINE 2022, he painted at Myoblast Strength on Dr.
  MLK Jr. Street North.

searchBio: |
  He was a leather engraver before he was a sign painter. He taught himself
  lettering in 2012. The 1930s showcard aesthetic stuck.

  Jeff Williams is a St. Petersburg native and the founder of Sun Signs &
  Lettering, the hand-painted sign company he started in 2015. Sun Signs is
  based out of St. Petersburg, Florida, and has worked with countless local and
  independent businesses across the greater Tampa Bay Area. The shop's emphasis
  from the start has been on traditional hand-painted sign techniques, with
  adaptations that combine modern technology and old-world applications
  depending on the job.

  Williams came to signs by way of house painting. He had always dabbled in art,
  and after long days painting houses he would come home and use the leftover
  paint to make work of his own. Selling the art was difficult, so he turned to
  signs as a more practical way to keep a paintbrush in his hand. In 2012 he saw
  the documentary "Sign Painters," which he credits with opening his eyes to the
  larger sign-painting community and sparking his serious pursuit of the trade.
  He taught himself by painting alphabets that, in his words, never saw the
  light of day, working through trial and error. He pulls reference from old
  sign books and from old signs he photographs while traveling, keeping a
  running collection he refers back to.

  The majority of Sun Signs' work is hand-painted reverse glass — lettering done
  on the inside of windows, either painted or in genuine gold leaf. The shop
  also offers A-frame signage, fascia signs, wall signs, vehicle lettering,
  truck lettering, panel signs, hanging signs, address numerals, storefront
  signage, interior lettering, logos, business cards, promotional materials, and
  full branding packages. Williams' process starts with a design on paper,
  hand-drawn or printed, then uses an electro pounce — a perforating machine
  grounded to a metal easel — to trace the design with a stylus, electrocuting
  small holes that he passes charcoal or chalk powder through to transfer the
  pattern onto a wall, window, or wooden panel. On-site jobs typically take one
  to three days with the client. He estimates his time runs about 50/50 between
  studio work and on-site work, mostly working solo and bringing on help when a
  job is large enough.

  His style draws from 1930s-40s showcard aesthetics, mid-century design, 1950s
  advertising, and American Traditional tattoo flash, with clean, legible
  letterforms and intentional negative space. He has described his shop as run
  the way a sign shop would have been in the 1950s. Sun Signs is popular with
  restaurants, coffee shops, tattoo shops, and barbershops around the Bay Area.
  Williams views himself as a keeper of the craft, referencing what came before
  him and bringing it forward at a time when there are no longer schools or
  traditional apprenticeships for sign painting. He has noted that vinyl signage
  in the 1980s brought the hand-painted industry to a halt, and that the form
  has been seeing a resurgence.

  Beyond storefront work, Williams has painted signage at Sunken Gardens in St.
  Petersburg, working with the site's archivist, and lettered a mini truck for
  Disney Springs. He also paints murals, cards, small signs, and cars.

  His work has been featured on WEDU Arts Plus on PBS — Season 12, Episode 15, a
  six-minute clip that aired August 31, 2023, profiling him as a sign artist
  creating custom-painted signs for local businesses throughout St. Petersburg
  and beyond. He was also featured on FOX 13 Tampa Bay in a Made in Tampa Bay
  segment by photojournalist Corey Beckman, published November 18, 2021,
  headlined "St. Pete artist resurrects hand-painted sign industry after going
  flat in the 1980s."

  For SHINE 2022, Williams painted at Myoblast Strength on Dr. MLK Jr. Street
  North in St. Petersburg.

  Sun Signs & Lettering takes commissions through a sign request form covering
  painted storefront signage (windows, doors, address numerals, contact info,
  hours, full storefronts, building walls, interior lettering), panel signs
  (A-frames, hanging signs, wall signs), and graphic design and branding work.
  The shop's tagline: "A business with no sign is a sign of no business."
  Website: sunsignsstpete.com.

searchMuralDescription: |
  A tall wall painted as a stack of vintage Florida tourism signs in bold
  primary colors. From top to bottom: "Florida SOUVENIRS" with palm trees, "ST.
  PETERSBURG" in large white block letters on black, "the sun... the sea... you
  & me — THE SUNSHINE CITY" on red with pin-up illustrations and oranges,
  "FLORIDA" in classic postcard lettering, "Tampa Bay" in red script with a
  pelican mascot, and "Sunshine 360 Days A Year" with a retro couple in green.
  Every detail is hand-painted in authentic mid-century sign style.

