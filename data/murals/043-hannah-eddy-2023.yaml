artistBio: |
  She grew up on the coast of Maine. Right out of college, she started
  collaborating with snowboard and skate companies.

  Hannah Eddy is based in Reno, Nevada. She trained in oil painting and moved
  straight into outdoor brands — Patagonia, Dakine, BlackStrap, Sierra Nevada
  Brewing Co., Protect Our Winters, and Dedicated, a Swedish sustainable
  clothing label. Her style is colorful pop-surrealism: bold linework, graphic
  dynamism, women and animals at exaggerated scale, joyful imagery undercut by
  skulls, cobwebs, and flames alongside technicolor mountains and forests.

  She paints murals because "no one has to pay to see it, and there's no barrier
  to entry." She has painted across the US, including Reno and Oklahoma City.
  For SHINE 2023, she brought her work to St. Petersburg.

searchBio: |
  She grew up on the coast of Maine. Right out of college, she started
  collaborating with snowboard and skate companies.

  Hannah Eddy was born in 1987 and grew up by the ocean in Maine. A love of
  mountains brought her west, and she is now based in Reno, Nevada, close to the
  Sierra Nevada range. She had traditional training in oil painting, then moved
  straight into work with snowboard and skate companies after college.
  Snowboarding, skateboarding, and surfing have been part of her life since she
  was young, and that culture shaped both her subject matter and her visual
  language.

  Her style is pop-surrealism: harmonious shapes, crisp lines, balanced colors,
  bold linework, and graphic dynamism. Her recurring cast of characters tends to
  be women and animals, often at exaggerated scale, moving through what she
  calls "flow." She paints technicolor mountains and forests, yolky suns, wavy
  rainbows, and elongated figures in motion. The joyful imagery is undercut by
  memento mori — pastel pink flowers growing from skulls' empty eye sockets,
  cobwebs stretched across stylized animal bodies, deep red flames flanking
  mountains and trees. She often blows up small things — flowers, bees, snails,
  mushrooms, frogs — to remind viewers of the details that get overlooked. Many
  pieces include short phrases like "Part of it all," "It is all temporary," and
  "find your flow," which come to her while mountain biking, hiking, or
  snowboarding.

  Her select client list includes Vans, Santa Cruz Skateboards, Hydroflask,
  Patagonia, Nixon, Sodastream, Lush Cosmetics, Skullcandy, Worn Wear,
  Snowboarder Magazine, Protect Our Winters, Dakine, Autumn Headwear, Nature
  Backs, Strainge Beast, Giro, Woodward, GNU Snowboards, Arcade Belts, Traeger
  Grills, Airblaster, Meow Skateboards, and Intersectional Environmentalist. She
  has also worked with BlackStrap and Sierra Nevada Brewing Co., and with
  Dedicated, a Swedish sustainable clothing label. For Sierra Nevada Brewing Co.
  she painted a Strainge Beast mural in Reno featuring the brand's Lemon and
  Watermelon characters, which was then put on a limited custom tee. For
  BlackStrap she was profiled in their Meet Our Artist series. For Protect Our
  Winters she is part of the Creative Alliance and designed the Team POW
  Membership Tee and the Stoke the Vote Tee.

  She started painting murals after a pro snowboarder-turned-muralist invited
  her to a mural festival following a few small free walls she had done. She has
  described that festival as feeling like she "went to mural school for a week."
  Since then she has painted across the US. In Reno, her murals include Find
  Your Flow (2021) and walls in Midtown. In 2023 she painted It's All Temporary
  in Oklahoma City. For SHINE 2023 she brought her work to St. Petersburg,
  Florida.

  She also showed at the Reno Tahoe International Art Show, where she created
  the event's original design — a colorful assemblage of flora, fauna, and the
  Truckee River with the tagline "Reno. Who knew?" — which appeared on tote
  bags, posters, and stickers. She moves between media constantly: brand design
  work in her Reno studio, gallery paintings, and large-scale murals. Studio
  pieces from 2021 to 2023 include Don't Wait (acrylic on panel, 12 x 12 in.,
  2023), Can't Hide (acrylic on panel, 20 x 24 in., 2023), Don't Let It Get To
  You (acrylic on recycled skateboard panel, 12 x 12 in., 2023), Fresh Start
  (acrylic and spray paint on panel, 24 x 24 in., 2023), and the Skull Snail
  series (acrylic on panel, 6 x 6 in. each, 2022). She works in acrylic, pen and
  ink, spray paint, and digital media on iPad with Apple Pencil.

  Her environmental message runs through everything. She partners with
  environmental organizations and outdoor brands to talk about climate change
  through what she calls a lighthearted lens, balancing playfulness with
  gravitas. She has said, "When you love something, you want to protect it," and
  frames preservation around small individual actions like riding a bike to the
  store or planting a garden. She paints public murals because "no one has to
  pay to see it, and there's no barrier to entry," and has said she could not
  continue an art practice without that.

  She was profiled by Aleina Grace Edwards in Southwest Contemporary in
  September 2023 in a piece titled "Hannah Eddy Paints Life and Death in
  Technicolor," with photos by Tre Packard. She was also profiled by Sierra
  Nevada Brewing Co. in December 2021 in "The Mural Life of Hannah Eddy."

  Website: hannaheddyart.com. Instagram: @hannaheddyart.

searchMuralDescription: |
  A wide, whimsical mural covering the full side of the CASA Support Center on a
  soft mint green background. The scene is a dense tropical ecosystem rendered
  in bold black outlines with playful, illustration-style fills in blues,
  greens, purples, oranges, and pinks. A large green tree frog sits center-left
  among oversized leaves and flowers, while a purple heron or crane flies to the
  right carrying a flower in its beak — a nod to the traditional peace dove,
  reimagined with Florida wildlife. Snakes wind through the foliage, insects
  hover between blooms, and cartoon raindrops fall from stylized clouds. The
  left side bursts with warmer tones — orange, yellow, and pink — while the
  right side fades to line-art outlines on the mint base, as if the color is
  still spreading. The piece was designed to create a positive, lighthearted,
  and welcoming atmosphere for CASA's mission as a domestic violence support
  center.

