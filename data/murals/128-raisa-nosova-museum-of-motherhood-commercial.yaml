artistBio: |
  A woman crouches at the doorway. Golden light bursts out behind her in
  stained-glass blocks. She painted it live over five days for the Museum of
  Motherhood and titled it "Woman of Light."

  Raisa Nosova is a Russian-born multidisciplinary artist (painting, murals,
  blown-glass sculpture, drawing, animation, performance) based in Hoboken, NJ.
  She earned her MFA from NYU Steinhardt and a BFA from the Fashion Institute of
  Technology, studied blown glass at Urban Glass in Brooklyn, and trained at
  Vesalius College in Brussels and the Art Students League of New York.

  Becoming a mother during her MFA reshaped her practice toward motherhood,
  trauma, resilience, displacement, and the invisible labor of caregiving. She
  is best known in the gallery world for blown-glass breast sculptures exploring
  postpartum experience, and in the mural world for "Uprooted" — an anti-war
  piece on a Ukrainian-owned gas station in Jersey City, painted after Russia
  bombed Kyiv while she was two months pregnant with close family in Ukraine.

  "Raisa Nosova Paints the Town" (April 14-18, 2025) brought her to St.
  Petersburg to paint this wall at The Factory's Museum of Motherhood. The
  collaboration was brokered by OXH Gallery (Odeta Xheka, Kress Building, Ybor
  City) for the MoM Art Auction and the museum's "We Build Tampa Bay"
  initiative. She has shown at Theodore Art Gallery (Manhattan), La Galerie
  Emeric Hahn (Paris), and Mana Contemporary (Jersey City), and held residencies
  at the Berlin Art Institute and the Ramona Residency in Houston (the first
  artist-mother residency in Texas).

searchBio: |
  Raisa Nosova is a Russian-born multidisciplinary artist working in painting,
  murals, blown glass sculpture, drawing, animation, and performance art. She
  earned her MFA in Studio Art from NYU Steinhardt and her BFA from the Fashion
  Institute of Technology, studied blown glass at Urban Glass in Brooklyn, and
  also attended Vesalius College in Brussels and the Art Students League of New
  York. Her time abroad in Brussels led to a string of international
  opportunities, including the George T. Dorsch Award for research in Cambodia,
  her first solo exhibition in Montclair, New Jersey, a commission painting for
  the OSMOS group in Paris, a solo exhibition at Galerie Emeric Hahn in Paris,
  and an assistant role to the director of CCNOA on a biannual event in
  Brussels. She describes her formal training as spanning classical figure
  painting and sculpture, abstract and conceptual art, glass blowing, apparel
  sewing, stage design, large-scale mural work, commercial photography, digital
  art, animation, film making, classical music, and ballet.

  Her studio practice took a turn into murals when a circle of friends opening
  Orso Coffee, the first boutique coffee shop in Sheepshead Bay, Brooklyn,
  invited her to create the artwork for the space. That commission grew her
  client base across the tri-state area and then internationally. Mural clients
  and projects include the Mayor of the Corbetta commune of Milan, Italy, where
  she painted a five-story exterior wall in the town center with full creative
  freedom; Lucas Portman's Fashion Baby XZY; William Etundi Jr.'s You Are So
  Lucky project; the Concorde hotel near MoMA in New York; the city of Hoboken,
  New Jersey; and Bushwick, New York. Her best-known mural is "Uprooted," an
  anti-war piece on a Ukrainian-owned gas station in Jersey City that she
  painted after Russia bombed Kyiv while she was two months pregnant, with close
  family in Ukraine. In April 2025 she traveled to St. Petersburg, Florida, for
  "Raisa Nosova Paints the Town," a live mural painting event April 14-18, 2025
  at The Factory at the Museum of Motherhood, 2606 Fairfield Ave. S, Building 7,
  made possible by a collaboration between OXH Gallery (founded by Odeta Xheka
  in the Kress Building, Ybor City, Tampa) and MoM for the MoM Art Auction. The
  project tied into MoM's "We Build Tampa Bay" initiative. She also painted a
  utility box mural for HobokenNJ.gov in 2020.

  The shift to street and mural work crystallized during a 2017 residency at the
  Berlin Art Institute, where weeks spent absorbing the city's Holocaust
  memorials pushed her past the limits of her 4 x 4 foot portraits on canvas —
  work that had grown out of her research travels through Cambodia on the
  Aftermath of the Cambodian Genocide. She painted her first street art in the
  middle of the night in Berlin. She has also held a residency at the Ramona
  Residency in Houston, the first artist-mother residency in Texas. Becoming a
  mother during her MFA reshaped her practice toward motherhood, trauma,
  resilience, displacement, and the invisible labor of caregiving, and pushed
  her into new disciplines including blown glass sculpture and performance art.
  She is best known in the gallery world for blown glass breast sculptures
  exploring postpartum experience.

  Gallery and exhibition history includes Theodore Art Gallery in Manhattan, WSE
  Gallery in New York, La Galerie Emeric Hahn (Interior Spaces) in Paris, Mana
  Contemporary in Jersey City, PRIME Gallery (the "Stripped" exhibition, covered
  by Jersey City Times in 2022), Gallery 14C in Jersey City (including the Art
  Fair 14C "Static Motion" coverage in 2024 and earlier Art Fair 14C appearances
  in 2021 and 2023), 81C in the US Virgin Islands (the "Equator Drift"
  exhibition of paintings covered by the St. Thomas Source and Daily News in
  2026), Laurelwood Arboretum, Holocenter, Linus Galleries Los Angeles, and the
  Osmos-group. She was the cover artist for Washington Square Review issue 35
  (2014) and issue 50 (2023).

  Press coverage spans the New York Times ("May Brings more than just Flowers,"
  2024), Jersey City Times (multiple features including "Muralist Raisa Nosova
  Raises a Distress call for Ukraine," 2022; "11 Must-See Exhibitors at Art Fair
  14C," 2021; "At a Grand Train Station, Art Fair 14C Opens with a Head of
  Steam," 2023; "In Its Fifth Year, Art Fair 14C Keeps Throwing the Dice," 2023;
  "What to See at the Year's First Art Crawl," 2024), Street Art NYC, Create!
  Magazine (including Issue 4 and a 2023 feature on her multidisciplinary
  motherhood installation), the Create! Magazine Podcast ("Expansion in the
  Studio and Unapologetically Sharing"), Milked Magazine issue 4, Hoboken Girl,
  Hudson Reporter, Hudson TV, Yahoo News, Bklyner, UpMag, St Pete Catalyst,
  Glasstire (Texas Visual Art coverage of the Ramona Residency), Art Dealer
  Street ("Inside the Studio: Raisa Nosova"), Canvas Rebel, Sold Magazine, Fresh
  Paint Magazine (Issue 11, December 2015), Artist Portfolio Magazine, Galerie
  Project, Arts to Hearts Podcast, Friend of the Artist, the Holocenter, and
  Italian outlets including Milano Pavia TV, Settegiorni, Logos News, Cronaca
  Ossona, Notizie Ticino, Notizie MI Tomorrow.

  Critic Tris McCall, writing for Jersey City Times, called her "indispensable"
  for her "unflinching commitment to her concept" and her refusal to hide from
  the trauma, bodily harm, vulnerability, emotional peril, and life-giving
  fluidity of womanhood and motherhood. She has over 15 years of teaching
  experience, including adjunct professorships at NYU and FIT, and founded a
  classical drawing and painting program for youth. Her studio is at 335 Throop
  Avenue, Brooklyn, NY 11221. Website: raisanosova.com. Instagram: @raisanosova.
  Vimeo: vimeo.com/user22878265.

searchMuralDescription: |
  A dynamic, warm-toned mural on the facade of the Museum of Motherhood at The
  Factory. A female figure is depicted in a crouching or seated position,
  rendered in expressive brushwork in reds, golds, pinks, and deep magentas.
  Radiating golden light beams and architectural fragments burst outward from
  behind the figure, creating a sense of energy and movement. The composition
  has a stained-glass quality with bold color blocks and strong outlines. The
  "MoM" (Museum of Motherhood) text is visible in the upper left. The piece
  wraps around the building entrance, framing the doorway.

muralInspiration: "Painted for the Museum of Motherhood after Nosova met the founder and felt both the urge and responsibility to contribute to raising awareness for the museum, the vital institution in a society that so often feels isolating for mothers."
