searchMuralDescription: |
  A painted roll-up door set into a tan stone building, under a large louvred
  vent. The door is covered edge to edge in Chad Mize's bold-outline doodle
  icons in red, orange, lime green, and light blue on a cream background. A
  line of small running figures crosses the middle above a bridge, with a
  cyclist below on a bike whose wheels are smiley faces. Text reads "ST. PETE",
  "727", "RUN." and "FIT." Around them: a flamingo, a pelican, a cardinal, a
  sun wearing sunglasses, a crescent moon, a rainbow over a cloud, a peace
  sign, a crab, a seahorse, a snail, a starfish, an anchor, an inline skate, a
  palm tree, a sailboat, a bulldog, a lightbulb, a running shoe, a woman
  runner, lightning bolts, stars, and hearts. Signed "MIZE" in vertical
  letters at the upper left.

