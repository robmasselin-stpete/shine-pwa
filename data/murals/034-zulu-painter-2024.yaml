artistBio: |
  He calls them "Mindful Murals." He wants to grow art everywhere.

  Carlos Culbertson — Zulu Painter — is a native West Virginian who started
  pursuing art at age eight. He holds a degree in fine arts painting and now
  works out of a studio at the ArtsXchange on 22nd Street South. He paints in
  acrylic and spray paint, favors reclaimed materials, and has worked as a
  scenic artist for Disney on Ice, the Science Channel, HSN, and SeaWorld Parks
  and Entertainment.

  His mural projects span the country: Denver, Chattanooga, Atlanta, Austin,
  Miami, Las Vegas, Los Angeles, Kansas City, Flint, and Binghamton, New York —
  where he painted "Cultivate Kindness," a 40-foot mural with West Side Middle
  School students. In St. Pete, he painted murals at CASA Family Justice Center
  on Arlington Ave (domestic violence survivor themes) and a portrait of Betty
  Reid Soskin at the Florida Botanical Gardens in Largo.

  He is a four-time SHINE artist — "Moon Beam Dream 2" in 2016, "Legacy" with
  Thirst in 2017, "Wisdom, Growth, Progress" in 2018, and the AMIKids wall in
  2024. He received a St. Pete Arts Alliance Muse Award in 2022. He also
  collaborated with Reid Jenkins and Iboms on "Imagine Gas Plant and Laurel
  Park" at Campbell Park Recreational Center.

searchBio: |
  He calls them "Mindful Murals." He wants to grow art everywhere.

  Carlos Culbertson — Zulu Painter — is a native West Virginian who started
  pursuing art at age eight. He holds a degree in fine arts painting and works
  out of a studio at the ArtsXchange in St. Petersburg, Florida — 515 22nd St.
  S, Studio 111, St. Petersburg, FL 33712, open Monday through Friday 9 a.m. to
  6 p.m. He paints in acrylic and spray paint, favors reclaimed materials, and
  works in special effects and scenic art alongside his mural practice. His
  scenic-art clients include Disney on Ice, the Science Channel, HSN, and
  SeaWorld Parks and Entertainment.

  His mural projects span the country: Denver, Chattanooga, Atlanta, Austin,
  Miami, Las Vegas, Los Angeles, Kansas City, Flint, and Binghamton, New York.
  In Binghamton he painted "Cultivate Kindness," a 40-foot mural completed with
  West Side Middle School students, and "Spread Love," approximately 40 feet
  tall on the M&T Bank building at 68 Exchange Street, Binghamton, NY 13901.
  "Spread Love" was painted with Golden Paintworks Mural & Theme Paint and Kobra
  spray paint, and was recognized by Broome County executive Brian Garner with a
  certificate of recognition. The mural depicts the butterfly effect of good
  deeds — watering the rose benefits the initial receiver and creates beauty for
  others through the outline of additional roses. Other festival appearances and
  projects include the 48 Hour Mural Competition in Jacksonville, Florida
  (September 29, 2023, painted with Golden Paintworks Mural & Theme Paint and
  various spray paint), the Paint Memphis Mural Festival, the HULAWEEN Spirit of
  Suwannee Lake Music and Art Festival, the Art With Me Art and Music Festival
  in Miami, an apartment complex in Sanford, Florida, and a private residence
  mural in St. Petersburg.

  In St. Petersburg he painted a two-building mural at the CASA Pinellas Family
  Justice Center on Arlington Avenue, two blocks north of Central Avenue,
  connected by an unofficial crosswalk of white polka dots and purple triangles.
  The mural was funded by Willi Rudowsky and Hal Freedman, longtime CASA donors
  and SHINE hospitality sponsors, and was selected through a
  request-for-proposals process that also drew submissions from Johnny Vitale
  and Cecilia Lueza. CASA Pinellas CEO Lariana Forsythe and the funders chose
  Culbertson's proposal. The piece features four faces. On one side, a woman
  cradles a baby whose curls contain the words Drive, Bravery, Family, Growth,
  Hope, Empathy, Love, Community, Wisdom, Faith, Create, and Unity. On the other
  side, a young woman stretches out a helping hand and a young man meets the
  viewer's gaze. The FJC by CASA logo, designed by St. Pete firm Stevie & Fern,
  appears in the upper right and points toward the building entrance. The Family
  Justice Center model originated with Gael Strack and Casey Gwinn, who opened
  the first FJC in San Diego in October 2002; the St. Pete center opened in
  October 2022. He also painted a portrait of Betty Reid Soskin at the Florida
  Botanical Gardens in Largo.

  He is a four-time SHINE artist: "Moon Beam Dream 2" in 2016, "Legacy" with
  Thirst in 2017, "Wisdom, Growth, Progress" in 2018, and the AMIKids wall in
  2024. He received a 2022 St. Petersburg Arts Alliance Muse Award alongside
  Matthew McGee, Gloria Muñoz, David and Becky Ramsey, Chad Mize, and Matthew
  Walker, presented at the Morean Center for Clay in the Warehouse Arts District
  on March 4, 2022, with hosts Paul Wilborn and Eugenie Bondurant. He
  collaborated with Reid Jenkins and Iboms on "Imagine Gas Plant and Laurel
  Park" at Campbell Park Recreational Center in St. Petersburg.

  His work prioritizes vibrant color, bold design, and what he describes as
  mindful energy. He frames public art as immediate and accessible — no entry
  fee, year-round, flash photography allowed. His practice has been profiled by
  Creative Pinellas, Creative Loafing Tampa Bay, Golden Paintworks, and the
  Monochronicle artist network.

  Contact: info@zulupainter.com, +1-727-768-4737. Website: zulupainter.com.
  Instagram: @zulupainter1. Facebook: facebook.com/ZULUPAINTER1.

searchMuralDescription: |
  Four diverse faces fill the two-story CASA Family Justice Center building,
  representing different demographics affected by domestic violence. On one
  side, a woman cradles a baby, with words embedded in the curls of her hair —
  "Drive, Bravery, Family, Growth, Hope, Empathy, Love, Community, Wisdom,
  Faith, Create, and Unity." The other side depicts a young woman extending a
  helping hand and a young man making direct eye contact. Colorful geometric
  patterns, blue polka dots, swirling vines, and flowers in purples and golds
  surround the figures. A pathway of white polka dots and purple triangles
  crosses Arlington Avenue as part of the design.

muralInspiration: |
  As Zulu Painter described the faces: "They're everyone... people from our
  community who have in some way been affected by family turmoil."

