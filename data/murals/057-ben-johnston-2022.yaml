artistBio: |
  He drew a 1,485-square-metre mural for Sierra Nevada Brewery with nothing but
  Sharpies and scaffolding.

  Ben Johnston grew up in Cape Town, South Africa, briefly studied industrial
  design, and is otherwise self-taught. He is now based in Toronto. His work is
  large-scale typographic murals with 3D illusory effects — bespoke typefaces,
  signage, and illustration referencing Art Nouveau and pop art. The words are
  often chosen with local communities: "Keep Going," "Relax," "Love,"
  "Together."

  Clients include Nike, Lululemon, Adobe, and Apple (where he also speaks). He
  has won multiple Graphis Gold and Silver awards, Type Directors Club awards,
  and ADC One Club Gold Cubes including Best of Discipline. He has painted for
  MURAL Festival Montreal, BUMP Festival Calgary, and SeaWalls / Pangeaseed with
  the UN. His "Wordplay" solo sculpture exhibit was featured by CBC Arts.

  For SHINE 2022, he painted in St. Petersburg.

searchBio: |
  He drew a 1,485-square-metre mural for Sierra Nevada Brewery with nothing but
  Sharpies and scaffolding. Ben Johnston is a typographic artist and muralist
  who creates large-scale painted works in public space. He grew up in Cape
  Town, South Africa, briefly studied industrial design, and is otherwise
  self-taught. He spent time in the agency world of South Africa before moving
  back to Canada to pursue freelance work focused on branding and typography. He
  is now based in Toronto.

  His murals are large-scale typographic pieces that play with color, shadow,
  and perspective to create lettering that appears three-dimensional, with
  bespoke typefaces, signage, and illustration referencing Art Nouveau and pop
  art. The words are often chosen with local communities and partners — examples
  include "Keep Going," "Relax," "Love," and "Together." Johnston came to mural
  painting when a friend asked him to create a piece for the entranceway of a
  new office building, and the work shifted his career; he now spends roughly
  80% of his time on murals for clients, charity, and personal projects. He told
  Scotty Russell of the Perspective Podcast that he spends no more than four
  days painting a mural, preferring long days to a stretched-out week. He
  balances outdoor mural painting with studio client work and tries to ride a
  bike before starting the day. His reference material includes classic design
  books on Bauhaus, photographs of peeling vinyl lettering, and mood boards
  dedicated to shadow.

  Clients include Nike, Lululemon, Adobe, and Apple, where he has also spoken.
  His listed services span art direction, brand development, advertising,
  murals, interiors, public art, events, live art, activations, sculpture,
  consultation, apparel, packaging, logo design, campaigns, illustration, custom
  fonts, and animation.

  Awards include The One Show design merit (2016), The One Show print and
  outdoor merit (2016), Applied Arts awards for logo design and mural design
  (2017), TDC certificates for environmental and mural design (2017), Print
  magazine's typography award (2017), a Communication Arts award (2017), ADCC
  awards for installation and environmental design (2017), a Graphis Silver
  trophy (2018), Applied Arts awards (2018), Young Guns finalist (2018),
  Communication Arts awards (2019, including design and environmental),
  MuralFest.com Best Canadian Mural (2019), three ADC merits in typography
  (2019), Applied Arts awards for environmental and typography (2019), TDC
  Ascenders award (2019), four Graphis Gold trophies and a Graphis Silver
  (2019), a Communication Arts typography award (2020), four Type Directors Club
  awards (2020), an Applied Arts design award (2020), an ADC One Club Gold Cube
  (2021), an ADC One Club Gold Cube Best of Discipline (2021), and two further
  Type Directors Club awards (2021).

  Exhibition history includes AGO Massive (2019), Taglialatella Gallery (2019,
  2020, and 2023), ABV Gallery (2019), and Hashimoto Contemporary (2020). His
  "Wordplay" solo show ran at the Taglialatella Gallery in Toronto (99 Yorkville
  Ave.) from March 23 to April 10, 2023, and was featured by CBC Arts. Wordplay
  was his first foray into sculpture, and included a piece that reads "CHAOS" or
  "ORDER" depending on viewing angle, a vertical tube reading "LOOK ON THE
  BRIGHT SIDE" when tilted, and ten paintings on canvas with messages including
  "SOME DAY" and "RISE ABOVE." He taught himself Cinema 4D and other 3D programs
  to design the work; the sculptures are resin and were fabricated in China. He
  began using an airbrush during the show as a way to translate a 50-foot wall
  to canvas, and planned to bring airbrush technique back into his murals. He
  has cited interest in moving toward more permanent public art at 20-to 30-foot
  scale in brass or bronze.

  Speaking engagements include Adobe in San Francisco (2017), FITC Toronto
  (2018), BrainStation Toronto (2018), the Ruda Fest panel in Bogota, Colombia
  (2018), Apple Toronto (2019), OFFF Barcelona (2019), the Hexo artist panel in
  Toronto (2019), Bright Walls in Jackson, Michigan (2019), PDP in Novi Sad,
  Serbia (2019, workshop and presentation), and TBW Talks with Arc'teryx (2020).

  Festival and partner credits include MURAL Festival Montreal, BUMP Festival
  Calgary, SeaWalls / Pangeaseed with the UN, PowWow, ABQ Fest, VMF, Bright
  Walls Michigan, Daily Bread Food Bank, Fashion Revolution, the Novi Sad
  Foundation, Patagonia, Up Here Sudbury, and others. Press coverage includes
  Visi, Air Canada, TDC, and Colossal (April 20, 2020, by Vanessa Ruiz). In 2026
  he is travelling for a global painting tour.

  For SHINE 2022, he painted in St. Petersburg, Florida.

  Website: benjohnston.ca.

searchMuralDescription: |
  A towering multi-story mural on the side of an apartment building spelling
  "RISE" in massive 3D block letters. The isometric letterforms are rendered in
  graduating shades of cerulean, sky blue, and white against a deep blue
  background, with crisp shadows giving the typography a sculptural, floating
  quality. Signed "Ben" in white script at the lower left. The mural dominates
  the building's full height, visible from blocks away along Central Avenue.

