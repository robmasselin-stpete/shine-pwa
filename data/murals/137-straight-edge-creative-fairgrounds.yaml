  - "28 August 2026 — Fact-check fleet: ATTRIBUTION UNVERIFIED. No source in the pooled Sydney Prusso evidence base (this record's 4 URLs plus the 8 on sibling #69) connects her to Fairgrounds St. Pete / FloridaRAMA. Her own studio site lists commissions and Fairgrounds is not among them, and SPAA's only Prusso record is the 2022 SHINE wall. The wall carries no visible signature, and its cool geometric palette does not match the warm 1960s-70s poster style her sources describe. Fairgrounds commissioned 60+ artists at its 2021 opening, so a Prusso wall there is plausible but undocumented. NOT reassigned - unlike #164 there is no positive evidence of another artist. Needs Rob's field knowledge or a signature check on site"
