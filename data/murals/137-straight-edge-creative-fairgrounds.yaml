artistBio: |
  The name is the straight edge — no drink, no drugs. He has been in recovery
  more than seven years and paints the recovery centre where people get clean.

  Straight Edge Creative is a public and commercial art company founded by
  Riley Gregor in Louisville, Kentucky. Gregor came up through street art and
  graffiti before turning professional, and took a BFA from the University of
  Louisville's Hite Art Institute in 2022. The studio paints large-scale murals
  and handles branding and event curation.

  The work runs through restaurants, museums, aquatic centres and universities
  — the Mary T. Meagher Center in Louisville, Origin Park in Clarksville,
  Caufields Novelty, the Louisville Dive Center — and out across Indiana, North
  Carolina and Florida. At The Healing Place, a recovery centre, the murals
  carry the line "Where Hope is Found & Change Happens."

searchBio: |
  The name is the straight edge — no drink, no drugs. He has been in recovery
  more than seven years and paints the recovery centre where people get clean.

  Straight Edge Creative is a public and commercial art company based in
  Louisville, Kentucky, founded and owned by Riley Gregor. The studio describes
  itself as "a public and commercial art company specializing in large-scale
  murals, branding, and artistic event curation," and says its process "is
  directed by client collaboration and conceptual thinking to create a long
  lasting relationship with both our clients and their communities."

  Gregor began in street art and graffiti before moving into professional
  muralism, and graduated from the University of Louisville's Hite Art Institute
  with a BFA in 2022. He is open about being in recovery — more than seven years
  — and the studio's murals at The Healing Place, a Louisville recovery centre,
  carry messages including "Where Hope is Found & Change Happens."

  Documented projects include the Mary T. Meagher Center in Louisville (a 50 x
  13 ft spray-paint exterior and a 20 x 10 ft interior), the Origin Park
  promotional mural in Clarksville, Indiana (45 x 10 ft), LouLou On Market in
  Louisville, the Louisville Dive Center, Caufields Novelty, and the Buffalo
  Construction support centre. Further walls are documented in Jeffersonville
  and Muncie and Marion, Indiana; Wrightsville Beach, North Carolina;
  Alexandria; and the University of Louisville.

  This wall is on the front of the Fairgrounds St. Pete building at 2606
  Fairfield Ave S, in the FloridaRAMA / Factory complex. Eyes on the Streets, a
  street-art blog covering the neighbourhood, credits it directly: "Straight
  Edge Creative is responsible for the bright and cheerful music themed painting
  of the front of this building." Rob independently found video of the studio
  unveiling the piece at Fairgrounds on its own site. Fairgrounds commissioned more than 60 artists to cover the building exteriors
  and interiors when it opened in September 2021; this wall came later, in 2024,
  and sits among exterior work by Derek Donnelly, Chad Mize, Zulu Painter and
  Ricky Watts.

  Website: str8edgecreative.com. Instagram: @straightedgecreative. Facebook:
  straightedgemurals.

searchMuralDescription: |
  A long horizontal mural across the front of the Fairgrounds St. Pete building
  — a music-themed composition in flat, hard-edged shapes. A ribbon microphone
  in blue and cream stands at the right, beside a teal quaver note and ruled
  staff lines in pale gold. Black and white bars step across the lower half like
  piano keys. A large black disc at the left reads as a record, overlaid with
  salmon-pink dots, and a six-pointed pale-teal star anchors the centre. The
  palette runs teal, pink, black, maroon and blue, with diagonal stripes,
  chevrons, teardrops and arches filling the field and two windows worked into
  the design. The register is pop-art graphic — Memphis Design or 1980s
  postmodern illustration.

