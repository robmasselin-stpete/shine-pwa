artistBio: |
  Aurailieus is the artist name of Marko "Mark" Stevens, born in 1983 in
  Camden, New Jersey. He found art as an escape from what he describes as
  "the family business of drug addiction and incarceration," and his ambitions
  solidified in high school when a teacher gave him a book about Jean-Michel
  Basquiat. The name Aurailieus came from friends who started greeting him
  like Marcus Aurelius from the movie Gladiator — it stuck. He relocated to
  St. Petersburg nearly two decades ago and became a fixture of the local
  arts community. His most recognizable creation is Bob the Robot (Prince of
  Denmark), a cute yellow bot he describes as "a mascot for existentialism."
  In 2012 he co-founded the St. Pete Robot Exchange with Zulu Painter and
  Jason Bromley — an annual robot-themed group show that ran for nine
  editions and was even exhibited at the Florida State Fair. He won a 2020
  SPAA Individual Artist Grant for "The Bob Project" to paint more Bob murals
  around the city. He had a solo retrospective at the Morean Arts Center
  titled "Fairly Local featuring Bob the Robot (Prince of Denmark)." He won
  the Open Call for SHINE 2021 and painted this wall at Zen Glass Studio.

muralDescription: |
  A vibrant mixed-style piece on a teal cinder block wall. On the left, a
  female portrait with flowers in her hair and golden earrings gazes outward,
  rendered in a clean illustrative style. To her right, a burst of graffiti
  lettering in pinks, reds, purples, and blacks fills the center of the wall,
  with angular black wing-like shapes exploding outward. Scattered throughout
  are colorful elements — green and pink splashes, circular dots, and what
  appears to be a small yellow-green character (Bob the Robot). The piece has
  a collaborative jam feel, blending portraiture with wildstyle graffiti.

