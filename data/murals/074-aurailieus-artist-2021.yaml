artistBio: |
  He painted a robot named Bob holding a sign that read "I hope SHINE has an
  Open Call next year." Then he won the Open Call. This is the wall.

  Mark Stevens — Aurailieus Artist — blends fine art with urban street art,
  leaning on graffiti influence and Jean-Michel Basquiat, whose work he first
  encountered when a high school art teacher handed him a book about the
  painter. He works in mixed media — paintings, spray cans, canvas prints, wood
  cutouts. Bob the Robot Prince of Denmark came out of a robot-building project
  he was running with Zulu Painter and Jason Bromley — little robots made of
  cardboard, duct tape, and wires. One of them had personality. He painted it,
  refined it, and stories started attaching. Bob is now St. Pete famous, with
  shows where other artists do their own interpretations of him.

  With Zulu Painter and Bromley he co-founded The St. Pete Robot Exchange — also
  called "The Robot Show" — an annual group show that ran for nine years. He
  also ran weekly Wednesday-night art meetups for ten years. In 2020 the St.
  Petersburg Arts Alliance awarded him a $1,000 Individual Artist Grant for "The
  Bob Project," which puts more Bob murals on surfaces around the city.

  This wall is a collaborative jam — a portrait on the left, wildstyle graffiti
  lettering in the center, angular black shapes exploding outward. Look for Bob
  the Robot tucked in among the splashes in yellow-green. He always finds his
  way in.

searchBio: |
  His robot character is named Bob. He paints him everywhere. Mark Stevens —
  also spelled Marko Stevens — works under the name Aurailieus Artist out of St.
  Petersburg, Florida. He blends fine art with urban street art, leaning on
  graffiti influence and Jean-Michel Basquiat, whose work he first encountered
  when a high school art teacher handed him a book about the painter. He was
  born in Camden, New Jersey in 1983, and credits art with giving him an escape
  from a family history of drug addiction and incarceration.

  The Aurailieus name traces back to high school. He and his friends were the
  kids getting picked on, so they formed a tight group of weirdos to fight back.
  After everyone went to see the Russell Crowe Gladiator movie, his friends
  started greeting him in a Roman gladiator voice with "Marcus Aurelius" while
  pounding their chests. The name stuck.

  He skipped school in St. Pete looking for exhibition opportunities. His first
  art show was in a tattoo parlor that shut its doors and skipped town with all
  his early paintings. His first local mural was a rough one painted next to
  Nova 535 around 2008. The first one he counts as relevant was Bob the Robot
  Prince of Denmark behind Bar@548, holding a sign that read "I hope SHINE has
  an open call next year." He says it created some friction but pushed the SHINE
  Mural Festival organizers to open things up a bit, which he counts as a win
  for artist accessibility. He went on to win an Open Call slot and painted for
  SHINE in 2021, and Creative Pinellas documented him painting a mural start to
  finish for SHINE Mural Festival 7 in 2022.

  Bob came out of a robot project he was working on with fellow Tampa Bay
  artists Zulu Painter and Jason Bromley. Stevens started building little robots
  out of cardboard, duct tape and wires, and one of them looked like it had
  personality. He started painting it, refined it, and stories began to attach
  to it. Bob the Robot Prince of Denmark is a creation of man — Stevens — while
  a separate character, Sad Robot, exists in the same universe but originates in
  space and functions more as an observer of human civilization. Bob has become
  "St. Pete famous," with shows where other artists have done their own
  interpretations of him.

  In 2020 the St. Petersburg Arts Alliance awarded Stevens a $1,000 Individual
  Artist Grant for "The Bob Project," which puts more Bob the Robot murals on
  surfaces around St. Pete. The Arts Alliance announced 20 grant recipients that
  May. Stevens scouts and procures the locations himself; the Bob murals tend to
  be much smaller than the full-wall pieces associated with SHINE. He mentioned
  planned spots behind Pizza Box at 923 Central Avenue and at CellarMasters Wine
  Bar and Bottle Shop at 1005 1st Avenue North.

  With Zulu Painter and Jason Bromley, Stevens co-founded The St. Pete Robot
  Exchange — also called "The Robot Show" — an annual group art show and
  intergalactic celebration of all things robotica that ran for nine years
  before going on hold during the coronavirus pandemic. He also founded weekly
  Wednesday night art meetups in St. Pete that ran for ten years, also paused
  for the pandemic; the meetups were a comradery-and-inclusivity engine for the
  local creative community.

  Stevens, Suarez and Zulu Painter went down to Miami for Art Basel one year,
  holding a fundraising event where they essentially gave pieces away to fund
  the trip. Each painted about three murals in various Miami spots, including
  the Puerto Rico Hope project in Wynwood, where roughly 30 artists muralized an
  entire parking garage to raise awareness for Puerto Rico's hurricane
  destruction.

  He works in mixed media — paintings, spray cans, canvas prints, wood cutouts.
  For mural prep he draws the piece out, sometimes colors it, then heads to
  Artisinns for spray paint and tips before treating the wall like a very large
  canvas — no projectors, nothing fancy. His shop and portfolio at
  aurailieus.com lists original paintings, prints, stickers, spray-can pieces,
  wood cutouts and unisex apparel, with titles like "I Aim to Please," "Come A
  Little Closer," "Like A Sunset You Can Taste," "Like Honey in the Summer Sun,"
  "Corazón," "Ingenue," "Tennesee Honey," "A West Side Story," "Linked To
  Roots," "Holy Gentrification Bob," "Remember To Shine," "Bob walks Keith
  Haring's dog during a nuclear holocaust," "Leeloo Dallas Multipass 22," "Van
  Der Bot 3000," "Death Rattle (of the Republican Party)," "Pop Art Bob,"
  "American Gothic," "Bobby Warhol" series, "Bob's World Tour" series and "Of
  Birds and Bobs" series. He has done collaboration pieces with Brook Lyn —
  titles include "I Love You I'm Over You," "Death by Robot," "The Perversions
  of Quiet Girls," "Pretty Art By Unattractive People," "Hot Sex With Strangers"
  and "Some Symbolistic Bullshit About the Evils of Money." He names Brook Lyn
  as a favorite local artist, citing her unwavering, unapologetic work.

  Creative Pinellas has produced video segments on him including "Eating
  Sandwiches Pilot Ep 1 – Aurailieus Artist" and "Painting TRAINS!! – Aurailieus
  Artist." He can be reached at aurailieus.artist@gmail.com and followed at
  aurailieus.com and on Instagram.

searchMuralDescription: |
  A vibrant mixed-style piece on a teal cinder block wall. On the left, a female
  portrait with flowers in her hair and golden earrings gazes outward, rendered
  in a clean illustrative style. To her right, a burst of graffiti lettering in
  pinks, reds, purples, and blacks fills the center of the wall, with angular
  black wing-like shapes exploding outward. Scattered throughout are colorful
  elements — green and pink splashes, circular dots, and what appears to be a
  small yellow-green character (Bob the Robot). The piece has a collaborative
  jam feel, blending portraiture with wildstyle graffiti.

