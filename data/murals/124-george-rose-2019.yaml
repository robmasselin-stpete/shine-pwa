artistBio: |
  Disney, Instagram, TikTok, Facebook, Nike. He paints endangered indigenous
  flora at macro scale.

  George Rose studied at the ANU School of Art in Canberra and is based in
  Melbourne, Australia. His style is gestural mark-making with endemic
  botanicals — bright surreal colors, signature gradients, hard edges with bold
  undulating texture. He has painted for the STRAAT Museum in Amsterdam and the
  Musee Pierre-Noel in France.

  He won the Resene Total Colour Visual Art Award (2020), the Resene Total
  Colour Award (2023), and "Best Mural" at the Street Art Australia Prize
  (2019). For SHINE 2019, he painted all eight walls of a handball court at
  Campbell Park — solo, brushes and paint sprayer, eight days.

searchBio: |
  Disney, Instagram, TikTok, Facebook, Nike. She paints endangered indigenous
  flora at macro scale.

  George Rose is a Melbourne, Australia-based muralist whose father is a
  forester — she grew up surrounded by the bush and developed an early interest
  in flowers. At ten years old she chose art over her childhood ambition of
  becoming an astronaut. She studied art and graphic design in school, then
  completed her formal training at the ANU School of Art in Canberra. Before
  settling on murals as her primary medium, she worked across ceramics, lighting
  installations, oil painting, digital illustration, festival set dressing, and
  sign writing. Stifled by the commercialism of sign writing, she narrowed her
  practice to walls after a friend asked what she would do if she could only
  choose one thing — "paint big walls."

  Her style is gestural mark-making intertwined with endemic botanicals,
  rendered in bright, surreal colors with signature gradients, hard edges, and
  bold undulating texture. She researches each location, finds endangered or
  endemic flora and fauna, and incorporates them into the design — a practice
  she describes as "pollination," carrying images from one location to another.
  Her subject matter explores the fragility of nature, transforming micro plant
  and animal life into macro-scale wall pieces. She balances hard edges with
  bold undulating colours and texture, and her work consistently sits at the
  juxtaposition of masculine scale and feminine motif.

  Her process started with black and white before someone pointed out her color
  sense; she now works heavily in color theory and the optical vibration between
  contrasting hues. She abandoned spray cans because the sun fades them and
  switched to house paint with a spray gun for the larger gradients and fades
  that became her signature. Her "recipe" combines gradients, hard lines, and
  textured backgrounds. Her favorite flower is the kangaroo paw — she has a
  tattoo of it, alongside flowers for each member of her family (lilies for her
  mother, rosewood for her father).

  Rose has been recognised as one of Australia's foremost female muralists. Her
  awards include the Resene Total Colour Visual Art Award (2020), the Resene
  Total Colour Award (2023), and "Best Mural" at the Street Art Australia Prize
  (2019). Her commissions span global media businesses (Instagram, TikTok,
  Facebook), entertainment giants (Disney, Nike), apparel brands (JanSport), and
  major museums — including the Musée Pierre-Noël de Saint-Dié-des-Vosges in
  France and the STRAAT Museum in Amsterdam. Her murals appear across Australia,
  the United States, Asia, and Europe. She has noted her work resonates
  particularly in California and Michigan.

  For SHINE Mural Festival 2019 in St. Petersburg, Florida, she painted all
  eight walls of a handball court at Campbell Park, solo, using brushes and a
  paint sprayer, over eight days. She works the festival circuit internationally
  and accepts invitations from countries around the world. She is represented by
  B&A (ba-reps.com), which lists her alongside artists Will Barras, Bakpak
  Durden, Kitt Bennett, Ewok, Taj Francis, Georgia Hill, INSA, Ornamental
  Conifer, Roids, Tatiana Suarez, Victor Reyes, and Vizie.

  She acknowledges the Wurundjeri Woi Wurrung peoples of the Eastern Kulin
  Nation as the owners of the land on which she operates. She lives in Melbourne
  with her partner and a Kelpie named Sunny Boy. Off the wall, she has expressed
  interest in completing a residency, working on smaller (1m x 1.5m) canvases,
  and dream projects including painting an airplane, working from a drop stage
  on a 20-story skyscraper, and collaborating with high-fashion labels such as
  Gucci, Prada, or Burberry on a runway show or fabric yardage.

  She has been interviewed by Coveteur ("'Wall Talk' with Australian Muralist
  George Rose," April 26, 2024). The piece's photography was credited to Yoshi
  Yanagita, Joel Colin, and Mike Chaney. Her advice for muralists at scale:
  "It's super physical, so it's like training for a sport. When you stop
  painting for a period of time, it's easy to get injured, so you have to keep
  training for it."

  Website: georgerose.com.au. Instagram: @george_rose. Agent: B&A
  (info@ba-reps.com).

searchMuralDescription: |
  A sprawling botanical mural covering all eight walls of two back-to-back
  handball courts at Campbell Park. Large curved bell-shaped flowers big enough
  to climb into sit alongside massive fringed petals and tall striated leaves
  stretching floor to ceiling. The color palette transitions from golden orange
  at the top through pink in the middle to electric blue at the base, all
  outlined in smoky blue linework. Half the flowers are Florida natives and half
  are Australian natives, connecting Rose's home country with the mural's
  location.

muralInspiration: "Half the flowers are Florida natives and half are native to Australia, connecting the artist's home country with St. Pete. Painted solo in 8 days on 8 walls using only buckets, brushes, and a paint sprayer."
