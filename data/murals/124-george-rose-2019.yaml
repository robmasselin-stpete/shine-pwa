artistBio: |
  George Rose is a Melbourne-based Australian muralist who shifted to
  painting walls full-time in 2015 and quickly became one of Australia's
  foremost female muralists. She studied graphic design at the University
  of Canberra and fine art at ANU School of Art, and that intersection of
  design and art defines her approach — large-scale botanical and floral
  imagery rendered with bold illustrative outlines and signature spray-
  painted gradient fades in bright, surreal colors. She researches each
  mural location to find endangered or endemic flora and fauna, creating
  a link between the artwork and the area's ecology. She's painted walls
  across Australia, the U.S., Asia, and Europe — festivals include Bright
  Walls (Michigan), Sea Walls (St. Thomas), Darwin Street Art Festival,
  Wall to Wall, Brisbane Street Art Festival, Roskilde (Denmark), and
  KAABOO. Commercial clients include Disney, Instagram, TikTok, and
  Jansport. She's won multiple Resene Total Colour Awards and took the
  "Best Mural" title at the 2019 Street Art Australia Prize.

muralDescription: |
  A sprawling botanical mural covering all eight walls of two back-to-back
  handball courts at Campbell Park. Large curved bell-shaped flowers big
  enough to climb into sit alongside massive fringed petals and tall
  striated leaves stretching floor to ceiling. The color palette transitions
  from golden orange at the top through pink in the middle to electric blue
  at the base, all outlined in smoky blue linework. Half the flowers are
  Florida natives and half are Australian natives, connecting Rose's home
  country with the mural's location.

muralInspiration: "Half the flowers are Florida natives and half are native to Australia, connecting the artist's home country with St. Pete. Painted solo in 8 days on 8 walls using only buckets, brushes, and a paint sprayer."
