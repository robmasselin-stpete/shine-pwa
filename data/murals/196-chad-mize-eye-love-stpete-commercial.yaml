artistBio: |
  CHAD MIZE is a multimedia artist, designer and curator residing in St.
  Petersburg, Florida. He was born in New Orleans, Louisiana in 1974, and then
  moved to Tampa Bay Florida, where he spent most of his childhood. An early
  interest in art resulted in his earning a BFA in Visual Communications at
  the University of Mississippi.

  His early career included drawing caricature portraits at Faneuil Hall in
  Boston and illustrating Flash animations for a digital textbook company in
  the late 1990s. In 2003, MIZE moved to St. Petersburg, FL and has been
  championing the Tampa Bay art scene ever since.

  MIZE created the "Paris/Tokyo/London/St. Pete" shirt in 2010. After 16
  years, it is still selling in local shops, popular among both locals and
  tourists.

  MIZE co-founded BLUELUCY gallery on Central Avenue in 2010 (representing
  450-plus artists before closing in 2015).

  In 2018, Mize opened the gallery MIZE in the Historic Uptown neighborhood of
  St Petersburg. Following the closing of MIZE in 2022 he set his sights on a
  larger gallery project entitled SPACE. Currently he is curating exhibits
  throughout Tampa Bay at various venues.

  He served on SHINE's organizing committee for a decade (2015-2025).

  With a love for past and contemporary culture, he takes a humorous,
  tongue-in-cheek approach to his designs, which include playful doodles,
  colorful patterns, political art and graphics with text.

  Mize's client list has included Aids Healthcare Foundation, The Dali Museum,
  Facebook, COACH, NUTRL, Tampa Bay Lightning, Tampa Bay Rays, Sprouts, Kahwa,
  Busch Gardens, The Vinoy Hotel, and JW Marriott.

  Mize's work is held in numerous private and corporate collections nationally
  and internationally.

searchBio: |
  An eye, a heart, and "ST. PETE" in fat blue letters at the center. Surrounding
  it: a black-and-white doodle map of every St. Pete venue worth knowing —
  Ruby's Elixir, BABA Bakery, Ringside Cafe, Coliseum, Rowdies, Uptown Eats,
  Three Birds Tavern, Daddy Kool Records, Dairy Inn, Sunken Garden, Cage
  Brewing, the Vinoy, Mazaro, Tampa Bay Lightning, and more. Signed "MIZE" in
  the upper right corner. The wall is essentially a hand-drawn city map,
  populated with the bars, restaurants, music venues, sports teams, museums, and
  landmarks that define the city's character.

  Chad Mize was born in 1974 in New Orleans, grew up in Tampa Bay, and has been
  in St. Petersburg for over seventeen years. He earned a BFA in Visual
  Communications from the University of Mississippi. His early career included
  drawing sidewalk portraits at Faneuil Hall in Boston and illustrating Flash
  animations for a digital textbook company. His style is bold, cartoon-like
  imagery commenting on politics, religion, and contemporary culture — humorous,
  tongue-in-cheek, influenced by Keith Haring's belief that art should be
  accessible.

  He has painted over 120 murals. He co-founded BLUELUCY gallery on Central
  Avenue in 2010 (representing 450-plus artists before closing in 2015), then
  opened MIZE Gallery on MLK Jr. Street (2018-2022), then SPACE Gallery in a
  former PSTA bus depot (2023), and now curates pop-ups at Green Bench Brewery
  and runs "Side Spot," a mini-gallery next to his husband Dan's restaurant
  Uptown Eats — which appears as one of the venues drawn into this wall.

  Commercial clients include the Tampa Bay Lightning, Tampa Bay Rays, Busch
  Gardens, JW Marriott, the Vinoy, NUTRL, COACH (he designed bag patterns),
  Sprouts, Kahwa Coffee, and AIDS Healthcare Foundation. Recent commercial walls
  include the Hollander Hotel (NÜTRL Vodka Seltzer sponsor), the Wyndham Grand
  in Clearwater Beach, Element Tampa, IMG Academy in Bradenton, the St. Pete
  Pier, the Dali Museum, the Adderley in Ft. Lauderdale, and University Town
  Center Sarasota.

  He is a featured artist at the James Museum (2025) and was included in
  "Outside In: New Murals Inspired by Dali" at the Dali Museum (2025). The
  Artisan Magazine cover story by Robin O'Dell (April 28, 2025) called him "St.
  Pete's Godfather of Art." Website: chadmize.com. Instagram: @chadmize.

