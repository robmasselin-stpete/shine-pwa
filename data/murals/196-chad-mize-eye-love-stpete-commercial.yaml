searchMuralDescription: |
  A wide horizontal mural on a white house wall with a steeply pitched shingled
  roof above. The composition is a dense black-and-white line drawing of St.
  Petersburg venues, signs, and landmarks — Ruby's Elixir, BABA Bakery & Cafe,
  Ringside Cafe, Coliseum, Rowdies (with player #15), Uptown Eats, Three Birds
  Tavern, Daddy Kool Records, Dairy Inn, Sunken Garden, Cage Brewing, Vinoy,
  Mazaro, Beer & Tacos, Bodega, Janus Live, and dozens more — drawn in Mize's
  signature playful doodle style. At the center, three colored elements pop
  against the otherwise monochrome composition: a blue eye with concentric
  circles, a red heart, and "ST. PETE" in chunky blue rounded lettering with
  bold black outline. A small white dog with a red tongue stands below the
  heart. Signed "MIZE" in plain black lettering in the upper right.

