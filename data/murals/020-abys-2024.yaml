artistBio: |
  His first graffiti piece was a Rasta sheep with a joint. He was in high
  school.

  Julien Brouand — Abys — was born in 1991 in Nancy, France. His father put a
  pencil in his hand at eighteen months. He originally wanted to design
  characters for video games or cartoons. He has no formal art education. He
  discovered graffiti in high school after meeting fellow artist Suroh, and they
  formed Osmoz Colors together.

  His style is cartoon-driven — whimsical, exaggerated creatures in lively
  narrative scenes. A "fantastic bestiary" of jazzman rats, thieving raccoons,
  gators, crabs. He describes each piece as "a freeze-frame in full action." He
  works in spray paint, drawing, silk-screening, and tattoo. He cites Mario,
  Ratchet & Clank, Zelda, Worms, and Banjo & Kazooie as influences.

  He has painted across France — Paris, Marseille, Toulouse, Bordeaux, Calais,
  Carcassonne — and in Luxembourg and Belgium. For SHINE 2024, he crossed the
  Atlantic and painted a gator mural at Modera on 17th Street South in about
  four days, plus a bonus crab at Anchor Skate Shop next door.

searchBio: |
  His first graffiti piece was a Rasta sheep with a joint. He was in high
  school.

  Julien Brouand — Abys — was born in 1991 in Nancy, France. His father drew a
  lot and put a pencil in his hand at eighteen months. He has been filling pages
  ever since. He originally wanted to design characters for video games or
  cartoons. He has no formal art education in the fine-art sense, but he studied
  applied arts at Lycée Loritz in Nancy before turning fully to mural painting
  and illustration. He is self-taught as a graffiti writer.

  He met Suroh in high school. Suroh was already into the movement but had never
  painted. They went to get cans one afternoon, slept at Suroh's parents' place,
  and went out that night. Abys painted the Rasta sheep with the joint. With
  three other friends they formed the Bêêêh Crew and started painting sheep in
  the streets of Nancy. As more writers joined, the group worked under the name
  La Meute for a few years. People moved on, others stopped painting, and Abys
  ended up teamed with Suroh again. In 2011 the two founded Osmoz — later Osmoz
  Colors — combining illustration and lettering in collaborative frescoes. He is
  also a member of Nid d'Guêpes Posse (also written Le Nid de Guêpes), a hip-hop
  collective bringing together rappers, graffiti artists and DJs that organizes
  neighborhood events.

  Today he paints more often with Scaf and Valer, both a generation above him.
  He credits them with opening new perspectives during a stretch when he was
  painting alone. Documented collaborations include "Freddy et la fille aux
  cheveux roses" with Scaf in Bordeaux (2018) and "Crâne tropical et requin
  festif" with Scaf and Valer in Pessac (2022).

  His style is cartoon-driven — whimsical, exaggerated creatures in lively
  narrative scenes. A "fantastic bestiary" of jazzman rats, thieving raccoons,
  gators, crabs. He describes each piece as "a freeze-frame in full action."
  Early on he chased realism after discovering the Maclaim crew, then dropped it
  because he wanted to create rather than reproduce. He went back to drawing and
  started building compositions that play characters, decor, letters, colors and
  moods against each other. He sketches constantly in books and assembles
  finished visuals from the pieces. He works in spray paint, drawing,
  silk-screening, canvas, and tattoo. He cites Mario, Ratchet & Clank, Ori,
  Zelda, Worms, Banjo & Kazooie, and Jak & Daxter as influences, plus old-school
  cartoons.

  He left home around nineteen, did odd jobs, then started his own decoration
  business. He grew tired of clients who wanted a "wall printer" reproducing
  rough photos and stopped taking that work. He kept the lights on running
  workshops with kids and painted for himself the rest of the time. Over time he
  rebuilt his identity to the point that clients now give him carte blanche.

  He has painted across France — Paris, Marseille, Toulouse, Bordeaux, Calais,
  Carcassonne, Cergy, Roubaix, Pessac, Le Barcarès — and in Luxembourg and
  Belgium. Documented works include "Symbiose marine colorée" in Le Barcarès
  (2023), "Tortue marine et crabe ermite d'Abys" in Roubaix (2021), and "La Casa
  de la Felicidad" in Cergy (2020). He paints legal walls, EDF power substations
  and private facades around the Nancy area. Festival credits include Urban
  Graff X, Chill Up, and COLORS Urban Art (2019).

  For SHINE 2024 — the festival's tenth anniversary edition, originally
  scheduled for October 11-20 and rescheduled after Hurricanes Helene and Milton
  — he crossed the Atlantic to St. Petersburg, Florida. A scheduling conflict
  meant he started and finished his piece before the rescheduled festival
  opened. He painted a gator mural at Modera, 201 17th Street South, in about
  four days. SHINE director Jenee Priebe then handed him the back side of Anchor
  Skate Shop at 501 16th Street South, where he added a bonus crab. Johnny
  Vitale and Kris Markovich painted the other sides of the same building. The
  festival, curated and invitation-only, is produced by the St. Petersburg Arts
  Alliance.

  He became a father during the pandemic, which gave him time to focus on
  sketches and canvases. He names "The Weird" as a crew he rates highly, and
  Maye as a writer who impresses him. He flags Horor, Korsé, Enora, Koye, Zeklo,
  and Koga as underrated.

  From the Osmoz-Colors site (osmoz-colors.fr): Studio at 74 rue de Mon Désert,
  54000 Nancy, France. Contact: abys.osmoz@gmail.com, 06.76.89.68.37.
  Collaborators listed alongside Abys and Suroh include Scaf, Mites, Reso, Joef,
  and Fogsprod. The portfolio documents named projects in additional venues
  including Le Mur Oberkampf in Paris (December 2021), Le Mur Epinal (2021),
  Mesto Gallery in Podebrady, Czech Republic (2021), Underground Effect at Paris
  La Défense (2020), Zoo Art Show in Lyon (2020), Klownala in Montauban for
  Mister Freeze (2020), "Kings" in Carcassonne with Reso and Scaf (2019), Long
  Art Street in Longlaville (2021), Street Art Boulogne Festival in
  Boulogne-sur-Mer (2021), Mister Freeze Exhibition in Toulouse (2018), Toul
  Graffiti Jam (2017), Open Summer Festival in Toulouse with Scaf, Mites, and
  Reso (2018), Urban Giants in Milan (2018), Mjc Bazin in Nancy (2018), and an
  "Abys Museum" pop-up in Nancy (2021). Documented canvas works include "I Love
  You More Than Ice Cream" (2021), "All Aboard" (2020), "Fireflies Hunter"
  (2019), "A Crack In Life" (2019), "Chillers" (2019), "Lone Bikers" (2019),
  "The Kleptoman" (2019), "Rainmakers" (2019), "Endless Race" (2019), "One
  Monkey Band" (2018), and "Seventh Land" (2016). Other commercial clients
  listed include Spadas Clothing (2014), BDS's Gaming House in Geneva (2020),
  and School of Style in Luxembourg (2019). He has produced recycled skateboard
  art ("7 Plis," 2021). Infographic / design projects credited under Osmoz
  include "Touche d'espoir" with Joef & Fogsprod (2017) and "Stratégie de Paix"
  (2015).

  Find him on Instagram as @abys_osmoz, on Flickr as abys-osmoz, and on Facebook
  as OSMOZ.COLORS.

searchMuralDescription: |
  A six-story-tall mural on the side of the Modera apartment building depicting
  a cartoonish, pot-bellied alligator with a mischievous grin, riding a red
  surfboard through splashing turquoise waves. A pink hibiscus flower sits atop
  the gator's head, and teal smoke curls above. The surfboard reads "SHINE" in
  stylized lettering. At the base, a triangular logo anchors the composition.
  The character's exaggerated features and vibrant green-on-gray color scheme
  make it visible from blocks away.

