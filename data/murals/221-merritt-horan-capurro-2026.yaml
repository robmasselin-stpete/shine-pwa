artistBio: |
  Merritt Horan Capurro paints walls several stories tall. She also built a
  gallery at one-twelfth scale, the St. Pete Mini Gallery, and takes it on the
  road.

  The Mini Gallery is a grant-funded public installation, backed by Creative
  Pinellas and the City of St. Petersburg. It fits how she sees art: something
  to meet up close, in ordinary places, when you aren't expecting it.

  A stranger in a beach wheelchair once told her that the Bellwether's
  elevator was hideous and needed a mural. She looked the St. Pete Beach hotel
  up, found it was where her grandparents had celebrated their 50th
  anniversary, and called. The cold call became a live-paint art night by the
  pool, then monthly zodiac-themed solo shows on the hotel's Level 11 rooftop,
  until the 2024 hurricanes put them on hold.

  She was born at MacDill Air Force Base, graduated from Largo High and earned
  a BFA in technical theatre at UCF, where she found a love of sewing and
  scenic art. She spent more than a decade in New York working in fashion. In
  about 20 years as a textile designer she has drawn prints for White House
  Black Market, Kohl's, Anthropologie, Victoria's Secret and Walmart, and she
  likes flat graphic illustration and bold, colorful prints.

  The textiles show on her walls. On St. Pete Beach she painted crabs from a
  vintage textile design by Andre Durenceau at Corey Avenue and Gulf
  Boulevard, and "Sealife Selfie," an oversized postcard with dolphins that
  you stand in front of for a photo. Her Bella's Bagels wall on Central Avenue
  fits all four Tampa Bay teams into one design. Her site lists "Waterfall
  Dreams," at Sailpointe Apartments in South Pasadena, as a 2024 Best of the
  Bay nominee. In the studio she paints realistic still lifes of fruit
  arranged in unexpected ways. One show listing called them "playfully
  adult-themed" art that is "safe enough to hang in your kitchen."

  After Hurricane Helene, Creative Pinellas asked her to curate "Still
  Shining," a one-night show of Pinellas artists at its hurricane relief
  fundraiser. By her own count, 15 of the 24 paintings sold.

  For SHINE 2026, the festival's twelfth year, she is painting a wall at PARC
  on Tyrone Boulevard, a nonprofit that has served people with intellectual
  and developmental disabilities since 1953.

searchBio: |
  Merritt Horan Capurro paints walls several stories tall. She also built a
  gallery at one-twelfth scale, the St. Pete Mini Gallery, and takes it on the
  road.

  The Mini Gallery is a grant-funded public installation, backed by Creative
  Pinellas and the City of St. Petersburg. It fits how she sees art: something
  to meet up close, in ordinary places, when you aren't expecting it. Her
  SHINE artist record describes it as a roving art space built at 1:12 scale,
  and says her work has shown in galleries, public spaces and curated
  exhibitions around Florida.

  A stranger in a beach wheelchair once told her that the Bellwether's
  elevator was hideous and needed a mural. She was on the beach researching a
  logo design when he rolled up and asked what she was doing. He was staying
  at the Bellwether Beach Resort in St. Pete Beach, and he had already asked
  the front desk. She looked the hotel up and found it was where her
  grandparents had celebrated their 50th anniversary. She called, pressed five
  for events, and pitched the events coordinator a monthly art night where
  artists paint live by the pool. He agreed, then asked what was next. Next
  was a 12-month curatorial gig: monthly zodiac-themed solo shows at the
  hotel's Level 11 Rooftop Bar & Lounge, and she booked a different artist
  each month: Wayward Walls in August 2024, Derek Donnelly in September, a
  Scorpio by Chad Mize in October. Then the hurricanes put the shows on hold.
  Her own murals include the top of the Bellwether at Level 11.

  She was born at MacDill Air Force Base in Tampa, and most of her family
  lives in Pinellas County. She graduated from Largo High, then earned a BFA
  in technical theatre at the University of Central Florida, where she found a
  love of sewing and scenic art. Her site says she opened a mural company in
  2005, working mainly on interior walls, before she moved to New York to
  start a fashion career. She spent more than a decade there before returning
  to the St. Pete area.

  The day job is textiles. She has worked professionally as a textile designer
  since 2006, and as a CAD artist in fashion she has designed across men's,
  women's, kids' and home categories. Her site lists White House Black Market,
  Kohl's, Anthropologie, Victoria's Secret and Walmart among the companies she
  has worked for, and USPA as a current freelance client. She hand draws her
  designs, then works them up in Adobe programs, and also paints watercolor
  and gouache originals that are translated into seamless repeats. She likes a
  flat graphic illustrative file and bold, colorful prints with whimsical
  novelty subjects. Her site also lists a live Home Shopping Network airing of
  the Cutterpillar light board on September 1, 2021. Her business is Creative
  Earth, LLC, which does business as Bunch of Sunshine and sells her designs
  on towels, clothes, cups and bags.

  The textiles show on her walls. On St. Pete Beach she painted crabs taken
  from a vintage textile design by Andre Durenceau at Corey Avenue and Gulf
  Boulevard, and "Sealife Selfie" at 76th Avenue and Gulf Boulevard, an
  oversized postcard with dolphins that you stand in front of for a photo. Her
  Bella's Bagels mural at 7100 Central Avenue fits all four Tampa Bay teams,
  and their favorite things, into one design. Her site lists "Waterfall
  Dreams," a waterfall on the outside of Sailpointe Apartments in South
  Pasadena, as a 2024 Best of the Bay nominee. Other walls on her site include
  a faux aged Moroccan wall at the Bohemian Reves flagship store at Central
  Avenue and 16th Street, stripes across the front of the company's warehouse
  in August 2022, sparrows in clouds at Garden of Growth Learning Center, and
  a Pinellas Park storm drain project completed in July 2022. During SHINE
  2022 she helped Chad Mize and friends decorate the Pinellas Trail in her
  stained-glass style. For the Mindful Muralists project at the Campbell Park
  Recreation Center art room, Zulu Painter asked her to collaborate on a
  Salvador Dalí-inspired piece: she painted the backdrop of sand and horizon
  line, and kids' drawings from the community fill it. Creative Pinellas
  counted more than 15 murals in November 2024. Her own site now says more
  than 25, and she gives talks about the local mural scene.

  In the studio she paints realistic still lifes of fruit arranged in
  unexpected ways, done from still-life moments she sets up at home in St.
  Pete Beach. Creative Pinellas calls them realistic "juicy" hand portraits.
  Her second solo show at Bayboro Brewery, "Art & Ale: A Fruity Soiree," on
  May 8, 2024, paired the paintings with beer, live jazz, hand-sewn bags and
  essential oils, and debuted her jazz-themed alley mural in the brewery's VIP
  stairwell. The listing called the paintings "playfully adult-themed" art
  that is "safe enough to hang in your kitchen." By Creative Pinellas's
  account, each painting has visible and hidden meanings, and she encourages
  people at her shows to ask her about them.

  Her group shows run through Populum's "Black Hearts" and "Effloresce"
  exhibits at Coastal Creative in 2022, the 9th Annual Robot Exchange at The
  Factory St. Pete, the Tampa Small Walls Show at the Renaissance Hotel in
  Tampa, and 5 Deuces Galleria, which showed "Florizia." Her site also lists
  Mize Gallery, Creative Pinellas, Werk Gallery, Morean Arts Center's gift
  shop, Ekeko Gallery, the Epicurean Hotel, Green Bench Brewing, Lake Wales
  Fine Art Center and the Kress Contemporary building.

  Hurricane Helene cost her an estimated $3,000 to $4,000 in business goods in
  2024, and members of her family lost their homes. At a sake-bar fundraiser
  for her family, Chad Mize introduced her to Margaret Murray, CEO of Creative
  Pinellas. They spoke on the phone the next day, and Murray offered her a
  curating job: "Still Shining," a one-night exhibition of Pinellas artists
  responding to Helene and Milton, held at the Arts Annual Hurricane Relief
  Fundraiser in Largo on December 7, 2024. Each artist had a month to make a
  12-by-12-inch piece with a positive resonance. By her own count, 15 of the
  24 paintings sold and the event helped raise $20,000 for the community.
  Creative Pinellas also gave her an Arts Impact Fund grant to build a
  weatherproof miniature art gallery for a rotating collection of miniature
  artworks. "I really like to take the universe's nod and say, 'Yep,'" she
  told Creative Loafing.

  For SHINE 2026, the festival's twelfth year, she is painting a wall at PARC
  on Tyrone Boulevard, a nonprofit that has served people with intellectual
  and developmental disabilities since 1953.

