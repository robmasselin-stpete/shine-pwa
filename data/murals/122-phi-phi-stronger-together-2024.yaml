artistBio: |
  This is a community mural, not the work of a single artist. It was led by Sara
  Salem — Phi Phi Artland's Head of Fine Arts — who started with a contest to
  give a free mural to a local storefront. Mikhael's storefront won. After
  Hurricanes Helene and Milton hit Florida in 2024, Sara wanted the mural to do
  more than beautify one wall: she wanted it to bring people together in a
  shared act of creation. She secured a grant from the St. Pete Arts Alliance
  with backing from the City of St. Petersburg, and the Community Mural Project
  was born.

  The Phi Phi Artland team — Christianna, Clair, Nadine Allan, Nelia, and Sara —
  designed a collage of faces in diverse colors, symbolizing unity and the
  beauty of embracing differences. Each face tells a story; together they
  reflect the multicultural fabric of St. Petersburg.

  Painting happened over four weekends, each led by a different team artist.
  Nelia ran weekend one — neighbors, families, and first-time painters laid the
  foundation. Clair led weekend two, layering color and detail. Christianna, the
  team's graphic designer, took weekend three, finalizing the layout despite
  unusually cold Florida weather and switching from scaffolding to ladders for
  the upper sections; the design picked up extra flowers along the way. Nadine
  Allan led weekend four — all painting slots fully booked — and the team
  finished the piece together.

searchBio: |
  "Stronger Together" is the 2024 St. Pete Community Mural Project — a
  collaboration led by Sara Salem (Phi Phi Artland's Head of Fine Arts) and
  painted by the Phi Phi Artland team alongside dozens of community participants
  over four weekends in late 2024. Funded by a grant from the St. Pete Arts
  Alliance and supported by the City of St. Petersburg.

  Sara Salem started with a storefront contest to give one local business a free
  mural. Mikhael's storefront won. After Hurricanes Helene and Milton hit
  Florida that year, Sara expanded the project to bring the community together
  in a shared act of creation, securing the grant from St. Pete Arts Alliance.

  The Phi Phi Artland team — Christianna, Clair, Nadine Allan, Nelia, and Sara
  Salem — designed a collage of faces in diverse colors, symbolizing unity and
  the beauty of embracing differences. The mural is a celebration of St.
  Petersburg's multicultural fabric.

  Each weekend was led by a different team artist: - Weekend 1 — Nelia laid the
  foundation with first-time painters. - Weekend 2 — Clair layered color and
  detail. - Weekend 3 — Christianna (graphic designer) finalized the layout
  despite cold weather; flowers added; switched scaffolding to ladders. -
  Weekend 4 — Nadine Allan led the finishing touches; all slots booked.

  Located near 22nd and Central Ave in downtown St. Petersburg.

  Phi Phi Artland is a St. Petersburg fine-arts and martial-arts studio that
  also runs community mural projects. Website: phiphiartland.com. Instagram:
  @phi_phi_artland.

searchMuralDescription: |
  A wide panoramic mural showing a row of stylized faces in profile, each
  rendered in different bold color blocks — greens, yellows, purples, pinks,
  blues, and oranges. The faces overlap and interlock like puzzle pieces,
  surrounded by tropical leaves, palm fronds, and simple white flowers. The
  words "Stronger Together!" appear in gold script on the right side. The style
  is flat and graphic with clean geometric shapes making up each face, giving
  the whole piece a modern, poster-art quality. It reads as a celebration of
  community and diversity.

