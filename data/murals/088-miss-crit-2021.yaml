artistBio: |
  Her illustration was chosen for the global Creative Mornings theme "Rise" —
  displayed across 238 cities in 69 countries.

  Laura Spencer — Miss Crit — was born and raised in St. Petersburg. She
  graduated from the Pinellas County Center for the Arts at Gibbs High School,
  then earned a BFA in Illustration from Ringling College of Art and Design with
  a semester exchange at Sint Lucas Antwerpen in Belgium. She calls her style "a
  little bit spooky and a little bit psychedelic."

  She worked as art director at Bealls Department Stores and as an illustrator
  at Creative Arts Unlimited before going full-time. She co-created the Sunshine
  City Mosaic — a $50,000 public art installation at Sunset Park. She received
  the Creative Pinellas Emerging Artist award (2019) and leads SHINE's 10th
  anniversary trolley mural tour.

  For SHINE 2021, she painted in St. Petersburg.

searchBio: |
  Her illustration was chosen for the global Creative Mornings theme "Rise" —
  displayed across 238 cities in 69 countries. Creative Mornings, founded in
  2008 in Brooklyn, calls itself the world's largest face-to-face creative
  community and runs free local events, weekly virtual FieldTrips, and job
  postings via its CreativeGuild. Each month a chapter nominates a one-word
  theme echoed by every other chapter; the program started in 2013 and has
  produced 132 themes and illustrations. Miss Crit was selected from a group of
  illustrations suggested by the Tampa Bay chapter (formerly the St. Pete
  chapter). She worked with Casey Greenleaf at Creative Mornings headquarters
  and offered three initial sketches — plants and flowers swaying toward the
  sun, a glimpse into the human mind with a pathway leading to a rising sun, and
  a phoenix rising from the ashes trailing the word RISE. The phoenix won. She
  built the illustration on a Wacom Cintiq Pen Display.

  Laura Spencer — Miss Crit — was born and raised in St. Petersburg, Florida.
  She started formal art training young, attended Pinellas County Center for the
  Arts at Gibbs High School with a major in Visual Arts in 2007, and earned a
  BFA in Illustration from Ringling College of Art and Design in Sarasota in
  2011. During her time at RCAD she did a semester-long foreign exchange at Sint
  Lucas Antwerpen — Studio illustratie in Antwerp, Belgium, where classes were
  held in both Dutch and English; she began designing digitally there. She calls
  her style "a little bit spooky and a little bit psychedelic" and says she
  designs with her third-eye wide open, combining traditional fine art
  techniques, narrative storytelling devices, and digital design technology. Her
  work spans drawings, paintings, murals, interactive installations, and
  collaborations.

  Before going full-time she worked as Art Director for Bealls Department Stores
  and as Illustrator for the exhibit design firm Creative Arts Unlimited, Inc.
  in Pinellas Park, Florida. She took out a small business loan to declare
  herself a full-time artist, calling it buying her creative freedom.

  She received the Creative Pinellas Emerging Artist Grant in 2019. Her mentor
  through that program, Chad Mize, advised her on building a recognizable brand.
  The nickname Critter came from fellow visual artist Frank Strunk III — given
  because she is "small, wiry, feisty and eats raw vegetables." She and Mize
  shortened it and added the retro title "Miss," combining the formal girlie
  "Miss" with something nicely ambiguous. Miss Crit.

  Her partner, sculptor George Retkes, also attended Gibbs and Ringling. They
  co-founded Artonomy LLC, a design company specializing in sculpture, exhibit
  design, interactive installation, immersive design, public art, art direction,
  project management, fabrication, and installation. Artonomy's $50,000 public
  art installation The Sunshine City Mosaic — a collaboration with artist Alex
  Kaufman — sits at Sunset Park at Central Avenue and Park Street in St.
  Petersburg. Retkes and Spencer were both Creative Pinellas Emerging Artists in
  2019; Kaufman was selected in 2022.

  For SHINE 2021, she painted at Absolutely Beautiful Flowers, 3000 Central, in
  St. Petersburg. In January 2022 she completed Garden Variety, a
  1,700-square-foot mural on the corrugated façade of the Mother Kombucha
  warehouse at 4360 28th Street N. in the Lealman District, commissioned by
  Creative Pinellas in association with the Lealman Community Redevelopment Area
  (CRA). The piece features nine or ten native Florida plants and pollinators —
  sea grapes, cocoa plums, native blueberries, wild coffee, prickly pear,
  passion flower — chosen to celebrate edible native plants and sustainable
  permaculture, aligning with Mother Kombucha's mission. Lealman is where she
  grew up. She painted from a rented green lift through a January cold snap. A
  solo show opened at the Wayward Goose in June 2022.

  Other mural projects listed on her site include Outside In | Dalí, Learning by
  Living, Centro Asturiano, Lakewood High School, Perkins Elementary, Jamerson
  Elementary, Mother Kombucha, the PIE Airport (St. Pete-Clearwater
  International Airport, where she posed in front of her mural in January 2023),
  the SHINE Mural Festival, The Woodson Museum, The Blueberry Patch, and a Misc.
  Mural Archive. Her practice categories include Murals, Exhibition,
  Illustration, Sunshine City Mosaic, Ralph's Mob Shop, and Mural Tours.

  She was included in Outside In: New Murals Inspired by Dalí at The Salvador
  Dalí Museum, May 24 through October 26, 2025, marking the SHINE St. Petersburg
  Mural Festival's 10-year anniversary. The exhibition was curated by Allison
  McCarthy, Associate Curator and Preparator at The Dalí Museum, and featured
  current and past SHINE artists creating murals inside the Museum's gallery,
  inspired by Dalí, his collection, and the Museum's architecture. The roster
  included Bakpak Durden, BASK, Chad Mize, Fintan Magee, Greg Mike, Lauren YS,
  Marina Capdevila, Miss Crit, Naomi Haverland, Nicole Salgar, Palehorse,
  SHOK-1, and Tes One. The exhibition concluded with YOUR PORTRAIT, a
  selfie-to-street-art experience, and an AI-powered Dream Tapestry.

  She leads SHINE's 10th anniversary trolley mural tour. She has spoken about
  Art, Wellness and New Year Revolutions at the St. Petersburg Arts Alliance's
  Beyond Arts Business Academy and appeared at CreativeMornings/Tampa Bay at
  Behar and Peteranecz Architecture, 2430 Terminal Dr S, St. Petersburg. She
  still takes on a few design clients while focusing on her own painting, plans
  to stay in St. Pete, and describes herself as a bit of a tomboy who also
  embraces her femininity.

  Website: themisscrit.com. Instagram: @miss_crit.

searchMuralDescription: |
  The phrase "NOWNESS IS THE PORTAL" stretches across the wall in large
  cream-colored serif lettering with a slight Art Nouveau curve to the type.
  Behind and around the text, a dense arrangement of tropical foliage fills the
  entire surface — deep green monstera leaves, burgundy ti plants, broad
  tropical leaves in teal and dark green, and a large white magnolia bloom
  opening in the upper right. The background is a moody dark teal that makes the
  plants and flower pop. The whole piece wraps around two second-story windows
  on the building face.

