artistBio: |
  Miss Crit is the working name of Laura Spencer, an illustrator and muralist
  born and raised in St. Petersburg. She earned her BFA in Illustration from
  Ringling College of Art and Design in Sarasota as a Trustees' Scholar, and
  built her career right in the Burg, becoming one of the city's most visible
  local artists. Her style ranges from lush botanical realism to spooky,
  psychedelic character work — she's comfortable painting a giant magnolia on
  one wall and a third-eye skeleton on the next. She co-founded Artonomy LLC,
  a creative studio handling murals, illustration, and design. One of her most
  ambitious projects is the Sunshine City Mosaic, a 175-foot community mosaic
  made from over 15,000 hand-placed tiles. She was selected for the Dali
  Museum's "Outside In" exhibition in 2025, bringing her work into dialogue
  with the Surrealist tradition. Beyond walls, she does illustration, digital
  design, and interactive installations. She's painted multiple SHINE murals
  and has work scattered across the Grand Central District and downtown.

muralDescription: |
  The phrase "NOWNESS IS THE PORTAL" stretches across the wall in large cream-
  colored serif lettering with a slight Art Nouveau curve to the type. Behind
  and around the text, a dense arrangement of tropical foliage fills the
  entire surface — deep green monstera leaves, burgundy ti plants, broad
  tropical leaves in teal and dark green, and a large white magnolia bloom
  opening in the upper right. The background is a moody dark teal that makes
  the plants and flower pop. The whole piece wraps around two second-story
  windows on the building face.

