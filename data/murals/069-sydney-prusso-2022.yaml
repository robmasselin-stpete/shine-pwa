artistBio: |
  This wall looks like a vintage concert poster blown up to building scale. The
  three words on it — Go Outside, Look Inside — are her whole practice.

  Sydney Prusso is an illustrator, lettering artist, and muralist based in the
  Tampa Bay area. Her style is contemporary botanical — flat illustration rooted
  in graphic design, warm 1960s and 70s color palettes, flowing poster
  lettering. Nature, the outdoors, and mental health run through the work. She
  graduated from MICA and has painted fifty-plus murals across six states, with
  installations up to 75 feet. She has done a Reef Organization project in the
  Florida Keys.

  Clients include Salesforce, Adobe, Dickies, PepsiCo, John Deere, Stihl, the
  NFL, and AstraZeneca. For SHINE 2022, she painted two murals in St.
  Petersburg.

searchBio: |
  She graduated from MICA and has painted fifty-plus murals across six states,
  installations up to 75 feet.

  Sydney Prusso is an illustrator, lettering artist, and muralist based in the
  Tampa Bay area. Her style is contemporary botanical — flat illustration rooted
  in graphic design, warm 1960s and 70s color palettes, flowing poster
  lettering. Nature, the outdoors, and mental health run through the work. She
  has done a Reef Organization project in the Florida Keys.

  Clients include Salesforce, Adobe, Dickies, PepsiCo, John Deere, Stihl, the
  NFL, and AstraZeneca. For SHINE 2022, she painted two murals in St.
  Petersburg.

  Her studio operates under the brand Syd Bloom Studio (sydneyprusso.com /
  sydbloom.com). Named brand projects on her site include an Apothecary mural
  and tea package design, a Grow Financial multi-store mural installation
  (including the West River, Tampa location), a Vintage Furniture Store mural
  and branding package, and a Fresh Kitchen multi-store installation. Other
  commercial clients include Garage Project (the brewery). She also takes
  residential commissions and out-of-state projects — testimonials reference a
  short-term rental mural in Port Angeles, Washington. Her illustration practice
  spans branded packaging, advertising, publishing, surface patterns, and
  textiles. Studio email: studio@sydbloom.com. Direct: sydney@sydneyprusso.com.

searchMuralDescription: |
  The entire side of a peaked-roof building wrapped in retro psychedelic
  lettering spelling "Outside" and "Look Inside" in chunky, rounded '70s-style
  typography. The letters are layered in pinks, oranges, chartreuse, white, and
  maroon against a purple background. Colorful butterflies — a large
  pink-and-red one at center, smaller ones floating above — are scattered
  between the words. Sparkle stars dot the upper peak. The overall vibe is a
  vintage concert poster blown up to building scale.

