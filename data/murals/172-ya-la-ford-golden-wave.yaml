searchMuralDescription: |
  A striking gold-on-black mural on the exterior of the Morean Arts Center. Ya
  La'Ford's signature dense geometric pattern — interlocking angular shapes
  rendered in gold leaf or metallic gold paint — forms a large arch or wave
  sweeping across a dark charcoal wall. The pattern flows over and around a pair
  of black double doors, with a matching geometric heart motif painted on the
  doors themselves. The composition creates an almost architectural portal
  effect. A small gold plaque on the lower right reads "Ya La'Ford / Golden Wave
  / Morean Arts Center / muralofia.com." Sunlight catches the metallic lines,
  giving the piece a luminous, shifting quality.

