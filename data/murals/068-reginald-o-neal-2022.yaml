artistBio: |
  He paints his Overtown neighbors at oil-on-linen museum scale. On this wall,
  he scaled up historian John Henrik Clarke and the Mundari of South Sudan to
  fill the building.

  Reginald O'Neal began painting in 2012 under Alejandro Dorda, who trained him
  classically and introduced him to his other mentor, the Spanish-born graffiti
  artist Axel Void. He still works in oil on linen — figurative work depicting
  musicians, family, and community members from Miami's Overtown neighborhood.
  His subject matter shifted over time from broad political work to intimate
  portraits of the people closest to him. Artsy named him Vanguard 2021.

  He has shown at the Rubell Museum ("American Vignettes," 2024), ICA Miami, The
  Bass, and Perez Art Museum Miami. His solo "Souled Out" opened at Vielmetter
  Los Angeles in 2024. He was nominated for the 2023 Florida Prize in
  Contemporary Art and holds residencies at Oolite Arts and Anderson Ranch.

searchBio: |
  He is self-taught. His mentor taught him to study Joaquin Sorolla. Artsy named
  him Vanguard 2021.

  Reginald O'Neal — who also goes by L.E.O. — was born in Miami, Florida in 1992
  and still lives and works there. He began painting in 2012 and soon met
  Alejandro Dorda, who became his friend and mentor and taught him classically.
  Dorda also introduced him to his other mentor, Spanish-born graffiti artist
  Axel Void. O'Neal works in oil on linen, painting figurative pictures of
  musicians, family, and community members from Miami's Overtown neighborhood.
  His subject matter shifted over time from broad political work to intimate
  portraits of the people closest to him.

  In 2014, L.E.O. took his first trip to Europe, completing murals in Austria,
  Norway, and Spain and exhibiting in a collective show alongside Dorda at Urban
  Art Clash in Berlin, Germany. Since then he has divided his practice between
  canvas work, residencies, and murals.

  Solo exhibitions include "Souled Out" at Vielmetter Los Angeles (September 14
  — November 2, 2024, in the gallery's Greenhouse space) and "Forever Fleeing"
  at the Festival del Arte Contemporáneo de Cádiz in Cádiz, Spain in 2024. In
  2023 he showed "And I Think to Myself" at Spinello Projects in Miami and "The
  Cellist" at Meridians, Art Basel Miami Beach. In 2021 he had "They Dreamt of
  Us" at Spinello Projects and "As I Am" at the Rubell Museum in Miami. Earlier
  solos include "At The Feet of Mountain" at Spinello Projects in 2020 and "Sun
  Beneath The Soil" at L.E.O. in Portland, Oregon in 2019.

  Group shows include "Mirror of the Mind: Figuration in the Jorge M. Perez
  Collection" at El Espacio 23 in Miami (2024), "American Vignettes: Symbols,
  Society, and Satire" at the Rubell Museum (2024), "To Be as a Cloud: Recent
  Acquisitions" at NSU Art Museum Fort Lauderdale, "A Landscape Longed For: The
  Garden As Disturbance" at the Crisp-Ellert Art Museum in St. Augustine, and
  "Selections of the Marquez Family Collection" at Marquez Art Projects in
  Miami. In 2023 he was included in the "2023 Florida Prize in Contemporary Art"
  at the Orlando Museum of Art, "Gimme Shelter" at the Historic Hampton House in
  Miami, and "It Was Always About You..." at Oolite Arts. Other group shows
  include "By the Skin of Your Teeth" at NOVA Art Basel Miami Beach (2022),
  "Open Storage" at The Bass (2022), "Lean-To" at Oolite Arts (2022),
  "Selections from Permanent Collection" at ICA Miami (2021), "Grounded" at
  Spinello Projects (2019), "Homeless" at Void Projects (2018 and 2019), "South
  Florida Cultural Consortium" (2019), "Collabo 6" (2019), "Afterglow" at The
  Frank in Pembroke Pines (2018), Laundromat 2.0 in Miami (2018), Youth Concept
  Gallery in West Palm Beach (2017), Street Art For Mankind in Miami (2017),
  Profiles Exhibition in Hollywood, Florida (2016), and the Artesano collective
  show in Miami (2014).

  Residencies include the Festival del Arte Contemporáneo de Cádiz in Spain
  (2024), Anderson Ranch Arts Center in Colorado (2022), Atlantic Center for the
  Arts in New Smyrna Beach, Florida (2020), the Forest for the Trees Curated
  Field Trip in Tokyo, Japan (2019), Bed-Stuy Art Residency in Brooklyn (2018),
  Creença in Catalonia, Spain (2018), and Konvant Art Residency in Catalonia
  (2017). He was a Studio Resident at Oolite Arts in 2022 and 2023, and a Home +
  Away Resident through Oolite at Anderson Ranch (2022) and Atlantic Center for
  the Arts (2020).

  Mural festival credits include In Wall We Trust Mural Festival in Airola,
  Italy (2019), Maya Angelou Mural Festival in Los Angeles (2019), Forest For
  The Trees in Seattle (2019), San Isidro Mural Festival in Havana, Cuba (2019),
  the Emancipation Exhibition in Marseille, France (2018), Transfert & Co in
  Nantes, France (2018), City Year MLK Day of Service in Miami (2018), the Shine
  Street Art Festival in St. Petersburg, Florida (2017), Slash and Burn in
  Sumatra, Indonesia (2017), Artesano Street Art Festival in San Pedro,
  Dominican Republic (2016), Urban Art Experience in Miami (2015), Artesano
  Street Art Festival in Nagua, Dominican Republic (2015), 352 Walls in
  Gainesville, Florida (2015), Artesano Street Art Festival in Rio San Juan,
  Dominican Republic (2014), and Desordes Creativas in Galicia, Spain (2014).

  His SHINE 2022 mural depicted historian John Henrik Clarke overlaid on the
  Mundari tribe of South Sudan. Recent paintings shown at Vielmetter include
  "Head of the Sax Player" (oil on linen, 20" x 16"), "Trio" (62" x 52"),
  "French hornist" (42" x 34"), "Sax and Drummer" (60" x 48"), and "Lost at Sea"
  (60" x 90"), all 2024 and photographed by Zachary Balber. His work is held in
  the public collection of the Perez Art Museum Miami.

  Press coverage includes Douglas Markowitz, "Reginald O'Neal, Cara Despain, and
  Other Artists Nominated for 2023 Florida Prize," Miami New Times, May 31,
  2023; Torey Akers, "Miami artist billboard project puts justice in the
  spotlight," The Art Newspaper, November 28, 2022; Isis Davis-Marks, "The Artsy
  Vanguard 2021: Reginald O'Neal," Artsy, December 1, 2021; Carolina del Busto,
  "Reginald O'Neal Searches for Inspiration From His Family and Overtown
  Neighborhood," Miami New Times, October 1, 2021; Angelica Villa, "At the
  Rubell Museum, Reginald O'Neal Pictures Miami's Overtown Neighborhood,"
  ArtNews, November 29, 2021; and Carl Juste, "Local artist Reginald O'Neal is
  emerging as an art star painting his community," Miami Herald, November 25,
  2021. He is represented by Vielmetter Los Angeles and Spinello Projects.

searchMuralDescription: |
  A sweeping black-and-white mural spanning the full wall. A suited man —
  historian John Henrik Clarke — sits as the central figure, painted with
  photorealistic precision. Behind him, silhouetted scenes show Mundari
  tribespeople tending long-horned cattle and casting fishing nets. The
  monochromatic palette and classical brushwork give the piece the weight of a
  museum painting at building scale.

