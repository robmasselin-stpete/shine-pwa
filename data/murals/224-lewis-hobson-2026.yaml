  own.

  Reiver is the name Lewis Hobson paints under; at home in the North East of
  England he is also known as Durham Spray Paints. A lifelong Durham resident
  with no art-school training, he came up through graffiti and turned to
  murals during the 2020 lockdown. His walls tend to start with local stories,
  like the RNLI lifeboat he painted on The Ship Inn in Hartlepool. A wall, he
  has said, is "70 percent chatting and 30 percent painting."

  In 2023 he launched a mural festival in his home town of Spennymoor and set
  up CYAN CIC, a community arts company.

  For SHINE 2026 he paints the back walls at Skyline Campus with Ellis Warren
  and Daniel White.

  Spennymoor's festival, billed as the North East's first, sends his Durham
  Spray Paints crew across the town for a week each July; one round added a
  giant curious pigeon and the town crest to the back of R. Defty's. Other
  walls include a tiger in Sacriston and pieces on Hartlepool's Headland,
  among them The Pot House pub. In 2023–24 he was artist in residence at
  Durham Sixth Form Centre, where he had studied, gathering photos,
  memorabilia and memories of Durham's ice rink, open from the 1930s until
  1996, for an April 2024 show at Dead Dog Gallery. The idea, he said, came
  from hearing his parents and grandparents talk about the rink. He posts his
  work on Instagram as reiver_94.

