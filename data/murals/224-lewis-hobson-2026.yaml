artistBio: |
  Reiver's first big wall was a trade: he asked to paint an abandoned building
  beside a scrapyard, for free, so his work would cover the graffiti already
  on it. Passers-by liked it enough to start asking him for murals of their
  own.

  Reiver is the name Lewis Hobson paints under; at home in the North East of
  England he is also known as Durham Spray Paints. A lifelong Durham resident
  with no art-school training, he came up through graffiti and turned to
  murals during the 2020 lockdown. His walls tend to start with local stories,
  like the RNLI lifeboat he painted on The Ship Inn in Hartlepool. A wall, he
  has said, is "70 percent chatting and 30 percent painting."

  In 2023 he launched a mural festival in his home town of Spennymoor and set
  up CYAN CIC, a community arts company.

  For SHINE 2026 he paints the back walls at Skyline Campus with Ellis Warren
  and Daniel White.

searchBio: |
  Reiver's first big wall was a trade: he asked to paint an abandoned building
  beside a scrapyard, for free, so his work would cover the graffiti already
