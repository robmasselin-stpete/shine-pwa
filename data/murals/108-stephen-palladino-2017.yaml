artistBio: |
  He started painting large-scale murals across New York City as a teenager.
  Tiffany and Lady Gaga are clients.

  Stephen Palladino was born in 1986 in the Bronx. He attended a magnet art
  program at age ten for classical technique, but his real education was on the
  streets. His style merges street culture, fine art, and raw emotional
  storytelling — cartoon and graffiti-rooted characters that are "slick and
  gritty, dark and lowbrow" with hidden layers of popular imagery.

  Clients include Tiffany & Co., Playboy, Lady Gaga, Reebok, American Express,
  and Capital One. He created "The Late Night Drawing Show" on social media and
  is a regular at Art Basel. He is based between Los Angeles and New York.

  For SHINE 2017, he painted in St. Petersburg.

searchBio: |
  He started painting large-scale murals across New York City as a teenager.
  Tiffany and Lady Gaga are clients. Stephen Palladino was born November 3, 1986
  in the Bronx, New York. His father, a carpenter and pinstriper, introduced him
  to airbrushing. His mother brought a Sicilian heritage into the household. By
  age ten Palladino had earned a spot in a magnet art program where he began
  formal training in classical techniques. The other half of his education came
  on the streets — painting large-scale murals throughout New York City as a
  teenager to earn money, sharpen his craft, and find his voice.

  The result is a signature style that merges street culture, fine art, and raw
  emotional storytelling. Cartoon and graffiti-rooted characters sit inside
  dense, highly detailed compositions, often blurring the line between chaos and
  control. The work carries hidden layers of popular imagery and themes of
  identity, culture, and the imperfect nature of being human.

  Palladino has grown from a local muralist to a commissioned creative force,
  with a portfolio of high-profile collaborations and brand work. His clients
  and collaborators include Tiffany & Co., Playboy, Lady Gaga, Reebok, American
  Express, and Capital One. His work lives in private collections across Europe,
  Asia, and the United States. Beyond walls, his practice extends to large-scale
  installations, intricate drawings, and immersive digital experiences. He lives
  and works between Los Angeles and New York.

  Documented projects include STP x Thumpers at Journal Standard in Tokyo in
  2019.

  For SHINE 2017, Palladino painted in St. Petersburg, Florida as part of the
  festival's third edition. The 2017 SHINE artist roster, curated by Chris
  Parks, included Axel Void & L.E.O., Cryptic (also written Kryptk), Daniel "R5"
  Barojas, Herbert Scott Davis, Hueman, James Oleson, Joram Roukes, Jose Mertz,
  Jujmo, Lauren YS, Mikael B, Ricky Watts, Sentrock, Sam Young, Stephen
  Palladino, Suarezart, Thirst & Zulu Painter, Vitale Bros., and Yok & Sheryo.
  The 2017 edition was organized with involvement from Iryna Kanishcheva and ran
  alongside an "Outside In" group exhibition that featured large-scale
  installations by The Yok and Sheryo, James Oleson, The Artwork of Ricky Watts,
  Vitale Bros., Sentrock, and others. Coverage of the festival ran on Brooklyn
  Street Art with photos by Iryna Kanishcheva. SHINE follows a roughly 5:10
  ratio of local to traveling artists.

  Palladino was profiled in Hypebeast's "Essentials" series in May 2016 under
  the heading "Good and Shiddy." His own description of his characters is "slick
  and gritty, dark and lowbrow." He created "The Late Night Drawing Show" on
  social media and is a regular at Art Basel.

