searchMuralDescription: |
  A 17-by-95-foot mural on the south wall of Benson Worley Architecture
  featuring a dense composition of distorted human figures and faces in bright
  fluorescent colors — aqua, orange, lime green, purple, blue, and rosy red.
  From a distance the forms read as a cheery abstract puzzle, but up close bold
  black line drawings reveal Palladino's expressive, German
  Expressionism-influenced style. Characters include an orange woman, a
  blue-suited man, and a red woman in profile, interspersed with phrases like
  "LOVE ME," "AIN'T," "NOBODY but YOU," "LOOKIN NEAT," "GAS," "YO!," and "NOT
  TRUE" scrawled in handwritten text across the wall.

