artistBio: |
  His work hangs in the Smithsonian. Swizz Beats and Michael B. Jordan collect
  him.

  Michael Vasquez earned his BFA cum laude from the New World School of the Arts
  in Miami in 2005. His figurative paintings explore identity in marginalized
  neighborhoods — transforming personal photographs into dramatic compositions
  where clothing, hand signs, tattoos, and neighborhood landmarks establish who
  someone is and where they come from.

  He was included in "Portraiture Now: Staging the Self" at the Smithsonian
  National Portrait Gallery (2014-15) and "The Culture: Hip Hop and Contemporary
  Art in the 21st Century" at the Baltimore Museum of Art (2023). His work is in
  the Perez Art Museum Miami, the Microsoft Art Collection, and the Rubell
  Museum. He has shown at the Saatchi Gallery in London, Wynwood Walls, and the
  Kemper Museum of Contemporary Art.

  He is a three-time SHINE artist — 2015, 2023, and 2025. For the Pier's 5th
  anniversary in 2025, he painted "Sandcastles with Father – Spa Beach," a
  deeply personal mural that revisits his recurring theme of reimagined
  fatherhood. Growing up without a father figure, Vasquez often explores
  intergenerational relationships and the longing for paternal connection. The
  sandcastle in the mural takes the form of the iconic inverted pyramid pier,
  drawing past and present into quiet dialogue through imagination and familial
  connection.

searchBio: |
  His work hangs in the Smithsonian. Swizz Beats and Michael B. Jordan collect
  him.

  Michael Vasquez earned his BFA cum laude from the New World School of the Arts
  in Miami in 2005. His figurative paintings explore identity in marginalized
  neighborhoods — transforming personal photographs into dramatic compositions
  where clothing, hand signs, tattoos, and neighborhood landmarks establish who
  someone is and where they come from.

  He was included in "Portraiture Now: Staging the Self" at the Smithsonian
  National Portrait Gallery (2014-15) and "The Culture: Hip Hop and Contemporary
  Art in the 21st Century" at the Baltimore Museum of Art (2023). His work is in
  the Perez Art Museum Miami, the Microsoft Art Collection, and the Rubell
  Museum. He has shown at the Saatchi Gallery in London, Wynwood Walls, and the
  Kemper Museum of Contemporary Art.

  He is a three-time SHINE artist — 2015, 2023, and 2025. His 2015 SHINE mural
  "Fishing with Father" featured the iconic inverted pyramid pier and explored
  themes of fatherhood and belonging. His 2023 SHINE mural "The Mangrove Refuge"
  depicted a displaced Lao family finding refuge at Gandy Beach circa 1980. For
  the St. Pete Pier's 5th anniversary in 2025, he was invited by the City of St.
  Petersburg and No Good Deeds Art to create "Sandcastles with Father – Spa
  Beach" — a 10-by-20-foot mural on exterior wood panel wall using latex and
  spray paint.

  Growing up without a father figure, Vasquez often explores intergenerational
  relationships and the longing for paternal connection in his work. The 2025
  mural directly recalls "Fishing with Father," revisiting and expanding those
  themes. The sandcastle takes the form of William B. Harvard Sr.'s inverted
  pyramid pier, which stood from 1973 to 2015 and continues to hold a lasting
  place in the city's collective memory. The current iteration of the Pier rises
  on the horizon in the background, drawing past and present into quiet
  dialogue.

  Instagram: @michaelvasquez_. Website: michaelvasquez.info.

searchMuralDescription: |
  A 10-by-20-foot photorealistic scene on a wood panel wall. A father in a
  lavender button-down shirt and blue jeans sits on Spa Beach beside a young boy
  in a yellow t-shirt and blue shorts. Together they build a sandcastle that
  takes the unmistakable form of the inverted pyramid pier — William B. Harvard
  Sr.'s iconic structure that stood from 1973 to 2015. The sandcastle is
  rendered with architectural precision, complete with arched entrance and
  angular upper floors. In the background, the current St. Pete Pier rises on
  the horizon over the water. Beach umbrellas and beachgoers dot the left side.
  Both figures smile with genuine joy. The sky is bright blue with cumulus
  clouds. Signed @MICHAELVASQUEZ in the lower right corner.

