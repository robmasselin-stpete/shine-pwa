artistBio: |
  She fuses traditional Chinese ink painting with X-ray imagery and
  inside-bottle painting craft. She holds MFAs from both Tsinghua University in
  Beijing and the Pennsylvania Academy of Fine Arts.

  Chenlin Cai was born in 1984 in Fujian, China, and relocated to the United
  States in 2014. Her work explores Chinese American identity through cellular
  structures, non-traditional surfaces, and multi-media expression. Her SHINE
  2023 "Bright Spot" mural, "The Path We Came," was a collaboration with the
  James Museum of Western & Wildlife Art — extending their exhibition "From Far
  East to West: The Chinese American Frontier" (Oct 2023 – Jan 2024) onto a St.
  Pete wall, depicting the Chinese American laborers who built the First
  Transcontinental Railroad but were excluded from its 1869 completion
  photographs.

  In Philadelphia, she worked with Mural Arts Philadelphia on a 21-story mural
  on the Crane Building in Chinatown celebrating 150-plus years of community,
  alongside Eurhi Jones and Yvonne Lung. She painted koi fish on the sidewalks
  of 10th Street Plaza and murals inside Chinatown restaurants.

  Her work is in the Copelouzos Family Art Museum of Contemporary Arts in
  Athens, Greece. She has shown at the 12th Florence Biennale, Freeman's Auction
  Gallery in Philadelphia, and 456 Gallery in New York.

searchBio: |
  She fuses traditional Chinese ink painting with X-ray imagery and
  inside-bottle painting craft. She holds MFAs from both Tsinghua University in
  Beijing and the Pennsylvania Academy of Fine Arts in Philadelphia.

  Chenlin Cai (蔡陈林) was born in 1984 in a small fishing village in Fujian
  province, China, and relocated to the United States in 2014. She now divides
  her time between Philadelphia and Beijing. Her parents, who never finished
  high school, ran a clothing store in the village where she grew up. Before
  leaving China, she and a partner ran a business in Beijing training Chinese
  high school students to prepare for art school entrance exams. After getting
  her first MFA from Tsinghua, she painted a mural for the South Korean
  government's Korean Cultural Center in Beijing during the 2008 Olympics, and
  later designed and executed a year-long mural project honoring the history of
  Xuchang, a city in Central China.

  A friend named Michelle Sun, an auntie-like figure who had settled in the
  Philadelphia suburbs and now lives in Berwyn, suggested she come to
  Philadelphia, calling it the mural capital of America. Cai arrived in 2014 and
  pursued a second MFA at the Pennsylvania Academy of the Fine Arts, where she
  studied under professor Renee Foulks. In her early days in the city, she went
  by "Jerry" because Americans struggled with her name. She funded her living
  expenses by flying back to Beijing each winter and summer break to teach
  intensive courses at her old business, and by giving private lessons to
  Chinese students abroad over WeChat.

  Her practice combines classical figure drawing with experimental work on
  non-traditional surfaces including plexiglass, exploring Chinese American
  identity through cellular structures and multi-media expression. One signature
  piece collected 400 X-rays of Chinese workers from hospitals around China,
  which she scanned to create digital collage replicas of a famous Chinese
  landscape painting — pairing the horror faced by Chinese workers with peaceful
  nature scenes. Her painting style uses inside-bottle painting craft, cellular
  structure oil painting texture, and X-ray imagery to interpret landscape. She
  served as a Commissioner on the Pennsylvania Governor's Advisory Commission on
  Asian Pacific American Affairs from 2022-2023.

  Her SHINE 2023 "Bright Spot" mural, "The Path We Came," at 1927 4th Avenue S
  in St. Petersburg, was a collaboration with the James Museum of Western &
  Wildlife Art exploring the Chinese American experience and the
  Transcontinental Railroad. The James Museum partnership was tied specifically
  to the museum's exhibition "From Far East to West: The Chinese American
  Frontier" (October 14, 2023 – January 28, 2024). The exhibition was organized
  into twelve thematic sections — immigration, mining, railroad construction,
  Chinatowns, festivals, traditional medicine, the 1906 earthquake, newspapers,
  Angel Island, women's experiences, artist Z.S. Liang, and visitor reflections
  — featuring works by contemporary Chinese American artists Hung Liu, Mian
  Situ, Jie Wei Zhou, and Benjamin Wu alongside historical objects. Cai's
  outdoor mural extended the exhibition's railroad-construction section to a
  wall in St. Petersburg, depicting Chinese American laborers who built the
  First Transcontinental Railroad but were excluded from its 1869 completion
  photographs. Emily Kapes, Chief Curator of the James Museum, framed the
  broader exhibition as "an opportunity to expand on the works by Chinese
  American artists already in The James Museum collection and engage with
  Chinese American art and culture in a thought-provoking and visually
  captivating manner." The St. Pete Catalyst credited the wall to "Chenlin Cai
  and the James Museum of Western & Wildlife Art, 1927 4th Avenue S." The
  exhibition is now available as a virtual exhibition in both English and
  Mandarin.

  In Philadelphia, she worked with Mural Arts Philadelphia on a 21-story mural
  on the west wall of the Crane Community Center (the Crane Building) in
  Chinatown, titled "承前啓後 – The Past Supporting the Future." The work, visible
  from I-676, was created with Eurhi Jones and Yvonne Lung, managed for Mural
  Arts Philadelphia by Lindsey Rosenberg, and commissioned by the Philadelphia
  Chinatown Development Corporation as part of the Philadelphia Redevelopment
  Authority's Percent for Art Program in partnership with the Philadelphia
  Housing Development Corporation (PHDC). Three years in the making, painting
  began in summer 2022 with help from over 100 volunteers from the Chinatown
  community and AAPI organizations, plus Mural Arts Interns. The 54-foot crane
  rises on a pathway of paper cranes emanating from a history scroll showing the
  original protest against the Vine Street Expressway, the creation of the
  Friendship Gate, and the completion of the Crane Community Center. Surrounding
  imagery includes a dragon boat team, a young girl performing the lion dance, a
  traditional pipa stringed instrument, the Monkey King from Chinese opera, a
  swallow, and area delicacies. The background uses peony petals embossed with
  textile patterns from Japan, India, Korea, China, Vietnam, Indonesia,
  Thailand, Myanmar, Laos, Cambodia, Tibet, Bhutan, and the Philippines. Process
  documentation lives at @phillychinatowncranemurals on Instagram.

  She painted koi fish on the sidewalks of 10th Street Plaza in Chinatown and
  murals inside Chinatown restaurants and Asian restaurants around Philly: a
  gluttonous panda surrounded by wontons in chili oil and Chinese hamburgers at
  Chengdu Famous Food on Lancaster Avenue, leaping yin-and-yang fish at the Old
  City sushi spot Tomo, and a dragon boating scene inside Chinatown's Bubblefish
  (co-owner Ping Li called it "a work of art"). She also worked at a
  collaborative project at 1735 Market Street where ten artists each designed a
  mural on the theme "What does Philadelphia mean to you" — her contribution
  juxtaposed a rendition of the William Penn Statue with a local hero from her
  hometown. She estimates she has painted about 20 murals around Philadelphia in
  public and private spaces.

  From February 23 to August 25, 2024, her solo exhibition "Interstellar
  Landscape" was on view in Terminal F at Philadelphia International Airport.
  The work drew on early footage from the James Webb Telescope of the Cosmic
  Cliffs in the Carina Nebula, blending classical oil painting with traditional
  Chinese ink painting techniques to combine panoramic landscapes from space
  with finely painted details resembling microscopic organic structures.

  Other clients listed on her site include IBEW and Westin. Her work is in the
  Copelouzos Family Art Museum of Contemporary Arts in Athens, Greece, alongside
  Chinese, American, and Greek private collectors. She has shown at the 12th
  Florence Biennale, Freeman's Auction Gallery in Philadelphia, and 456 Gallery
  in New York. Named projects include "Mist-Covered and Majestic Mountain"
  (层峦烟波图, Philadelphia, 2018), "Daydream" (白日梦, Philadelphia, 2021), "the
  Forbidden City" (Philadelphia, 2017), and the Artelo Mural Project. Her studio
  is at 1001 Vine Street, Philadelphia, PA 19107. Website: cai-chenlin.com (also
  caichenlin.com and caichenlin.wixsite.com/finearts). Email:
  caichenlin0821@gmail.com.

searchMuralDescription: |
  A wide mural on the Lantmännen Unibake building depicting three Chinese
  American railroad laborers rendered in blue-gray tones against a dramatic
  sunset of deep orange, gold, and purple. The three figures — one holding a
  staff, one reading a letter, one planting a flower with his hat removed —
  represent family longing, hope, and resilience. Behind them, golden mountain
  peaks evoke the Sierra Nevada, with a setting sun and crescent moon embodying
  the duality of aspiration and homesickness. A steam locomotive and train cars
  wind along railroad tracks at right. The mural reimagines Chinese laborers who
  built the First Transcontinental Railroad but were excluded from its 1869
  completion photographs. Created in partnership with the James Museum's "From
  Far East to West" exhibition.

