artistBio: |
  He co-founded The Weird — an international graffiti crew alongside Nychos, Low
  Bros, and DXTR. He has been painting walls since he was fifteen in East
  Germany.

  Lars Wunderlich — LOOK the Weird — was born in 1981 in Neubrandenburg, East
  Germany. He studied art at Ernst Moritz Arndt University in Greifswald and
  earned a graphic design degree from HTW Berlin. His current work uses
  algorithm-generated portraits with distortions and glitches — post-graffiti
  visual collages exploring technology and art, parallel to the New Leipzig
  School but centered on AI aesthetics.

  He co-founded PEACHBEACH design company (2007-2019) and KIDZONCOMPUTERS
  animation studio (2020-present). His "AM I JUST A CODE FOR YOU?" showed at
  Urban Nation Museum in Berlin (2022-2024). He has done residencies in Denver,
  Belgrade, and Chennai.

  For SHINE 2018, he painted in St. Petersburg.

searchBio: |
  He co-founded The Weird — an international graffiti crew alongside Nychos, Low
  Bros, and DXTR. He has been painting walls since he was fifteen in East
  Germany. Lars Wunderlich, working as LOOK the Weird, was born in 1981 in
  Neubrandenburg in the GDR and has been making murals, paintings, and drawings
  since 1996. He studied art at Ernst Moritz Arndt University in Greifswald and
  earned a graphic design degree from the University of Applied Sciences Berlin
  (HTW Berlin). He is based in Berlin.

  He is a founding member of The Weird, the nine-member international street art
  crew and artist collective established in 2011-2012, whose roster includes
  Nychos, Low Bros, DXTR, and Vidam. Before that, in 1999, he co-founded
  Gangsters of Doom, a Berlin-Hamburg graffiti crew started in the woods of
  Mecklenburg. He co-founded PEACHBEACH, the design company he ran with Vidam
  from 2007 to 2019. In 2020 he and Niklas Warnecke from Instant Waves founded
  the animation studio KIDZONCOMPUTERS as a joint venture for animated work. He
  also works as a senior designer specialized in illustration, motion, branding,
  concepts, games, and murals.

  His current work consists of visual collages and post-graffiti pieces that
  replicate portraits generated by algorithms, juxtaposing different time
  elements to produce collisions, distortions, and glitches. The work explores
  the unreal nature of those representations and contrasts tranquil landscapes
  surrounded by heavy industry with elements from action movies, pop culture,
  and celebrities. His paintings bear similarities with the New Leipzig School,
  with technology at the core and aesthetics boosted by artificial intelligence
  and modern faux-semblants.

  His piece "AM I JUST A CODE FOR YOU?" was included in the exhibition "Talking…
  & Other Banana Skins," curated by Michelle Houston at Urban Nation Museum for
  Urban Contemporary Art on Bülowstraße in Berlin, running June 2022 through
  August 2024. He was previously featured in "Urban Nation 01" at Urban Nation
  Museum for Urban Art in Berlin in 2017. He has also been working at the Urban
  Spree artist residency in Berlin preparing a solo show.

  For SHINE 2018 he painted in St. Petersburg, Florida, and returned for the
  "shine on st pete alumni show" group exhibition and residency at the Morean
  Art Center in St. Petersburg, FL.

  His exhibition and residency history includes "Walls - a Louvre Show" group
  exhibition at Urban Spree Gallery in Berlin in 2020; "Awaking" group show at
  2KnewConcious Gallery with Ryan Joseph Gallery in Denver, USA in 2020;
  "quatre" group show at Loft du 32 Galery in Paris in 2019; his solo show
  "whatarewelookingfor?" at Urban Spree Gallery in Berlin in 2019; Urban Art
  Fair Paris with Urban Spree Gallery in 2018 and 2019; Urvanity Madrid with
  Urban Spree Gallery in 2019; "what the weekend is gallery" during Gallery
  Weekend Berlin at Art Union in 2017; "WE 48" curation at 48h Neukölln in
  Berlin in 2017; his solo show "Eastern German Realities" at Gallerie Altes
  Zollamt in Hamburg in 2017; "South x so weird" group show at Mindzai Art &
  Vinyl in Austin, Texas in 2017; "Knotenpunkt" group shows at Affenfaust
  Gallery in Hamburg in 2014 and 2016; "5 years the weird crew" group show and
  residency at Mural Harbour in Linz and REM Artspace in Vienna in 2016; the "WE
  FESTIVAL" curation at RIXBOX Neukölln, Berlin in 2016; the duo show "momentum"
  at PROOF Gallery in London in 2015; "the weird world nyc" group show and
  residency at Exit Room Gallery in New York in 2015; his solo show "the
  nightsky is full of rainbows" at REM Artspace in Vienna in 2015; "The Haul" at
  Affenfaust Gallery in Hamburg in 2015; the "Conquer the Concrete" residency at
  the Goethe Institute in Chennai, India in 2015; SCOPE at Art Basel Miami with
  ABV Gallery of Atlanta, Georgia in 2014; his solo show "Meanwhile in
  ULTRALAND" at Epicentro Art Gallery in Berlin in 2014; "the weird goes
  Belgrade" group show and residency at the Goethe Institut in Belgrade, Serbia
  in 2014; his solo show "it was all green instead" at Balsamo Gallery in Mexico
  DF in 2013; "The weird rehab 2" group show at Art is a 4 letter word in Basel
  in 2013; "The weird rehab" group show and residency at Clienia in Littenheid,
  Switzerland in 2013; "the weird in Detroit" group show and residency at
  Innerstate Gallery in Detroit in 2013; "ich bin ein Berliner" group show and
  residency at the Musée des Beaux-arts d'Arras in France in 2013; and the "4560
  Urban Art Show" group show and residency at Stadtgalerie Saarbrücken in 2013.

  His residencies have taken him to Denver, Belgrade, Chennai, St. Petersburg
  (FL), Detroit, New York, Linz, Vienna, Littenheid, Arras, Saarbrücken, and
  Berlin's Urban Spree. Press coverage includes a Juxtapoz studio visit and
  artist feature, Widewalls interviews and a podcast appearance, the Widewalls
  Chennai Travel Diaries, a Vantage Point radio show interview, Spraydays artist
  talks, a VNA Magazine artist feature, a Graffiti Art exhibition feature, and a
  Down by Law Magazine interview. His portfolio is at
  larswunderlich.myportfolio.com and he can also be found on Artsy, Widewalls,
  MutualArt, Facebook, and Instagram.

searchMuralDescription: |
  A wide mural on the west-facing wall of the Central Arcade building at 1114
  Central Avenue, visible to eastbound traffic on 1st Avenue South. The piece is
  a surreal, dreamlike panorama painted in Wunderlich's signature
  distortion-collage style. Flowing organic shapes in pink, magenta, teal, mint
  green, and cream swirl across the wall, evoking melting landscapes and wavy
  glass. Among the abstract forms, recognizable elements emerge: a figure
  reading or holding books, rippling striped surfaces, plant-like tendrils, and
  architectural fragments. The composition references Florida's environment —
  the piece was inspired by hurricane damage, red tide, and the contradictions
  of contemporary life in the state. The overall effect is of something familiar
  viewed through a funhouse mirror: colorful and inviting at a distance,
  unsettling and thought-provoking up close.

muralInspiration: |
  "My piece in St. Pete is all about Florida and the environment. I love to
  provoke questions." — LOOK the Weird

