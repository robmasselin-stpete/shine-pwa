artistBio: |
  LOOK the Weird is the moniker of Lars Wunderlich, a German artist and designer born in 1981 in Neubrandenburg, then part of the GDR. He started painting graffiti in 1996 and studied art at Ernst Moritz Arndt University before earning a graphic design degree from HTW Berlin. He is a co-founding member of The Weird Crew, an internationally recognized collective of about ten Austrian and German character painters that includes Nychos, Low Bros, DXTR, and Frau Isa. His personal work revolves around visual collage and algorithmically generated portrait replications — he deliberately juxtaposes elements from different time periods to produce what he calls "collisions, distortions and glitches." The results sit somewhere between digital corruption and classical figuration. He has exhibited at Urban Spree Galerie in Berlin, Gallery 1:1 in Luxembourg, and the URBAN NATION Museum. He also co-founded the design company PEACHBEACH (2007-2019) and the animation studio KIDZONCOMPUTERS (2020). He works as a senior designer specializing in illustration, motion graphics, and murals, and is based in Berlin.

muralDescription: |
  A wide mural on the west-facing wall of the Central Arcade building at 1114 Central Avenue, visible to eastbound traffic on 1st Avenue South. The piece is a surreal, dreamlike panorama painted in Wunderlich's signature distortion-collage style. Flowing organic shapes in pink, magenta, teal, mint green, and cream swirl across the wall, evoking melting landscapes and wavy glass. Among the abstract forms, recognizable elements emerge: a figure reading or holding books, rippling striped surfaces, plant-like tendrils, and architectural fragments. The composition references Florida's environment — the piece was inspired by hurricane damage, red tide, and the contradictions of contemporary life in the state. The overall effect is of something familiar viewed through a funhouse mirror: colorful and inviting at a distance, unsettling and thought-provoking up close.

muralInspiration: |
  "My piece in St. Pete is all about Florida and the environment. I love to provoke questions." — LOOK the Weird

