artistBio: |
  This wall — Gothic moon, bats, barn owl in the storm — is exactly the
  territory Rebekah Lazaridis has worked her whole career: medieval art, fairy
  tales, the spiritual realm.

  She started by building elaborate Halloween sets in front of her family's home
  as a teenager. That portfolio got her into the School of the Art Institute of
  Chicago, where she earned her BFA in Painting and Drawing in 2005. After
  Chicago she completed a one-year apprenticeship with USA829, the scenic
  artists' union, in New York — working on Broadway productions, Saturday Night
  Live, live television, and large-scale films.

  Back in St. Pete (a third-generation native — her great-grandfather founded
  Wilhelm Funeral Home in 1918), her work integrates story, nostalgia, and the
  architecture of her hometown. Her solo show "CIRCA" at Mize Gallery rendered
  local landmarks — the Emerald Cocktail Lounge, the Thunderbird Hotel, Haslam's
  Books, Biff Burger — in postcard style. Her NYC solo "Broken Legs" was painted
  on black velvet theater curtains, cut and sewn into new compositions. She
  designs sets for Jobsite Theater, American Stage, freeFall, and the Straz
  Center, and is an Official Roycroft Artisan.

  She also runs @homeillustrations — custom colored-pencil portraits of historic
  homes, starting at $375. For SHINE Origins 2025, she painted at 31st Street
  and 7th Avenue South.

searchBio: |
  She is a third-generation St. Petersburg native. Her great-grandfather founded
  Wilhelm Funeral Home in 1918.

  Rebekah Eugenia Lazaridis earned her BFA in Painting and Drawing from the
  School of the Art Institute of Chicago in 2005. The path started in her late
  teens, when she built elaborate Halloween sets and stages in front of her
  family's home — sets meant to entertain kids with song, dance, and theatrical
  elements rather than scare them. That non-traditional portfolio got her into
  multiple art schools.

  After Chicago she completed a one-year apprenticeship with USA829, the scenic
  artists' union, in New York City. She worked in teams on Broadway productions,
  live television, Saturday Night Live, and large-scale films. Tampa Bay retail
  clients from her scenic work include Montblanc, Louis Vuitton, and Tiffany.
  Back in Florida she has worked as a scenic artist for Stageworks, the Straz
  Center, Patel Conservatory, American Stage, freeFall, and Jobsite Theater,
  where she also collaborates as a set designer. Jobsite productions she has
  worked on include Constellations, Doubt: A Parable, Dr. Ride's American Beach
  House, The Thanksgiving Play, and Twilight: Los Angeles, 1992. She has been in
  the theater industry for more than 20 years.

  Her first New York City solo exhibit, "Broken Legs: An Art Exhibit on Theater
  Superstition," opened at The Sheen Center for Thought and Culture at 18
  Bleecker Street in NoHo in October 2015 and ran through November 30. The Sheen
  Center's art director found her after seeing her cover art for the book "The
  Dream Belongs to the Dreamer" by Velva Lee Heraty, MSW. The Broken Legs pieces
  explored superstitions like "break a leg," whistling backstage, and saying the
  name of "the Scottish play." She painted on black velvet theatrical curtains —
  the "legs" — then cut them up, altered them, and sewed them into new
  compositions. Her substrates included theater paint, old wood planks, scrim,
  and beat-up cabinets and drawers.

  Her solo show "CIRCA" opened at Mize Gallery (689 Dr MLK Jr St N, Suite C, St.
  Petersburg) on January 7, 2022 and ran through January 23. The works were
  Prismacolor pencil with touches of gouache and ink on colored cardstock,
  depicting St. Pete locations in an iconic postcard style. Pieces included
  Holiday Motel, Ted Peters, Thrill Hill, Osprey Nest, Beach Theatre, Manhattan
  Casino, The Garden, Truth, Emerald Cocktail Lounge, China City, Grand Central
  District, The Soreno Hotel Logo, Wolfie's Restaurant, Timeless Pelican, Royal
  Theater, Maas Brothers, Thunderbird Motel, Parakeet Feeder, Sunken Gardens,
  Publix Market, The Chattaway, Two Headed Palm on 22nd Ave, Bringe Music, The
  State Theatre, Southland Roller Palace, The Globe, Banana's Records, Ovo Cafe,
  Deuces Live, Old Southeast Sign, Old Northeast Sign, Gulfport Casino, Dairy
  Inn, Snell Isle Bridge, H&D Cafeteria, Biff Burger, Haslam's Books, and El
  Cap. The Manhattan Casino piece referenced the historic 22nd Street South
  dance hall that hosted Nat King Cole, Sarah Vaughn, and Ray Charles. The Royal
  Theater piece referenced the 1948 movie theater that catered to African
  Americans during segregation. The seed for the show was a 2019 painting she
  contributed to the Mize Halloween show "Creep" — a self-portrait as a little
  ghost on her childhood street in Old Northeast.

  She runs @homeillustrations, where she draws customized portraits of historic
  homes and landmark buildings using colored pencils and colorful cardstock,
  often with a dramatic sunset behind each home. The 8x10 illustrations start at
  $375. The pursuit began during Covid theater shutdowns, sparked by a closing
  gift she made for the realtor who sold her and her husband Steve their old
  bungalow. She co-operated SCENERY BAGS / Eugenia Woods, a hand-painted bags
  and purses line, with her sister Susanna.

  In 2022 she began intaglio copper plate etching at the Dunedin Fine Arts
  Center under the mentorship of Holly Bird and Steve Littlefield. She began
  teaching Beginner Intaglio at Dunedin Fine Arts Center in 2025. Her immersive
  art installation work includes THE UNSEEN and BLOOM AND RESIDUE. Collaborative
  efforts include Preserve The Burg, Historic Seminole Heights Neighborhood
  Association, and projectAlchemy. She is an Official Roycroft Artisan.

  She was a featured artist in the SHINE Mural Festival in 2025 (SHINE Origins),
  painting at 31st Street and 7th Avenue South in St. Petersburg. Her work has
  been featured in Creative Loafing and St. Pete Catalyst. She had her wedding
  reception at Sunken Gardens in 2011 and lives in Tampa. Personal influences
  and recurring subjects include nature, medieval art, fairy tales, the
  afterlife, myth, the spiritual realm, and the architecture of her hometown.
  Website: www.RebekahLaz.com / rebekahlazaridis.com. Instagram:
  @homeillustrations.

searchMuralDescription: |
  A dramatic monochromatic mural on a black cinder block wall. A large ornate
  Gothic letter "B" with intricate Celtic knotwork fills the center, overlaid on
  a detailed full moon rendered in grays and whites. Bats swarm from the left
  across the night sky, and a barn owl with outstretched wings emerges from
  storm clouds on the right, with rain streaking diagonally downward. Signed
  "ReAh @rebekahlaz" in the lower right corner. The entire palette is black,
  white, and silver — a stark contrast to the colorful murals flanking it.

