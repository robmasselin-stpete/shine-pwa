artistBio: |
  Her grandmother is her muse. She paints the vitality of old age — beauty
  outside the usual aesthetic canons.

  Marina Capdevila holds a degree in art from the University of Barcelona and a
  postgraduate in artistic illustration from Eina School. She spent time at the
  Willem de Kooning Academy in Amsterdam. Her style uses powerful color with
  soft shading inspired by Renaissance sfumato technique, rendered through
  exaggeration and irony — elderly people rendered as vibrant, vital, alive.

  She has painted in fifteen-plus countries. Festival credits include The
  Crystal Ship in Belgium, Vision Art Festival in Switzerland, and Wynwood
  Embassy in Miami. She won the Junceda Public Space Award (Spain, 2022) and the
  Pinzell Cuixart artistic career recognition (2019). For SHINE 2022, she
  painted in St. Petersburg.

searchBio: |
  Her grandmother is her muse. She paints the vitality of old age — beauty
  outside the usual aesthetic canons. Marina Capdevila was born in 1986. She is
  a Spanish visual artist based in Barcelona, working across painting, drawing,
  mural art, installation, and mixed media. Her practice centers on playful
  portraits of the elderly in candid, nostalgic, festive moments, using vibrant
  exaggerations to provoke the familiar and the humorous. Her work explores
  themes of identity, death, and the human experience, and uses her grandmother
  as muse to challenge conventions of beauty, gender, and age and to deconstruct
  negative stereotypes.

  She holds a degree in art from the University of Barcelona and a postgraduate
  in artistic illustration from Eina School. She also spent time at the Willem
  de Kooning Academy in Amsterdam. Her style combines powerful color with soft
  shading inspired by Renaissance sfumato, rendered through exaggeration and
  irony — elderly people as vibrant, vital, alive. Beyond her studio practice,
  she participates in workshops and art education initiatives.

  Her murals can be found in Florida, New York, California, China, Brazil,
  Mexico, Canada, Belgium, Switzerland, Italy, Netherlands, United Kingdom,
  Austria, Spain, Portugal, and Croatia. She has exhibited original artworks in
  galleries in Los Angeles, San Francisco, Oakland, Denver, New York, Atlanta,
  London, Paris, Barcelona, and Madrid.

  Awards include the Junceda Public Space Award in Spain (2022), the Pinzell
  Cuixart artistic career recognition / Primer Premio in Barcelona, Spain
  (2019), and the Silver medal / Segundo Premio in the ÑH Awards, the Society
  for News Design competition of Latin America, Portugal and Spain, in Madrid
  (2017).

  Street art festival credits include SHINE Festival in St. Pete, Florida, USA;
  Murart in Ontinyent, Valencia, Spain; Ourtowns in Basildon, UK; Borgo Universe
  in Aelli, Italy; Cidade de Cor in Vigo, Spain; Cura Festival in Belo
  Horizonte, Brazil; The Raw Project in Miami, Florida, USA; Paseo Pionero
  Festival in Cancun, Mexico; The Crystal Ship in Oostende, Belgium; Delasfest
  in Galicia, Spain; Vision Art Festival in Crans Montana, Switzerland; Vukovart
  in Vukovar, Croatia; Estau Festival in Estarreja, Portugal; Meeting of Street
  Art in Ciudad del Carmen, Mexico; Rexenera Fest in Galicia, Spain; Via Vai
  Project in Torre San Giovanni, Italy; Desvelarte in Santander, Spain; Wynwood
  Embassy in Miami, Florida, USA; Domina Domna in Bergamo, Italy; Open Walls in
  Barcelona, Spain; and Gar Gar in Penelles, Spain. For SHINE 2022, she painted
  in St. Petersburg.

  Solo exhibitions include Falta Gel at LAB36 Gallery / Galeria LAB36 in
  Barcelona, Spain (2023); Ready Steady Young, a duo show with Mico Rabuñal at
  Furiosa Gallery in Madrid, Spain (2020); Oldie But Goldie at Domina Domna Art
  Space in Bergamo, Italy (2017, also listed 2016); Never Too Late For A First
  Date at Miscelanea Gallery in Barcelona, Spain (2016, also listed 2015); and
  Smokers at Basis Artspace in Amsterdam, Netherlands (2016, also listed 2014).

  Group exhibitions include Out Of Touch at Subliminal Projects in Los Angeles,
  California (2020); B-Local at B Murals Gallery in Barcelona, Spain (2020);
  Change Is A Team Sport at B Murals Gallery in Barcelona, Spain (2020); Galeria
  Balneario Group at The Source in Denver, Colorado (2019); Lately at First
  Amendment Gallery in San Francisco, California (2018); Murs Lliures at Montana
  Gallery in Barcelona, Spain (2019); 2nd Annual 4%Ers at Athen B Gallery in
  Oakland, California (2017); Impecable Bunch at Go Gallery in Amsterdam,
  Netherlands (2018); Happy at 19 Karen Gallery on the Gold Coast, Australia
  (2017); Ashurst Emerging Artist Space at Good Mother Gallery in Oakland,
  California (2017); Fresh & Fun at Plastic Murs Gallery in Valencia, Spain
  (2016); The Story of the Creative at See Gallery / See Exhibition Space in New
  York, USA (2016); WeArt at Transforma BCN in Barcelona, Spain (2016); Human at
  Wayco Artspace in Valencia, Spain (2016); London Illustration Fair at Hoxton
  Arches Gallery in London, UK (2016); Hoax at Choko Club in Barcelona, Spain;
  Barcelona Drawing City at Galeria Le Marais / Galerie Le Marais in Paris,
  France (2015); Gato por Liebre at Cadaver Exquisit in Barcelona, Spain; and
  Molecula at Mutuo Gallery in Barcelona, Spain.

  Press and documentary work includes La Pell dels Murs and the Viejas Glorias
  documentary, available on the TV3 website. Her website is marinacapdevila.com.

searchMuralDescription: |
  A two-story wall dominated by a crowd of surreal orange-skinned characters in
  various states of mischief. On the left, a figure in a beret and sunglasses
  clutches a boombox. In the center, an enormous face wearing oversized
  reflective shades holds a lobster. On the right, a figure in a bucket hat
  dangles a fish on a line while a pale ghost-like creature peeks out between
  them. The palette is almost entirely warm oranges, creams, and golds against a
  yellow-gold upper band with tiny palm tree silhouettes. Signed "Marina
  Capdevila" at the upper left.

