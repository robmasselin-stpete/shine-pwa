artistBio: |
  He was a middle-school teacher in Baltimore. He moved to Berlin in 2010 and
  started painting buildings.

  James Bullough is self-taught in realistic oil painting, trained by studying
  the Old Masters of the Netherlands. His style is photorealistic portraiture
  combined with graphic fragmentation — figures in mid-motion, dissected and
  shattered, in oil, latex, acrylic, and spray paint. He works from his Berlin
  studio.

  He painted an eleven-story mural on Landsberger Allee in Berlin with
  collaborator Addison Karl, facade murals for the URBAN NATION Museum, and
  walls at Wynwood Walls, POW! WOW! Hawaii, and Lollapalooza. He is represented
  by Thinkspace Projects in LA and Stolenspace Gallery in London. He co-created
  VantagePoint Radio, an interview show on urban art. For SHINE 2022, he painted
  in St. Petersburg.

searchBio: |
  He was a middle-school teacher in Baltimore. He moved to Berlin in 2010 and
  started painting buildings.

  James Bullough is an American-born artist who grew up in Washington, DC and
  now lives and works in Berlin, Germany. As a kid in the DC exurbs, he was
  fascinated by the innovative graffiti he saw around the DC subway, and that
  early exposure to gritty urban art drove him to make his own work. Alongside
  the graffiti influence, he taught himself realistic oil painting techniques by
  studying the Old Masters of the Netherlands. Combining the technical precision
  of one with the momentum of the other, his work stages compelling contrasts
  and juxtapositions — photorealistic portraiture combined with graphic
  fragmentation, figures in mid-motion, dissected and shattered. He works in
  oil, latex, acrylic, and spray paint.

  He moved from the United States to Germany in 2010 after quitting his
  middle-school teaching job in Baltimore to focus on his artwork full-time.
  While in Berlin, he shifted his focus from the paintbrush to the spray can,
  transitioning from photorealistic oil murals to photorealistic spray-paint
  murals. In his first three years in Berlin, he worked with American-born,
  Berlin-based artist Addison Karl under the name JBAK. The pair painted widely
  across Germany and the United States. Their best-known Berlin piece is
  "Totem," painted at Landsberger Allee 228B in 2014 — an eleven-story mural
  depicting three individuals standing on each other's backs, completed using a
  crane over the course of a month.

  Bullough is featured in URBAN NATION's roster as a Berlin-based artist and has
  been part of multiple URBAN NATION projects, including Wynwood Walls, Unity,
  and Lollapalooza. He painted a One Wall in Berlin and was featured in the
  URBAN NATION 2018 exhibition "UN-DERSTAND The Power of Art as a Social
  Architect" at the URBAN NATION Museum for Urban Contemporary Art in
  Berlin-Schöneberg (Bülowstrasse 7). The 2017 ONE WALL project marking the
  museum's opening included Berlin Kidz, Paradox, 1UP, James Bullough, and 2501,
  who created four large-format murals on the façade of a Berlin-Schöneberg
  building.

  In 2014 he co-created and hosted VantagePoint Radio, an interview show focused
  on urban art and the graffiti and mural artists who occupy the genre. Each
  episode features an established artist or group of artists in the contemporary
  art scene.

  He is represented by Thinkspace Projects in Los Angeles (4217 W. Jefferson
  Blvd., Los Angeles, CA 90016) and Stolenspace Gallery in London. His
  Thinkspace exhibition history includes "Breaking Point" (Project Room, May
  2016), with works including "Furthest Reach," "Good Hurt," "Breaking Point,"
  "Away," "Collide," and "Pull This Thread (As I Walk Away)"; "Parallel Truths"
  (Main Room, 2020), with works including "Into The Ether," "Morning Light,"
  "The Ghost In Me," "As I Fall," "Cascade," "Release Me," "Numb," "Into
  Shadow," "Linger," "Afterthought," "Flicker," "Dust," "Fade," "LA," "Love
  Hate," "Torn," and the "Orbit" hand-finished print editions; "F CANCER"
  (Gallery II, 2023), with "F*ck Cancer"; and "Stand Strong" at The Brand
  Library and Art Center in Glendale, California (2024), with "Dylan." Other
  Thinkspace-affiliated shows include "La Familia" (Thinkspace 10th Anniversary
  Show, 2015), a curated exhibit at the Honolulu Museum of Art School (2015),
  "Gumbo" (2015), "Vitality and Verve: Transforming the Urban Landscape" (2015),
  "LAX / DTW" at Inner State Gallery in Detroit (2015), "Scope Miami Beach"
  (2015, 2016, 2017), "SCOPE New York" (2016), "LAX / ORD" at Vertical Gallery
  in Chicago (2016), "POW! WOW! Hawai'i 2017" at Honolulu Museum of Art School,
  "POW! WOW! Exploring The New Contemporary Art Movement" (2018), "LAX / DTW:
  Detroit Hustle II" (2017), Moniker Art Fair in London Stand 34 (2017), "15
  Years of Thinkspace" (2019), and Group Show Inaugurating the New Gallery Space
  alongside "SCOPE Immersive Miami Beach Part 2" (2020).

  Other documented works on his own jamesbullough.com site include "Hydra
  Sculpture" in Washington DC, "Release" for the Handel With Care Project in
  Dallas, Texas, "Tin-Can Telephone" for the MuralsDC Project in Washington DC,
  and "Peacekeeper" at URBAN NATION in Berlin. His "Desi" mural in Brooklyn, NYC
  is cited as a representative example of his portraits of women rendered
  against negative space. His "Breaking Point" series at Thinkspace was made
  working with dancers from Berlin, capturing fractured moments through
  expressive body motion against expanses of negative space; the models remain
  faceless throughout to reaffirm the universality of the emotive physical
  motion.

  For SHINE 2022, he painted in St. Petersburg.

  Website: jamesbullough.com.

searchMuralDescription: |
  A multi-story mural on the side of a building depicting a woman in a crimson
  dress, her body fragmented into sweeping ribbon-like shards that scatter
  across a dark black background. The photorealistic figure — head tilted back,
  arms outstretched — appears to be dissolving or reassembling mid-leap. Deep
  navy blue, coral red, and muted lavender geometric strips weave through the
  composition, creating a sense of explosive movement against the void.

