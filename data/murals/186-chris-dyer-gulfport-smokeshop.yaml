artistBio: |
  He has painted in forty-five countries. His mural is in the Bob Marley Museum.

  Chris Dyer was born in Ottawa in 1979, moved to Lima, Peru at four, and
  returned to Canada at seventeen. He studied illustration at Dawson College in
  Montreal and trained under visionary masters Alex Grey, Robert Venosa, and
  Amanda Sage. His style fuses psychedelic imagery, Incan and pre-Columbian
  influences, sacred geometry, and 1980s skate culture.

  He founded the Positive Creations brand in 2003 — clothing, tapestries, books,
  skateboards, footwear. He now lives in a purple house in Gulfport with his
  partner Paulina Casati.

searchBio: ""

searchMuralDescription: |
  A psychedelic mural covering the front facade of a purple smoke shop in
  Gulfport. The central figure is a symmetrical creature with multiple eyes and
  ornate geometric patterns in Chris Dyer's signature style — greens, golds,
  pinks, and purples interlocking in sacred geometry motifs. A lightning bolt
  runs through the design. The surrounding wall is painted deep purple with pink
  drip effects along the roofline. The shop sign reads "SMOKE SHOP — CIGARS &
  TOBACCO" in green lettering above.

