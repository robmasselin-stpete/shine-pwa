artistBio: |
  When the Florida art-teachers convention came to St. Petersburg in October
  2024, they painted this wall.

  "The Importance of Art Education" was painted at Bell Pharmacy as one of four
  "Bright Spots" community murals in SHINE's 10th-anniversary festival. Dwayne
  Shepherd and Brian McAllister led the wall in partnership with the Florida Art
  Educators Association — finished early to coincide with the FAEA's annual
  convention. Art teachers from across the state picked up brushes.

  Brian McAllister teaches visual arts at Gibbs High School's Pinellas County
  Center for the Arts — the same program that trained Derek Donnelly and Reid
  Jenkins. He holds a degree from Ringling College of Art and Design, runs JBM
  Studios out of St. Pete, and works as an international muralist whose practice
  centers on local folklore, history, and culture. His SHINE 2019 piece
  "Evolution" at the historic Royal Theater in the Deuces District — Angela
  Bassett, the Griffin twins, Serena Williams — was painted with Boys & Girls
  Club members and Gibbs Mural Club students. He also led the Gibbs Mural Club's
  Fighting Chance Mural at the Morean Arts Center, raising COVID-19 relief
  funds.

  Dwayne Shepherd studied art, psychology, and theology at Austin Peay State
  University. He works mostly in acrylics, paints impressionist landscapes from
  his Historic Kenwood home studio, and serves as a docent at the Dali Museum.
  He teaches at Osceola Middle School in Seminole, where he founded a mural club
  that decorates the school's halls — student work spans inspirational quotes,
  butterflies, and a "superpowers" theme; the club shifted toward community and
  social-change themes during the pandemic.

searchBio: |
  McAllister teaches visual arts at Gibbs High School's Pinellas County Center
  for the Arts, the same program that trained Derek Donnelly and Reid Jenkins.
  Shepherd is a Dali Museum docent who paints impressionist landscapes from his
  Historic Kenwood home studio. For SHINE 2024, the two collaborated on a Bright
  Spots community mural in St. Petersburg.

  Brian McAllister holds a degree in Art from Ringling College of Art and Design
  in Sarasota. He runs JBM Studios out of St. Pete, Florida, working as an
  international muralist, professional artist, illustrator, graphic designer,
  and arts educator. His practice spans oil, acrylic, mixed media, digital, and
  print making. His work focuses on local folklore, history, and culture. JBM
  Studios projects include Spirit of St. Pete, Tichenor Orthopedic Clinic for
  Children in Long Beach CA, Raising Local Spirits, Handoff, The Sky is the
  Limit, Resting Place, Black Leaf Wine and Cigar Lounge, Little Bird Key,
  National Gratitude, The Peir's Sentinel, The Schu, Fred Held South Pasadena
  Habitat, Creative Habitat, Triumphant Youth, Native Roots, Caribbean Cafe,
  Alliance Gulf Coast, Weightless, Coastal Protection, Moseidon, Sunset Stroll,
  Eastern Shore Alliance, King of Pipeline, Pete's Pot, Resilient, Right of Way,
  Spoonbill Welcome, The Flag Company, The Royal Theater, Northeast Little
  League, Tampa Bay Rays, Be The Change, Tribal Wave, Stonegate Mortgage Co,
  Anchor Skate Supply, St Pete Ink Co., and Alden Suites Resort. His studio
  works include Calm After the Storm (mixed media, 16" x 48"), Big Wave (oil,
  30" x 40"), Peak 6 (oil on wood, 16" x 48"), One Fin Turn (digital), The Duke
  (digital), Dizzy (digital), Delayed Ascent (acrylic on wood, 48" x 24"), Peter
  Tosh (digital), Indecent Exposure (mixed media, 18" x 24"), Yancy and the
  Breakneck Quartet (mixed media, 11" x 17"), Passafire (mixed media, 11" x
  17"), The Roots Crew (mixed media, 11" x 17"), Method Man (graphite, 9" x
  12"), Redman (mixed media, 18" x 24"), Tenacious D (oil on canvas, 18" x 24"),
  Got Job? (mixed media, 9' x 12"), Redemption (intaglio, 3" x 9"), and Early in
  the Mornin' Drake (acrylic on canvas, 12" x 24"). He is the featured artist
  for a Tampa Bay Rays print.

  His SHINE 2019 piece, titled "Evolution," was painted at the historic Royal
  Theater in the Deuces District in partnership with the Boys and Girls Club and
  Gibbs Mural Club students. It was the first time SHINE had painted on a
  historical building. The Royal Theater operated from 1948 to 1966 as one of
  two African-American theaters in St. Petersburg, served as a youth center in
  the 1970s, and now functions as a Boys and Girls Club focused on Arts and
  Education. The mural weaves the BGC motto "Great Futures Start Here" through
  the design and depicts St. Pete native Angela Bassett with a movie reel,
  floating bottle caps, and popcorn (bottle caps were once used by children for
  the price of admission), NFL Griffin twins as a nod to the youth-center era of
  athletics, and Serena Williams, who trained in Florida. Two students working
  with a teacher appear inside the word "HERE," and a pelican finishes the
  design. Project partners included the SHINE Mural Festival, Creative Pinellas,
  and Boys and Girls Clubs of the Suncoast.

  McAllister also led Gibbs High School's mural club in designing the Fighting
  Chance Mural at the Morean Arts Center, 719 Central Ave in downtown St. Pete,
  in partnership with the Leadership St. Pete Class of 2020. Funds raised
  supported the Fighting Chance Fund, which provided COVID-19 relief to
  brick-and-mortar businesses, home-based businesses, and individuals. The
  design featured a Florida-native passion vine, a young boy in a mask reading a
  book with doves emerging from its pages, a young girl in a mask with a smiley
  face holding a camera, a pelican in front of the St. Pete skyline, a "+"
  symbol doubling as a red cross for healthcare workers, and the Dr. King quote
  "What are you doing for others?" The palette was muted warm tones with shades
  of purple and cream. Other Gibbs Mural Club projects under McAllister include
  downtown Clearwater murals for the City of Clearwater, the Spectrum of the
  Arts PCCA mural at Gibbs High School, a Clearwater FL mural, and PCS student
  murals around Pinellas. JBM Studios is reachable at (727) 902-3228, based in
  St. Pete, Florida.

  Dwayne Shepherd studied art, psychology, and theology at Austin Peay State
  University. He works mostly in acrylics, inspired by nature. He is a member of
  the Art Enclave Historic Kenwood and the Art Alliance of St. Petersburg, and
  serves as a docent at the Dali Museum. He paints impressionist landscapes from
  his Historic Kenwood home studio and participated in the Artist Enclave Studio
  Tour in Historic Kenwood in 2024. He also teaches art at Osceola Middle School
  in Seminole, where he founded a mural club that decorates the school's halls
  with scenes celebrating education, diversity, and inclusion. The club began as
  a campus beautification effort and shifted toward themes of community and
  social change during the pandemic. Student-painted works there include a
  butterfly encouraging students to fly, inspirational quotes, and a
  "superpowers" theme. Principal Dr. Solomon Lowery has spoken publicly about
  the program.

  For SHINE 2024, Shepherd and McAllister worked in partnership with The Florida
  Art Educators Association (FAEA) to complete "The Importance of Art Education"
  at Bell Pharmacy, 3535 Central Avenue, as part of the festival's "Bright
  Spots" community murals. The piece was finished early to coincide with an FAEA
  convention in St. Petersburg the second week of October 2024, ahead of the
  festival's rescheduled dates following Hurricanes Helene and Milton. SHINE
  director Jenee Priebe oversaw the 10th-anniversary edition. Photo coverage by
  Sunsation Media.

searchMuralDescription: |
  A vibrant marine-themed mural on the side of Bell Pharmacy celebrating art
  education. The composition centers on an underwater scene with sea turtles
  swimming among mangrove roots, tropical fish, and coral. Dolphins arc through
  the water above while the text "The Importance of ART Education" anchors the
  design. The mural was painted collaboratively with art educators from across
  Florida during the FAEA annual conference in October 2024 as one of four
  "Bright Spots" community murals in SHINE's 10th anniversary festival.

