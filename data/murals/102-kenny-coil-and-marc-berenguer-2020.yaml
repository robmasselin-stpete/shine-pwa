artistBio: |
  Kenny Coil and Marc Berenguer are the creative duo behind Break Maiden,
  a Tampa-based design studio that works across branding, illustration,
  and large-scale murals. Coil grew up in the Tampa Bay area and brings a
  bold, graphic sensibility to their projects, while Berenguer moved from
  Barcelona to the U.S. in 2009, bringing a European eye for typography
  and minimal composition.

  Together they have worked with brands across every consumer category and
  built a reputation for clean, flat illustration styles with strong color
  palettes. Their SHINE 2020 mural at USFSP Harbor Hall transforms the
  building into a bright, mid-century-flavored celebration of Florida
  coastal life — herons, fish, mangroves, and downtown buildings rendered
  in cheerful geometric shapes.

muralDescription: |
  A full-building mural in a flat, graphic illustration style depicting
  Florida nature and neighborhood life. The composition is divided into
  loose grid-like sections filled with stylized herons, egrets, pelicans,
  tropical fish, palm trees, mangroves, and colorful downtown buildings in
  teal, pink, yellow, orange, and sage green. The shapes are rounded and
  geometric with a mid-century modern feel — puffy trees with scalloped
  edges, simplified houses with bright facades, and birds rendered as
  elegant silhouettes. A large white egret dominates the lower right. The
  overall palette is warm and coastal, giving the building a cheerful,
  welcoming presence.
