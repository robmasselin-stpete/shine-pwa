searchMuralDescription: |
  A full-building mural in a flat, graphic illustration style depicting Florida
  nature and neighborhood life. The composition is divided into loose grid-like
  sections filled with stylized herons, egrets, pelicans, tropical fish, palm
  trees, mangroves, and colorful downtown buildings in teal, pink, yellow,
  orange, and sage green. The shapes are rounded and geometric with a
  mid-century modern feel — puffy trees with scalloped edges, simplified houses
  with bright facades, and birds rendered as elegant silhouettes. A large white
  egret dominates the lower right. The overall palette is warm and coastal,
  giving the building a cheerful, welcoming presence.

