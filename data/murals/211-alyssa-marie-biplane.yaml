artistBio: |
  A bright yellow Stearman biplane punches straight out of the hangar wall
  it's painted on — wings, struts, bracing wires, and a propeller blurred
  into a translucent disc, all scaled up to read from a moving car on First
  Street.

  Alyssa Marie is a fine artist from Colorado who moved to St. Petersburg in
  2017 and opened Alyssa Marie Gallery on Beach Drive NE the next year (it
  closed in January 2020). She also runs The Happy Mural Project, the paint-by-numbers community sunflower walls she started in 2020, which have been part of SHINE in 2020, 2022 and 2023.

  Her solo work runs to local and nature scenes — water, birds, the Florida
  coast — in oil and on walls. The biplane is the outlier: an aircraft instead
  of wildlife, and it earns the exception.

  Friends of Albert Whitted Airport, the City of St. Petersburg, and the St.
  Petersburg Arts Alliance organized it, funded by the William and Katherine McMannis charitable fund, and unveiled it, still in progress, in January 2024. A second
  airport mural by Brian McAllister went up alongside it. The plane bursting
  from its own hangar turns the building into a picture of what's parked
  inside.

searchBio: |
  A bright yellow Stearman biplane punches straight out of the hangar wall
  it's painted on — wings, struts, bracing wires, and a propeller blurred into
  a translucent disc, all scaled up to read from a moving car on First Street.

  Alyssa Marie (credited on the airport project as Alyssa Dunlap) is a fine
  artist from Colorado who relocated to St. Petersburg in 2017. In 2018 she
  opened Alyssa Marie Gallery on Beach Drive NE in downtown St. Petersburg,
  where she exhibited her own work; the gallery closed in January 2020 and she
  shifted to selling paintings of local and nature scenes. She started The Happy Mural Project, the sunflower and color-by-number community walls, in 2020; it has been part of SHINE in 2020, 2022 and 2023, and she returns for SHINE 2026. Her solo subjects run nautical and
  Florida-coastal — water, birds, the coast — in oil on canvas and scaled up
  onto walls.

  This wall sits on the hangar facing First Street at Albert Whitted Airport.
  It depicts a bright yellow Stearman biplane — a classic open-cockpit trainer
  — emerging head-on from the hangar, propeller rendered as a translucent
  spinning disc. The piece was commissioned through a collaboration between Friends of Albert Whitted Airport, the City of St. Petersburg, and
  the St. Petersburg Arts Alliance, with funding from the charitable fund of
  William and Katherine McMannis, and unveiled in January 2024. A companion
  mural by St. Petersburg muralist and art educator Brian McAllister, titled
  "Past, Present and Future," went up nearby, visible from the airport
  restaurant, The Hangar. The murals mark St. Petersburg's aviation heritage —
  the city is recognized as the birthplace of scheduled commercial airline
  flight.

  Instagram: @alyssa.marie.of.the.sea. Website: alyssamariegallery.com.

searchMuralDescription: |
  A large mural on the side of a hangar at Albert Whitted Airport, painted to
  match the building's own dark, curved-roof silhouette. A bright yellow
  Stearman-style open-cockpit biplane fills the center, shown nearly head-on
  and angling forward as if taxiing out of the dark hangar interior. Upper and
  lower wings are rendered in saturated yellow with white spars; thin white
  struts and crossed bracing wires connect the wings, and the landing gear and
  wheels sit below. At the nose, the spinning propeller is painted as a large
  translucent circular disc, with the engine cowling and prop hub massed dark
  at its center. The background reads as sky and water in blues, with the real
  curved roofline of the hangar incorporated into the composition. Painted on
  the hangar wall facing First Street.

