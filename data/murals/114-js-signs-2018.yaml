artistBio: |
  The Spanish for "Pinellas" is "point of pines." They painted three vintage
  1950s St. Pete storefronts on this wall and gave it the same name.

  Jeffrey Sincich (born 1990, Belleair, FL) and Josh Stover met as ceramics
  majors at the University of Florida and graduated in 2012. They founded J&S
  Signs in St. Petersburg in 2013, started by painting positive-message murals
  around the city ("You Are My Sunshine" at the Morean Arts Center, "Love Your
  Neighborhood" on Central Avenue), then transitioned into professional sign
  painting in a style drawn from 1930s-1950s lettering — bold, simple, with a
  signature mint-and-red palette.

  They relocated to Portland, Oregon around 2015 and rebranded as "Variety Shop"
  in 2021. Their client list runs through Nike, Adidas, Patagonia, Airbnb, and
  the Portland Trail Blazers. For SHINE 2018 they came back to St. Pete and
  painted "Point of Pines" — a 15-by-60 retro storefront scene of buildings that
  never quite existed.

searchBio: |
  They met as ceramics majors at the University of Florida. Their clients
