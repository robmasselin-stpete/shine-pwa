artistBio: |
  Matt Callahan was a Tampa-based muralist who could paint just about anything
  and make it look effortless. Working under the name Man Made Murals, he built
  a reputation across Florida for detailed, technically jaw-dropping work —
  restaurant interiors, brewery walls, hotel lobbies, even a project at
  Disneyland in California. Fellow artists consistently pointed to him as the
  most skilled painter in the Tampa Bay area, someone who could render
  photorealistic detail at any scale.

  A Tallahassee native, Callahan studied illustration at the Atlanta College of
  Art, graduating in 2001 before settling in Tampa and launching Man Made
  Murals. His client list ran deep — Cigar City Brewing, Rick's on the River,
  Bella's Italian Cafe, Beach Shack Harley-Davidson in Panama City Beach — but
  he was equally comfortable doing large-scale outdoor work and fine commercial
  illustration.

  "St. Tampasburg" came together during the first SHINE Mural Festival in 2015,
  a collaboration with fellow Tampa artist Angela Delaplane of Delaplane
  Studios. The two wanted to celebrate the connection between Tampa and St.
  Petersburg, bridging the gap between the cities' art communities. Though
  Callahan participated in every SHINE-related event, he was never officially on
  the festival roster. Instead, he showed up to help other artists — bringing
  extra tools, offering advice, calming nerves.

  Callahan passed away in April 2018 at age 40. His organs were donated, and his
  heart saved the life of another person. A scholarship for young artists was
  established in his name at LeMoyne Art Gallery in Tallahassee. The murals he
  left behind across Tampa Bay remain some of the most technically accomplished
  work in the region.

searchBio: |
  Matt Callahan was a Tampa-based muralist and illustrator who operated under
  the name Man Made Murals. Born in Tallahassee, Florida in 1978, he studied
  illustration at the Atlanta College of Art, graduating in 2001. After college,
  he returned to the Tampa Bay area and founded Man Made Murals, building a
  career that spanned restaurants, breweries, hotels, retail spaces, and
  large-scale outdoor murals across Florida and beyond.

  Callahan's technical ability set him apart. Fellow muralists and SHINE Mural
  Festival organizers consistently described him as the most skilled painter in
  the Tampa Bay area. SHINE organizer Tes One said Callahan was at the top of
  any list of detail-oriented, photorealistic painters who could render anything
  at any scale, equally impressive from one inch or twenty feet away. His range
  was enormous — photorealistic portraits, abstract compositions, hand-lettered
  signage, and densely illustrated narrative scenes.

  His commercial portfolio stretched across Florida. He painted murals for Cigar
  City Brewing in Tampa, Rick's on the River, Bella's Italian Cafe, the Red Star
  Rock Bar in Seminole Heights, Union 72 BBQ, The Avenue burger restaurant,
  Beach Shack Harley-Davidson in Panama City Beach, and numerous other
  restaurants, hotels, bakeries, and bowling alleys. His work even reached
  Disneyland in Southern California.

  "St. Tampasburg" was painted during the inaugural SHINE Mural Festival in
  2015, a collaboration between Callahan and fellow Tampa artist Angela
  Delaplane of Delaplane Studios. Both were Tampa-based artists who had done
  significant work in St. Pete, and the mural reflected that cross-bay bond.

  Although Callahan was deeply embedded in the SHINE community and participated
  in every festival-related event, he was never officially on the artist roster.
  He showed up anyway — to help other painters, offer advice, lend tools, and
  provide moral support. Artist Bekky Beukes recalled how Callahan reached out
  before her first St. Pete mural, unprompted, to share tricks of the trade.
  Derek Donnelly described Callahan as the best artist he had ever known in
  terms of both technical skill and people skills.

  Matt Callahan died on April 13, 2018, at age 40, from a head injury sustained
  outside a bar on Gandy Boulevard in Tampa. His family chose organ donation,
  and his heart saved the life of another person. A scholarship fund for young
  artists was established in his name at LeMoyne Art Gallery in Tallahassee.

  Instagram: @manmademurals. Collaborator: Angela Delaplane (@delaplanestudios).

searchMuralDescription: |
  Large-scale mural featuring oversized block letters spelling "ST PETE," each
  letter filled with a different illustrated scene capturing the spirit of St.
  Petersburg. The S holds a pelican in bold graphic style; other letters frame
  architectural landmarks, a striking face rendered in deep blue and black
  tones, a tropical flower, and marine life. The palette combines rich blues,
  greens, blacks, and warm accents in a punchy, illustrative style. A circular
  "MAN MADE" logo sits to the right of the lettering. The wall is co-signed
  @delaplanestudios and @manmademurals.

