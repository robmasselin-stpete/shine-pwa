artistBio: |
  She studied metalsmithing to continue work her late father began. Art runs in
  the family — both her parents were artists.

  Sarah Sheppard grew up in Dallas, studied photography, drawing, painting,
  graphic design, ceramics, and fabric art at the University of North Texas, and
  has lived in St. Petersburg for over twelve years. She also trained in
  metalsmithing at the Creative Jewelry Academy.

  Her style is colorful, high-contrast figurative work — new romanticism,
  movement as metaphor for continuous loss and seeking. She started her mural
  career painting for a spa in St. Petersburg after earlier work in Venetian
  plaster and faux finishing for model homes. She has multiple SHINE murals
  across the city, including "Life Reimagined" on the back wall of the Morean
  Arts Center, commissioned by AARP.

  For SHINE 2023, she returned to paint in St. Petersburg.

searchBio: |
  She studied metalsmithing to continue work her late father began. Art runs in
  the family — both her parents were artists.

  Sarah Sheppard was born and raised in Dallas, Texas, where her father (her
  mother's college art teacher) shaped her artistic environment from the start.
  She studied photography, drawing, painting, graphic design, ceramics, and
  fabric art at the University of North Texas before relocating to Florida,
  where her parents were living, to be closer to family and change scenery.

  In Florida, with her parents' help, she launched her own business doing
  Venetian Plaster, Faux Finishing, and Murals for model homes, businesses, and
  residences during the mid-2000s housing boom. Fourteen-hour days were routine.
  The 2008 economic downturn coincided with the birth of her son Sebastian,
  ending the model-home work. After three years as a stay-at-home mother, she
  returned to part-time work at Brew D'Licious coffee shop in St. Petersburg,
  where she painted her first exterior mural — roughly 30 feet by 10 feet — for
  the spa across the street. That wall launched her exterior mural career; she
  has since completed roughly 15 exterior murals.

  Her style is colorful, high-contrast figurative work rooted in new
  romanticism, with movement as metaphor for continuous loss and seeking. Her
  personal artwork is inspired by life events, the natural world, and historical
  motifs and symbolism, sometimes mixed with modern color or application. She
  aims to convey beauty, romanticism, and mysticism, and works at large scale in
  both painting and jewelry.

  Her best-known St. Pete commission is "Life Reimagined," painted on the back
  wall of the Morean Arts Center at Central Avenue and Seventh Street. AARP and
  the Morean approached her in 2015 to develop a mural around the themes "Life
  Reimagined" and "Disrupt Aging." Her composition uses gears to represent the
  grind of daily life and the mechanics of the working world, a Banyan tree as
  the central figure with roots sinking into the community, and a Phoenix as the
  symbol of rebirth into the next stage of life. The piece was profiled by Julie
  Garisto in Creative Loafing Tampa Bay (September 26, 2015). AARP partnered on
  the project as part of its Tampa Bay arts initiative — "a vibrant cultural
  life connects people to their community."

  Other documented public work includes a massive wall at Skull & Cakebones
  Vegan Craft Bakery in Dripping Springs, Texas, and a SHINE 2023 mural in St.
  Petersburg at 2356 5th Ave S. She is included in "We Built This City: Women
  Artists of SHINE," a Morean Arts Center exhibition opening October 11, 2025,
  alongside Alyssa Marie, Artist Jones, Elizabeth Barenis, Quinn Cale, Ashley
  Cantero, Jenipher Chandley, Dreamweaver, Amy Ilic-Volpe, Carrie Jadus, Nneka
  Jones, Cristi Lopez, Cecilia Lueza, Syd Bloom, Sara Salem, and Nicole Salgar —
  sixteen Tampa Bay muralists recognized for shaping St. Pete's public and
  street art scene through SHINE. The exhibition runs through October 22, 2025.
  SHINE® St. Petersburg Mural Festival, produced by the St. Petersburg Arts
  Alliance since 2015, has commissioned more than 170 murals.

  After moving back to Texas, she began studying metalsmithing at Creative Side
  Jewelry Academy. The decision started with Jewelry 101 — taken to finish a few
  pieces her father had given her when he passed away — and grew into ongoing
  coursework. Her jewelry work mirrors the scale of her painting: large
  statement pieces, each unique, drawing from the same historical motifs and
  natural-world references. She has lived in St. Petersburg for over twelve
  years across her time in Florida.

  Sheppard has spoken about the emotional dimension of the work — particularly
  the discipline of being kind to herself as her own toughest critic, trusting
  the creative process, taking breaks, and seeking new experiences to shake up
  perspective. She names painting outside as both the most challenging and most
  rewarding part of mural work — weather, public visibility of every mistake,
  and the conversations with passersby and children who light up at the work.

  Website: sarahsheppardsart.com. Instagram: @thee.divine.sarah. Facebook:
  theedivinesarah. Phone: 727.417.2687.

searchMuralDescription: |
  A wide mural on a black background centered on a pair of large, detailed eyes
  gazing out from behind an ornate golden mask-like structure. The face is
  flanked by crescent moons, a starburst crown, and colorful tropical flowers —
  hibiscus in pink and teal. White feathered wings spread out on both sides, and
  elaborate gold filigree scrollwork curls outward to fill the edges of the
  wall. The words "We are all Magic" appear in script across the lower center.
  The overall effect is mystical and symmetrical, like a gilded altar piece
  reimagined as street art.

