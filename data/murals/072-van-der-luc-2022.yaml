searchMuralDescription: |
  A large whimsical mural on a bright blue sky background covering the full side
  of Allums Auto. A massive white polar bear strides across a green grassy
  landscape, carrying a robot passenger who holds a black umbrella studded with
  stars. The robot sits atop the bear with a first-aid kit satchel, a potted
  plant, and a box labeled "Honey" strapped to the bear's back. A skeletal bird
  — just bones and a long beak — perches behind the robot. A swarm of bees
  buzzes on the right side, and in the upper left, a drone delivers a cardboard
  box labeled "Art Supplies." Power lines and distant utility poles dot the
  horizon. Signed "VAN DER LUC" in angular hand-lettered type in the upper right
  corner. The piece blends environmental and technological themes with a
  storybook charm.

