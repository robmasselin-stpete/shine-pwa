artistBio: |
  Polar bears hauling robots through sunny landscapes. Drones delivering art
  supplies. Bird skeletons wandering past boxes of honey. This is how he talks
  about the environment.

  Lucas Franco — Van Der Luc — is a self-taught painter and multimedia artist
  from Bogota, Colombia, now based in St. Petersburg. He works out of Studios at
  5663 in Pinellas Park's Pinellas Arts Village. His subjects are big — climate,
  nature, geopolitics, technology — but his delivery is whimsical and
  surrealist, playful rather than preachy.

  He has shown in group exhibitions and museum-curated shows across the Tampa
  Bay region. In 2019 he was selected as an emerging artist for SHINE's REVEAL:
  EMERGE live painting event at Station House. By 2022 he was a full SHINE mural
  artist.

  For SHINE 2022 he painted "Tank School" on the side of Allums Auto in the
  Warehouse Arts District — a white polar bear striding across a green landscape
  with a robot on its back, an umbrella studded with stars, and a drone
  delivering art supplies in the corner.

