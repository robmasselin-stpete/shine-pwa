artistBio: |
  A charging bull, a woman trailing red silk, and a sun stamped with glowing
  code — painted like a Japanese woodblock print down the side of a Bitcoin
  hotel.

  It's the Wall Street bull, relocated to St. Pete and wrapped in ukiyo-e
  clouds. The wall reads as one idea: a woman breaking free of the financial
  establishment, the red silk she trails standing for that freedom; a dragon
  tucked into the clouds for prosperity; and a sun lighting what Bitcoin calls
  the "genesis block," the first block ever mined.

  The mural covers the side of Satoshi Hideout, a crypto-themed boutique hotel
  and co-living building at 425 2nd Street N downtown. The building's art
  program launched in 2022, with the concept designed by St. Petersburg
  advertising firm Clear ph. This wall is signed AnniePhunk.

searchBio: |
  A charging bull, a woman trailing red silk, and a sun stamped with glowing
  code — painted like a Japanese woodblock print down the side of a Bitcoin
  hotel. This wall is signed AnniePhunk.

  It wraps the side of Satoshi Hideout, St. Petersburg's first crypto-themed
  boutique hotel and co-living building, at 425 2nd Street N (the project also
  spans 424 2nd Street N, the former Park Plaza Apartments) in downtown St.
  Petersburg. The art concept was designed by St. Petersburg advertising firm
  Clear ph; press coverage in 2022 credited the Satoshi Hideout murals to local
  artist gatsbynotart, and the mural work took more than two weeks. This wall
  carries the signature "AnniePhunk."

  The imagery is openly about money and freedom. A woman confronts a bull drawn
  after the iconic Charging Bull sculpture on Wall Street; the unwoven red silks
  she trails were described as freedom from the constraints of the financial
  establishment. A dragon hidden in the clouds represents prosperity, and a sun
  illuminates the "genesis block" — the first block of the Bitcoin blockchain —
  above the figures. The woman is rendered in an anime style. Another side of
  the project carries portraits of unrelated people, a nod to the unknown
  identity of Satoshi Nakamoto, Bitcoin's pseudonymous creator.

  Annie Phunk is a painter — her studio work runs to realist oil, from
  portraits to pop-leaning still lifes. Instagram: @miss.phunk. Website:
  missphunk.com.

  Painted in 2022. Category: commissioned (a private commission for the hotel,
  not a SHINE Mural Festival wall).

searchMuralDescription: |
  A long two-story mural on the stucco side wall of an apartment-style building,
  with the building's windows and air-conditioning units left exposed and
  painted around. The whole scene is rendered in a stylized Japanese
  woodblock-print idiom: scrolling, curled clouds in layered blues, purples,
  pinks, and white fill the wall edge to edge. At center, a large dark
  navy-to-black bull charges with its head lowered — pale curved horns, cyan
  contour lines defining the muscles and a shaggy, bison-like mane, tail flicked
  up behind. At far left, an anime-style woman with long black hair and a pink
  hair ribbon leans into motion, wearing a deep magenta/maroon jacket over white,
  her hair and a length of red-pink silk streaming behind her. Upper left, a
  golden sun disc is filled with small repeating glyphs and characters
  (code-like "AF" and "00" forms), throwing straight rays across a graduated
  blue sky. The right half continues the cloudscape in pink and lavender. Signed
  in black at the lower left: "AnniePhunk."

