artistBio: |
  Jon Murrill drew Southwest Virginians in charcoal for more than ten years,
  in detail fine enough to pass for photographs. Now the faces are twenty-two
  feet tall.

  He wants a face to show who someone really is, not to flatter them. Some of
  his best-known walls are the "Lady Appalachia" series. The first went up in
  Vinton, his hometown. He has also painted "Lady of the Pines" in Stuart and
  "Lady of the River" in Roanoke. If he wasn't painting portraits, he has
  said, he "wasn't being true to myself as an artist."

  He graduated from Roanoke College with a studio art degree in 2009 and
  earned an MFA in painting and drawing at Radford University in 2012. His
  charcoal portraits were shown in regional and national exhibitions. For
  about ten years he taught, high school art in Craig County and at Patrick
  Henry High School in Roanoke, and college courses in watercolor, drawing and
  art history. He took his first mural jobs in early 2022 and went full-time
  in 2023. He works out of Roanoke.

  The map of his murals now covers much of Virginia: "The Swing" in Salem, 48
  by 110 feet; "Neon Osprey" in Warsaw, 180 feet long; "The Welder" in
  Daleville; "James River Reflections" in Lynchburg; "Neon Owl" in Blacksburg.
  In December 2024 he painted his first wall abroad, in Florianópolis, Brazil.
  The City of Roanoke named him its 2023–24 Artist in Residence.

  At his Community Painting Days, volunteers block in the base layers. "It
  doesn't matter what your skill set is," he says. Nearly 100 of them worked
  on a 380-foot mural at a Roanoke sports complex. In fall 2025 Roanoke
  College brought him back to wrap its Maroon Village lounge in paint on every
  side, working with students ten at a time. In September 2026 about 70
  volunteers helped him finish "The River's Radiance" in Danville.

  For SHINE 2026 he is one of fifteen artists in the festival's twelfth year,
  and the lineup's only Virginian. He is painting one of two walls at VIV.

searchBio: |
  Jon Murrill drew Southwest Virginians in charcoal for more than ten years,
  in detail fine enough to pass for photographs. Now the faces are twenty-two
  feet tall.

  The charcoal portraits were shown in regional and national exhibitions. He
  wasn't after flattering faces. He wanted each one to show who the person
  really was, and his walls grew out of that. He credits Appalachians, and the
  character and stories he finds in them, for the work more than any school.
  His site sorts what he paints into four threads: people, landscape, stories
  and Appalachia itself.

  Some of his best-known walls are the "Lady Appalachia" series. If he wasn't
  painting portraits, he has said, he "wasn't being true to myself as an
  artist." He plans more than a dozen. The first, a 22-foot-tall young woman,
  went up on a Vinton municipal building; Kellard Media dates it to April
  2024, while his own site lists 2025. "Lady of the Pines," in Stuart, peeks
  over a tree with a pine cone above one ear. "The idea of representing the
  more natural elements of our area and landscape seems a bit more feminine to
  me," he says. He has also painted "Lady of the River" in Roanoke.

  He is a native of Vinton, Virginia, and graduated from Roanoke College with
  a studio art degree in 2009, working in the college's Olin Gallery as a
  student. In 2012 he earned an MFA in painting and drawing at Radford
  University, where the watercolorist and charcoal artist Professor Z. L. Feng
  shaped his work. For about ten years he taught: high school art in Craig
  County and at Patrick Henry High School in Roanoke, plus Watercolor I–III,
  Drawing, Design, Art History and Art Appreciation at the college level,
  including as an adjunct at Virginia Western Community College. He started
  taking mural jobs in early 2022, small indoor pieces for restaurants,
  breweries and a credit union, and went full-time in 2023. "If I want to
  build a business around this," he told himself, "I need to look beyond the
  smaller indoor pieces." He works out of Roanoke.

  The walls are about Appalachia, and his own mural map now covers much of
  Virginia. In 2024 came "Lady of the Pines" in Stuart and "Lady of the River"
  in Roanoke. In 2025 he painted "The Swing" in Salem, 48 by 110 feet; "Neon
  Osprey" in Warsaw, 30 by 180 feet; "The Welder" in Daleville, 30 by 120
  feet; "James River Reflections" in Lynchburg; "Neon Owl" in Blacksburg,
  glowing in purples, pinks and fluorescent greens; and "Nature Train,"
  "Mothers of the Forest" and "The Night Owl" in Roanoke. "Nature Train" wraps
  trees, vines and a squirrel around the Norfolk & Western 1218 locomotive. On
  two bridge underpasses on Roanoke's greenways, the Southeast Greenways
  Project murals carry reed-lined lakes, cedar waxwings, a green heron and the
  Roanoke Star. A Craig County wall, made with high school students, has a
  black bear's head, deer, birds and a red barn. Cardinals fly over mountains
  in Clifton Forge. A running store got a rabbit in athletic gear. Inside, his
  work is at Sidecar and Twisted Track Brewery, and he has painted walls for
  Blue Eagle Credit Union and Cherry Alley.

  For a community wall he works out the design with the group around its own
  story, then talks volunteers through the painting a step at a time,
  first-timers included. At his Community Painting Days, volunteers block in
  the base layers. "It doesn't matter what your skill set is," he says. "We'll
  find something that you're comfortable with when you come to the wall."
  Nearly 100 volunteers from around the state helped paint a 380-foot mural on
  an elevated roadway at a Roanoke sports complex. In late September 2025
  Roanoke College brought him back to wrap its Maroon Village lounge in paint
  on every side. The job took about six weeks, and students signed up for six
  painting sessions, ten at a time. Once a mural is done, he says, "it is then
  no longer mine."

  In 2023 he assisted the international muralists James Bullough, Onur Dinc
  and Thiago Valdí when they painted in Roanoke. The City of Roanoke named him
  its 2023–24 Artist in Residence, with a plan to catalyze murals across the
  city. In December 2024 he painted his first wall outside the country, a
  woman engulfed by plants, at an arts conference in Florianópolis, Brazil. In
  September 2026 about 70 volunteers helped finish "The River's Radiance" on
  Memorial Drive in Danville, Virginia. A community panel picked him through a
  national call run by the City of Danville and its Arts Commission. The mural
  shows a 14-year-old girl surrounded by wildlife, reeds and dragonflies by
  the river. "The heart of this mural actually lies in the portrait," he says.

  He takes on one large mural a month, which leaves room for weather, drone
  footage and press, and he is usually booked six months to a year out. "I
  believe that the role of the artist is to be an advocate for those
  individuals or stories in society that need to be given a voice," he says.

  For SHINE 2026 he is one of fifteen artists in the festival's twelfth year,
  and the lineup's only Virginian. He is painting one of two walls at VIV.

