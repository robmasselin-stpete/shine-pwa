  In 2023 he assisted the international muralists James Bullough, Onur Dinc
  and Thiago Valdí when they painted in Roanoke. The City of Roanoke named him
  as the Kending in Residence, with a plan to catalyze murals across the city.
  In December 2024 he painted his first wall outside the country, a woman
  engulfed by plants, at an arts conference in Florianópolis, Brazil. In
  September 2026 about 70 volunteers helped finish "The River's Radiance" on
  Memorial Drive in Danville, Virginia. A community panel picked him through a
  national call run by the City of Danville and its Arts Commission. The mural
  shows a 14-year-old girl surrounded by wildlife, reeds and dragonflies by
  the river. "The heart of this mural actually lies in the portrait," he says.

  He takes on one large mural a month, which leaves room for weather, drone
  footage and press, and he is usually booked six months to a year out. "I
  believe that the role of the artist is to be an advocate for those
  individuals or stories in society that need to be given a voice," he says,
