artistBio: |
  Jon Murrill is a communitry storyteller who drew photorealistic charcoal
  portraits for ten years.  Those small microdetailed drawings have now become
  massive faces sometimes twenty or thirty feet tall.

  He wants a face to show who someone really is, not to flatter them, but to
  capture their spirit on the wall. Some of his best-known walls are the "Lady
  Appalachia" series. The first went up in Vinton, his hometown. He had also
  painted "Lady of the Pines" in Stuart and "Lady of the River" in Roanoke. If
  he wasn't painting portraits, he has said, he "wasn't being true to myself
  as an artist."

  As a former educator he has also incorporated community painting experiences
  across Appalachia engaging others to participate alongside him painting.
  He took his first mural jobs in early 2022 and went full-time in 2023.  With
  his home base in the heart of the Blue Ridge mountains much of his work also
  includes imagery of local wildlife and landscape.

  The map of his murals now covers much of Virginia: "The Swing" in Salem, 48
  by 110 feet; "Neon Osprey" in Warsaw, 180 feet long; "The Welder" in
  Daleville; "James River Reflections" in Lynchburg; "Neon Owl" in Blacksburg.
  In December 2024 he painted his first wall abroad, in Florianópolis, Brazil.
  The City of Roanoke named him as the Kending Award winnner for best
  individual artist in 2025.

  His passion truly lies in engaging each community he travels to.  While his
  portraits tell different stories he also ties in ways to celebrate alongside
  residents in each area in different ways.  Murrill has organized hundreds of
  volunteers on a 380-foot mural at Roanoke’s River’s Edge Park.  He has also
  shared street art with students at Roanoke College painting a four sided
  mural at their new Maroon Village location.   In September 2026 about 70
  volunteers helped him finish "The River's Radiance" in Danville, Virginia.

  “Once a mural is finished it is no longer mine, but becomes a part of that
  community.”  This philosophy is the through-line in Murrill’s public art.
  Each community becomes a different story to tell.

  For SHINE 2026, the festival's twelfth year, he is the lineup's only
  Virginian, painting a wall at Skyline Campus.

searchBio: |
  Jon Murrill is a communitry storyteller who drew photorealistic charcoal
  portraits for ten years.  Those small microdetailed drawings have now become
  massive that sometimes twenty or thirty feet tall.

  The charcoal portraits were shown in regional and national exhibitions. He
  wasn't after flattering faces. He wanted each one to show who the person
  really was, and his walls grew out of that. He credits Appalachians, and the
  character and stories he finds in them, but to capture them , for the work
  more than any school. His site sorts what he paints into four threads:
  people, landscape, stories and Appalachia itself.

  Some of his best-known walls are the "Lady Appalachia" series. If he wasn't
  painting portraits, he has said, he "wasn't being true to myself as an
  artist." He plans more than a dozen. The first, a 22-foot-tall young woman,
  went up on a Vinton municipal building; Kellard Media dates it to April
  2024, while his own site lists 2025. "Lady of the Pines," in Stuart, peeks
  over a tree with a pine cone above one ear. "The idea of representing the
  more natural elements of our area and landscape seems a bit more feminine to
  me," he says. He had also painted "Lady of the River" in Roanoke.

  He is a native of Vinton, Virginia, and graduated from Roanoke College with
  a studio art degree in 2009, working in the college's Olin Gallery as a
  student. In 2012 he earned an MFA in painting and drawing at Radford
  University, where the watercolorist and charcoal artist Professor Z. L. Feng
  shaped his work. For about ten years he taught: high school art in Craig
  County and at Patrick Henry High School in Roanoke, plus Watercolor I–III,
  Drawing, Design, Art History and Art Appreciation at the college level,
  including as an adjunct at Virginia Western Community College. He started
  taking mural jobs in early 2022, small indoor pieces for restaurants,
  breweries and a credit union, and went full-time in 2023.  With his home
  base in "If I want to build a business around this," he told himself, "I
  need to look beyond the smaller indoor pieces." the heart of the Blue Ridge
  mountains much of his work also includes imagery of local wildlife and
  landscape.

  The walls are about Appalachia, and his own mural map now covers much of
  Virginia. In 2024 came "Lady of the Pines" in Stuart and "Lady of the River"
  in Roanoke. In 2025 he painted "The Swing" in Salem, 48 by 110 feet; "Neon
  Osprey" in Warsaw, 30 by 180 feet; "The Welder" in Daleville, 30 by 120
  feet; "James River Reflections" in Lynchburg; "Neon Owl" in Blacksburg,
  glowing in purples, pinks and fluorescent greens; and "Nature Train,"
  "Mothers of the Forest" and "The Night Owl" in Roanoke. "Nature Train" wraps
  trees, vines and a squirrel around the Norfolk & Western 1218 locomotive. On
  two bridge underpasses on Roanoke's greenways, the Southeast Greenways
  Project murals carry reed-lined lakes, cedar waxwings, a green heron and the
  Roanoke Star. A Craig County wall, made with high school students, has a
  black bear's head, deer, birds and a red barn. Cardinals fly over mountains
  in Clifton Forge. A running store got a rabbit in athletic gear. Inside, his
  work is at Sidecar and Twisted Track Brewery, and he has painted walls for
  Blue Eagle Credit Union and Cherry Alley.

  For a community wall he works out the design with the group around its own
  story, then talks volunteers through the painting a step at a time,
  first-timers included. At his Community Painting Days, volunteers block in
  the base layers. "It doesn't matter what your skill set is," he says. "We'll
  find something that you're comfortable with when you come to the wall."
