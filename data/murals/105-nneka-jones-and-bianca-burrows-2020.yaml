artistBio: |
  TIME Magazine used her embroidered American flag on its cover. She was twenty.

  Nneka Jones was born in Trinidad and Tobago, where she placed first in the
  Caribbean for Art and Design Examinations before moving to the United States
  in 2016. She earned her BFA with a minor in marketing from the University of
  Tampa in 2020. A professor challenged her to "paint without paint" — she
  turned to embroidery, a skill learned from her mother in Trinidad.

  Her work addresses systemic injustice, sexual abuse, and human trafficking
  through realistic embroidered portraits and mixed media. Her "Targets" series
  incorporates condoms. TIME commissioned her embroidered flag for its August
  2020 cover on "The New American Revolution." She keynoted Adobe MAX that
  October. She won the Gasparilla Emerging Artist Award (2019) and Best of Show
  with a $15,000 prize at Gasparilla (2022). For SHINE 2022, she painted in St.
  Petersburg.

searchBio: |
  TIME Magazine used her embroidered American flag on its cover. She was twenty.

  Nneka Jones was born in Trinidad and Tobago and grew up in Port of Spain. She
  attended Newtown Girls' RC for primary school and Bishop Anstey High School
  after that. Her mother taught her to thread needles and manipulate fabric at
  home. Caribbean artists Jackie Hinkson and James Armstrong were visible
  figures in her early sense of the field, but she rarely saw women working at
  the same scale, which pushed her toward becoming the role model she had been
  looking for.

  She placed first in the Caribbean for Art and Design Examinations and moved to
  the United States in 2016 to continue her training. She studied at the
  University of Tampa and earned a BFA with a minor in marketing in 2020,
  graduating at twenty-five. An experimental painting class with professor Chris
  Valle changed her practice — Valle told her to "paint without paint," and
  Jones turned to embroidery, drawing on what her mother had taught her in
  Trinidad. She made her first thread-and-mixed-media works in that class and
  never went back.

  In 2019, while still a student, she applied to the Raymond James Gasparilla
  Festival of the Arts in Tampa and was accepted as an Emerging Artist. It was
  the first time she had shown work in public. She won the Emerging Artist Award
  and sold her first two pieces to buyers who remained clients. Three years
  later, at GFA 52 in 2022, her mixed media piece Modern Renaissance won Best of
  Show and the $15,000 prize. The piece was also purchased at the festival.

  Her Targets series uses condoms as part of the medium and addresses sexual
  abuse, human trafficking, and the protection of women and girls of color.
  Pieces in the series include Shooting Range Target (2019), Colorblind Target
  (2019), Dartboard Target (2019), Biggie Embroidered (2019), Colorblind
  Shooting Range (2020), and Red Light (2020). Other works include Self Portrait
  (2019), Unzipped (2020) — hand embroidery with embroidery thread, zipper, and
  fabric swatches — Destroy the Myth (2021), New Era (2022), Modern Renaissance
  (2022), Retrospect: Between You and Me (2023), and the Blueprint Reconstructed
  I and II diptych (2023). Her larger pieces use a combination of hand
  embroidery and punch needle on stretched canvas, cotton fabric, or monk's
  cloth, with embroidery thread, yarn, and acrylic paint. She works without a
  tufting gun or sewing machine.

  In June 2020, during the Black Lives Matter protests, TIME Magazine
  international art director Victor Williams reached out after seeing the
  painted portrait of George Floyd that Jones had posted to Instagram. He came
  back in August to commission a cover for a TIME series with Pharrell Williams
  about creating a more equitable future for Black Americans. Jones produced an
  embroidered American flag with black stripes stitched onto canvas, the white
  stripes left as raw canvas, the stars formed by raw canvas with black thread
  embroidered around them. She left the flag intentionally incomplete and tucked
  the needle she had used into the last stripe. The piece ran on the August
  31–September 7, 2020 special issue, "The New American Revolution." That
  October she was the keynote speaker at Adobe MAX.

  Her work has been acquired by the Tampa Museum of Art, the Florida Craft Art
  Gallery, and the Ferman Center for the Arts at the University of Tampa, where
  Special Delivery – Unzipped is in the permanent collection, along with many
  private collectors. She completed the mural History Starts Here at the Gwen
  Miller Community Center in Tampa, telling the story of the community and a
  vision for its future. For SHINE 2022, she painted in St. Petersburg.

  Her process starts with an image she has already worked out in her head. She
  gathers source images, sometimes from her own photography, and collages them
  digitally in Photoshop, a step that can take a day to a week. She prints the
  collage as her reference, transfers a hand-sketched outline to the substrate
  using pencil, light marker, and carbon paper, and uses it as a color map. She
  begins with the eyes and works outward in sections, rarely returning to a
  section once it is complete except to add highlights to skin tone over
  mid-tones. Backgrounds are either pre-stretched colored fabric, painted around
  the thread, or built up with hand-embroidered fabric swatches. Different
  colored stitches layer like brushstrokes, which is why viewers often need a
  second look to register that the portraits are stitched by hand.

  She has described her role as an artist activist — using portraiture to push
  back on the way women of color are labeled "independent," "powerful," and
  "strong" in ways that get used as shields against protecting them. Her current
  focus has shifted toward identity across cultures and within oneself, with the
  female figure and the gaze of her subjects as the entry point.

