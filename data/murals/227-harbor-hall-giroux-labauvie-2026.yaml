artistBio: |
  Harbor Hall project at USF St. Petersburg for SHINE 2026, more to be
  announced.

  Jay Giroux builds his work from repurposed construction supplies, spray
  paint and printing materials. He earned an MFA in painting at the University
  of Houston, and in 2018 he founded Greater Public Studio in Tampa's Seminole
  Heights. The studio paints murals and designs brands for clients including
  the Tampa Bay Rays, the Buccaneers and the City of Tampa.

  Giroux also teaches graphic arts at USF St. Petersburg. With his students he
  painted the seven floors of the campus parking garage, from the ocean floor
  at street level up to the sky at the top. In 2023 he led the university's
  SHINE street mural on 2nd Street South, which came up in August 2025 under
  the state's ban on decorative street markings.

  Dominique Labauvie was born in Strasbourg in 1948 and trained as a sculptor
  in Paris. In 1997 the city commissioned a monumental cast-iron sculpture
  from him beside the Seine. He has lived and worked in Tampa since 1998. His
  steel sculptures "Air Fer Mer" stand on the Tampa Museum of Art's terrace by
  the Hillsborough River, and in 2019 he mentored the USF St. Petersburg
  student whose steel sculpture now hangs in Harbor Hall's lobby.

searchBio: |
  Harbor Hall project at USF St. Petersburg for SHINE 2026, more to be
  announced.

  Jay Giroux is an artist, designer and educator based in Tampa. He works in
  repurposed construction supplies, spray paint and printing materials, and
  designs murals and large public works. He holds an MFA in painting from the
  University of Houston. In the early 2000s he worked under the Tampa painter
  Theo Wujcik, and he helped bring the "Beautiful Losers" exhibition to the
  USF Contemporary Art Museum in 2006. He co-founded Pep Rally Inc with Josh
  Pearson, left in July 2018, and founded Greater Public Studio.

  Greater Public Studio is an art and design studio in Old Seminole Heights,
  Tampa: creative direction, hand-painted murals, brand identity, graphic
  design, illustration and installation design. Its clients include Nike, the
  Tampa Bay Rays and Buccaneers, Coca-Cola, Fanatics, Hotel Haya, the City of
  Tampa and USF. Its work includes a Nike and Rays mural in St. Pete, the
  Buccaneers' 50 Seasons branding and the SkyDeck at Tropicana Field. With
  Anthony Freese, Giroux created the 2023 wayfinding intersection mural at
  Cass and Tyler streets in downtown Tampa, a "river of color" leading people
  to the Riverwalk, and in February 2025 the studio finished the Avion Park
  mural in Westshore.

  Giroux teaches graphic arts at USF St. Petersburg and Hillsborough Community
  College. With USFSP Graphic Arts students he painted a seven-floor marine
  mural in the campus parking garage (2024), from the ocean floor at ground
  level to the sky at the top. For SHINE 2023 he and ten Graphic Design
  students painted the university's street mural at 2nd Street and 6th Avenue
  South, outside the University Student Center; USF calls it "Fluid
  Structures" and the SHINE site lists it as "Dive Into Discovery." It was
  removed on August 29, 2025, after the Florida Department of Transportation
  banned non-standard surface markings.

  Dominique Labauvie (also written LaBauvie) was born in Strasbourg in 1948,
  studied art history there, and moved to Paris in 1968 to train in sculpture.
  He worked as a sculptor on unfinished Rodin pieces, among them "The Gates of
  Hell." His 1989 show at FIAC in Paris sold out; he was represented by
  Galerie Maeght. In 1997 Paris commissioned a monumental cast-iron sculpture,
  about 50 feet long and 20 feet high, overlooking the Seine. He has lived in
  Tampa since 1998, in Bleu Acier, a live-and-work space in Tampa Heights. He
  received an Adolph and Esther Gottlieb Foundation grant in 2009, and the
  Tampa Museum of Art gave him a solo show in 2010, "Musical Lines in My
  Hand." His four steel sculptures "Air Fer Mer" (a play on éphémère) stand on
  the museum's Sullivan Terrace by the Hillsborough River, and he has public
  work at Tampa General Hospital.

  In September 2019 he mentored the USF St. Petersburg student Darnell
  Henderson, whose steel sculpture went into the Harbor Hall entrance lobby.
  Its shadows read as musical notes, and the university called it the first
  student-made public art on campus.

  For SHINE 2026 the three share the Harbor Hall project at 1000 3rd St S. The
  building already carries "Rooted in the Community" by Kenny Coil and Marc
  Berenguer (SHINE 2020).

  Instagram: @greaterpublicstudio (Jay Giroux: @jtgiroux). Websites:
  greaterpublicstudio.com, jaygiroux.com.

