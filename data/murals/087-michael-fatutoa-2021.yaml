artistBio: |
  He tattoos the traditional Samoan Pe'a — waist to knees, hand-tapped with bone
  or boar-tusk combs lashed to a turtle-shell handle and struck with a wooden
  mallet. His daughters Savannah and Sienna are learning the craft.

  Michael Fatutoa — Samoan Mike — was born on the island of Tutuila in eastern
  Samoa and grew up in Kalihi, Hawaii within the Samoan community. He started
  tattooing at fifteen, went professional at nineteen in Las Vegas, and now runs
  Sacred Tatau in Tampa (8130 W Waters Ave) by appointment only. He is
  self-taught. He returned to Samoa to receive his own Pe'a.

  His client list runs through the Anoa'i wrestling family — the Bloodline —
  including Roman Reigns (a 17-hour right-arm sleeve), The Usos (Jimmy and Jey),
  Bronson Reed, Montez Ford, Tamina, and the late Bray Wyatt. He was featured in
  the Japanese American National Museum's "Tatau: Marks of Polynesia" exhibit.
  For SHINE 2021, he extended his Polynesian geometric vocabulary onto a wall —
  a hammerhead shark and a sea turtle, both bodies filled edge to edge with
  tatau.

searchBio: |
  He tattoos the traditional Samoan Pe'a — waist to knees, hand-tapped with bone
  or boar-tusk combs lashed to a turtle-shell and wood handle, struck with a
  wooden mallet (the au tattoo method). The Pe'a takes anywhere from ten days to
  several months to complete. Pigment is herbal juice from candlenut or coconut.
  His daughters Savannah and Sienna are apprenticing under him; he has four
  children in total.

  Michael Fatutoa — Samoan Mike — was born on the island of Tutuila in eastern
  Samoa and grew up in Kalihi, Hawaii within the Samoan community. He started
  tattooing at fifteen, went professional at nineteen in Las Vegas, and now runs
  Sacred Tatau in Tampa (8130 W Waters Ave, Suite 130, Tampa, FL 33615; phone
  813-249-8288), a private studio operating by appointment only. He has been
  tattooing since 1997 (about 29 years of career as of 2026). The shop also
  offers permanent makeup. He previously operated Sacred Tatau on S. Eastern Ave
  in Las Vegas before relocating the business to Tampa. He is self-taught. He
  returned to Samoa to receive his own Pe'a.

  His client roster runs through the Anoa'i wrestling family — the Bloodline —
  and includes Roman Reigns (Leati Anoa'i, whose right-arm sleeve totaled 17
  hours), The Usos (Jimmy Uso and Jey Uso), Bronson Reed, Montez Ford, Tamina,
  and the late Bray Wyatt. He has spoken about these sessions on Instagram,
  including the post-session caption that referenced aiga (family) and uso
  (brother): "true meaning lay deeply rooted in #aiga whom we draw our strength
  no matter what life throws at us. Thanks for always being a warrior during our
  long a** sessions. #Loveandrespect my uso."

  Beyond tattoo work, he is a featured artist in the Japanese American National
  Museum's "Tatau: Marks of Polynesia" exhibit, with an associated YouTube
  documentary segment ("Tatau: Marks of Polynesia | Featuring Samoan Mike"). His
  most substantive long-form profile is a February 2024 interview with Stories
  Not Far in Chinese-language press. He has been covered by Sportskeeda,
  Wrestling Inc., EWrestling, TheSportster, and Samoa Observer, mostly via the
  Roman Reigns / Bloodline angle. He sells fine-art prints (including a "Samoa"
  piece on Pixels) and self-published art books "Siapo Art" and "Greetings of
  Polynesia" on Amazon. His online store is at samoanmike.shop (formerly
  michaelfatutoa.com).

  For SHINE Mural Festival 2021 in St. Petersburg, Florida, he painted at 2060
  1st Ave S on the Grayspeed building — two massive sea creatures facing each
  other, a hammerhead shark on the left rendered in teal and black with
  intricate Polynesian tatau patterns (spirals, chevrons, and layered geometric
  bands following the contours of its body) and a sea turtle on the right in
  black and white with bold angular motifs including step patterns and diamond
  shapes, with small teal accents at the flippers. The two animals appear to
  circle each other across the wall.

  Instagram: @samoan_mike. Permanent makeup at the Tampa studio is offered by
  Angae. Sources used in writing this expanded bio include the Yelp listing for
  Sacred Tatau, the SHINE 2021 St. Pete Arts Alliance page, the Stories Not Far
  February 2024 Chinese-language interview, Sportskeeda's "Who is the artist
  behind Roman Reigns and the Bloodline's Samoan tattoos," EWrestling's coverage
  of Reigns' new back tattoo session, TheSportster's Reigns tattoos facts and
  trivia, the Samoa Observer, the Japanese American National Museum exhibit and
  YouTube documentary, his samoanmike.shop store, and his Instagram account.

searchMuralDescription: |
  Two massive sea creatures face each other on a flat gray wall. On the left, a
  hammerhead shark rendered in teal and black, its entire body filled with
  intricate Polynesian tatau patterns — spirals, chevrons, and layered geometric
  bands that follow the contours of its form. On the right, a sea turtle in
  black and white, its shell packed with bold angular motifs including step
  patterns and diamond shapes, with small teal accents at the flippers. The two
  animals appear to be circling each other, filling the wall from edge to edge.

