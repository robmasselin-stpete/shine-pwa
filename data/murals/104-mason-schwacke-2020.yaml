artistBio: |
  Four threatened Florida species. Tropical Storm Eta tried to wash him off the
  wall. He finished anyway.

  Mason Schwacke is a St. Petersburg-based muralist who has been painting around
  Tampa Bay for over a decade. His style sits at the intersection of street art
  and contemporary illustration — bold, illustrative, leaning hard on color and
  on characters that feel like they wandered out of a cartoon and into a
  conservation textbook. He has exhibited at the Morean Arts Center and shown
  work at Portspace Gallery in Gulfport.

  For SHINE 2020, the festival partnered with PangeaSeed Foundation's Sea Walls
  program for an ocean conservation edition. Schwacke teamed up with C.J. Thomas
  (Christian Thomas of Commitment Tattoo Shop) and developed the concept in
  consultation with NOAA. The sawfish is endangered; the other three are
  threatened. He titled the piece "Prosperitas" — for the future he hoped they
  could still have. Eta hit on Wednesday, November 11, 2020, costing him 24
  hours mid-week. He finished on time.

searchBio: |
  Mason Schwacke is a St. Petersburg, Florida-based muralist. He has been
  painting murals in the Tampa Bay area for over a decade. He has exhibited at
  the Morean Arts Center and shown work at Portspace Gallery in Gulfport. He is
  also associated with the Art Asylum creative community.

  For SHINE 2020, the festival partnered with PangeaSeed Foundation's Sea Walls
  program. Schwacke teamed up with C.J. Thomas (Christian Thomas) of Commitment
  Tattoo Shop and developed the concept in consultation with NOAA, painting four
  marine species at risk off the Florida coast: the scalloped hammerhead shark,
  oceanic whitetip shark, giant manta ray, and smalltooth sawfish. The sawfish
  is endangered; the other three are threatened. He titled the piece
  "Prosperitas."

  The wall at Hawk Diesel (1400 3rd St S) is 12 feet tall and 43 feet wide.
  Tropical Storm Eta caused a 24-hour rain delay on Wednesday, November 11,
  2020, during SHINE week.

  Instagram: @masonschwacke.

searchMuralDescription: |
  An underwater scene spanning a long wall. A giant manta ray dominates the left
  side in deep teal and navy blue with curling tentacle-like forms. At center, a
  scalloped hammerhead shark dives downward through shafts of light breaking
  through the water. A smalltooth sawfish with its distinctive elongated snout
  swims along the coral-covered bottom. An oceanic whitetip shark cruises in
  from the right. The seafloor is rendered in warm coral, red, and brown tones
  with brain coral, sea fans, and sponges. Dark navy water fills the upper
  portion with silhouettes of fish schools and rays of light. Signed
  @masonschwacke and @cthomascustoms 2020.

muralInspiration: "Painted in partnership with PangeaSeed Foundation and NOAA to highlight threatened local marine species and ocean conservation."
