artistBio: |
  The poem on the wall is not by the painters. The verse on the scroll is by
  poet Morgan Harper Nichols, whose name is signed beneath it — which is how
  this mural has often been miscredited to her.

  The octopus is the work of ArtFluent Creatives, a mural and custom-art agency
  founded by Michelle Sasha. Three of its artists signed the wall at the lower
  left, beneath the agency's name.

  NEEDS RESEARCH: this record's bio was rebuilt on 28 August 2026 after the
  mural was found to be misattributed. A full artist bio has not yet been
  written.

searchBio: |
  The octopus mural wrapping the corner of the Art Jewelry Boutique building is
  the work of ArtFluent Creatives, a mural and custom-art agency founded by
  Michelle Sasha (@michellesashacustomart). The agency describes itself as "an
  agency of talented Artists creating custom art and murals." Three artists
  signed this wall at the lower left beneath the ArtFluent Creatives name.

  The parchment scroll at the centre of the mural carries a poem by Morgan
  Harper Nichols, a poet and author with a large following, and her name is
  signed beneath the verse. That signature is the likely source of the long-
  standing misattribution of the whole mural to her; she is the author of the
  poem, not the painter of the wall.

  NEEDS RESEARCH: a full bio for ArtFluent Creatives and the individual signing
  artists has not yet been written.

searchMuralDescription: |
  An octopus mural wrapping around the corner of a small commercial building
  (Art Jewelry Boutique). The octopus tentacles are rendered in warm earth tones
  — browns, rusts, and tans — studded with colorful concentric circles in teal,
  pink, purple, yellow, and brown, like suction cups reimagined as abstract
  eyeballs. A parchment scroll at center contains a handwritten poem about inner
  beauty and strength, signed "Morgan Harper Nichols." The circles continue onto
  the sidewalk in front of the building. "Affluent Creatives" is painted at the
  base. The background is a muted sage green.

