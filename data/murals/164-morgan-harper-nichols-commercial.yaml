artistBio: |
  She started a project to write a million poems to strangers in her lifetime.
  She has two million followers on Instagram.

  Morgan Harper Nichols is a poet, author, and interdisciplinary media artist
  born in Los Angeles in 1990, raised in Georgia, now based in Athens where she
  is pursuing a PhD in Communication Studies at the University of Georgia. She
  earned a BFA in English from Point University and an MFA in Interdisciplinary
  Media Arts from Lindenwood University. In 2017 she began writing personalized
  poems for strangers who submit their stories through her website — brief
  letters of encouragement paired with visual art, sent free and shared
  anonymously.

  She has published four books with Zondervan/HarperCollins, including the Wall
  Street Journal bestseller "All Along You Were Blooming." Clients include
  Google, Apple, Adobe, Starbucks, COACH, and Hallmark. She was diagnosed with
  autism at thirty-one.

searchBio: |
  She started a project to write a million poems to strangers in her lifetime.
  She has two million followers on Instagram.

  Morgan Harper Nichols (born Morgan Novelate Harper, February 4, 1990, Los
  Angeles) is a poet, author, and interdisciplinary media artist. Her family
  moved to Georgia in 1993 where her parents started Kingdom City Church in
  Stone Mountain. Her younger sister is Christian music artist Jamie Grace. She
  was homeschooled growing up. She began attending Point University at sixteen
  and earned a BA in English. She earned an MFA in Interdisciplinary Media Arts
  from Lindenwood University (2024) and is pursuing a PhD in Communication
  Studies at the University of Georgia (began August 2024).

  In 2017 she began writing personalized poems for strangers — people submit
  stories via her website and she writes brief letters of encouragement paired
  with visual art, sent free and shared anonymously on social media. She creates
  all words and art on an iPad Pro. Her approach is collage-based, drawing from
  worldbuilding, assemblage, and remixing.

  Books include "Storyteller: 100 Poem Letters" (2017, self-published), "All
  Along You Were Blooming" (2020, Zondervan — Wall Street Journal bestseller),
  "How Far You Have Come" (2021, Zondervan), "Peace Is a Practice" (2021,
  Zondervan), and "You Are Only Just Beginning" (2023, Zondervan). She signed a
  two-book contract with Zondervan in June 2020.

  Clients include Google, Meta, Apple, Adobe, Starbucks, KIND Snacks, COACH,
  Paul Mitchell, Skillshare, Hallmark, Instagram, Aerie, and Vogue Singapore.
  Products found at Target, Barnes & Noble, and Anthropologie. She is Vice
  President of the Board of Directors for TWLOHA (To Write Love on Her Arms).
  She founded Garden24, an e-commerce platform and physical shop in Phoenix. She
  launched the "Storyteller by MHN" app (2019) and "The Morgan Harper Nichols
  Show" podcast (2019).

  She was diagnosed with autism at thirty-one along with ADHD and sensory
  processing disorder. She married Patrick Kekoa Nichols on October 17, 2010.
  They have a son, Jacob.

  Instagram: @morganharpernichols (approximately 2 million followers). Website:
  morganharpernichols.com. Shop: garden24.co.

searchMuralDescription: |
  An octopus mural wrapping around the corner of a small commercial building
  (Art Jewelry Boutique). The octopus tentacles are rendered in warm earth tones
  — browns, rusts, and tans — studded with colorful concentric circles in teal,
  pink, purple, yellow, and brown, like suction cups reimagined as abstract
  eyeballs. A parchment scroll at center contains a handwritten poem about inner
  beauty and strength, signed "Morgan Harper Nichols." The circles continue onto
  the sidewalk in front of the building. "Affluent Creatives" is painted at the
  base. The background is a muted sage green.

