artistBio: |
  He has been called the "Australian Banksy." He considers it lazy journalism.

  Fintan Magee was born in 1985 in Lismore, New South Wales. His father, from
  Derry, Northern Ireland, is a sculptor. His mother, English-born, is an
  architect. He grew up around the political murals of the Irish tradition —
  they stayed with him. He earned his BFA from the Queensland College of Art at
  Griffith University in 2009 and started painting full-time the day he
  graduated. He was already active as a graffiti writer before university.

  His style is social realist — large-scale photorealistic figures on buildings
  in isolated or abandoned urban locations, integrated with their surroundings.
  Climate change, endangered species, migration, refugee crises, loss,
  consumption. In Amman, Jordan, he painted "The Exile" — a refugee camp girl.
  In Bali, "Plastic Tiger" — endangered species and colonialism's environmental
  toll. In Berlin-Tegel, a 41.5-meter wall for Urban Nation's "One Wall"
  project. He has painted in over twenty countries.

  His recent work experiments with a "beveled glass technique" — subjects appear
  out of focus, glass breaking and deconstructing images as allegory for memory
  and lost time. He is represented by Thinkspace Projects in Los Angeles.

  For SHINE's 10th anniversary in 2024 — postponed by Hurricanes Helene and
  Milton — he painted a multi-story mural on the Reflection St. Pete building at
  777 3rd Ave North.

searchBio: |
  He has been called the "Australian Banksy." He considers it lazy journalism.

  Fintan Magee was born in 1985 in Lismore, New South Wales, and grew up in
  Brisbane, where graffiti and train bombing were heavily common in the local
  scene. His father is from Derry, Northern Ireland, a sculptor; his mother is
  English-born, an architect. His maternal grandfather, originally from
  Woollahra in Sydney, ran an architectural practice in Ghana, West Africa.
  Magee attended Brisbane State High School, became active as a graffiti writer
  in Brisbane before university, and earned his Bachelor of Fine Arts at the
  Queensland College of Art (QCA), Griffith University, in 2009. He began
  painting full-time the year he graduated, and now lives and works in Sydney.

  His practice is informed by a profound interest in political murals — Northern
  Irish in particular, by way of his father — and the socialist character of his
  public work draws on that tradition. He has described the work as combining
  journalistic elements with public art, and is driven by what he sees as the
  power of murals to communicate political and social viewpoints and to divide
  or unite communities. Recurring themes include diversity, migration and
  transition, waste and consumption, loss, climate change, and the environment.
  His large-scale figurative paintings are deeply integrated with the urban
  environment and exhibit an inherent sentimentality and softness, influenced in
  part by children's books and the Lowbrow art movement.

  Notable mural projects include "The Exile" in Amman, Jordan (2017), portraying
  a young girl from a local refugee camp looking toward better days; "Plastic
  Tiger" in Bali, Indonesia (2017), based on a European realist painting and
  drawing a line between the role of colonialism in damaging the environment and
  the modern tourism industry; the 41.5-meter "One Wall" mural at Neheimer
  Straße 2 in Berlin-Tegel for the Urban Nation Museum for Urban Contemporary
  Art (2015); a contribution to the open-air Djerbahood street-art museum in
  Tunisia (Mehdi Ben Cheikh, Albin Michel, 2015); and his early national
  breakthrough — a mural depicting Felix Baumgartner in Brisbane (2012). He
  participated in Toowoomba's "First Coat" program. His work appears in over
  twenty countries: in addition to Australia, completed projects span New
  Zealand, India, Indonesia, the United Kingdom, France, Italy, Portugal,
  Germany, Denmark, Norway, Sweden, Finland, the Netherlands, Austria, Ukraine,
  Russia, Turkey, the United States, Colombia, Argentina, Belarus, Spain, and
  Tahiti, with specific city walls in London, Vienna, Los Angeles, Miami,
  Atlanta, Buenos Aires, Copenhagen, Kyiv, Rome, and Dublin.

  He is represented by Thinkspace Projects at 4217 W. Jefferson Blvd., Los
  Angeles, CA 90016. Solo exhibitions with Thinkspace and other galleries
  include "Big Dry" at Thinkspace in Los Angeles (2018), "Waves" at Mathgoth
  Gallery in Paris (2017), "Water World" at Backwoods Gallery in Melbourne
  (2016), and a 2015 Backwoods solo themed around his personal experience of the
  2011 Brisbane floods. Painting works shown through Thinkspace include "The
  Lunchbreak" (2016), "Waiting Game" (2017, exhibited at SCOPE Basel and Moniker
  Art Fair London), "The Late Afternoon" (2018), "The Firestarter 1" and "The
  Firestarter 2" (2018), "The Waiting Place" (2018), "The Soloist 1" and "The
  Soloist 2" (2018), "Day Labourers" (2018, oil on white picket fence), "Haitian
  Workers" (2018, oil on white picket fence), "The Audience" (2018), "The
  Impossible Jump" (2018), "Head In The Sand" (2018), and "Exit Strategy Study
  I" (2019, included in the 15 Years of Thinkspace show). He was featured at the
  Long Beach Museum of Art in 2018.

  Press and publication credits include the Sydney Morning Herald, Juxtapoz
  Magazine, ABC News, The Australian, The Daily Telegraph (Sydney), the Brisbane
  Times, News.com.au, artnet News, Wikipedia, the Urban Contemporary Art Guide
  (2014 and 2015), Street Art Australia by Lou Chamberlain, Graffiti Art
  Magazine (France), Home & Design: Trends Magazine, Surface by Soren Solker
  (Denmark), World Sculpture News, Stuart Magazine, U Magazine, and Artmapp.

  For the SHINE Mural Festival's 10th anniversary edition in 2024 — postponed
  from October to November in the wake of Hurricane Milton — Magee painted a
  multi-story mural on the Reflection St. Pete apartment complex at 777 3rd
  Avenue North, beside Mirror Lake. Reflection St. Pete was the festival's
  corporate sponsor that year, contributing $50,000 of approximately one-fifth
  of the event's annual budget. SHINE director Jenee Priebe oversaw the
  rescheduled festival, which produced fifteen new murals overall and included a
  14-story Walker Whitney Plaza wall by Canadian muralist Emmanuel Jarus
  alongside Magee's piece.

  Website: fintanmagee.com. Instagram: @fintan_magee. Facebook: fintanmageeart.

searchMuralDescription: |
  A four-story mural in shades of blue and teal covers the face of the
  Reflection St. Pete building. The scene depicts objects and a figure submerged
  underwater — a glass perfume-style bottle, crystalline formations, and a
  pineapple float in rippling blue water. The photorealistic rendering captures
  light refracting through the water surface above. The building's "REFLECTION"
  signage sits just below the mural's lower edge.

