artistBio: |
  One of them co-founded SHINE. The other painted a wall in its first year.
  Both names are signed on this one: "Pale Horse" stacked over "BASK."

  Chris Parks — Palehorse — earned a BA in Graphic and Interactive
  Communication from Ringling College of Art and Design. His intricate
  illustration draws on Eastern mysticism, sacred iconography and global
  mythologies, and his practice is rooted in Kriya Yoga. He has designed gig
  posters for Foo Fighters, Queens of the Stone Age, Iggy Pop and Jimi Hendrix,
  and co-founded SHINE with his wife Michelle in 2015.

  Ales Bask Hostomsky — BASK, for "Because Art Should Kill" — fled communist
  Czechoslovakia as a child and grew up in Florida. He is self-taught. His work
  explores the parallels between state propaganda and American consumerism, in
  mixed media with rich textures. His art appeared in Iron Man 3, and he
  painted for SHINE in 2015 and 2020.

  The striped fur, the flower crown and the stepped zigzag behind it all meet
  in one face, on a lime-green wall off the 600 block alley.

searchBio: |
  See Palehorse entries (ids 117, 121) and BASK entries (ids 134, 209) for the
  full search bios.

  Chris Parks works as Palehorse (also styled Pale Horse) and is based in St.
  Petersburg, Florida. Ringling College of Art and Design graduate (BA, Graphic
  and Interactive Communication); co-founder, with his wife Michelle, of the
  SHINE Mural Festival in 2015. Gig posters for Foo Fighters, Queens of the
  Stone Age, Iggy Pop and Jimi Hendrix; shown at the Dali Museum; co-created the
  FloridaRAMA immersive art experience. Instagram @palehorse.

  Ales Bask Hostomsky works as BASK — "Because Art Should Kill." Born in
  Czechoslovakia, he fled the communist state as a child and grew up in Florida.
  Self-taught; mixed media on wood and canvas; "anti-iconic" imagery that
  deconstructs media. His work appeared in Iron Man 3 and has been shown at the
  Florida International Museum; Jacksonville Museum of Modern Art permanent
  collection. SHINE 2015 and 2020. Instagram @knownasbask.

searchMuralDescription: |
  A large beast's face, gorilla-like, fills a lime-green cinder-block wall. A
  pink flower with a single eye at its centre sits on its head like a crown,
  among braided pink, pale-blue and lime leaves. Its fur, mane and beard are
  drawn in flowing stripes of pale blue, pink, lilac and lime outlined in black
  and white; its pale eyes sit under heavy pink brows. Behind it, black panels
  carry stepped zigzag bands striped in pink, blue, lilac and lime that read as
  3D blocks. Pink and black splashes run across the green wall on the left,
  where "Pale Horse" and "BASK" are signed one above the other. A small sticker
  sits on the zigzag pattern at right, and a drainpipe crosses the top of the
  face. The wall faces east onto a sand-and-gravel lot.

