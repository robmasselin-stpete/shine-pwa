searchMuralDescription: |
  A low, pink-painted block wall along the sidewalk, still being painted. A
  pencil grid of letters and numbers runs along the top and left edge. Two dark
  brown long-necked water birds, anhinga-like, are finished: one on the left
  with its wings spread to dry, one on the right perched upright. Both stand on
  brown branching roots or limbs that loop along the bottom of the wall. The
  rest is still outline sketch: a large face in the middle, a big cat
  resting on a branch near the top, a smoke-like curl, and a bear with a cub on
  the right, plus pink marker underdrawing of plants. The white Green Bench
  silo rises behind the wall.

