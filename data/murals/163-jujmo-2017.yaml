artistBio: |
  She grew up as a military kid moving between bases overseas with limited
  access to cartoons. When she finally got to watch anime in the U.S., she
  decided to become an artist.

  Cheryl Weber — Jujmo — is a Filipina American artist based in Tampa. She
  earned her BFA from the University of South Florida and started freelancing
  immediately after graduation. Her style is colorful and playful — saturated
  colors, no straight lines, happy intertwined worlds of strange creatures
  influenced by anime, Japanese folklore, and Filipino folklore. She paints on
  walls, helmets, shoes, tote bags, and cars.

  She has ten-plus years of mural experience and painted the "B" in the Black
  Lives Matter street mural in front of the Dr. Carter G. Woodson Museum for
  Juneteenth 2020. She gave a lecture at the Imagine Museum in 2024 and was
  featured on WEDU Arts Plus (PBS). Her work is her true love: "I want it to be
  your time to shine, just as much as mine."

searchBio: |
  She grew up as a military kid moving between bases overseas with limited
  access to cartoons. When she finally got to watch anime in the U.S., she
  decided to become an artist.

  Cheryl Weber — Jujmo (pronounced "jooj-moe") — is a Filipina American artist
  based in Tampa, FL. She earned her BFA from the University of South Florida
  (approximately 2013) and began freelancing immediately via email, Instagram,
  and Facebook. Her style is colorful and playful with saturated colors and
  heavy influence from anime, Japanese folklore, and Filipino folklore. She is
  characterized by bright colors and the absence of straight lines — happy
  intertwined worlds of fanciful creatures. She paints on walls, helmets, shoes,
  tote bags, and cars.

  SHINE credits: 2017 ("Aquatic Forest," 1701 1st Ave S — 48 feet wide by 14
  feet high) and 2021 (A-1 Recovery, 2221 5th Ave S, plus a week-long mural
  education course for the Shirley Proctor Puller Foundation). She painted the
  "B" in the Black Lives Matter street mural in front of the Dr. Carter G.
  Woodson African American Museum for Juneteenth 2020. Other murals include
  Black Radish Grocery and Love Food Central in St. Petersburg.

  She gave a lecture at the Imagine Museum Artist Lecture Series (September
  2024) and was featured on WEDU Arts Plus (PBS, Season 14 Episode 8). She
  launched a free Instagram livestream drawing show during COVID-19. She created
  a limited-edition design for WEDU PBS supporters.

  Instagram: @jujmo. Website: jujmo.com.

searchMuralDescription: |
  A wide panoramic mural covering a commercial wall, filled edge to edge with
  colorful abstract blob creatures and organic shapes. The palette spans soft
  pinks, greens, teals, yellows, purples, and deep blues. Playful characters
  with simple dot eyes and small mouths peek out from amorphous cloud-like
  forms. Some shapes resemble mushrooms, coral, or amoebas. The composition
  flows like an underwater garden or alien landscape — dense, layered, and
  cheerful. Trees frame the mural on both sides.

