artistBio: |
  The Happy Mural Project's first wall came with a sign: "Honk if You're Happy." It went up the week the world shut down.

  Alyssa Marie started The Happy Mural Project in 2020 and leads it. She is a fine artist from Colorado who moved to St. Petersburg in 2017 and ran a gallery on Beach Drive from 2018 to January 2020. She launched the project with Braden Everly, who brought house-painting experience, with a sunflower wall at Lolita's Catering in early March 2020, days before lockdown.

  The project's signature is oversized sunflower murals in vibrant color, plus
  community-participatory "color by number" walls. Its SHINE 2020 piece "Hands of Change" at the City Theatre featured hands holding sunflowers representing
  racial and cultural diversity. For SHINE 2023, "Girl Power" was a
  color-by-number mural completed by Girl Scouts of West Central Florida. SHINE 2026 is Alyssa Marie's fourth festival, after 2020, 2022 and 2023.

searchBio: |
  The Happy Mural Project's first wall came with a sign: "Honk if You're Happy." It went up the week the world shut down. Alyssa Marie started The Happy Mural Project in 2020 and leads it; she launched it with Braden Everly. She is a fine artist from Colorado who moved to St. Petersburg in 2017. In 2018 she opened the
  Alyssa Marie Gallery on Beach Drive NE in downtown St. Petersburg, where she
  exhibited her own work. The gallery closed in January 2020, and she shifted to
  selling her paintings of local and nature scenes through her website.  The combination of Alyssa's
  fine-art background and Braden's experience with paint, ladders, and
  scaffolding became The Happy Mural Project.

  Their first mural went up at Lolita's Catering + Events at the corner of 5th
  Avenue North and 28th Street, address 2735 5th Ave N, in early March 2020,
  days before the COVID-19 lockdown. The original plan had been to hand out
  sunflowers to passersby at the launch. After social distancing rules took
  effect, they propped up a sign reading "Honk if You're Happy" instead, asking
  drivers to honk as they passed. The first wall sits in the shadow of St.
  Petersburg High School and drew coverage from Sean Daly at ABC Action News. Maggie
  Duffy at the Tampa Bay Times later covered their paint-by-numbers community
  work in a June 8, 2023 story.

  The project's signature work is oversized sunflower murals in vibrant color, plus
  community-participatory "color by number" walls where volunteers fill in
  numbered shapes. Its SHINE 2020 piece, "Hands of Change," went up at the St.
  Petersburg City Theatre at 4025 31st Street South. Volunteers painted hands
  holding giant sunflowers from October 31 through November 6, 2020, as an early
  start to the SHINE Mural Festival. The hands represented different races,
  colors, national origins, and sexual orientations as a symbol of love,
  connectedness, and growth. The City Theatre, a volunteer-driven theater that
  celebrated its 100th birthday in 2021, hosted the wall during a season that
  included Broadway By Request and A Christmas Carol.

  For SHINE 2022 they painted a community mural at St. Peters Bark! at 3001
  Central Avenue in St. Petersburg. For SHINE 2023, "Girl Power" was a
  color-by-number mural completed by Girl Scouts of West Central Florida at 2727
  6th Avenue South. SHINE 2026 is her fourth festival, after walls in 2020, 2022 and 2023.

  Beyond the SHINE festival, the project has a growing list of locations. They
  painted a community mural at Pro Karting Experience at 4770 34th Street North
  in St. Petersburg, featured in the 2023 Tampa Bay Times piece by Maggie Duffy.
  They have walls at Tampa General Hospital, including the peace garden at 1
  Tampa General Circle in Tampa, and at the Tampa General Hospital Food Pantry.
  They painted a community mural at Winthrop Charter School at 6204 Scholars
  Hill Lane in Riverview, and at Salon Eunoia at 4218 Henderson Boulevard in
  Tampa. Other locations include a wall in Fossil Park visible from Fire Station 7, a residence at 4897 Lake
  Charles Drive North in Kenneth City, The 490 Building at 490 1st Avenue South
  in St. Petersburg, and a private residence backyard in Tampa. They reached
  beyond Florida for a community mural at the Artesia Arts Council in Artesia,
  New Mexico, at 310 W Main Street, where school children, families, and people
  getting off work stopped by across a week to paint every detail except the
  logo.

  The mission, as stated by the artists, is to inspire and uplift people and
  communities through supersized, vibrantly colored sunflower murals. Braden Everly said in 2020 that happiness is needed right now, as always, and that people have flocked to their walls; he said Alyssa believes anyone can do art, and that they wanted to bring the community together in an activity where everyone could help beautify
  the city. Volunteer painters do not need experience, and supplies are
  provided. A Volunteer Artist sign-up form and a Submit Your Wall form live on
  their website at thehappymuralproject.com. Their Instagram is
  @thehappymuralproject. Alyssa Marie posts as @alyssa.marie.of.the.sea. Creative Pinellas
  covered the project in an October 26, 2020 piece by Shae Vehorn tied to the
  Hands of Change wall and the SHINE Mural Festival rollout.

searchMuralDescription: |
  A vibrant community paint-by-number mural created in partnership with Girl
  Scouts of West Central Florida. A young girl in a blue shirt stands
  face-to-face with a dappled gray horse, surrounded by giant golden sunflowers
  against a teal background. The Happy Mural Project logo is signed in the lower
  right corner.

