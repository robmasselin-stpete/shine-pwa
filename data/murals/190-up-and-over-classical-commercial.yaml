artistBio: |
  Up & Over is a St. Petersburg mural collective that includes the Vitale
  Brothers. Their work ranges from photorealistic portraits to bold graphic
  compositions mixing classical imagery with contemporary street art techniques.

searchBio: ""

searchMuralDescription: |
  A striking two-story mural on a commercial building. A massive classical
  sculpture face — reminiscent of Michelangelo's Moses or a Greek god — rendered
  in photorealistic grayscale dominates the upper portion, looking downward with
  an intense expression and flowing beard. One enormous hand reaches forward
  gripping a small branch with a figure. The composition is split between the
  photorealistic figure and bold pop-art graphic elements — halftone dot
  patterns in black, white, and blue, geometric orange and gold shapes, swirling
  wave patterns, and tiger-stripe accents. Signed "Vitale Broz" at lower right.
  Address 2214 visible on the building.

