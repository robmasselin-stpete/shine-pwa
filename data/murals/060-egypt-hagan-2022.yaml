artistBio: |
  She uses portraiture as storytelling — bold, vibrant colors carrying cultural
  imagery and narratives that go untold elsewhere.

  Egypt Hagan is originally from Los Angeles, now based in Tampa. Her first solo
  exhibition was in New York in 2014. She has done international commissions and
  community work, including "The Silent Symphony" — a mural commissioned by
  Burlington City Arts and Vermont's Office of Racial Equity for Juneteenth
  2021. For SHINE 2022, she painted at 299 Dr. MLK Jr. Street North.

searchBio: |
  She uses portraiture as storytelling — bold, vibrant colors carrying cultural
  imagery and narratives that go untold elsewhere. Egypt Hagan, who works as
  Graffiti Egypt, was born in Los Angeles. She moved to New York, where she held
  her first solo exhibition in 2014. She later relocated to Tampa, Florida, and
  per her own website is now based in Arizona, continuing to expand her practice
  through large-scale mural projects, public commissions, and international
  exhibitions.

  She is self-taught. As a child she was shy and used art as her main source of
  expression, drawing every day in class and sketching designs on her homework.
  She started painting on canvases in 2011, and her work became influenced by
  society, culture, and historical figures. Before painting full time she worked
  jobs at a library, an airport, warehouses, and in security. Seven years after
  she committed to art as her career, she had moved into full-time work as an
  artist and muralist. By March 2022 she was 31 years old.

  Her street art is known for vibrant colors, shapes, and cultural images. Her
  palette runs to pinks, luminous golds, and combined patterns, and her imagery
  draws on African fashions and on iconic figures including Nina Simone, Prince,
  Muhammad Ali, James Baldwin, Sade, and Notorious B.I.G. Her work is inspired
  by Afro Caribbean and African folklore, nature, and sci-fi, with a focus on
  storytelling — a tradition she describes as passed down for generations in her
  family, dating back to ancient Africa. A recent focus has been African tribes,
  with portraits intended to shed light on tribes that still exist and practice
  their traditions today.

  For SHINE 2022 in St. Petersburg she painted at 299 Dr. MLK Jr. Street North.

  In Vermont she painted "The Silent Symphony" for Juneteenth 2021, commissioned
  by Burlington City Arts and the Office of Racial Equity, Inclusion and
  Belonging. The mural depicts young tribal women and a man wearing traditional
  African wardrobes, standing together to convey the significance of Juneteenth
  — the story of strong African people who have endured and now stand tall and
  fearless. BCA Center is at 135 Church Street, Burlington, Vermont 05401.

  In Pembroke Pines, Florida, she was commissioned by the city to create "The
  Valiant Four: A Tribute to Black History," a four-sided interactive mural of
  Black leaders. Residents engaged with the artist on site at the Charles F.
  Dodge City Center, 601 City Center Way, layering vibrant colors as the
  background with brushes and rollers. Guests watched the mural come to life
  during a special edition of the Jazz in the Pines concert at the Charles F.
  Dodge City Center plaza in February 2022.

  Her projects have been displayed in Canada, Chicago, New York, Colorado, Los
  Angeles, Wisconsin, Miami, and at The W Hotel in Fort Lauderdale. She has made
  Florida her permanent home and has spoken about the difference between the
  Hispanic-influenced art scene of California, close to Mexico, and the Cuban
  and Jamaican cultural influences she finds in Florida.

  She has also worked in product design. Spin Master Games featured three of her
  portraits in its "Spotlight" jigsaw puzzle series, sold exclusively at Target
  for under ten dollars. The 500-piece puzzles feature portraits of people from
  diverse African tribes and focus on the subject's individualism. The jigsaw
  art was reworked from her original paintings using lively colors, radiant
  gold, and fearless portraiture. One of the puzzle portraits is titled
  "Morning." Spin Master Games found her through social media. The Spotlight
  Series is described as a platform for underrepresented voices to celebrate
  their diversity and share their stories.

  Her own statement on her practice: "We as humans bare a unique story. I enjoy
  creating these stories not with the use of words, but bold images and an
  underlying vibrancy that emphasizes the main subject. My paintings consist of
  people or moments I've come across that have inspired my journey here on
  Earth, untold stories that deserve to be heard." On her message: "My main
  message is to tell a story through each individual. About it's OK being 100%
  your authentic self. Topics and subjects may change, but it's a distinctive
  style where people know who it is and where it comes from." On her sources:
  "I'm inspired by meeting everyday people and life. It might be someone with a
  crazy hairstyle or the way they dress influence a lot of my portraits within
  my artwork along with dating back to various African tribes and diving deep
  into other cultures."

  She has been profiled by the Sun-Sentinel (Nile Fortner, March 18, 2022) and
  PRINT Magazine (Chloe Gordon, February 24, 2022), where she was described as
  an emerging Black artist using rich colors and bold images to tell beautiful
  and emotional stories. In March 2022 she held a solo exhibit in her hometown
  of Los Angeles.

  Website: graffitiegypt.com.

searchMuralDescription: |
  Two faces in profile fill the multi-story wall of the George F. Young
  building, surrounded by roses and soft washes of warm color. The portraits are
  rendered with expressive, painterly brushwork — detailed enough to read as
  specific individuals but loose enough to feel like fine art rather than
  photorealism. Roses and floral elements weave around and between the two
  figures.

