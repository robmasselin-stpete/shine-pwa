artistBio: |
  He started by painting portraits on freight trains in Saskatchewan. They went
  viral on the internet before he ever had a gallery show.

  Emmanuel Jarus was born around 1992 in Regina, Saskatchewan. His grandmother,
  a watercolor painter, introduced him to art at four or five. He started
  graffiti around fourteen, left high school early, studied briefly at the
  Academy of Realist Art in Toronto, and is otherwise self-taught. He credits
  his grandmother, graffiti culture, and his mentor Kwest for his work ethic.

  His style is post-Impressionist applied to massive walls — figurative
  portraits of people he meets in his travels, painted with basic hardware-store
  supplies: bucket paint, brushes, rollers, sometimes brooms. "I observe life,
  characters and paint people I meet," he says. "Each painting is a unique
  avatar for a city, a mood, memory or mostly a person."

  He painted the United Nations 75th anniversary mural in Manhattan. A 17-story
  building in Boulogne-sur-Mer, France. A collaboration with Francisco Bosoletti
  for Urban Nation's "One Wall" project in Berlin. A glow-in-the-dark mural for
  Tourism Toronto. Festivals across Canada, the US, and Europe.

  For SHINE 2024, he painted the Walker-Whitney building at 226 5th Ave North —
  14 stories, roughly 180 by 60 feet. The largest mural in SHINE's ten-year
  history.

searchBio: |
  He started by painting portraits on freight trains in Saskatchewan. They went
  viral on the internet before he ever had a gallery show.

  Emmanuel Jarus was born in 1992 in Regina, Saskatchewan, Canada. His
  grandmother, a watercolor painter, introduced him to art at four or five years
  old. He started graffiti around age fourteen, left high school early, and
  studied briefly at the Academy of Realist Art in Toronto. He is otherwise
  self-taught and credits his grandmother, graffiti culture, and his mentor
  Kwest, along with influences from realist masters and resources found on the
  internet, for his work ethic and approach. Jenee Priebe, Director of the SHINE
  Mural Festival, has said Jarus was first discovered because of graffiti art he
  created on the side of a train at age 19. He is based in Toronto and works
  internationally.

  His style sits in the post-Impressionist tradition applied to massive walls —
  figurative portraits and figures of people he meets in his travels, painted
  with basic hardware-store supplies including bucket paint, brushes, rollers,
  and at times brooms dipped in paint. He combines acrylic, latex, and aerosol
  paint, and has been described as using classical oil-paint technique while
  working with spray paint. His focus is on color and the environment in which
  the figure sits. As he puts it, "I observe life, characters and paint people I
  meet. Each painting is a unique avatar for a city, a mood, memory or mostly a
  person." His narrative approach communicates a story of individual spirit
  relevant to the metabolism of the particular neighborhood where the wall sits.

  Major projects include the United Nations 75th anniversary mural in Manhattan,
  painted with Street Art for Mankind as part of the #UN75Murals series and tied
  to the Zero Hunger campaign. He painted a 17-story building in
  Boulogne-sur-Mer, France for the Festival Street Art de la ville de
  Boulogne-sur-Mer in 2022, depicting a fair-skinned woman in black — the same
  enigmatic figure he later returned to on the Walker-Whitney Plaza wall in St.
  Petersburg. In 2018 he collaborated with Argentine artist Francisco Bosoletti
  on Urban Nation's Epic ONE WALL Crossover project in Berlin, where Jarus
  painted Apollo from Greek mythology and Bosoletti painted a portrait of Daphne
  in negative light. He has painted a glow-in-the-dark mural for Tourism
  Toronto. His "Zion" mural pays tribute to the Toronto graffiti and mural
  community organizer who founded The Bomb Shelter as a meeting space and fought
  to legitimize graffiti when the City of Toronto moved to cover it. He is part
  of the BUMP Festival roster in Calgary, with a wall at 602 11th Avenue SW.

  He works with Street Art for Mankind, the nonprofit that uses public art to
  advance human rights and fight child trafficking, whose mural campaigns
  include Seattle World Cup 26, Los Angeles LA28 & Bigger Dreams, New York
  Climate Action, New York ILO100, New York Free Children, New York NRNY,
  Houston Big Art Bigger Change, Houston Legacies of Change, Houston World Cup
  26, Houston I Choose to Rise, Houston John Biggers, Detroit Be the Change, USA
  Zero Hunger, France Impressionist Land, World Ecosystem Restoration, and World
  Generation Equality. He is also represented by LALAContemporary, where his
  work has appeared alongside artists including Maria Hupfield, Patricia
  Linenberg, Vivian Galban, Sofia Medici, Liliana Golubinsky, Camila Salcedo,
  Marcolina Dipierro, Ana Casal, Paulo Nazareth, Gabriel Chaile, Mariel
  Belanger, Aner Urra, Julia C. Parodi, Mark Bland, Claire Dunn, Carolina
  Quesada, Aaron Nachtailer, Débora Staiff, and Ximena Berecochea. His mural
  work is found in major cities and rural settings across Canada, the United
  States, Mexico, and Europe. URBAN NATION's museum profile lists him under the
  name Young Jarus.

  For SHINE 2024, he was assigned the west-facing wall of the Walker-Whitney
  Plaza building at 226 5th Avenue North in St. Petersburg — 14 stories,
  approximately 180 feet tall and 60 feet wide. A board committee representing
  the Walker-Whitney building selected him after deliberating over numerous
  candidates. The mural is the largest in the SHINE festival's ten-year history.
  He used acrylic, brush on a roller, and at times a broom dipped in paint, and
  worked on a tight 20-day schedule before he had to be in Hawaii for another
  commitment. He laid down the painting grid and general sketch just before
  evacuating ahead of Hurricane Milton; the building and his sketch survived the
  storm, and he returned to finish the mural in time for the rescheduled SHINE
  festival on November 8 – 17, 2024. The figure is the same fair-skinned woman
  in black he had painted in Boulogne-sur-Mer in 2022; her identity is not
  disclosed. The festival was directed by Jenee Priebe, with Reflection St. Pete
  as corporate sponsor for the year. SHINE has produced more than 160 public
  artworks over a decade.

  Coverage includes Aaron Styza for I Love the Burg (November 5, 2024) and Bill
  DeYoung for the St. Pete Catalyst (November 18, 2024). Website: jarus.ca.
  Instagram: @youngjarus (also listed under "Young Jarus" on URBAN NATION's
  museum profile).

searchMuralDescription: |
  A 14-story photorealistic portrait of an enigmatic woman in flowing black
  garments spanning the entire west-facing wall of the Walker-Whitney building —
  the largest mural in SHINE's 10-year history at roughly 180 feet tall by 60
  feet wide. The woman has long brown hair and one hand resting on her chest,
  gazing out with a serene, mysterious expression against a muted gray-teal
  background. Jarus intentionally keeps her identity a secret. The figure is a
  recurring subject he first painted on a seaside structure in Boulogne-sur-Mer,
  France. Painted with brushes, rollers, and bucket paint over 20 days —
  interrupted by Hurricane Milton's evacuation — in time for SHINE's 10th
  anniversary festival in November 2024.

