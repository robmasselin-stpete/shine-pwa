artistBio: |
  He did a residency at Red Bull House of Art in Detroit. His work has been
  featured in Forbes and Juxtapoz.

  Michael Reeder was born in 1982 in Dallas and earned his BFA in Painting from
  the School of Visual Arts in New York in 2007. His figurative work mixes
  realism with flat graphic space — vibrant colors, geometric patterns, lifelike
  imagery exploring identity, ambiguity, ego, and mortality. Skate and street
  culture run through everything.

  He is represented by Allouche Gallery (LA and NY), Hashimoto Contemporary
  (SF), and Thinkspace Gallery. He has shown at the Fort Wayne Museum of Art,
  Long Beach Museum of Art, Mesa Contemporary Arts Museum, and internationally
  in London, Basel, Melbourne, and Honolulu. For SHINE 2016, he painted in St.
  Petersburg.

searchBio: |
  He did a residency at Red Bull House of Art in Detroit. His work has been
  featured in Forbes and Juxtapoz.

  Michael Reeder is an Urban Contemporary artist from Dallas, Texas, born in
  1982. He graduated with a BFA in Painting from the School of Visual Arts in
  New York. Alongside his exhibiting practice he works as a freelance graphic
  artist and at Eyecon Studios, a custom mural and design company based in
  Dallas. His extensive studies in fine art, combined with his background in
  graphic design and early exposure to graffiti, define the style he is known
  for: a fusion of vibrant colors, geometric patterns, and lifelike figurative
  imagery exploring identity, ambiguity, ego, and mortality. The work frequently
  expands beyond gallery confines onto expansive exterior walls.

  Reeder's working method is built around ambiguity. He repeatedly works from
  the limited reference of a single person whom he himself does not know,
  constructing a fresh identity with each painting. The protagonists live in a
  kind of limbo, their identities seemingly within reach — strengthened by
  clean, voidlike geometric backdrops — yet personalities remain blurry and
  distant, as if a key component is missing. Critic Matthew Eaton of Uncommon
  Editions wrote in 2017 that Reeder's figures look as if they "had their skin
  carefully removed, their wardrobe replaced by graphic designers and thrust
  into the living world of Monty Python," settling into a calm, slightly amusing
  harmony.

  He is represented by Thinkspace Projects (4217 W. Jefferson Blvd, Los Angeles,
  California). Documented Thinkspace shows include "The Otherealm" (2019, Main
  Room) — works "The Wizard," "Shapeshifter," "Dead Again," "Doomsayer," "Mortal
  Man," "Blockhead," "Vigilante Manny," "The Prophet," "The Outsider,"
  "Transcendental Stencil," the "Screen Glitch I–III" prints, and the tinted
  concrete series "Black Skull I–V" and "Spectrum I–VIII." Earlier "mOMENt"
  (2018, Project Room) — "False Guru," "Epiphany I," "Split II," "Space Bandit,"
  "Flashback," "Don Juan Matus," "Reverie I," and "Sacred Journey." "15 Years of
  Thinkspace" featured "BFF" (2019); the inaugural group show at Thinkspace's
  new gallery space featured "Hype Sniper" (2020); the "SWANK" show featured
  "Gold Digger," "Gasp," "Supreme Being," "The Moment It All Made Sense," and
  "Gimme The Loot."

  Other documented exhibitions: "Crusader" (2016) at Nexus, Brand Library & Art
  Center; "The Upside Down" (2016) at LAX / ORD, a curated show at Vertical
  Gallery in Chicago; "Release The Introvert" (2016) at SCOPE Miami; "Gold
  Digger" also shown at "Flourish" at the Mesa Contemporary Arts Museum (Mesa,
  AZ). SCOPE Miami Beach 2017 included "Made In The Image Of God," "For You My
  Love," "Self," "Soul," "Spirit," "Elevated," "Split I," and "Ride or Die."
  SCOPE Basel (Booth B03) included "Lord of the Land In Between," "Pushing Up
  Daisies," and "Temporal Spaced" (2017). "The New Vanguard II" at the Lancaster
  MOAH featured "Gestalt Dreams" (2017). "CONVERGENCE" at the University of
  Texas featured "Lord Commander" and "Bodhi One" (2019). POW! WOW! Hawai'i 2019
  featured "Sweet Delight (Endless Night)." "UNITY" at Volery Gallery in Dubai,
  UAE featured "No Dice" (2022). SCOPE Miami Beach 2025 included "Levitation IV"
  and "Vigilante III"; "Vigilante III" also showed at the Stand Strong Urban Art
  Fair at the Brand Library and Art Center in Glendale, California.

  His materials extend across acrylic, oil, spray paint, screen print, latex,
  tinted concrete, faux turf, laser-cut steel, hand-cut wood assemblage, and
  recycled studio wood, on multilayered panel and cradled wood. His work has
  been featured in printed publications including New American Paintings, Le
  Petit Voyeur, and HiFructose Magazine. Brand collaborations include Santa Cruz
  Skateboards, New Balance, and Specialized Bicycles.

  For SHINE Mural Festival 2016 in St. Petersburg, Florida, he extended his
  exterior wall practice to the festival — a regular thread in his career, where
  the work frequently moves from gallery walls onto large outdoor surfaces.

  Website: reederone.com (also michael-reeder.com per the Thinkspace artist
  listing).

searchMuralDescription: |
  A mural on the north side of the FRSTeam by Rogers building, facing the alley
  between 1st Avenue South and Central Avenue. The left half of the wall is
  covered in a repeating three-dimensional cube pattern in pink, teal, and gold
  on a salmon-pink background — an optical illusion that appears to project
  outward from the wall. The pattern extends over a roll-up garage door. On the
  right, a photorealistic greyscale human skull emerges from behind the cubes,
  its jaw and cranium rendered in precise detail. To the far right, a fragment
  of a living face — just the nose, eyes, and brow — peeks from behind the skull
  in warm flesh tones. The composition moves left to right from abstraction to
  death to life, illustrating the title's idea of what exists beneath outward
  appearances.

