artistBio: |
  She used VR to plan the composition before a single can of paint was opened.
  Then she handed the wall to the community.

  Sara Salem is originally from Egypt, now based in St. Petersburg. She holds a
  BFA (2011), a 200-hour yoga teacher certification, Reiki Level II, and an art
  therapy certification. She co-founded Phi Phi Artland with her husband Fahd —
  a space that started as a martial arts facility and expanded into a
  comprehensive arts and wellness hub combining fine arts, yoga, sound baths,
  and Reiki.

  She has over twelve years of teaching experience across Africa, Asia, and the
  United States, working with students from kindergarten through adults. She
  believes art is "a tool to achieve higher levels of well-being,
  self-awareness." She started murals as a side hustle painting for friends and
  found the process meditative.

  For SHINE Origins 2025, she created "Sol" — a community mural wrapping around
  the LMCU Bank building, with "We Are St. Pete" painted across the design as
  the project's rallying line. She designed it in VR, then opened it to
  volunteers for a community weekend. After the public phase, she and her
  advanced students spent seven more days refining to festival quality. "This
  wasn't a mural for St. Pete," she said. "It was a mural created with St.
  Pete."

searchBio: |
  She used VR to plan the composition before a single can of paint was opened,
  then handed the wall to the community. Sara Salem is originally from Egypt and
  now based in St. Petersburg, Florida. She holds a Bachelor of Fine Arts from
  2011, a 200-hour RYT yoga teacher certification, Reiki Level II certification,
  and a certification in art therapy. She co-founded Phi Phi Artland with her
  husband Fahd Elsaid, a partnership rooted in an eleven-year marriage that
  began as a friendship long before the business existed. She is also a partner
  at Custom Teez Shop and serves as Head of Fine Arts at Phi Phi Artland, where
  she works as art teacher, muralist, and yoga instructor.

  Phi Phi Artland opened in 2021 as a martial arts studio and expanded in 2023
  into a comprehensive arts and wellness hub at 2299 9th Ave N STE 1G, St.
  Petersburg, FL 33713. The name draws from the Phi Phi Islands in Thailand. The
  studio's offerings include Muay Thai, acrylic painting, drawing, oil painting,
  watercolor, kids art classes for ages 7 to 14, teens art classes for ages 11
  to 19, Evergreen art classes for ages 50 and up, mind-body workshops, yoga,
  breath work, sound bath meditation, and Reiki. There is also a murals division
  serving commercial, residential, public, and community projects across St.
  Petersburg, Tampa, Ybor, Central Avenue, and the wider Tampa Bay area. The
  mural division has logged 5,582 square feet painted to date. Claire Delong has
  partnered with Salem on the murals division, and Fahd Elsaid oversees site
  assessments, client coordination, scheduling, budgeting, material sourcing,
  scaffolding setup, safety compliance, and cleanup. The Phi Phi Artland team
  also includes muralist and art instructor Vyolette Hastings, known as 6ER;
  Miami-based Ringling College of Art and Design graduate Sandra Hernandez, who
  runs the brand starri.day; and studio artist and educator Brianna Taylor, a
  2019 Coastal Carolina University Studio Art graduate from Hamer, South
  Carolina.

  Salem has more than twelve years of teaching experience across Africa, Asia,
  and the United States, working with students from kindergarten through adult
  learners. She believes art is "a tool to achieve higher levels of well-being,
  self-awareness." Her mural career began as a side hustle painting for friends,
  a process she found meditative, and grew through word-of-mouth referrals, an
  online portfolio, and local collaborations into a full mural business under
  the Phi Phi Artland brand.

  She won the Art Wave contest at Countryside Mall with her mural "Retro in
  Colors," a piece combining nostalgic elements with a modern twist. She
  designed and led the LMCU Community Mural Project in 2024, sponsored by St.
  Pete Arts Alliance and St. Pete City, with the Phi Phi Artland team as
  designer and the St. Pete Artful Community as painter. She returned in 2025
  with the St. Pete Community Mural, again sponsored by St. Pete Arts Alliance.

  For SHINE Mural Festival 2025, the festival's eleventh year and the first to
  include local St. Petersburg artists, Salem created "Sol," a community mural
  wrapping around the LMCU Bank building, with "We Are St. Pete" painted across
  the design as the project's rallying line. The project coincided with LMCU
  celebrating the opening of its first St. Pete branch and its acquisition of
  Pilot Bank. Salem mapped the entire composition using a VR headset, floating
  inside the design to adjust scale, plan movement, and build the blueprint in
  digital space, replacing hours of projection work with minutes of digital
  prep. Phase one ran Friday through Sunday as a community weekend with five
  daily painting slots filled by LMCU members, families, kids, longtime locals,
  new residents, and first-time painters. Roy Binger, LMCU Senior Vice
  President, and Chris Steinocher, CEO of the St. Pete Chamber of Commerce, were
  among the community members who painted. Salem guided each section personally
  to ensure every volunteer had a meaningful part. Phase two ran Monday through
  Sunday, when Salem returned with a small team of her advanced students for
  seven days of detailed brushwork, layering, line work, and large-scale
  coverage to bring the piece to festival-level finish. The VR prep meant no
  last-minute redesigns and no wasted hours. "This wasn't a mural for St. Pete,"
  she said. "It was a mural created with St. Pete." She also said, "Since I came
  here, I wanted to be in SHINE. This is the first year they're doing it for
  local artists, and I'm on it. I'm so excited." Florida Paints served as the
  festival's official paint partner for the first time in 2025, supplying
  products including Sunscreen designed for Florida sun exposure.

  Phase three extended the project beyond the wall. Salem's artwork was featured
  at the Morean Arts Center and the St. Pete Museum of History. SHINE's opening
  ceremony highlighted her festival entry. LMCU hosted an event at their new St.
  Pete branch showcasing and selling her artwork. Art Conservatory for Teens
  (ACT) participated with young performers dancing and singing as part of the
  surrounding festivities.

  SHINE Mural Festival has commissioned more than 170 murals across its
  eleven-year history. Other 2025 SHINE artists profiled alongside Salem
  included Cuban-born muralist Karel García and emerging muralist Isac Gres.
  Salem's website is phiphiartland.com, and her Instagram handles are
  @ss_artsy_yogi and @phi_phi_artland.

searchMuralDescription: |
  A large mural on the side of a building featuring a colorful pelican wearing a
  white baseball cap and reflective sunglasses that show St. Pete landmarks in
  their lenses. The pelican's wings are spread wide in vibrant pinks, oranges,
  blues, and deep reds. A golden spiral sun radiates in the upper left corner,
  and "We Are St. Pete" appears in playful navy blue script to the right. Signed
  "Phi Phi Artland @Sarasalemartsy" at the bottom. The white background keeps
  the whole piece bright and inviting.

