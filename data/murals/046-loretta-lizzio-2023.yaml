artistBio: |
  She was the first female artist commissioned for Melbourne's Hellenic Museum —
  painting three fearless women from ancient Greek history and myth.

  Loretta Lizzio was born in 1986 and is based on the Gold Coast, Australia. Her
  work lives in Romanticism and nostalgia — "forgotten fairy tales, spectacles
  of cinema, fleeting glances and dog-eared National Geographics." She works
  across painting, murals, illustration, photography, and collage.

  She has painted across Melbourne, Vancouver, London, Brisbane, and Darwin.
  Festival credits include Vancouver Mural Festival, Wall to Wall Festival
  Benalla, Brisbane Street Art Festival, Wonderwalls Festival Port Kembla, and
  Darwin Street Festival. Clients include New Balance, Toyota x Virgin Airlines,
  Element, and Wacom. She is represented by The Drawing Arm in Australia and has
  shown at Haven Gallery in New York, Nucleus Gallery in Portland, and Beinart
  Gallery in Melbourne. Featured in Juxtapoz and Beautiful Bizarre Magazine.

  For SHINE 2023, she traveled from Australia to paint in St. Petersburg.

searchBio: |
  She was the first female artist commissioned for Melbourne's Hellenic Museum —
  painting three fearless women from ancient Greek history and myth.

  Loretta Lizzio was born in 1986 and is based on the Gold Coast, Australia. She
  has worked across publishing, photography, and advertising while continuing to
  grow as a mural artist, and her work has appeared on walls and in galleries
  across Australia, the United Kingdom, France, Canada, and the United States.
  Her practice spans painting, murals, illustration, photography, and collage,
  in pen, pencil, and oils on a variety of surfaces. Her work lives in
  Romanticism and nostalgia — what she calls "forgotten fairy tales, spectacles
  of cinema, fleeting glances and dog-eared National Geographics" — and her
  recurring subject is the strong female figure. She aims for work that is
  sensual, mysterious, energy-giving, calming, and reflective at once. She has
  spoken publicly about a life-changing accident and adjusting to motherhood as
  experiences she now draws on as inspiration.

  The Hellenic Museum commission was part of the museum's Dialogue Series, a
  program that reimagines antiquity and features women at the forefront of the
  narrative. Lizzio joined a cohort that included Bill Henson's photographic
  series, Sam Jinks's hyperrealist sculpture of the goddess Iris, and
  "Renegades" by Spanish street artists PichiAvo. She collaborated with Head
  Curator Sarah Craig and Assistant Curator Sara Prica through video meetings
  and emails, and worked artefacts on display in the museum into her designs.
  She made costumes and wax tablets, photographed them, then drew up the final
  design. The three women she painted are Hydna of Scione (diver, Battle of
  Salamis), Anyte of Tegea (poet, ca. 3rd century BCE), and Agnodike of Athens
  (physician, ca. 300 BCE). She began work on the museum forecourt at 280
  William Street, Melbourne, on Thursday 2 December 2021, and the launch was
  tied to the museum's BLOCK PARTY festival, where visitors watched the murals
  come to life. Her favorite mythological subjects include Aphrodite, Poseidon,
  Kerberos, and Medusa.

  Solo exhibitions: "Lonesome Souls" at Juddy Roller Gallery, Melbourne (2018);
  "Dearly Beloved" at Outré Gallery, Melbourne (2016); "Subconscious" at Private
  Space, Gold Coast (2013).

  Group exhibitions: "Vanguard" at Outre Gallery, Melbourne (2021 and 2022);
  Brisbane Outdoor Gallery curated by @MCRT.Studio (2022); "Wish You Were Here"
  at Nucleus Gallery, Portland Oregon (2019 and 2021); "The Knowable Unknown" at
  Wow x Wow Gallery, Scotland (2021); "Antipodes" at Beinart Gallery, Melbourne
  (2021); "Threesome" at 19Karen Gallery, Gold Coast (2019); "Mythos" at Haven
  Gallery, New York (2018); "Terra Oztralis" at Outré Gallery, Melbourne (2018);
  "Trouble Makers" at Vs Gallery, Melbourne (2018); "The Next Level" at Silo
  Park, Auckland, Comber Street Studio, Sydney, and Besser Space, Melbourne
  (2018); "Element Eden" in Los Angeles (2014); "King Brown Magazine" at The
  Tate, Sydney (2013); "I Used to Skate Once" at The Zoo, Brisbane (2013); "Made
  to Endure" at China Heights Gallery, Sydney (2013); and a duo show with Sean
  Scott at the Old Burleigh Theatre Arcade, Gold Coast (2012).

  Festival credits: SHINE Mural Festival, St. Petersburg, Florida (2023);
  Brisbane Street Art Festival (2020 and 2023); Tumby Bay Street Art Festival,
  South Australia (2022); Wonderwalls Festival, Port Kembla, NSW (2019); Wall to
  Wall Festival, Benalla (2016, 2017, and 2018); Vancouver Mural Festival,
  Canada (2017); Darwin Street Art Festival (2017); and "House of Cards" art
  installation at Amsterdam Central Station, Netherlands (2015).

  Commercial clients include New Balance, Toyota x Virgin Airlines, Element,
  Wacom, STAN / Roadshow, Rough Diamond Production's "YEAR OF" series, and The
  5th. She is represented in Australia by The Drawing Arm.

  Press and publications include Juxtapoz Magazine (2014), Beautiful Bizarre
  Magazine (2017), WOW x WOW (2017), Etiquette Silver (2016), Voyeur Magazine
  for Virgin Airlines (2018), the Bench Talk Podcast (2018), Il Globo News
  (2019), The Age, Melbourne (2019), and Blank Magazine, Gold Coast (2021).
  Speaking engagements include the Analogue Digital Creative Conference at
  Brisbane Powerhouse (2013) and Crown Hotel, Melbourne (2014), and the Head
  Space Conference at the Albert Waterways Community Center, Broadbeach,
  Queensland (2019).

  For SHINE 2023, she traveled from Australia to St. Petersburg to paint at 2875
  7th Avenue S. Website: lorettalizzio.com.

searchMuralDescription: |
  A wide mural on the Stewart Moving & Storage building depicting three women as
  sirens from Greek mythology against a deep teal-green background. The figures
  emerge from lush green foliage, their pale skin overlaid with intricate leaf
  patterns and delicate line work that makes them appear to grow from the plants
  themselves. Their dark hair flows and intertwines across the top of the
  composition, creating a canopy effect. The sirens gaze outward with serene yet
  subtly unsettling expressions — beautiful and sinister at once. Signed
  "Loretta Lizzio" in the upper right corner.

