artistBio: |
  Look for letters and you won't find any. Apexer starts from graffiti and
  Chinese calligraphy, then abstracts the letterforms until only the strokes
  are left.

  Ricardo Richey was born in San Francisco in 1978, a third-generation San
  Franciscan of Latino and African-American heritage. He studied classical
  art technique, architecture, graphic design and art history, and credits
  Precita Eyes, the San Francisco community mural group, with helping
  him find his own voice.

  His walls are dense, colourful, interlocking pattern work in spray paint.
  He has painted for the de Young Museum — a Haight Street mural for the
  Summer of Love's anniversary in 2017 — and for a Stadia Bar at Caesars
  Palace in Las Vegas. He belongs to the Gestalt Collective, a group of
  artists who paint collaborative murals around San Francisco.

  He flew in from California for SHINE's second year, in 2016, and took
  the long wall on Baum Avenue in the Edge District: ribbon-like bands,
  braided so tight the eye never finds an end.

searchBio: |
  Look for letters and you won't find any. Apexer starts from graffiti and
  Chinese calligraphy, then abstracts the letterforms into complex, dynamic
  compositions until only the strokes are left.

  Apexer is Ricardo Richey, born in San Francisco in 1978, a
  third-generation San Franciscan of Latino and African-American heritage.
  He studied classical art techniques, architecture, graphic design and art
  history while working out his own artistic identity, and he credits
  Precita Eyes, the San Francisco community mural organization, with
  guiding him to it.

  His work is colourful abstract pattern made with spray paint. His group
  shows include "Calligraffiti: Writing in Contemporary Chinese and Latino
  Art" at the Pacific Asia Museum in Pasadena in 2009. He is a member of the
  Gestalt Collective, which paints collaborative murals throughout San
  Francisco.

  Commissions include the de Young Museum (a Haight Street Summer of Love
  mural, 2017) and the San Francisco Museum of Modern Art, Stanford
  University, a Stadia Bar at Caesars Palace in Las Vegas (2021), the
  Timbuk2 flagship storefront in Brooklyn (2017), the Space NK boutique in
  San Francisco (2016), Hayes Valley Playground in San Francisco (2019) and
  the Zoox building in San Francisco (2024). Juxtapoz profiled him in 2018
  ("Apexer: The Path of Intuition"), and KQED has featured him teaching
  street-art technique.

  He painted this wall for SHINE 2016, the festival's second year, flying in
  from California. WMNF photographed it in progress on Baum Avenue, between
  1st Ave N and Central, just west of 9th Street. The St. Petersburg Arts
  Alliance lists it at 1000 Baum Ave N, on the back of the building at 965
  Central Ave, around the corner from 11th Street and facing the alley:
  abstract, about 74 feet wide and 20 feet high, built from thick,
  interlocking curved lines in many colours.

searchMuralDescription: |
  A long, low single-storey wall across a side street, painted end to end
  with abstract pattern. Hundreds of wide, ribbon-like bands in blue, teal,
  green, yellow, orange, pink, red and purple cross, curve and weave over
  one another, some shaded to look rounded, some filled with smaller
  patterns. Big arching bands frame the two ends; the middle is a dense
  tangle. At the upper left, in a yellow and orange section, it is signed
  "@APEXER". Next door at left is a sky-blue building painted with birds.

