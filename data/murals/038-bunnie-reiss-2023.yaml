artistBio: |
  She started painting murals because her San Francisco apartments were too
  small to hold a studio. She'd work outside on whatever wall she could find,
  walk away, and treat it like a modern-day cave painting.

  Born in Maryland, raised mostly in Colorado in a Polish/Russian family whose
  Eastern European folk traditions still saturate her work. She studied
  literature, worked at NPR, then earned her MFA from the San Francisco Art
  Institute and spent more than 20 years in the Bay Area before relocating
  full-time to Lilac Lane Farms — a 5-acre desert homestead in Landers, near
  Joshua Tree, where she grows food, keeps chickens, and built a dedicated
  painting studio.

  Her subject matter centers on nature and the cosmos, mysticism and magic, and
  the systems that connect people, animals, and plants — all rendered in dense
  pattern and a maximalist palette drawn from Russian fairy tales, Mexican folk
  art, and Jewish mysticism. She works across murals, paintings, hand-painted
  leather gloves with sacred-geometry eye motifs, large-scale mosaics, and
  immersive sculpture — including "The Sky Rabbit's House," a giant rabbit
  leaping over a rooftop, built on a street-legal truck chassis and named after
  Lepus, the winter constellation she can see from her porch. People can sit
  inside it. She says it was "made for people to fall in love."

  She's painted walls in over 20 countries, with documented locations including
  "Magic Buffalo" in Buffalo, NY (via the Albright-Knox Museum), Carbondale, CO,
  El Segundo, CA, and the high-desert towns of Joshua Tree and Yucca Valley.
  Solo shows at Superchief Gallery LA; group exhibitions at Paradigm Gallery
  (Philadelphia), La Luz de Jesus, and Luna Rienne. Coverage in Juxtapoz,
  Colossal, Vice, Hi-Fructose, VoyageLA, and Palm Springs Life. As of late 2023
  she was working on illustrations for a children's book and a monograph
  covering the previous ten years.

searchBio: |
  Bunnie Reiss is a muralist based near Joshua Tree, California who paints
  folk-art walls full of animals, flowers, and dense patterning. She was born in
  Maryland and raised mostly in Colorado, and her work consistently reflects her
  Eastern European family background. She moved to California more than 20 years
  ago and has lived in major areas in both the north and south of the state. She
  started painting murals while living in San Francisco, where small apartments
  meant she could not afford big studios and learned to work outside on walls
  instead. She describes the early San Francisco years as wild — painting
  outside, leaving the work, walking away, treating it like a modern-day cave
  painting.

  Reiss relocated full-time from Los Angeles to a 5-acre desert property in
  Landers about two years before her October 2022 VoyageLA interview, after
  owning the land for almost four years. She had previously run a storefront
  gallery in LA. The desert property, near Joshua Tree National Park, is a
  homestead she calls Lilac Lane Farms, where she grows food, keeps chickens and
  other livestock, and built a dedicated painting studio. Sustainability is part
  of her practice. She describes being surrounded by a community of artists,
  writers, and musicians in the high desert that has informed her current
  creative process.

  Her subject matter centers on nature and the cosmos, mysticism and magic, and
  the systems that connect people, animals, and plants. She cites her Eastern
  European family as the source of the mysticism and the emphasis on community
  in her work. Colossal describes her output as colorful, cosmic characters with
  an emphasis on patterns and a symbiosis between wild animals, botanicals, and
  people. An ongoing series of hand-painted leather gloves features embellished
  eye motifs, symmetry, and sacred geometry.

  She works across murals, paintings, immersive sculptures, and — added to her
  practice in roughly 2021–2022 — large-scale mosaics. She recently completed a
  500-square-foot mosaic mural. She also built "The Sky Rabbit's House," a
  sculpture of a giant rabbit leaping over a rooftop, constructed on the chassis
  of a street-legal truck and made in collaboration with a team of fabricators.
  She named it after Lepus, a winter constellation she can see from her porch.
  The piece has a cavity inside for people to sit in and was, in her words,
  "made for people to fall in love."

  Documented mural locations include "Magic Buffalo" in Buffalo, New York,
  commissioned through the Albright-Knox Museum Public Arts Initiative; a wall
  in Carbondale, Colorado, through the Carbondale Public Arts Program; and a
  wall in El Segundo, California, commissioned by the El Segundo Arts Council.
  In the high desert she has painted an interior mural for Untamed Yoga in
  Joshua Tree and a wall for The End in Yucca Valley. She has said she would
  like to paint a mural in Palm Springs.

  She taught herself to use spray paint after being offered large brick walls
  that demanded different materials than she had previously used, and she talks
  about adapting her style — which she describes as consistent and core to who
  she is — to the texture of different walls and the conditions of different
  environments.

  Reiss participated in the Highway 62 Open Studio Art Tours, organized by the
  Morongo Basin Cultural Arts Council (mbcac.org), opening her Landers studio
  during the 20th edition of the tour in October 2021 (weekends of Oct. 9–10,
  16–17, and 23–24) and again in 2022 (weekends of Oct. 8/9, 15/16, 22/23). The
  2022 edition featured almost 200 properties across the desert. La Matadora
  Gallery is among the local galleries she had been aware of before making the
  desert her permanent home.

  She started really living off her art roughly ten years before her October
  2022 interview, after years of taking on any work she could to fund her
  practice. She talks openly about the emotional, physical, and spiritual
  exhaustion of being a working public artist, and about the importance of
  seeking out older, more experienced mentors. As of late 2023 she was working
  on illustrations for a children's book and organizing a monograph covering the
  previous ten years of her work.

  Her work has been covered by Colossal (October 31, 2023, by Kate Mothes),
  VoyageLA (October 12, 2022), and Palm Springs Life (October 6, 2021, by Carl
  Schoemig). Website: bunniereiss.com. Instagram: @bunnieluvrocks.

  Per her current website (bunniereiss.com/all-about-bunnie-1), Reiss has since
  relocated to Detroit, Michigan; the Mojave Desert property — Lilac Lane Farms
  at 55526 Lilac Lane, Landers, CA 92285 — is still developed with art and
  sculpture but is now maintained by friends rather than full-time by her. She
  also did a brief residency in France between her Bay Area years and Los
  Angeles. She describes herself as "Artist, educator, magic maker." Her
  practice now spans murals, interior murals, painted vehicles, paintings,
  mosaics, sculpture, textile, and installation.

  Her mural map on bunniereiss.com/murals lists wall projects across San
  Francisco, Oakland, Sacramento, Joshua Tree (including a Writers Retreat
  series), Santa Monica, Marina Del Rey, Los Angeles (including Blacklist / LA
  Marathon, Silverlake / Donut Farm LA, Highland Park / co-LAb Gallery, and The
  Container Yard in the Downtown LA Arts District), Morongo Valley, Slab City,
  Nevada Trailer Park / Gerlach, Cincinnati, Roger's City and Detroit, Michigan,
  Austin and Marfa, Texas, Salt Lake City, Buffalo and Queens (Welling Court)
  New York, Chicago (Truborn and a Public Art series), Milwaukee, Jersey City,
  Asbury Park (Mercat), and St. Petersburg, Florida. International mural
  locations include Vancouver Mural Fest, Ontario (Canada), San Pancho and
  Mexico City (Magic Hand and a UN-commissioned series) and Guadalajara
  (Mexico), Florence (Italy), and Manila (David's Hand, Philippines).

  Beyond "The Sky Rabbit's House," her sculpture practice includes "Big Bouncy
  Bird" (2022) — a roughly 12-foot interactive sculpture built on a truck spring
  that visitors can ride, made in collaboration with One Hat One Hand in San
  Francisco and based on one of her paintings — and "The Lookout," a tiny
  teetering wooden house with stained-glass windows and hidden messages, pushed
  by mosaic clouds and a mosaic moon, inspired by the Chakora bird's
  mythological devotion to the moon.

searchMuralDescription: |
  Three elaborately patterned pink flamingos stride across the wall on long dark
  legs, each bird filled with intricate floral and geometric details in shades
  of pink, coral, and lavender. They step over a blue-violet rainbow arch with
  rolling green hills beneath. Golden flower clusters bloom on the right side
  against a bright teal sky dotted with small clouds and birds. The piece covers
  the entire side of the building.

