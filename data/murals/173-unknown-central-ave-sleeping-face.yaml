artistBio: |
  Artist unknown. A two-story mural on Central Avenue in St. Petersburg.

searchMuralDescription: |
  A large two-story mural on a gray building depicting a sleeping female face
  with closed eyes and flowing pink-coral hair that cascades in waves across the
  wall. The hair transforms into dark gray-blue ocean waves at the left side. A
  small white origami paper boat carries two small figures (drawn in a cartoon
  style contrasting with the painterly surroundings) through the pink waves near
  the center. The overall palette is soft pinks, grays, and teals. The piece
  wraps around multiple windows and shutters integrated into the composition.

