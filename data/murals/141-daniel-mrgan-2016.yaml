artistBio: |
  He immigrated to the US at twenty-one as a refugee. His family fled the
  Yugoslav conflict from a contested city near the Serbian border, first to
  Berlin, then to America.

  Daniel Mrgan is originally from Croatia, now based in St. Petersburg. He
  earned a graphic design degree from St. Petersburg College and also studied at
  Schiller International University. His fine art is whimsical and illustrative
  — introspective characters, wood burnings, immersive narrative works combining
  illustrations, sculptures, and texts. He treats fine art as personal passion
  alongside his graphic design career.

  His solo show "Sir Dr. Admiral Rupert Xavier's Paper Plane Flights to Exotic
  Mind Destinations" at Bluelucy captured the tone. For SHINE 2016, he painted
  "A Picnic" at 1701 1st Avenue South.

searchBio: |
  He immigrated to the US at twenty-one as a refugee. His family fled the
  Yugoslav conflict from a hotly contested Croatian city near the Serbian
  border, where his parents ran a butcher shop. His mother and father went
  briefly to Berlin first, leaving Daniel and a younger brother behind to finish
  high school, before the family received refugee visas to the United States and
  resettled in Pinellas County. He was 36 and living in St. Petersburg when
  Creative Loafing profiled him in February 2014.

  Daniel Mrgan is originally from Croatia, now based in St. Petersburg. He
  earned a graphic design degree from St. Petersburg College and also studied at
  Schiller International University. While he was studying at Schiller and St.
  Petersburg College, he began making wood burnings of whimsical characters. The
  work caught the eye of Kaya Parwanicka, then a curator at the Dunedin Fine Art
  Center and a classmate at Schiller, who put him in his first exhibition.

  He treats fine art as personal passion alongside his graphic design career. As
  he told writer Megan Voeller, "I like to make art to have fun, so if it's
  something my livelihood depends on, it's not fun anymore — it's a job." He
  creates what he feels like creating, which makes him not particularly prolific
  by choice. He has become something of a mainstay in St. Pete art shows, with
  work exhibited at Bluelucy, C. Emerson Fine Arts and the Dunedin Fine Art
  Center.

  His fine art is whimsical and illustrative — introspective characters, wood
  burnings, and immersive narrative works combining illustrations, sculptures,
  and texts. "The inner world is to me the most interesting world to explore,"
  he told Creative Loafing. "I'm more interested in someone who is sitting
  quietly than somebody who is jumping around." He uses entry-level wood burning
  pens and planks from Michaels, embracing the medium's associations with home
  craft and folk art, the irregularity of wood surfaces, and a kitsch aesthetic
  of vignetted scenes. He picked up the technique after probably seeing it on
  television.

  His solo show at Bluelucy Gallery, Sir Dr. Admiral Rupert Xavier's Paper Plane
  Flights to Exotic Mind Destinations, ran through February 8, 2014 at 653
  Central Avenue in St. Petersburg. Megan Voeller reviewed it for Creative
  Loafing on February 6, 2014. The show was staged like an immersive book, with
  viewers walking left to right around the gallery reading framed texts and
  seeing illustrations of Sir Dr. Admiral Rupert Xavier, the fictional and
  acutely neurotic protagonist. Sir Rupert wears high-waisted pants, suspenders
  and a formidable mustache, and a ragtime-ish soundtrack played over the
  gallery speakers. A wall-mounted sculpture of the character's head let
  visitors duck inside his noggin.

  The exhibition included more than 30 works — texts, drawings, wood burnings
  and sculptures — and unfolded as a narrative about the two psychic forces
  governing Sir Rupert's life: the anxieties that constrain him and the
  imagination that sets him free. Half of the drawings devoted themselves to
  Rupert's paranoid solitude, like his yellow orb of a head peeking out from
  behind a picket fence and blue house collapsed together in space, and his
  melancholy anxieties, like an actual blue monster wrapping itself around his
  head. The wood burnings gave form to his imagined adventures, transforming the
  character's cranium into a hot air balloon, the sail of a boat, a spaceship,
  and a puff of smoke. One running joke is that Rupert's day job consists of
  driving a Google car as it forges a virtual copy of the world.

  His childhood in Croatia included a surreal decade when armed conflict
  co-existed with an otherwise civilized eastern European standard of living. He
  has stories about venturing outside at age 12 to salvage a ping pong table
  with his brother and being fired at by a cannon. He was already making zines
  with his brother in those days. That brother also became a graphic designer
  and lives in Portland, Oregon. A still younger brother is a concept artist and
  character designer in Los Angeles.

  Mrgan shrugs at the idea that Rupert's quirkiness — the beard and suspenders —
  could look like a hipster affectation, pointing out that the same garb recalls
  socialist eastern Europe from a different perspective. "Hipsters are not the
  first people to invent the beard or suspenders," he says. He told Voeller, "At
  a very young age I realized that a lot of the stuff that you're told, or that
  we read, is basically just not true."

  For SHINE 2016, he painted "A Picnic" at 1701 1st Avenue South in St.
  Petersburg.

  After his St. Petersburg years he relocated to Missoula, Montana, where he
  continued working as a graphic designer and illustrator. His Tumblr at
  danielmrgan.tumblr.com (active through October 2021) documents Missoula-era
  projects including a poster for the Moon Randolph Homestead annual event
  (February 2021), a label for Soil Cycle composting service (October 2020) and
  a recycled-plywood mural for the same service (April 2020), a woodburning
  piece for Longstreet Gallery's Labor Day group show (October 2020), a
  Blundstone boots art-contest submission (November 2020), and a bandana design
  for friend Jess's Kakigori Bar Japanese shaved-ice business in a restored
  Airstream trailer. He also kept a COVID-lockdown sketchbook series of
  apartment objects and cat illustrations (April 2020) and a comic on voting.
  The Tumblr's about page frames his influences as "silent cinema,
  Eastern-European stop-motion, folk art, and melancholy aesthetics," and lists
  drawing, cooking, reading, and cycling in wooded areas as personal interests.

searchMuralDescription: |
  A 25-by-12-foot mural on the south side of the FRSTeam by Rogers building at
  1701 1st Ave S, facing the sidewalk. The piece depicts a whimsical picnic
  scene starring two cartoon characters named Leon and Olive, rendered in a
  flat, graphic illustration style using a limited palette of green, gold, red,
  dark navy, and white. Against a rich green grass background bordered by red
  trees, Leon reclines reading a book while Olive daydreams at a table with
  coffee and art supplies. A white text bubble in the upper left reads:
  "Meanwhile, in a city park, Leon was reading a library book of Latino poetry
  while Olive daydreamed about her next business venture. They both wondered
  whether to have another piece of cheese." Playful details fill the scene — a
  smiling log, a worm in a derby hat, bicycle wheels, a butterfly, and scattered
  food. The building number "1701" is visible in red at the lower right. The
  style recalls vintage children's book illustration with bold outlines, flat
  color fills, and a gentle sense of humor.

