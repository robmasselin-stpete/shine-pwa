artistBio: |
  Google made him their Artist in Residence. He painted the lobby of Building 42
  in Mountain View.

  Ricky Watts was born in 1980 in San Francisco. He studied graphic design at
  the Art Institute of California in San Diego for two years, then left to
  pursue fine art. In 2011 he developed his signature "hard-edge gradients" —
  abstract, fluid shapes with psychedelic color gradients that evolved from
  letter-based canvas work.

  He has painted fifty-plus large-scale murals since 2004 and mounted over a
  hundred group exhibitions and twenty solo shows, including at Sotheby's
  Oakland and Modern Eden. Clients include Google, Louis Vuitton, YouTube,
  Mercedes Benz, IBM, and Outside Lands. He has painted for POW! WOW!, the Las
  Vegas Circus Center, and Sonic Temple Festival.

  For SHINE 2021, he painted in St. Petersburg.

searchBio: |
  Google made him their Artist in Residence. He painted the lobby of Building 42
  in Mountain View.

  Richard "Ricky" Watts was born in 1980 in San Francisco. As a kid he drew
  comics, mostly battles between the U.S. Army and nuclear dinosaurs. In school
  he sold drawings of his classmates' names in exchange for bartered items, and
  by high school the side hustle was funding his daily lunches. High school was
  also when he discovered aerosol art. After graduation he traveled up and down
  the West Coast painting large-scale pieces on every surface he could find.

  In 2000 he enrolled at the Art Institute of California in San Diego with an
  emphasis in graphic design. He left after two years and returned to the Bay
  Area to pursue fine art. His debut solo show "Spontaneous Combustion" opened
  at Boomerang Gallery in Petaluma in 2004. He worked through several styles
  before landing on his current "hard-edge gradients" in 2011 — abstract, fluid
  color shapes that came out of deconstructing the letter forms he was painting
  on canvas at the time.

  His commission list includes Google, Louis Vuitton, YouTube, Mercedes-Benz,
  IBM, Anchor Brewing Company, and stage banner designs for the Outside Lands
  Music Festival in San Francisco — a project he credits with opening the door
  to the Google and Mercedes-Benz work. He worked with Fogbelt Brewing on label
  art and donated the original print to Make-A-Wish California.

  His public works run deep. SHINE Mural Festival in St. Petersburg in 2015 (98'
  x 37'), 2017 (36' x 18'), and 2021 (100' x 48'). POW! WOW! San Jose in 2017
  (91' x 27') and POW! WOW! Hawai'i in 2018 with James Bullough (72' x 20'). The
  Las Vegas Circus Center in July 2018, his largest mural to date at the time.
  Sonic Temple Festival in Ohio. Other festivals and projects: Tampa Walls
  (2022), Wide Open Walls in Roseville (2022), OuterSpace Project in Atlanta
  (2015 and 2022), Bright Walls in Jackson, Michigan (2022), Sea Walls in Santa
  Cruz (2021), Cleveland Walls (2021), Arts Fest Montana in Great Falls (2021),
  Color The Creek in Battle Creek, Michigan (2021), REN ART WLK in Rensselaer,
  Indiana (2020), Only Up Mural Festival in Livermore (2020), Burners and BBQ in
  Asheville (2015), West End Mural Festival in Sand City with BACON (2024), The
  Mural Festival in Santa Rosa (2023), and the Modesto Children's Museum (2023).
  Other named walls include Church of Clown in San Francisco (2024), AIDS
  Healthcare Foundation in Berkeley (2024), Senor Grubby's in Carlsbad (2023),
  BREW in Forestville (2023), Fishetarian in Bodega Bay (2023), Tia Maria's
  Panderia in Santa Rosa (2022), Larkin Street at Bay in San Francisco (2021),
  CAL Bears Mural in Berkeley (2019), Painted Gentlemen at Alamo Square (2019),
  Riley Street Art Supply in Santa Rosa (2018), Daredevils and Queens in Santa
  Rosa (2018), The Container Yard in Los Angeles (2015 and 2017), Blacklist
  Gallery & Tattoo in Portland (2016), Fresh Coat at Jamieson Ranch in Napa
  (2016), the 1 Brush Initiative in San Francisco (2015), FLAX Art Store in San
  Mateo (2014), Rocha Gallery (2014), the RAI Care Center collab on Haight
  Street (2014), and The Phoenix Theater in Petaluma (2013).

  Solo shows include "My Own Worst Enemy" at The Epitome Gallery in Eureka
  (2024), "Deep Within" at Nielsen Arts in Berkeley (2023), "Pursuit of
  Hoppiness" at Fogbelt Brewing Co in Santa Rosa (2022), "New Paintings by Ricky
  Watts" at Sotheby's Oakland (2019), "The Artwork of Ricky Watts" at Leave Your
  Mark in Sacramento (2017), "Levitation" at Upper Playground / Fifty24PDX
  Gallery in Portland (2016), "Home Grown" at Opera House Collective in Petaluma
  (2015), "VINTAGE" at 1192 Folsom in San Francisco (2014), "Destination
  Unknown" at ZeroFriends in Oakland (2013), and earlier shows at Buddha's Palm
  in Sebastopol, Starstruck and Mail Depot in Petaluma, Patrick Evan Salon and
  Chrissy Bee in San Francisco, Triumph in San Rafael, and Daredevils & Queens
  in Santa Rosa.

  Group exhibitions include "Line Addicts" by Hi-Fructose Magazine at Thinkspace
  (2024), the SHINE Year 10 Exhibition and SHINE 2021 Exhibition at the Morean
  Arts Center in St. Petersburg, "The Art of Art" curated by Michael Cuffe at
  Modern Eden in San Francisco (2021), "I Only Have To Land It Once" at
  Blackbook Gallery in Denver (2021), Moniker Art Fair in London (2019), "LAX /
  ORD II" at Vertical Gallery in Chicago (2019), "LAX / SFO Part III" at Heron
  Arts in San Francisco (2019), POW! WOW! Hawai'i print and group shows curated
  by ThinkSpace Projects, "Locals Only" at Mirus Gallery, the 12x12 Group Show
  at SCOPE Art Fair Miami, "LAX / PDX II" at Antler Gallery in Portland,
  "Outside In" at Behar + Peteranecz Architecture in St. Petersburg (2017),
  "Colors | Lines | Layers" at CASS Contemporary in Tampa (2017), "212 Arts
  Anniversary Exhibit" in New York, "LEGENDS" at Oakland Terminal, "Cultural
  Xposure" at the San Jose Museum of Art (2006), and "Tetrachromatic" at Arch
  Enemy Gallery in Philadelphia (2013).

  He works out of a Northern California studio while raising twins. Website
  watts.art.

searchMuralDescription: |
  A massive abstract mural wrapping around The Factory St. Pete building.
  Enormous organic, fluid shapes in bold saturated colors — orange, teal,
  yellow, deep blue, green, and coral — flow and overlap across the facade like
  giant brushstrokes frozen mid-motion. The forms are rounded and bulbous,
  somewhere between liquid ribbons and inflated tubes, creating a sense of
  constant movement. Palm trees in front of the building interact with the
  composition. The "Ricky Watts" signature and address "2622 Fairfield Ave S"
  are visible on the right side. The scale is impressive — the flowing shapes
  span two stories.

