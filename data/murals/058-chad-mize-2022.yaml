artistBio: |
  CHAD MIZE is a multimedia artist, designer and curator residing in St.
  Petersburg, Florida. He was born in New Orleans, Louisiana in 1974, and then
  moved to Tampa Bay Florida, where he spent most of his childhood. An early
  interest in art resulted in his earning a BFA in Visual Communications at
  the University of Mississippi.

  His early career included drawing caricature portraits at Faneuil Hall in
  Boston and illustrating Flash animations for a digital textbook company in
  the late 1990s. In 2003, MIZE moved to St. Petersburg, FL and has been
  championing the Tampa Bay art scene ever since.

  MIZE created the "Paris/Tokyo/London/St. Pete" shirt in 2010. After 16
  years, it is still selling in local shops, popular among both locals and
  tourists.

  MIZE co-founded BLUELUCY gallery on Central Avenue in 2010 (representing
  450-plus artists before closing in 2015).

  In 2018, Mize opened the gallery MIZE in the Historic Uptown neighborhood of
  St Petersburg. Following the closing of MIZE in 2022 he set his sights on a
  larger gallery project entitled SPACE. Currently he is curating exhibits
  throughout Tampa Bay at various venues.

  He served on SHINE's organizing committee for a decade (2015-2025).

  With a love for past and contemporary culture, he takes a humorous,
  tongue-in-cheek approach to his designs, which include playful doodles,
  colorful patterns, political art and graphics with text.

  Mize's client list has included Aids Healthcare Foundation, The Dali Museum,
  Facebook, COACH, NUTRL, Tampa Bay Lightning, Tampa Bay Rays, Sprouts, Kahwa,
  Busch Gardens, The Vinoy Hotel, and JW Marriott.

  Mize's work is held in numerous private and corporate collections nationally
  and internationally.

searchBio: |
  He created the "Paris/Tokyo/London/St. Pete" shirt in 2010 and it is still
  everywhere. Chad Mize was born in 1974 in New Orleans, Louisiana, and moved to
  Tampa Bay as a child, spending most of his childhood in the Bradenton area
  south of St. Petersburg. He visited the Dali Museum and Jannus Live as a kid,
  which built an early attachment to the city he would later call home. He
  earned a BFA in Visual Communications at the University of Mississippi in
  Oxford, then moved to Boston in his twenties, where he drew sidewalk character
  portraits in front of Faneuil Hall — an unpolished gig that laid the
  groundwork for the improvisational style he still uses. In 1998 he became an
  illustrator for a digital textbook company, creating Flash animations for
  educational content. Laid off a week before 9/11, he co-founded the creative
  studio Bluelucy with partner Phillip Clark and moved back to Florida. He
  considered Sarasota but chose St. Petersburg in 2003, largely because the Dali
  Museum convinced him a small city could support world-class art. He has lived
  in St. Pete for over seventeen years.

  Mize works as a multimedia artist, designer, and muralist. His style is bold,
  cartoon-like imagery — playful doodles, colorful patterns, political art, and
  graphics with text — taking a humorous, tongue-in-cheek approach to politics,
  religion, and contemporary culture. He cites Keith Haring as a major
  influence, specifically Haring's belief that art should be accessible; he
  visited Haring's Pop Shop in New York as a child and that inspired him to open
  his own retail spaces. His father, who died eight years before the St. Pete
  Catalyst interview, was also a major influence — a people person and hard
  worker. His artist statement: "My purpose for creating art is to inspire and
  uplift the viewer. I consistently saturate my work with colors and concepts
  that radiate happiness."

  He has painted over 120 murals of his own design, mostly in Tampa Bay but also
  in Miami and other cities. Some of St. Pete's first murals were painted by
  Mize behind Bluelucy, including iconic images of Twiggy and Mr. Sun, which
  still remain partially obscured by later upgrades. Recent and notable mural
  work includes University Town Center in Sarasota (2026), AIDS Healthcare
  Foundation in St. Petersburg (2025), Fit 2 Run in St. Petersburg (2025), IMG
  Academy in Bradenton (2025), The Factory in St. Petersburg (2025), St. Pete
  Pier (2025), Troyer Residence (2025), Dali Museum (2025), 821 16th Street N in
  St. Petersburg (2025), Jackson Residence (2025), The Adderley in Ft.
  Lauderdale (2025), Antoinette Residence (2025), Gibson/DeSomery Residence
  (2025), Wyndham Grand in Clearwater Beach (2024), Wagner Residence in St.
  Petersburg (2024), Creative Contractors in Clearwater (2024), Element in Tampa
  (2024), and NUTRL x Hollander Hotel in St. Petersburg (2024).

  His client list includes AIDS Healthcare Foundation, The Dali Museum, COACH,
  NUTRL, Tampa Bay Lightning, Tampa Bay Rays, Sprouts, Kahwa, Busch Gardens, The
  Vinoy Hotel, and JW Marriott. His work is held in private and corporate
  collections nationally and internationally. His designs have appeared on Coach
  brand bags, paddle-ball rackets, t-shirts, and walls across the city.

  In 2009 the 600 block of Central Avenue transformed into a hub for artist-run
  shops and galleries, and Bluelucy at 653 Central Avenue thrived. Bluelucy
  hosted monthly themed exhibitions featuring dozens — sometimes over a hundred
  — local artists, providing both exposure and income (it represented over 450
  artists before closing in 2014/2015 due to rising rents). In 2005 he helped
  start the St. Pete Shuffle. In 2010 he met his now-husband Dan Schmidt and,
  while traveling, spotted a "Paris/Tokyo/London/Torrance" shirt design and made
  his St. Pete version. In 2015 he was asked to help launch the SHINE Mural
  Festival, working closely with director Jenee Priebe; he served on SHINE's
  organizing committee for over six years. In 2018 he opened MIZE Gallery in the
  Historic Uptown neighborhood on MLK Jr. Street, which ran for five years
  (closing 2022) hosting monthly exhibitions of Bay Area talent and pivoting to
  virtual shows during the pandemic. In 2023 he opened SPACE in a former PSTA
  bus depot on south 28th street, a short-lived but legendary venue that added
  performance to the mix and featured Bay-area stalwarts including Bask, Zulu
  Painter, Vitale Brothers, IBOMBS, Frank Strunk III, and Andrea Pawlisz.
  Pawlisz was a key collaborator at both SPACE and MIZE Gallery. The city was
  not keen on the large gatherings and SPACE shuttered after only a few shows.
  He also remembers the warehouse parties of the 2000s with the Vitale Brothers,
  alongside the rise of Central Avenue galleries Craftsman House, Shapiro's, and
  Davidson Fine Art.

  In 2025 Mize is a featured artist at the James Museum, displaying work in the
  stone entry canyon, and is included in "Outside In: New Murals Inspired by
  Dali" at the Dali Museum (opening May 24, 2025), which features twelve former
  SHINE mural artists painting inside the museum walls. He curates art pop-ups
  at Green Bench Brewery and runs "Side Spot," a mini-gallery next to his
  husband Dan's restaurant Uptown Eats. The Artisan Magazine cover story by
  Robin O'Dell (April 28, 2025) called him "St. Pete's Godfather of Art."
  Contact: info@chadmize.com, 727-251-8529, chadmize.com.

