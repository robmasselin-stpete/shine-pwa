artistBio: |
  George F. Baker III (GFB3) is a Nebraska-born, Detroit-raised illustrator
  and muralist who has called Atlanta home since his college years. He earned
  his BFA from Georgia State University in 2015 and quickly built a reputation
  for chunky, candy-colored characters packed with infectious energy. His
  client list reads like a brand hall of fame — Nike, Jordan Brand, ESPN,
  Mercedes-Benz, and Levi's among them — and he has painted more than 50
  large-scale murals across the U.S. He gave a TEDxAtlanta talk on creativity
  and community, earned a nomination for the World Illustration Awards, and
  co-founded Foster, a multidisciplinary studio-collective in Atlanta where
  he serves as Creative Director. Whether on a building or a sneaker box,
  his work channels a playful, childlike spirit meant to remind people of
  who they really want to be.

muralDescription: |
  A full-building mural on a black background packed with a joyful crowd of
  cartoon-style characters rendered in bold pinks, teals, purples, blues, and
  warm browns. The figures are chunky and expressive with exaggerated grins,
  wild hair, and animated poses — dancing, laughing, taking selfies, playing
  instruments, and celebrating. Across the top in large bubble letters with
  teal outlines and cream fill reads "WE'RE ALL FRONT ROW AT YOUR SHOW."
  White diamond-shaped dots scatter across the black background like confetti
  or stars. The GFB3 tag appears in a small heart-shaped logo in the lower
  right corner. The piece wraps around garage doors and windows, covering
  the entire rear wall of Studio@620.

