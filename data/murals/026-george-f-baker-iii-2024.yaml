artistBio: |
  He painted a mural on ESPN's College GameDay. Live, on air.

  George F. Baker III grew up in Detroit, raised in Atlanta. He earned a BFA in
  Graphic Design from Georgia State University in 2015, worked as a creative
  marketing manager at a screen-printing company, and transitioned to full-time
  muralist and illustrator. His first mural was in 2018 at Switchyards Downtown
  Club in Atlanta. He has painted 25-plus walls since, across Miami, Atlanta,
  Chicago, and beyond.

  His style is playful and cartoon-inspired — larger-than-life characters in
  bright bold color with positive messaging. "Take Care." "Be You." "Be A
  Light." He cites Keith Haring, Nickelodeon cartoons, Pokemon trading cards,
  and Dragon Ball Z as influences. He is creative director of Foster, a
  studio-collective "striving to make people unafraid to play." He describes
  himself as a sneakerhead with 78-plus pairs.

  The client list reads like a brand deck: Nike, Adidas, Jordan Brand, Levi's,
  ESPN, NFL, Cartoon Network, Adult Swim, Adobe, Mailchimp, Red Bull, Patagonia,
  Mercedes-Benz. His "Be Playful" project for Mailchimp was longlisted for the
  2021 World Illustration Awards. His dream project is designing a Nike sneaker
  to benefit L.E.A.D., a nonprofit mentoring young Black boys in Atlanta.

  For SHINE 2024, he painted at Studio@620 on 1st Avenue South.

searchBio: |
  He painted a mural on ESPN's College GameDay. Live, on air. The August 28,
  2021 segment also flagged him as Midtown Alliance's artist-in-residence and a
  Georgia State alum.

  George F. Baker III — also known as GFB3 — was born in Omaha, Nebraska, grew
  up in Detroit, lived briefly in Hilton Head, South Carolina, and settled in
  Atlanta in the early 2000s. He earned a BFA in Graphic Design from Georgia
  State University in 2015. After graduation he worked as a creative marketing
  manager at Danger Press, an Atlanta screen-printing company, before
  transitioning to full-time mural and illustration work. His first mural,
  painted in 2018, went up inside Switchyards Downtown Club, an Atlanta
  coworking space. He has completed 25-plus walls since across Atlanta, Miami,
  Chicago, Panama City, and Boulder.

  His path to art ran through an early elementary school art teacher who told
  him he could not become an artist because he did not draw realistically. His
  parents told him to challenge incorrect assumptions, and at the library he
  discovered Keith Haring — the first work that gave him permission to develop
  his own voice. Other influences include Piet Parra, KAWS, Adult Swim,
  Nickelodeon, Toonami, Cartoon Network's Dexter's Laboratory and Adventure
  Time, Pokemon trading cards, the Japanese anime Dragon Ball Z, and early-2000s
  streetwear brands The Hundreds, Huff, Crooks & Castles, and Perks & Mini. He
  has collected the annual street culture book All Gone since 2013.

  His style is playful and cartoon-inspired — larger-than-life characters in
  bright bold color paired with positive messaging. Recurring text includes
  "Take Care," "Be You," "Be A Light," and "Yup! Things Will Be Better." He
  pairs typography with imagery to communicate; the typography skill carries
  over from his graphic design career.

  Documented Atlanta murals include "Make Friends" on the Atlanta BeltLine
  Westside Trail (2019), "Creating You" on the MET Atlanta building at Murphy
  Avenue and Ralph David Abernathy Boulevard (2019), "Everybody" on Carroll
  Street in Cabbagetown as part of the Stack Squares Mural Project (2019), and a
  passion project titled "Spreading Good, Being Good" on an old moving truck on
  Metropolitan Parkway in the Adair Park neighborhood. A larger Adair Park II
  piece for SafeAuto — his second project with the agency Muros — is three
  stories tall and almost 50 yards wide. He also collaborated with German artist
  1010 on a rooftop optical-illusion mural at Peachtree Center downtown, in
  partnership with the nonprofit Living Walls, the City Speaks, and
  Florida-based International Corporate Art. Beyond Atlanta, he painted "Keep
  Dancing" in Panama City, Florida and a 2022 mural at 1535 Spruce Street in
  Boulder, Colorado for Street Wise Arts — an eTown Hall-inspired piece
  featuring three figures playing keys, guitar, and saxophone, with a robot
  tagged on the prepped wall incorporated into the design. For SHINE 2024 in St.
  Petersburg, he painted at Studio@620 on 1st Avenue South.

  In 2021 he was selected as one of six artists for Midtown Alliance's Heart of
  the Arts Studio Residency Program, with studio space at Dewberry Capital's
  Peachtree Pointe office building — his first dedicated studio. His first solo
  show, "Little Reminders," opened at Cat Eye Creative on November 3, 2023,
  featuring smaller canvas works, an interactive installation where visitors
  recorded their own reminders, printed shirts, stickers, merch, and a 3D
  version of one of his illustrations. He also designed an Atlanta Magazine
  cover, advertisements for Cartoon Network and Adult Swim, a Slutty Vegan
  storefront, and event poster artwork titled "MARTA" for the Atlanta rap duo
  Paid in AmeriKKKa.

  The client list reads like a brand deck: Adidas, Adult Swim, Atlanta United,
  ESPN, Georgia Power, Lululemon, Mailchimp, Mercedes-Benz, Nike, NFL, ONE
  Musicfest, Patagonia, Topo Chico, Verizon, Target, Warby Parker, Cartoon
  Network, Adobe, Red Bull, Levi's, and Jordan Brand. His "Be Playful" project
  for Mailchimp, commissioned by Linda McNeil, was longlisted for the 2021 World
  Illustration Awards in the Advertising Professional category.

  He is the Creative Director of Foster, a studio-collective "striving to make
  people unafraid to play." He describes himself as a sneakerhead with 78-plus
  pairs. His dream project is designing a Nike sneaker to benefit L.E.A.D., an
  Atlanta nonprofit that mentors young Black boys through baseball, life, and
  leadership skills.

  Contact: George@GFBThree.com, 678-923-8666. Website: gfbthree.com. Instagram:
  @gfb3.

searchMuralDescription: |
  A full-building mural on a black background packed with a joyful crowd of
  cartoon-style characters rendered in bold pinks, teals, purples, blues, and
  warm browns. The figures are chunky and expressive with exaggerated grins,
  wild hair, and animated poses — dancing, laughing, taking selfies, playing
  instruments, and celebrating. Across the top in large bubble letters with teal
  outlines and cream fill reads "WE'RE ALL FRONT ROW AT YOUR SHOW." White
  diamond-shaped dots scatter across the black background like confetti or
  stars. The GFB3 tag appears in a small heart-shaped logo in the lower right
  corner. The piece wraps around garage doors and windows, covering the entire
  rear wall of Studio@620.

