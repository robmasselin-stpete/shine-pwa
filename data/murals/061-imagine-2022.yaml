artistBio: |
  She has a master's from Harvard. She founded Nepal's first Children's Art
  Museum. She paints mindful mantras in Devanagari script with spray paint.

  Sneha Shrestha — Imagine — was born in Nepal and is based in Boston, where she
  works as Arts Program Manager at Harvard's Mittal South Asia Institute. Her
  style fuses Nepali, Tibetan, and Japanese Buddhist mandalas with graffiti
  aesthetics and American abstract expressionism. She uses a disciplined
  breathing technique while painting.

  She is the first contemporary Nepali artist in the collection of the Museum of
  Fine Arts Boston. Her work is also in Harvard Art Museums, the Davis Museum,
  and the Worcester Art Museum. She has painted at MIT, created a monumental
  sculpture for the Isabella Stewart Gardner Museum, and won the James and
  Audrey Foster Prize from the ICA Boston (2025). Other clients include Google,
  Facebook, and Fidelity. Nepal's Cultural Council named her one of the
  country's 100 most influential women.

  For SHINE 2022, she painted at RetroTiques on Dr. MLK Jr. Street North.

searchBio: |
  She has a master's from Harvard. She founded Nepal's first Children's Art
  Museum. She paints mindful mantras in Devanagari script with spray paint.

  Sneha Shrestha works under the name IMAGINE. She was born and raised in Nepal
  and is based in Boston. She holds a Master's degree in Education from the
  Harvard Graduate School of Education, where she studied effective leadership
  in education and the intersections of creativity, learning, and technology.
  She is the Arts Program Manager at Harvard's Mittal South Asia Institute,
  where she works to amplify Asian art and culture.

  Her practice bridges her native Devanagari script with the visual language of
  graffiti handstyles. She is the first artist to mesh Nepali alphabets with
  American graffiti. Her style draws on Nepali, Tibetan, and Japanese Buddhist
  mandalas, Sanskrit scriptures, Turkish calligraphy, and American abstract
  expressionism. She works across painting, murals, and sculpture, moving
  between meditative abstraction and large-scale public intervention. In some
  bodies of work she foregrounds calligraphic repetition drawn from Sanskrit
  scriptures and immigration documents. In others she shifts toward
  architectural scale and sculptural presence in brass, steel, and
  site-responsive installation. Her central themes include cultural continuity,
  diaspora identity, guardianship, migration, and belonging.

  She is the first contemporary Nepali artist included in the Museum of Fine
  Arts, Boston permanent collection, with her painting Home416. Her show Mindful
  Mandalas was on view at the MFA Boston. Her sculpture Dwarpalika was acquired
  by the Harvard Art Museums and is on long-term view on the second floor. Her
  work is also in the collections of the Davis Museum, the Worcester Art Museum,
  Google, Facebook, Capital One, Fidelity Investments, Reebok, Neiman Marcus,
  TripAdvisor, Red Bull, Montana Cans, and Harvard.

  She was awarded the James and Audrey Foster Prize by the Institute of
  Contemporary Art (ICA), Boston, with the Foster Prize show running at ICA
  Boston in 2025-2026. She had a solo show, Forms and Foundations, at Aicon
  Gallery in New York in 2025, and a solo show, Ritual and Devotion, at the
  Cantor Arts Gallery, College of the Holy Cross in 2024. She participated in
  the group exhibitions Deities of Nepal II at the Nepal Arts Council (2024),
  Reimagine: Himalayan Art Now at The Rubin Museum (2024), and a 2024 exhibition
  at Wrightwood659 in Chicago. She was selected for a Studio Residency at the
  Boston Center for the Arts funded by the Wagner Foundation.

  Her monumental sculpture Calling the Earth to Witness was commissioned by the
  Isabella Stewart Gardner Museum. Her public art sculpture About a Living
  Culture in Queens, New York was included in Our Culture magazine's 5
  Innovative Examples of Public Art. She is the artist behind the landmark mural
  on an MIT building at the corner of Massachusetts Avenue and Main Street in
  Cambridge, MA. From August 2018 through September 2022, her mural Knowledge is
  Power was installed at Northeastern University along the concourse between Ell
  Hall and the Curry Student Center outside Gallery 360, using vibrant reds,
  blues, and gold drawn from the colors she would see in Nepal.

  Her honors include a grant from the Collective Futures Fund funded by the Andy
  Warhol Foundation (2024), the Artist of the Year Award from the Center for
  Arts at the Armory (2023), inclusion in WBUR The ARTery's 25 Millennials of
  Color (2019), recognition as one of the 100 most influential women in Nepal by
  the Nepal Cultural Council (2018), the Boston Artist-in-Residence Award
  selected by the Mayor's Office of Arts and Culture (2018), the HUBWeek Change
  Maker Award (2018), the South Asia and the Arts Fund Grant from Harvard
  University (2017), and the Project Zero Artist-in-Residence Award from Harvard
  University (2017).

  She has shown work and painted public walls across the United States,
  Indonesia, Istanbul, Switzerland, Denmark, and Kathmandu. Earlier in her
  career she worked at Boston's Artists for Humanity, an experience that pushed
  her toward dedicating her life to art, education, and social impact. She later
  established Nepal's first Children's Art Museum, a space where children and
  youth develop 21st-century skills through project-based art experiences. She
  was the Somerville Arts Council Artist of the Month in May 2020. She was
  profiled in the Boston Globe's The Questions feature in November 2020 and in
  The Huntington News in November 2018.

  For SHINE 2022, she painted at RetroTiques on Dr. MLK Jr. Street North.

  Website: imagine876.com. Instagram: @imagine876. Contact:
  imagine876@gmail.com.

searchMuralDescription: |
  A long parking-lot wall painted solid hot pink, covered with repeating columns
  of gold Sanskrit-inspired calligraphy. The metallic gold letterforms cascade
  downward in ornate clusters, with subtler red and pink swirls layered
  underneath. The effect is meditative and hypnotic — the same sacred text
  echoing across the entire wall like a visual chant.

