artistBio: |
  His great-uncle was Ralph Eugene Meatyard, the pioneering photographer. His
  grandfather Jerry was a metal sculptor. He is third-generation.

  Rhys Meatyard graduated from the Pinellas County Center for the Arts at Gibbs
  High School, then studied fine art and anthropology at Eckerd College. He has
  been a graphic designer and illustrator since 2007. He is also a former stone
  carver who designed tombstones and marble inscriptions, and has done high-end
  jewelry photography retouching.

  His style is digital and traditional — pop-culture-centric work with dark
  humor and surreal elements, watercolors, gouache, acrylics, colored pencils,
  and found ephemera like vintage maps and sheet music. He reimagines
  mythological figures into whimsical, irreverent character studies. He is a
  non-binary, trans-masculine artist who found his artistic voice in his late
  thirties after overcoming homelessness and single parenthood.

  He is art director for Friend Club Records and designed the logo for Meatyard
  Ybor, an affordable art studio complex in Ybor City. For SHINE 2023, he was an
  invited participating artist.

searchBio: |
  His great-uncle was Ralph Eugene Meatyard, the pioneering postmodern
  photographer. His grandfather Jerry Meatyard was a Tampa metal sculptor and
  lifelong art educator who taught at HCC Ybor for decades and helped found the
  El Sama art collective in Ybor City in the 1970s. His mother Laura Meatyard
  was a monument designer responsible for headstones and stone memorials across
  Florida. He is third-generation.

  Rhys Meatyard attended the Pinellas County Center for the Arts at Gibbs High
  School and studied fine art and anthropology at Eckerd College in St.
  Petersburg. He has worked as a graphic designer and illustrator since 2007,
  with a long parallel track in higher-end jewelry photography retouching, ad
  design, and catalog layout. He has worked from home for the past twelve years.
  He grew up watching his mother stencil cemetery stones and picked up the trade
  himself, designing tombstones and marble inscriptions — a fascination with
  letterforms he says is a big part of who he is.

  His path to making his own art was non-linear. He left home at 15, married at
  17, and was a single parent at 22. He went to school for visual art in his 20s
  while raising three children and working full time. In his mid-to-late 30s an
  identity crisis, an addiction to prescription pain medication, and a stint in
  detox forced a reset. He gave himself a five-year deadline to repair his
  family, find himself, and build a life worth living. He came through it, came
  out as non-binary and trans-masculine, transitioned, took his mother's family
  name, downsized, and went fully freelance to make time for art. He started
  consistently showing in 2019. He lost both his grandfather Jerry and his
  mother Laura in March 2016.

  He is creative director and art director for Friend Club Records, the
  independent record label for which he creates album art, print layouts for
  physical media, merch, and brand identities. He designed the logo for Meatyard
  Ybor — the future home of more than fifty affordable artist studios and
  gallery space in historic Ybor City, named after his grandfather. His
  freelance design work continues with logos and branding alongside the
  jewelry-industry retouching.

  His style blends digital and traditional media with dark humor and surreal
  twists on instantly recognizable images. He works in watercolors, gouache,
  acrylics, colored pencils, and found ephemera including vintage maps and sheet
  music. He often glues watercolor paper to wood panels. He reimagines
  mythological figures into irreverent character studies — the Fates as trans
  people; a spinning sun with the face of Jack Nicholson from The Shining. His
  cited subjects include cats, classical art, mythology, and a general sense of
  fun and irreverence. His personal icon is a t-bone steak.

  Documented works include "Hamburger Cop Jail" (2021), "Bomb Pops And
  Bentleys," "Peets of Despair," and "Cemetery Hangs Part of 'Blue Monday in
  Lothlórien.'" His widely shared digital piece "Always Hungry" is a Post Malone
  cartoon that plays on the rapper's face tattoo reading "Always Tired." He
  produced a line of soap art with scents including "Smelly Pits" and "Smoky
  Air," riffing on the pre-COVID music festival experience. For a 2019 Mize
  Gallery show he made a lenticular piece showing different images depending on
  viewing angle.

  He has participated in countless group shows locally and nationally, won
  several awards, and was an invited participating artist in the 9th annual
  SHINE Mural Festival in 2023. He was featured in the MIZE Gallery "SHINE YEAR
  7 ART EXHIBIT" in 2021. His first solo exhibition was in 2024. A new solo
  show, "Ceremony," opened March 16, 2026. Recent blog posts on themeatyard.com
  include "Self-Reflection, With a Side of Dumplings" (January 12, 2026), "Yet
  Another Horror" (January 8, 2026), and "AI: The True 'Art' Movement of Late
  Capitalism" (November 22, 2025).

  He has been profiled by The Gabber Newspaper ("The Off-Kilter World of Artist
  Rhys Meatyard," October 27, 2021, by Abby Baker) and CanvasRebel Magazine
  ("Meet Rhys Meatyard," September 19, 2022). His shop sells original art,
  museum-quality prints, stickers, soap, shirts, and a rotating selection of
  music from Friend Club Records.

  Website: themeatyard.com. Instagram: @the_meatyard. Facebook: meatyardart.
  Twitter: @TheMeatyard. Friend Club Records: friendclubrecords.com.

searchMuralDescription: |
  A dreamy pastel mural inspired by classical sculpture and 1970s prog rock
  album art. Blue-toned Greek and Roman statues stand on pedestals within a
  colonnade of soft lavender arches. As the scene moves right, the temple begins
  to break apart — columns float upward and the ground fragments — while the
  furthest figure steps off her base and gazes into golden sun rays breaking
  through pink and tan clouds. String lights hang across the top of the
  building.

