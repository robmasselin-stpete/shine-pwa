artistBio: |
  He started on the streets of Berlin at twelve. Years later he left his
  mark on the Morean Arts Center's outdoor gallery.

  Akut — Damir Tabakovic — is a graffiti artist based in Tampa Bay. He
  gathers ideas on the road, from buildings and from nature, and the
  results are abstract: bold color, hard angles, forms that read as birds one
  second and shards the next.

  In 2012 he and Center One painted a huge storm-and-lightning wall on a
  warehouse at 24th Street South and 5th Avenue South, one of the first
  pieces in the Warehouse Arts District's push to put art on the street. His
  part was a pyramid of red-orange arrows and blue diamonds built out of the
  letters of his name.

  By his own account he helped build the Morean's outdoor gallery. He took
  part in both of its Leave a Message shows, in 2012 and 2015, and in 2017
  the Morean picked him for 100 Years 100 Artists, its centennial roll call.

  He says he painted the west side of the Morean's main building. This fence
  runs along that side, and it carries his tag, ACUT, low on the metal.

searchBio: |
  Akut, also written Acut, is the tag of Damir Tabakovic, a graffiti artist
  living in Tampa Bay, Florida. Not to be confused with Akut (Falk Lehmann) of
  the German duo Herakut. Tabakovic began painting graffiti on the streets of
  Berlin, Germany, at age 12. He travels extensively and draws on architecture
  and natural elements for abstract work marked by bold color and unusual
  form, found in public places and private collections.

  In March 2012 Akut and Center One (Chris James) painted a large mural on a
  commercial warehouse at 24th Street South and 5th Avenue South in St.
  Petersburg's Warehouse Arts District, in a project set in motion by glass
  artist Duncan McClellan and sculptor Dan Painter, with invitations issued by
  Central Art Supply owner Pat Jennings. The wall showed a dark landscape of
  storm clouds and lightning with homages to neighbouring studios; Akut's
  contribution was a pyramidal mass of red-orange arrows and blue diamonds
  based on the letters of his name.

  By his own account, at the Morean Arts Center he created the art on the
  west side wall of the main building and collaborated with the artist Dolla on the north wall of the
  Hot Shop. He exhibited in the Morean's Leave a Message exhibitions in 2012
  and 2015, and was one of the artists in 100 Years 100 Artists (May 13 –
  June 25, 2017), the exhibition marking the Morean's centennial.

searchMuralDescription: |
  A long spray-painted mural on a corrugated-metal fence along a gravel
  parking lot, with the white Morean Arts Center building and its red "m" logo
  rising behind it. Sharp, angular, origami-like birds and shard figures in
  red, orange, yellow, pink and teal fly across the wall. Behind them are dark
  misty mountain ridges and big triangle and pyramid shapes — a yellow
  triangle on the left, a pink-and-grey striped wedge in the middle, and a
  teal pyramid with a dark sky on the right. The signature "ACUT..." is
  painted in white on a blue band low on the fence.

