searchMuralDescription: |
  A long warehouse wall covered in a pack of oversized panda bears piled on top
  of each other against a black background. The pandas are rendered in gritty
  black and white with exaggerated features — bloodshot pink eyes, bared fangs,
  and massive claws. Some snarl at the viewer while others sleep with one eye
  cracked open. Bright green bamboo leaves poke through the tangle of fur and
  limbs. The scale is enormous — each panda is taller than a parked truck.

