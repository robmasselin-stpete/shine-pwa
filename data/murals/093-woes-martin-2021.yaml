artistBio: |
  His signature character is a stressed-out panda. It represents struggle and
  perseverance. There is also a hipster Chewbacca.

  Aaron "Angry Woebots" Martin — Woes — was born and raised on Oahu, Hawaii.
  Self-taught through graffiti, hip hop, and comics. He paints acrylic on wood
  and canvas in minimal color palettes with detailed character design, plus
  aerosol murals, resin sculptures, and vinyl toys.

  Clients include Kidrobot, Disney, Converse Red, Samsung, New Era, and Fitted
  Hawaii. He has shown at Urban Nation in Berlin, Comic-Con, Designer Con, and
  Singapore Toy Con. Festival credits include POW! WOW! Hawaii, Murals in the
  Market in Detroit, and the Heineken Mural Project.

  For SHINE 2021, he painted in St. Petersburg.

searchBio: |
  His signature character is a stressed-out panda. It represents struggle and
  perseverance. There is also a hipster Chewbacca.

  Aaron "Angry Woebots" Martin — also known as Woes Martin or simply Woes — was
  born on the Hawaiian island of Oahu. He spent most of his childhood in
  Southern California, then moved to Nevada, before landing back in Hawaii
  during his junior year of high school. He is self-taught and has no formal art
  education. His earliest experiences in the graffiti scene came as a kid
  growing up in Southern California and Las Vegas in the late 1990s. Saturday
  morning cartoons, kung fu, comic books, and hip hop culture pulled him into
  making things from an early age, and graffiti followed from there.

  In 2009, Woes picked up a can to paint in public, beginning with the iconic
  panda characters that became his moniker in cities across the globe. The
  pandas appear under some kind of emotional stress — detailed, character-driven
  figures rendered in vibrant or minimal color palettes depending on the piece.
  Beyond the pandas he also paints a hipster Chewbacca character. His mediums
  include acrylic paintings on wood and canvas, aerosol murals, resin
  sculptures, and vinyl toys.

  Clients include Kidrobot, Disney, Converse Red, Samsung, New Era, Fitted
  Hawaii, and Mind Style. His work has been published in magazines in the United
  States, Japan, and Europe. Despite having no formal education himself, Aaron
  has given lectures at schools and spoken at universities around the US,
  contributing to youth arts education.

  Exhibition history includes Urban Nation Museum for Urban Contemporary Art in
  Berlin, where his work was featured in the 2018 exhibition UN-DERSTAND The
  Power of Art as a Social Architect. The Urban Nation museum sits at
  Bülowstrasse 7, 10783 Berlin, Germany. He has also shown at Comic-Con,
  Designer Con, and Singapore Toy Con.

  Festival credits include POW! WOW! Hawaii, Murals in the Market in Detroit,
  and the Heineken Mural Project. Murals in the Market is run out of 1xRUN at
  1410 Gratiot Avenue / 2905 Beaufait St in Detroit, Michigan, and his
  appearance there placed him alongside artists including Askew, Beau Stanton,
  Brian Lacey, Denial, Ellen Rutt, Eugene Carland, Fel3000ft, Hannah Stouffer,
  Hebru Brantley, Hygienic Dress League, Jeff Soto, Maxx242, Jonny Alexander,
  Kashink, Kobie Soloman, Luke Chueh, Marlo Broughton, Meggs, Michelle Tanguay,
  Miss Van, Monica Canilao, Naturel, NNII, Noségo, Ouizi, Patch Whiskey, Persue,
  Kwest, Jarus, Ron Zakrin, Rone, Ryan Doyle, Shaina Kasztelan, Shark Toof,
  Sydney G. James, Taylor White, and Tead.

  For SHINE 2021, he painted in St. Petersburg.

