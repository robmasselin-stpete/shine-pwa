artistBio: |
  She had never painted a mural before April 2020. She painted her first one on
  plywood covering a boarded-up business during lockdown. It went viral.

  Stevie Shao is a second-generation Chinese American whose parents immigrated
  from Shanghai in the 1990s. She grew up in Seattle's Magnolia neighborhood,
  one of few Asian-American students in predominantly white schools. She studied
  interior design at Seattle Pacific University, where an illustration course
  under professor Rachell Sumpter introduced her to Chinese-American
  illustrators and changed her trajectory. She worked as an interior designer at
  a Seattle architecture firm until she was laid off in the summer of 2020. She
  has not gone back.

  Her style is vibrant and saturated — hot pink, marine blue, kohl black.
  Flattened two-dimensional forms inspired by folk art, Chinese ceramics,
  traditional American tattoos, and Pacific Northwest wildlife meeting Chinese
  folklore. Seattle Magazine named her one of the city's 25 Most Influential
  People reshaping the region.

  The client list came fast: Anna Sui used her designs in a fashion collection.
  Starbucks Reserve commissioned an exclusive artist merchandise line. The
  Seattle Kraken had her design their Women in Hockey jersey. Then Google,
  Nordstrom, REI, Sub Pop Records, Russell Wilson.

  For SHINE 2024, she painted at the Volunteers of America building on 5th
  Avenue South.

searchBio: |
  She had never painted a mural before April 2020. She painted her first one on
  plywood covering a boarded-up business during lockdown. It went viral.

  Stevie Shao is a second-generation Chinese American whose parents immigrated
  from Shanghai in the 1990s. The family settled in Seattle, and Shao and her
  sister Tori grew up in the Magnolia neighborhood. Her parents wanted the girls
  to assimilate, and Shao remembers having only one Asian-American classmate in
  elementary and middle school. The art she encountered as a kid was almost
  entirely Eurocentric. She painted intricate watercolor and acrylic scenes, but
  did not see art as a viable career.

  She studied interior design at Seattle Pacific University. An illustration
  course there with professor Rachell Sumpter, a Seattle illustrator herself,
  changed the trajectory. Sumpter sent Shao links to Chinese-American
  illustrators across multiple generations — the first time Shao saw people who
  looked like her doing work she could see herself doing. At SPU she became art
  director of Lingua, the student-run quarterly art and literary magazine, and
  instead of a standard 11x17 photocopy poster she blew her promo up to roughly
  11x14 feet across a wall of the art center. She freelanced as an illustrator
  and graphic designer for local brands and musicians, including Parisalexa,
  while still in school. After graduating she worked as an interior designer at
  a Seattle architecture firm housed in the City Centre building downtown. She
  was laid off in summer 2020 and has not gone back.

  The first mural was a last-minute April 2020 assignment from the Ballard
  Alliance, a neighborhood business group she had done freelance work for in
  2019. She painted a black cityscape on a white background with swoopy pink
  letters reading "It's gonna be ok" on plywood along Ballard Avenue. She
  painted three in total along the street during the first months of the
  pandemic. The image moved fast on Instagram. Devin Reynolds of the Ballard
  Alliance hired her for the others.

  Her style is vibrant and saturated — Barbie pink, kohl black, marine blue,
  Pepto-Bismol pink, lipstick red. Flattened two-dimensional forms inspired by
  folk art, Chinese ceramics, traditional American tattoo flash (mermaids,
  anchors, panthers), and Pacific Northwest wildlife meeting Chinese folklore
  and morality tales. Negative space is shrunk to horror vacui density;
  decorative florals function as main characters alongside beasts and birds. She
  researches ecosystems and species and pulls from Instagram accounts cataloging
  traditional textiles from different regions. She talks about her murals as
  universes with recurring characters, a "world building" approach where symbols
  reappear in new combinations to tell different stories.

  Murals across Seattle followed quickly: a warm-toned firebird and flowers at
  Phở Bắc Sup Shop in Rainier Valley, based on a Vietnamese folktale the owners
  told her; a bull, horse and crane at Re:Public bar and restaurant in South
  Lake Union; Northwest marine mammals, fish and birds wrapping the Metropole
  building in Pioneer Square; a deer-and-rabbit piece at Cal Anderson Park about
  mutualistic alarm and feeding systems; a tiger and phoenix live-painted in
  Hing Hay Park during the Chinatown-International District Celebration on
  August 7, 2021; a piece for Overcast coffee; a mobile food pantry for Family
  Works in veggie-green pattern; a Capitol Hill, Belltown, and International
  District presence; and a collaboration with the street art nonprofit Urban
  ArtWorks. She painted a mural for the Showbox in SoDo. Her largest to date
  wraps three façades of the building housing University Book Store, a menagerie
  of mythical creatures. She also painted the Crossroads building on the UW
  campus through extreme weather and a fractured timeline.

  She and her sister Tori Shao designed wayfinding signs and murals for the City
  Centre building in downtown Seattle — a return to the building she had been
  laid off from. With Monyee Chau she made an installation at the Wing Luke
  Museum, 兩隻老虎, featuring two tigers from a Chinese nursery rhyme. She
  collaborated with Lauren YS (@squid.licker) on "Enter the Dragon," an homage
  to Bruce Lee on the top floor of the historic Railspur building, made for
  Forest for the Trees. She painted at Alethia Tanner Park in Washington, DC as
  part of the DC Walls mural festival, and at Long Beach Walls in California.
  She showed at the Limelight two-day art show at Lake Union Park (August 21-22,
  2021) for Seattle Design Fest, alongside Nikita Ares, Colleen Louise Barry,
  and Mary Anne Carter. She made protest graphics during the George Floyd
  protests and the rise of anti-AAPI hate crimes, which connected her to other
  artists of color in the city.

  The client list came fast. Anna Sui discovered her on Instagram and used her
  designs — a pink moon, a white-lettered "Take Care" — for T-shirts, totes and
  pouches in the Anna Sui spring/summer 2021 ready-to-wear collection. Starbucks
  Reserve commissioned an exclusive artist merchandise line through the
  Starbucks Art Program — a serving tray, tote, mug, T-shirt, bandana and
  decorative bowls drawing on Chinese-American folklore, Northwest wildlife, and
  the biodiversity of South American coffee-growing regions, featuring a jaguar,
  butterflies, trees and flowers. The Seattle Kraken commissioned the 2022 Women
  in Hockey jersey. Other work: Google, Nordstrom, REI, Sub Pop Records
  (tide-pool tote bags), Russell Wilson (shoes), the Seattle Seahawks, Throw &
  Co. (a jacquard blanket), Monorail Espresso, Chong the Nomad (poster for the
  sold-out Barboza reopening), a Seattle Artist Relief fund benefit,
  welcome-back banners for Downtown Seattle, and labels for a French beer
  company including the "Monsta Passionista" sour with a pink-winged deer and
  yellow-polka-dotted boar.

  Cascade PBS / Crosscut called her Seattle's breakout muralist in August 2021,
  when she was 23. Seattle Magazine named her one of the city's 25 Most
  Influential People reshaping the region in its January/February 2023 issue.
  Her studio is a narrow two-story building behind her parents' Magnolia house.
  She also keeps studio space in Ballard.

  For SHINE 2024, she painted at the Volunteers of America Florida Innovare
  building at 850 5th Avenue South in St. Petersburg, during the festival
  running November 8-17, 2024.

  Website stevieshao.com. Instagram @stepfrae.

searchMuralDescription: |
  A multi-story mural on the side of the Volunteers of America building
  depicting a sinuous, serpentine dragon in bold navy blue, red, gold, and
  turquoise against a white background. The dragon coils upward across the full
  height of the building, its body decorated with pink scalloped scales and
  chartreuse dots. Two stylized birds with spread wings — one near the top and
  one at the bottom — intertwine with the dragon's twisting form. Blue flames
  curl from the dragon's mouth. The flat, graphic style draws on Chinese folk
  art and traditional tattoo aesthetics. Signed "Stevie Shao 24" in the lower
  right corner.

