artistBio: |
  The microscopic creatures swirling on this wall? She studied them live, under
  microscopes inside the Discovery Center — then painted them on the outside.

  Naomi Haverland grew up in Denver, lived in Seattle, and is now based in
  Florida. She has been painting since childhood and doing chalk art
  specifically since 2011. No formal art education — she credits mentors and the
  broader mural community, and emphasizes paying it forward.

  Her specialty is hyper-realistic large-scale portraits — candid, exaggerated
  human expression with unexpected props and pop-culture references. She favors
  children and elderly as subjects and adds humor wherever the image allows. She
  also creates anamorphic pavement illusions. She draws inspiration from "things
  some people might think of as defective" — distinctive body types, recycled
  materials, religious themes.

  Clients include Microsoft, Amazon, Harley Davidson, Skittles, 7-Eleven, Blick
  Art Supply, and Uber. She has been invited to chalk art festivals in Germany,
  Canada, and Mexico. Her signature piece, "Ring Pop" (2014), features her
  daughter Roxanne holding a glowing green candy ring.

  For SHINE 2024, she partnered with Tampa Bay Watch to paint a ring of plankton
  species found in Tampa Bay at the Discovery Center on the St. Pete Pier.

searchBio: |
  She is self-taught. She has seven awards from the Denver Chalk Art Festival
  alone.

  Naomi Haverland grew up in Denver, Colorado, lived in Seattle, and is now
  based in Florida — Maitland and Titusville have both been listed as her home
  base. She has been painting for as long as she can remember and has been doing
  chalk specifically since 2011. No formal art education. She credits art
  mentors and the broader artist community, and emphasizes paying it forward.
  Her primary mediums are acrylics, oils, and chalk. In the summer she focuses
  on oil painting in her studio.

  Her specialty is humorous, hyper-realistic large-scale portraits — candid,
  exaggerated human expression rendered in bold color, often with unexpected
  props and pop-culture references. She also creates anamorphic "3D" pavement
  illusions. She favors children and elderly subjects and adds humor wherever
  the image allows. She draws inspiration from "things some people might think
  of as defective" — distinctive body types, recycled materials, religious
  themes, her own children, garbage, and Jesus. She belongs to the Scum of the
  Earth Church and describes her art as an extension of her relationship with
  God. One of her recurring models is Little Miss Firefly, who is 21 inches
  tall. Another is Marlene, whom she met while painting a mural with the
  disabled employees of ARC Thrift Stores for an auction.

  Her chalk art has won seven awards at the Denver Chalk Art Festival in
  Colorado, including Best Color in 2012 and People's Choice in 2013. She
  returned to the festival in 2014 (held May 31 and June 1, sponsored by ARC
  Thrift Stores) to draw Marlene. She has been invited to national and
  international chalk art festivals in Germany, Canada, and Mexico. Commercial
  clients include Microsoft, Amazon, Harley Davidson, Skittles, 7-Eleven, Blick
  Art Supply, and Uber.

  Her signature piece, "Ring Pop" (2014), features her daughter Roxanne posing
  larger-than-life with a glowing green candy ring. Roxanne is her "mini-muse" —
  the artist has said she has never done a literal self-portrait but uses
  portraits of her daughter to similar effect. She also has a son, who is less
  interested in art. In May 2014, T Gallery Denver — half gallery, half teahouse
  — featured her child-inspired paintings in a Mother's Day exhibit titled "A
  Mother's Muse," opening Friday, May 2 with a reception from 6 to 9 p.m.
  Ten-year-old Roxanne ran a portrait booth at the opening. The show included a
  new portrait of Dame Edna, the character created by Australian comedian Barry
  Humphries, with her signature "wisteria hue" hair and glasses, alongside a
  "face furniture" station where attendees could create their own glasses.

  Outside of paintings she works in recycled materials — outdoor installations
  made from tires and hubcaps, an ongoing "cap fence" of plastic bottle caps
  screwed to her fence, and a constantly evolving treehouse built with her kids
  from free Craigslist finds.

  Mural and festival credits include "Texas Rose" for the Arts Center of Brazos
  Valley (ACBV) in College Station, Texas — a rose paired with a composite bug
  rendered in her signature jeweled style with metallic and iridescent textures,
  sited on the wall of a flower shop. For Paint The Park in Allen Park (a
  community-driven mural project run by the Allen Park DDA that has produced
  eight murals downtown), she painted "Nuts Now" — a young astronaut surrounded
  by swirling candy and sweets on the side of the Nuts Now building. She is part
  of the Beyond Walls roster, with a wall at 25 Washington Square in Haverhill,
  Massachusetts. In May 2023 she was featured in the Sioux City Journal article
  "Artist adds finishing touches to Heidman Law Firm mural." Earlier press
  includes "Giant Tiger Mural Roars a Colorful Bouquet of Flowers" in My Modern
  Met (December 2020), "Meet Naomi Haverland" in Voyagela.com (September 2019),
  "Six Questions with Naomi Haverland" by Helikon Gallery (Helikongallery.com,
  February 2016), and the Denver Westword profile "Naomi Haverland on the
  strange things that inspire her" by Jamie Siebrase (April 28, 2014).

  For SHINE 2024 she partnered with Tampa Bay Watch to paint a ring of plankton
  species found in Tampa Bay at the Discovery Center on the St. Pete Pier.

  Website: naomihaverland.com. Instagram: @naomihaverland. Facebook:
  NaomiHaverlandchalkart.

searchMuralDescription: |
  A swirling oval wreath of brilliantly colored microscopic plankton organisms
  on a deep teal-blue background. The composition features hyper-realistic
  renderings of shrimp larvae, diatoms, radiolaria, copepods, and other
  planktonic creatures, painted with luminous, almost bioluminescent coloring.
  Bubbles drift through the arrangement. Each organism is rendered at enormous
  scale with scientific precision and vivid detail, transforming Tampa Bay's
  invisible marine biodiversity into monumental wall art. Signed @NaomiHaverland
  with the SHINE Mural Festival logo.

