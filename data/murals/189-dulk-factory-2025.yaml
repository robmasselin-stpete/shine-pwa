artistBio: |
  One side: a Florida panther and a wild boar sprint through vegetation. The
  other side: a manatee with a flower-headed figure on its back. Before he
  painted, he went up the Weeki Wachee River with the Florida Wildlife Corridor
  Foundation to see them in real life.

  Antonio Segura Donat — Dulk — grew up in Valencia, Spain, copying exotic
  animals from his parents' old encyclopedias. At nineteen, while studying
  economics at the University of Valencia, a friend dragged him into the
  graffiti world. Within a year he dropped economics for illustration.

  He builds surreal ecosystems on walls — animals, plants, and invented hybrid
  creatures layered into dense, dreamlike compositions saturated with color. The
  scenes look fantastical but are rooted in real ecology; he researches every
  local ecosystem before painting it.

  His murals span Berlin, Paris, Las Vegas, Miami, and Vancouver. He is a
  National Geographic Expeditions expert and a Liquitex-sponsored artist. For
  Las Fallas 2022 in Valencia he built "Protegeix Allò que estimes" (Protect
  What You Love), a 23-meter polar bear sculpture. The Factory commission was
  curated by Jenee Priebe of No Good Deeds Art and supported by the Florida
  Wildlife Corridor Foundation.

searchBio: |
  Antonio Segura Donat — Dulk — born 1983 in Valencia, Spain. Studied
  illustration in Valencia after dropping out of an economics degree at the
  University of Valencia. Surreal nature murals around the world. National
  Geographic Expeditions expert. Liquitex-sponsored artist. Las Fallas 2022
  monumental sculpture ("Protegeix Allò que estimes" — 23-meter polar bear).
  Exhibited at Thinkspace Projects (LA, "Legacy" solo show 2018), Moniker Art
  Fair (London, 2017).

  St. Pete mural at The Factory commissioned by The Factory St. Pete and St.
  Pete Athletic, curated by Jenee Priebe of No Good Deeds Art, supported by the
  Florida Wildlife Corridor Foundation.

  Instagram: @dulk1.

searchMuralDescription: |
  A two-sided mural wrapping St. Pete Athletic at The Factory campus, visible
  from the Pinellas Trail. One face shows a Florida panther and wild boar
  sprinting through stylized vegetation against a warm yellow-orange sky, with
  birds and leaves in motion. The other face depicts an underwater scene in deep
  teal — a manatee swimming through the water surrounded by fantastical sea
  creatures, a flower-headed figure riding on its back, fish schools, and
  bubbling marine life. Both sides are rendered in Dulk's signature surrealist
  style with dense layering of real and imagined species.

muralInspiration: "Celebrates Florida's biodiversity — the artist researched native species with the Florida Wildlife Corridor Foundation before painting."
