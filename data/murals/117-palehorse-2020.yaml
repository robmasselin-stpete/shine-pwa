artistBio: |
  He co-founded SHINE with his wife Michelle. He has also designed gig posters
  for Foo Fighters, Queens of the Stone Age, Iggy Pop, and Jimi Hendrix.

  Chris Parks — Palehorse — earned a BA in Graphic and Interactive Communication
  from Ringling College of Art and Design. His style is intricate digital
  illustration blending Eastern mysticism, sacred iconography, esoteric
  symbolism, and global mythologies. His practice is rooted in Kriya Yoga — he
  hosts weekly meditation circles called "Seekers of the Eternal."

  Clients include National Geographic, Nike, Mini Cooper, FX, World of Warcraft,
  Hasbro, Under Armour, WWE, Harley Davidson, Red Bull, Wired Magazine, and DC
  Comics. He was featured in the Dali Museum and co-created the FloridaRAMA
  immersive art experience.

searchBio: |
  He co-founded SHINE with his wife Michelle. He has also designed gig posters
  for Foo Fighters, Queens of the Stone Age, Iggy Pop, and Jimi Hendrix. Chris
  Parks works under the name Palehorse (also styled Pale Horse) and is based in
  St. Petersburg, Florida. He earned a BA in Graphic and Interactive
  Communication from Ringling College of Art and Design. In 2006 he opened his
  own studio, Pale Horse Design.

  In 2015, Chris and Michelle Parks were founding members, curators, and
  organizers of the Shine Mural Festival in St. Petersburg. The festival brought
  world-renowned mural artists to the city during a period when many local shops
  and businesses were closing due to the recession, and it has continued to
  reshape the streetscape of St. Petersburg since.

  Palehorse's commissioned client list spans entertainment, apparel, beverage,
  gaming, and lifestyle brands, including National Geographic, Nike, Mini
  Cooper, FX, DC Snowboards, X-Games, World of Warcraft, G.I. Joe, Transformers,
  Arnette Sunglasses, Under Armour, WWE, Brisk Iced Tea, Modelo, Jagermeister,
  Bud Light, PBR, Live Nation, Hasbro, Harley Davidson, Red Bull, Wired
  Magazine, DC Comics, Iron Fist, Vans, Etnies, and The Cartoon Network. He has
  also created officially licensed, screen-printed gig posters for Foo Fighters,
  Queens of the Stone Age, Puscifer, 108, Converge, Primus, Iggy Pop, Jimi
  Hendrix, and Rush. Named poster and album projects include the Aftershock
  Festival gig poster (2017), the Foo Fighters gig poster (2017), the EXPO LUCHA
  screen-printed event poster (2018), the 108 "Threefold Misery" album artwork
  (2016), the Sonic Temple festival entrance artwork (2019), the DC Snowboards
  "Space Echo" graphic (2017), the "Moment of Death" laser engraving (2015), the
  "Kali The Destroyer" artwork (2018), and the "Tiger Tamer" digital
  illustration (2025). His gallery and illustration work includes pieces such as
  La Calavera Catrina, Japanese Koi, the 7 Skate Deck Totem, Yami, The Pale
  Horse, The Book of Five Rings, Geisha Samurai, a Super7 Florida x Pale Horse
  collaboration, Zap Skimboards board graphics, and a Baroness/Torche gig
  poster.

  His work has been exhibited in local, national, and international galleries,
  and shown at the Salvador Dali Museum in St. Petersburg, Florida. He has
  created entrance artwork for some of the largest music festivals in the world.
  He co-created the FloridaRAMA immersive art experience.

  In St. Petersburg, his Saraswati Goddess mural — a 50 by 30 foot piece on the
  Floridian Social Club, a historic music venue — was painted in August 2020.
  The mural depicts the Hindu goddess Saraswati, who symbolizes knowledge,
  music, art, speech, wisdom, and learning, traditionally shown with four arms
  representing mind, intellect, ego, and consciousness, holding a veena. He
  painted it with his brother Matthew Parks and Cat Gomez. He has also painted
  Pro Wrestling and Muay Thai dojo murals (2024).

  Beyond brand and mural work, Palehorse designs masked pro wrestling personas
  for luchadors, including AEW's Serpentico and Arena Mexico's CMLL star
  Oraculo. He has participated in self-initiated projects such as Back in Black,
  a live printing t-shirt exhibit featuring top apparel artists from around the
  world, and ran Golden/Black, a royalty-free stock vector art and fonts
  website. He has curated, hosted, and participated in gallery exhibits
  throughout the year.

  His personal practice is rooted in Kriya Yoga. Since 2018 he has hosted a
  weekly local meditation circle called Seekers of the Eternal. He describes the
  current direction of his work as drawing from global mythologies, archetypes,
  esoteric symbolism, and personal devotion, with each form treated as a
  vibration and each symbol as an opportunity for inner reflection. The work is
  intended to function as both invocation and offering, whether displayed in
  museums, galleries, personal spaces, on T-shirts, or in city streets.

  With more than 20 years of experience as a professional artist, his catalogue
  blends intricate digital illustration with Eastern mysticism, sacred
  iconography, esoteric symbolism, and global mythologies. Contact:
  chris@palehorsedesign.com. Website: palehorsedesign.com. Instagram:
  @palehorse.

searchMuralDescription: |
  A massive black-and-gold mural depicting Saraswati, the Hindu goddess of
  knowledge and the arts. The multi-armed figure plays a veena (stringed
  instrument) at center, surrounded by extraordinary ornamental detail — a swan
  on the left, a peacock on the right, an Om symbol above, and the word
  "सरस्वती" (Saraswati) in Devanagari script. The entire composition is rendered
  in white and gold linework on a jet-black background, giving it the quality of
  an illuminated manuscript at building scale.

