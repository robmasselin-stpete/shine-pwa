artistBio: |
  Eduardo "Eddie" Rivera wrote graffiti first and picked up tattooing second,
  and has kept at both for more than 25 years. Ask Starve what the best part
  of graffiti is, though, and the answer is the company: painting and joking
  around with a crew.

  Rivera was born and raised in Key West, to Cuban immigrant parents, and says
  he has drawn and painted "since I could walk." Sketchbooks came before
  everything. He started writing graffiti at about 18, under names that
  included "Tooth" and "Eat." Starve is the one that stuck, for about ten
  years now, repping MSG out of Miami and STP out of Los Angeles. Tattooing
  came next. After ten years as a burnt-out tattoo artist, he says, graffiti
  made him love art again. He still tattoos, at Stigma Ink in Tampa.

  The crew runs wide. Hiero Veiga is "probably the dude I've collaborated with
  the most," he says, and the two call themselves "the odd couple, P.I.G.,
  Partners in Grime." Oz is another regular partner. He would rather paint
  with a good person than with someone Instagram has crowned a good painter.
  He and Eric "Artist Esh" Hornsby go back at least to 2018, when both worked
  on a Tampa Heights wall that Creative Loafing photographed.

  His characters swing between realistic and cartoon. Character work, he says,
  "is how I make up for my lack of hand styles," and portraits are his
  favorite puzzle. Some of it runs dark on purpose: if there's room on a wall
  for pretty, he reasons, there's room for this too. At one crowd-voted art
  battle in downtown St. Pete, he and Oz painted an apple with a bite missing
  and its insides spilling out. The other teams painted hibiscus and parrots.
  The crowd voted for the apple.

  Starve was on the 2019 Tampa Bay Fresh Fest roster and the 2024 Secret Walls
  bill at the Florida State Fair. For SHINE 2026, the festival's twelfth year,
  he is painting a wall at 939 Dr. MLK Jr St S, the same address as Esh.

searchBio: |
  Eduardo "Eddie" Rivera wrote graffiti first and picked up tattooing second,
  and has kept at both for more than 25 years. Ask Starve what the best part
  of graffiti is, though, and the answer is the company: painting and joking
  around with a crew.

  Starve is the graffiti name of Eduardo "Eddie" Rivera, a graffiti writer,
  character painter and tattoo artist in Florida. He was born and raised in
  Key West, to Cuban immigrant parents, and says he has drawn and painted
  "since I could walk." By the SHINE artist record, he has been a graffiti
  artist for over 30 years and a professional tattoo artist for 26. Sketching,
  drawing and black books came before everything, and still do. He has written
  graffiti on and off since about 18, and has also written "Tooth" and "Eat."
  Starve is the name he has written longest and most consistently, for about
  ten years. In hindsight, he says, a good letter combination instead of a
  food theme would have made things easier, but no one else seems to write the
  same name. Starve has taken on other meanings since, he says, "mostly as a
  form of humility."

  He primarily reps MSG out of Miami, put down by Nerve, and also reps STP out
  of Los Angeles. Graffiti came first, then tattooing. Murals first suggested
  that art could be a living. Tattooing proved it. After ten years as a
  burnt-out tattoo artist, he says, graffiti made him love art again,
  tattooing included. He still tattoos, at Stigma Ink in Tampa, which lists
  Eddie Rivera on its artist roster.

  The crew runs wide. Hiero Veiga is "probably the dude I've collaborated with
  the most," he says, and the two call themselves "the odd couple, P.I.G.,
  Partners in Grime." He names Oz (@worx_of_oz), Ceser87, Gus Cutty and Hoxxoh
  among other collaborators. He would rather paint with a good person than
  with someone Instagram has crowned a good painter. He and Eric "Artist Esh"
  Hornsby go back at least to 2018, when Creative Loafing Tampa ran a photo of
  a Tampa Heights mural by Starve, Zulupainter1, Skylar Suarez, Eric Hornsby
  and Zeros, as the kind of wall Tampa Bay Fresh Fest wanted to see more of.
  His advice to younger writers: keep producing, avoid trends, be as original
  as possible, and never take advice from another writer.

  His characters swing between realistic and cartoon. Character work, he says,
  "is how I make up for my lack of hand styles," and a distraction from
  letters that can run weak, though he respects writers who do letters well
  and takes on the challenge of doing them right. He is fine being the
  character guy on a production, as long as that does not also mean being the
  background guy. He loves portraits and characters and figuring them out, and
  finds it funny when letter writers say they cannot paint characters. They
  can, he tells them.

  Some of the work runs dark on purpose. In a 2024 Bombing Science interview,
  he called the gore "a direct response to all the street art festival" habit
  of "a pretty girls face surrounded by flowers and calligraphy." If there's
  room on a wall for pretty, he reasons, there's room for this too. He cites a
  statistic, from memory, that horror movies have been most popular when
  society is in the worst shape. The imagery has drawn objections, he says,
  from the city and from other graffiti artists who will not paint devil
  imagery or death.

  At one crowd-voted art battle in downtown St. Pete, six teams competed. He
  and Oz painted an apple with a bite missing and its insides spilling out,
  "really graphic and visceral." The other teams painted hibiscus, parrots and
  other crowd-friendly tropical scenes. The two expected to lose. The crowd
  voted for the apple. The experts, he concludes, cannot call it. In 2022
  UnknownKnowItAll x Oz Fua was an official team in the St. Pete Art Battle.

  The Tampa Bay record runs back years. In 2019 Starve was on the Tampa Bay
  Fresh Fest roster at Southeastern Seating, 903 E. 17th Ave., Tampa. In
  February 2024 he was among the Tampa Bay locals in the Secret Walls
  competition at the Florida State Fair.

  For SHINE 2026, the festival's twelfth year, he is painting a wall at 939
  Dr. MLK Jr St S, the same address as Eric "Esh" Hornsby.

