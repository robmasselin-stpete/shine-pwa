  Two hands — one lighter, one darker — form a heart on this wall. Concentric
  rainbow hearts radiate inward toward a small awareness ribbon. Colorful
  silhouettes of diverse people flank both sides. This is a community/awareness
  piece — graphic silhouettes and flat color rather than Posner's usual
  photorealism — celebrating connection, diversity, and care.

  Melanie "Mel" Posner was born around 1993 in a small town just outside
  Philadelphia. She moved to Tampa in 2013 and earned her BFA in Painting from
  the University of Tampa in 2016, where she also studied art therapy. She was
  previously based in Gulfport, Florida, and is now in Los Angeles. Her usual
  style is photorealistic portraits of women — oversized expressive eyes,
  vibrant rainbow color palettes, psychedelic paisley backgrounds, floral
  elements. She blends lifelike detail with touches of dreamy surrealism. She
  works in oil on canvas, collage, prints, and large-scale murals. She sources
  her subjects from Pinterest, Google, and social media, looking for eyes,
  story, and confidence. "Working large is just really exciting," she says. "I
  feel like I'm a little bit more free doing murals." Her stated philosophy:
  paint strong, confident, independent women to be inspired by them.

  Commercial clients include Walt Disney World (scenic artwork for Star Wars:
  Galaxy's Edge at Hollywood Studios, Orlando), New Belgium Brewing (the
  eighteen-foot Hollander Hotel mural of a woman in a red headscarf with a glass
  of Mural Agua Fresca Cerveza, completed in under five days), Amazon Prime
  Video (a mural on a promotional bus for Tampa Baes), and TikTok. For TikTok's
  2024 "Create the Future" campaign, she painted a forty-foot mural on the LGBT
  Center of Los Angeles at 8745 Santa Monica Blvd in West Hollywood.

  She was a cast member on all eight episodes of Tampa Baes (Amazon Prime Video,
  2021), a docuseries about a Tampa Bay lesbian friend group produced by 3 Ball
  Productions and filmed over roughly ten weeks starting April 2021. Her oil
  painting "Passion" (also called "Summer and Marissa") appears on screen. She
  worked for years as a bartender at The Honey Pot, a landmark LGBTQ+ club in
  Ybor City, Tampa.

  Other St. Petersburg walls include: the Mint House at 77 11th St N (a 2023
  commercial commission — a woman in giant reflective sunglasses with the
  waterfront skyline reflected in the lenses, polka dots, palm trees), the Iryna
  Zarutska memorial mural on the 2200 block of Central Ave (a 2026 portrait of
  the 23-year-old Ukrainian refugee killed on the Charlotte light rail in August
  2025; mint-to-gold background, pink hibiscus), and her SHINE 2018 Open Call
  mural "New Beginnings" at 4139 7th Terrace South — twenty-three feet high by
  sixty-five feet long, a photorealistic woman lying horizontally on her side,
  her hand cupping the right side of her face, one eye peeking through her
  fingers. She has exhibited at Enigma gallery in downtown St. Petersburg.

  Instagram: @therealmelpoz. Website: melanieposner.com. Signed @therealmelipoz
  at lower right of this wall.

searchMuralDescription: |
  Two hands — one lighter-skinned, one darker-skinned — form a heart shape at
  the center of a white cinder block wall. Inside the heart, concentric
  rainbow-colored hearts radiate inward toward a small awareness ribbon at the
  center. Flanking the hands on both sides are overlapping silhouettes of people
  in profile — men and women with different hairstyles and builds — rendered in
  bold, flat colors: yellow, green, pink, magenta, blue, teal, orange, and red.
  The silhouettes layer and overlap transparently, creating rich color
  intersections. Signed @therealmelipoz at lower right.

