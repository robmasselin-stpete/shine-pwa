artistBio: |
  Two hands — one lighter, one darker — form a heart on this wall. Concentric
  rainbow hearts radiate inward toward a small awareness ribbon. Colorful
  silhouettes of diverse people flank both sides.

  This is a community/awareness piece — graphic silhouettes and flat color
  rather than Posner's usual photorealism — celebrating connection, diversity,
  and care.

  Melanie Posner was born around 1993 outside Philadelphia, moved to Tampa in
  2013, and earned her BFA in Painting from the University of Tampa in 2016. She
  is now based in Los Angeles. Her usual signature is photorealistic portraits
  of women — oversized expressive eyes, vibrant rainbow palettes, psychedelic
  paisley backgrounds, florals.

  Her commercial commissions include scenic art for Walt Disney World's Star
  Wars: Galaxy's Edge, the eighteen-foot Hollander Hotel mural for New Belgium
  Brewing (a woman in a red headscarf, completed in under five days), and a
  forty-foot wall on the LGBT Center of Los Angeles for TikTok's 2024 "Create
  the Future" campaign. She was a cast member on Amazon Prime's docuseries Tampa
  Baes (2021).

  Other St. Pete walls: the Mint House on 11th St N (a woman in giant reflective
  sunglasses with the waterfront skyline in the lenses), the Iryna Zarutska
  memorial on Central Ave (gold-blonde hair, pink hibiscus, mint-to-gold), and
  her SHINE 2018 wall "New Beginnings" — a 23-by-65-foot photorealistic woman
  lying on her side — at 4139 7th Terrace South.

