artistBio: |
  Fabstraq is the working name of Shawn Rainey, a New York native now based
  in Tampa. The name stands for "abstract art that makes you feel fabulous,"
  and his tagline is "Abstract From The Heart." He's been making art since
  he was 10, when it became an escape from childhood trauma — experiences
  of isolation and rejection that he later channeled into a practice centered
  on healing through creativity. He's a certified Art Therapy Life Coach who
  volunteers at the Glazer Children's Museum in Tampa, teaches kids' art
  classes at Center Place Fine Arts in Brandon, and visits schools across
  the Tampa area to talk about art and mental health. He works across
  painting, murals, and poetry. He was featured on Bay News 9's "Everyday
  Hero" segment in 2019 for inspiring children through art, and was included
  in the Green Book of Tampa Bay group exhibition at TheStudio@620 in St.
  Petersburg. He was selected as one of six local artists for SHINE 2023.

muralDescription: |
  A bold, graphic mural covering the entire front face of the Clay Coop
  building. The composition is a patchwork of large geometric shapes —
  triangles, rectangles, and angular forms — in saturated flat colors:
  bright green, royal blue, hot pink, red, purple, yellow, and teal. A
  heart shape, a star, zigzag patterns, and concentric rectangles are
  scattered throughout the design. The overall effect is like an abstract
  quilt or a Memphis Design-inspired collage, with clean edges and no
  blending between the color fields. Two tiki statues flank the entrance,
  and the artist's "FABSTRAQ" tag appears in the lower right corner.

