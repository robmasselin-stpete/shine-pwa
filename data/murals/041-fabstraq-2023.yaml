artistBio: |
  He started making art at ten to process emotions he couldn't name. He is now a
  certified art therapy life coach.

  Shawn Rainey — Fabstraq — is based in Tampa. He has no formal art education.
  His style is contemporary abstract — vibrant colors and defining lines,
  one-of-a-kind pieces meant to be thought-provoking. He also works as an audio
  engineer and music producer, and writes poetry.

  He volunteers regularly at the Glazer Children's Museum and has done charity
  shows for the National Breast Cancer Foundation and Chemo Angels. Bay News 9
  profiled him as an "Everyday Hero" for his community work with children. His
  eventual goal is to travel worldwide establishing art programs.

  For SHINE 2023, he painted at Charlie Parker Pottery on 6th Avenue South.

searchBio: |
  He started making art at ten to process emotions he couldn't name. He is now a
  certified art therapy life coach.

  Shawn Rainey — Fabstraq — is based in Tampa. The name is shorthand for
  abstract art that makes you feel fabulous. He has no formal art education and
  credits art as the vehicle that pulled him out of childhood trauma, isolation,
  and rejection. In his own words: "It helped me with a lot of struggles that I
  was having. It helped me release a lot of emotions and feelings that came
  about that I didn't understand. It was the only thing that made me feel
  alive." His style is contemporary abstract — vibrant colors and defining
  lines, one-of-a-kind pieces meant to be thought-provoking. He also works as an
  audio engineer and music producer, and writes poetry.

  He volunteers regularly at the Glazer Children's Museum in Tampa, leading
  Member Mornings sessions where each child receives a miniature canvas and is
  invited to explore their creativity through abstract work — no competition, no
  comparison, no shared subject to copy. His wife Paula and daughters Geelee and
  Geeotta volunteer alongside him. He also hosts painting parties. "They make
  their painting as beautiful as they want it to be," he has said of the
  children. "They inspire and make their own happiness where they see, 'Oh, I
  can do that. I can paint more than a stick figure.'" His framing: in abstract,
  every child wins.

  Beyond the museum work, he has done charity shows benefiting the National
  Breast Cancer Foundation Inc. and Chemo Angels. His eventual goal is to travel
  worldwide establishing art programs.

  He was profiled by Bay News 9 (Spectrum Bay News 9) in their "Everyday Hero"
  segment on August 5, 2019, by Bill Murphy, recognizing his work inspiring
  children to grow their imaginations through Fabstraq.

  In August 2021 he was one of nine featured artists in the Green Book of Tampa
  Bay Group Art Exhibit at TheStudio@620 in St. Petersburg (620 1st Avenue
  South, St. Petersburg, FL 33701). The show opened during Second Saturday Art
  Walk on Saturday, August 14, 2021 from 5:00 to 9:00 p.m., and ran through
  Second Saturday September 11, 2021 with gallery hours and a closing reception
  that evening. The Green Book of Tampa Bay is a Black-owned business directory
  serving Pinellas and Hillsborough counties that promotes Black-owned
  businesses, Black artists, and historical and cultural sites. The other
  featured artists in that exhibit were Ebony Adside (Eb&Floww), Elaine
  Chambliss Dogan, Lauren Gay, Denzel Johnson-Green, Myiah Pink (Soul Lessons),
  Ashley Rivers (Nature of Fire), Roosevelt Skinner (Earth Arts by Roose), and
  Rolph Vassor (Vassor Enterprises).

  For SHINE 2023 — the festival's ninth year, October 13-22 — he was selected as
  one of six Bay Area artists alongside Michael Vasquez, Sarah Sheppard, Chris
  Dyer, Artist Jones (Tracey "Artist" Jones), and Rhys Meatyard. The roster was
  announced August 18, 2023 by St Pete Catalyst writer Bill DeYoung at an event
  held at the Dali Museum, where festival director Jenee Priebe also revealed
  the festival's first two-year title sponsor: Reflection St. Pete, the
  88-residence, 18-story condominium tower under construction adjacent to Mirror
  Lake (scheduled to debut in 2024, with a planned three-story SHINE mural on
  its façade during the 10th-anniversary year). SHINE 2023 added 14 new murals
  plus a series of street art-related events, tours, and "Bright Spot" community
  projects. He painted at Charlie Parker Pottery on 6th Avenue South in St.
  Petersburg.

  Sources used in writing this expanded bio include the Bay News 9 "Everyday
  Hero" August 5, 2019 profile by Bill Murphy, TheStudio@620's Green Book of
  Tampa Bay Group Art Exhibit listing, and the St Pete Catalyst article "Local
  artists, new partnership announced for mural festival" by Bill DeYoung, August
  18, 2023.

searchMuralDescription: |
  A bold, graphic mural covering the entire front face of the Clay Coop
  building. The composition is a patchwork of large geometric shapes —
  triangles, rectangles, and angular forms — in saturated flat colors: bright
  green, royal blue, hot pink, red, purple, yellow, and teal. A heart shape, a
  star, zigzag patterns, and concentric rectangles are scattered throughout the
  design. The overall effect is like an abstract quilt or a Memphis
  Design-inspired collage, with clean edges and no blending between the color
  fields. Two tiki statues flank the entrance, and the artist's "FABSTRAQ" tag
  appears in the lower right corner.

