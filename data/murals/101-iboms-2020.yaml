artistBio: |
  His solo show "Ego Death" at Mize Gallery sold out in 48 hours. IBOMS stands
  for "illegal. Beauty. On. My. Streets."

  Jabari Jahi Babatu Reed-Diop — IBOMS — is a St. Petersburg native. He attended
  Douglas Anderson School of the Arts in Jacksonville and the Gibbs High PCCA
  Magnet Program. His signature character "Ashi" — a young Black male — was
  drawn from his childhood in south St. Pete. He uses the "iceberg theory":
  celebratory surface, deeper narratives underneath.

  He works in 2D illustration, 3D sculpture, and digital design. His recent work
  features mushroom-headed characters exploring "Ego Death." He has shown at
  d-Gallerie and Mize Gallery, designed a Tampa Bay Rays Artist Print Series
  (2019), and co-created a PSTA bus wrap with St. Pete Youth Farm.

  For SHINE 2020, he painted "Where the Bloom Begins" at Grand Central
  Brewhouse. He returned as a SHINE 2021 Bright Spots artist.

searchBio: |
  His solo show "Ego Death" at Mize Gallery sold out in 48 hours. IBOMS stands
  for "illegal. Beauty. On. My. Streets." Jabari Jahi Babatu Reed-Diop — IBOMS —
  is a St. Petersburg native based in St. Petersburg, Florida. His artistic
  acumen comes from personal experience and formal education at Douglas Anderson
  School of the Arts in Jacksonville and the Gibbs High PCCA Magnet Program in
  St. Petersburg.

  His signature character "Ashi" — a young Black male — was drawn from his
  childhood in south St. Pete. The name "ASHI" appears in capital letters below
  the character's left eye on his SHINE 2020 mural. IBOMS uses the "iceberg
  theory" in his practice: a celebratory surface with deeper narratives running
  underneath, like a dark river beneath a blissful exterior. His characters are
  complex and often represent aspects of his psyche as a young Black male,
  transmuting emotional and physical states of being to mirror the relationships
  between spirit and god. His work covers themes of self-love, destruction,
  discovery, omens, and love, and aims to give his community a lens into the
  experience of an African American male in the Sunshine City.

  He works across multiple mediums: 2D illustration, 3D sculpture, and digital
  design. At first glance his work may read as simple illustrations or graffiti,
  but each piece carries a deeper message. His recent work features
  mushroom-headed characters exploring "Ego Death." He has shown at d-Gallerie
  and Mize Gallery (also styled MIZE Gallery) in St. Petersburg. His show with
  Chad Mize at Mize Gallery sold out within 48 hours of its debut, with select
  pieces remaining for sale at d-Gallerie afterward.

  He designed a Tampa Bay Rays Artist Print Series in 2019. A portrait of IBOMS
  by muralist and curator Derek Donnelly is painted in the alley behind the 600
  Block of Central Avenue in St. Petersburg.

  For SHINE 2020, he painted "Where the Bloom Begins" on the side of the
  then-new Grand Central Brewhouse in St. Petersburg. The mural is set back from
  the street and takes up the right half of the west-facing wall, measuring 30
  feet high and 36 feet wide. The background is a brilliant yellow. The center
  of the image features Ashi, towering over the wall with his back to the
  viewer, looking over his left shoulder and down. Ashi's skin is greyish, with
  a bright red nose, pink circles on his cheeks, and dark grey tattoos on his
  face, neck, and back.

  He returned to SHINE in 2021 as a Bright Spots artist. For that project he
  partnered with the Pinellas Suncoast Transit Authority (PSTA) and the St. Pete
  Youth Farm on "Together We Grow," a custom PSTA bus wrap designed by IBOMS
  together with the students of the St. Pete Youth Farm. The final wrap was
  revealed on October 23, 2021.

  IBOMS was profiled in the Tampa Bay Born Murals video series from I Love the
  Burg and That's So Tampa, made possible by Neptune Flood Insurance CEO Trevor
  Burgess and his husband Gary Hess in partnership with Metro Inclusive Health.
  The October 11, 2021 feature by Andrew Harlan covered the Grand Central
  Brewhouse mural and his SHINE 2021 Bright Spots role.

  He is also listed as a Creative Pinellas artist, with a profile posted March
  28, 2023, identifying him as based out of St. Petersburg, Florida. Despite
  constantly pushing his craft and experimenting with new mediums, his style is
  immediately recognizable. Recent articles authored by IBOMS on the Creative
  Pinellas platform include "Imagine Nation," "Trustpassing," "The power of
  silence," "Reedr of Hearts Bearer of Watts," "Music influence," "Anime
  influence," "Logos & Commissions," "The Power Of Illegal Beauty On My Streets
  Compels You," "Trails of Sean," "Even a open book has pages you can't Reed,"
  and "Intro to iBOMS."

