artistBio: |
  iBOMS is the tag of Jabari Reed-Diop, a St. Petersburg-based artist who
  came up through Douglas Anderson School of the Arts in Jacksonville — one
  of Florida's top arts magnet schools — before settling in the Burg. His
  style sits somewhere between street art and cartoon illustration: chunky
  outlined characters with exaggerated expressions, heavy personality, and
  autobiographical weight. He pulls from his experiences as a young Black man
  in Florida and turns them into bold, narrative-driven compositions. His
  SHINE 2020 mural was created in partnership with the Pangeaseed Foundation's
  Sea Walls program, which pairs artists with ocean conservation themes —
  this piece addressed the red tide and harmful algal bloom crisis that
  devastated Florida's Gulf Coast. He received a Creative Pinellas
  Professional Artist Grant and was commissioned for an installation at
  Tampa International Airport. He's continued to build a presence across
  Tampa Bay with murals, gallery shows, and collaborative projects, and was
  one of the youngest artists featured in the SHINE festival when he painted
  this wall.

muralDescription: |
  A large cartoon-style character dominates the bright yellow wall — a
  tattooed figure with blue and gray braided hair, gritted teeth, and an
  intense sideways glare. The word "BLOOMS" is tattooed across its chest.
  The character is surrounded by bulbous, cloud-like brown shapes that pile
  up around the base, with a wavy white line suggesting water and small fish
  swimming along the bottom edge. The IBOMS tag sits in the upper right
  corner. Stars and swirl details float above the character's head.

muralInspiration: "Created in partnership with the Pangeaseed Foundation's Sea Walls program to address Florida's red tide and harmful algal bloom crisis."
