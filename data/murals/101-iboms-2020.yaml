searchMuralDescription: |
  A large cartoon-style character dominates the bright yellow wall — a tattooed
  figure with blue and gray braided hair, gritted teeth, and an intense sideways
  glare. The word "BLOOMS" is tattooed across its chest. The character is
  surrounded by bulbous, cloud-like brown shapes that pile up around the base,
  with a wavy white line suggesting water and small fish swimming along the
  bottom edge. The IBOMS tag sits in the upper right corner. Stars and swirl
  details float above the character's head.

