searchMuralDescription: |
  A roughly 100-foot-long black-and-white collage mural on the east-facing wall
  of 648 Central Avenue. The piece is a dense retrospective of BASK's graphic
  vocabulary: overlapping panels of greyscale portraits, faces, figures, and
  icons rendered in his signature distressed, wheat-paste-influenced style. A
  salmon-pink geometric panel near the top right provides the only color. On the
  right side, "BASK" is repeated five times in stacked block letters —
  alternating black-on-white and white-on-black — with a single red "S" breaking
  the monochrome. Below the stacked name, "AMERICAN ANIMAL" appears in bold
  white type. The overall effect is a visual manifesto — layered, gritty, and
  unapologetically personal.

