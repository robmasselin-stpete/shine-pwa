artistBio: |
  At fifteen, Jacksun picked up a pencil to work through what he couldn't put
  into words. With no teacher, he worked out how to turn a sketchbook drawing
  into a wall five or ten times its size.

  Jacksun is Jackson Benavidez, born in San Antonio in 2002. The city's
  Mexican-American culture sparked an interest in his roots, and his own
  description of the work is "a tribal style" that resembles art from cultures
  such as the Aztecs, Mayans and Incas. Two years of self-taught drawing came
  before the style: bold lines and abstract patterns, with "animal, spiritual,
  and religious iconography." The sun turns up again and again in his titles:
  "Sun Panther" and "Sun Dolphin" in St. Pete, "Drunken Sun" in San Antonio.

  Spray paint took over in Florida. He came to St. Petersburg for school,
  studied environmental science and visual art at Eckerd College and earned a
  visual arts degree in 2024. From 2021 to 2024 he was gallery curator and
  assistant event manager at The Factory in St. Petersburg. Exhibiting around
  St. Pete and Tampa brought mural offers from business owners and homeowners,
  plus live painting at music festivals and events. Eckerd gave him the Robert
  O. Hodgell Award for Excellence in the Visual Arts in 2024.

  He still lives in San Antonio, where his walls include "A Heart of Music"
  for Southtown Vinyl and "Sound of Freedom" for VFW Post 1533, and the work
  reaches "Quetzalcóatl" at a co-op housing community in Austin. The artist
  statement fits on a T-shirt: "I create to remember."

  For SHINE 2026, the festival's twelfth year, Jacksun is painting a wall at
  Duncan McClellan Studio on Emerson Avenue South.

searchBio: |
  At fifteen, Jacksun picked up a pencil to work through what he couldn't put
  into words. With no teacher, he worked out how to turn a sketchbook drawing
  into a wall five or ten times its size.

  The sun keeps turning up in Jacksun's titles: "Sun Panther" and "Sun
  Dolphin" on walls in St. Petersburg, "Drunken Sun" at The Cove in San
  Antonio, and "Sun God #2" and "Nothing New Under The Sun" in the studio.
  Business clients get aspects of the business worked into a design, but, as
  he told CanvasRebel, "my expressive style is always going to show through
  what I paint."

  Jacksun is Jackson Benavidez. The website and festival lineups spell it
  Jacksun, the résumé spells it Jackson, and the business has run as "Jacsun
  Art" since June 2022. He is a Mexican-American artist, born in San Antonio
  in 2002, and has lived there most of his life. The city's spiritual and
  cultural pride sparked an interest in his roots. He describes much of his
  work as "a tribal style" that resembles art from cultures such as the
  Aztecs, Mayans and Incas, in "complex two-dimensional forms reminiscent of
  ancient hieroglyphic art, with a modern twist". He started making art at
  fifteen, "as a therapeutic outlet for emotions and ideas," and put in two
  years of self-taught drawing before finding a style: bold lines and abstract
  patterns, with "animal, spiritual, and religious iconography." Oil paint,
  watercolor and spray paint came after. He taught himself large-scale
  painting as well, working out how to multiply an illustration five or ten
  times over. His early walls were friends' houses and small businesses, done
  to build a portfolio.

  Spray paint took over in Florida, and it is now his primary medium. He came
  to St. Petersburg for school and studied environmental science and visual
  art at Eckerd College from 2020 to 2024. He earned a visual arts degree
  there in May 2024, with a focus on gallery curation, mural and large-scale
  painting, and illustration. From October 2021 to 2024 he was gallery curator
  and assistant event manager at The Factory in St. Petersburg. In 2023–2024
  he taught drawing and spray-paint classes and mural-strategy seminars at
  Cosmic Art Haus in Tampa, and painted two spray-paint murals for the studio,
  10 by 15 feet and 10 by 40 feet. Exhibiting around St. Pete and Tampa
  brought mural offers from business owners and homeowners, plus live painting
  at music festivals and events: Alchemy Productions' AP 10 and AP 12 (2023)
  and Sacred Sessions (2023–2024) in St. Petersburg.

  The Florida exhibition record includes the solo show "Sunset In Paradise" at
  Centro Asturiano de Tampa (2023) and the solo show "Creativity Unity & Soul"
  at Eckerd College (2024). His résumé says the Warehouse Arts District
  Association rated one of his pieces among the top three in a citywide show
  in 2023, the same year the Morean Arts Center's Psychedelic Art Show gave
  him an honorable mention. Eckerd gave him the Robert O. Hodgell Award for
  Excellence in the Visual Arts in 2024. His Florida walls include "Sun
  Panther" and "Sun Dolphin" in St. Petersburg, "Flower Moth" and "Pillar of
  Flowers" at a Clearwater home, "2 Fish & a Bird's Soul" at a farm in Tampa,
  and the "Phoenix House Mural" for South Miami Fellowship House. In July 2026
  Bloom After Dark Volume 5 at El Jardín Inn in Miami was billed around
  Jacksun painting a mural live throughout the event.

  By his own count he painted more than ten murals across Texas and Florida in
  2024–2025. The Texas walls are mostly in San Antonio: "A Heart of Music" at
  Southtown Vinyl, which also hosted a solo exhibition and live mural work in
  2023–2024, "Sound of Freedom" at VFW Post 1533, "Corn God" at Delicious
  Tamales, "Fun Flamingo" at Bombay Bicycle Club, an armadillo mural at Thrift
  at The Warehouse and a hummingbird mural at a private home. Others are
  "Monster Plant Mural" at Payne Dentistry in Olmos Park, "Quetzalcóatl" at
  New Guild Co-op community housing in Austin, and, in Rockport, the "Native
  Fish Mural" at Blue Shed Car Wash and "Color Ship" and "Texas Coast
  Wildlife" at McDonald's, a restaurant he says he painted in its entirety.

  His studio pieces include "Huitzilopochtli, The God of War Cries," a
  7-by-7-foot oil and paint-pen piece from 2023, "Nothing New Under The Sun"
  (2024), "Drums of Liberation," "Spider Lily" and "Mother of Mothers." His
  artist statement counts societies and cultures as part of the natural world,
  names "beliefs, religions, and stories (true and mythological)" as
  inspiration, and describes a habit of imagining the earth from outside, "a
  sort of cosmic viewpoint." The work is "vibrant colors, otherworldly
  figures, and a harmonious chaos." On why murals and not just galleries: "Art
  is intrinsically human, so it should exist alongside humanity." Most of his
  murals so far are for private clients, and he is starting to seek public
  grants for larger projects. The website statement is shorter: "I create to
  remember."

  For SHINE 2026, the festival's twelfth year, Jacksun is painting a wall at
  Duncan McClellan Studio on Emerson Avenue South.

