artistBio: |
  He left Cuba in 2019 and walked through twelve countries — including the
  Darien Gap — before reaching the United States. He brought his brushes.

  Isac Gres was born in 1993 in Bayamo, Cuba. He studied cubism, hyperrealism,
  surrealism, and conceptual thinking at the E.I.A Jose Marti Perez art academy,
  then served in the Cuban army before studying psychology at the Celia
  Sanchez Manduley institute. He left Cuba on November 12, 2019, established a tattoo studio called Isac Ink
  in Uruguay,
  then relocated to Miami in 2022 to reunite with family before settling in St.
  Petersburg.

  His work is contemporary surrealism in mixed media — acrylic, oil, spray
  paint. Fragmented figures, dreamlike landscapes, hybrid beings. Pathways and
  doorways recur. So do jellyfish, which he reads as resilience and immortality,
  and apples, which stand for knowledge and identity. Light drives everything.
  "Color for me means light," he says, "and also good energy."

  For SHINE Origins 2025 he painted the tallest wall of his career — a
  surrealist design with melting clocks (a nod to Dali) on the Melting Pot
  restaurant.

searchBio: |
  He left Cuba in 2019 and walked through twelve countries — including the
  Darien Gap — before reaching the United States. He brought his brushes.

  Isac Gres was born November 29, 1993 in Bayamo, Cuba. He studied cubism,
  hyperrealism, surrealism, and conceptual thinking at the E.I.A Jose Marti
  Perez art academy, then served in Cuba's army before studying psychology at the Celia Sanchez
  Manduley institute. He left Cuba in 2019 and traveled through 12
  countries including the Darien Gap. He established "Isac Ink" tattoo studio in
  Uruguay (approximately 2019-2022), then relocated to Miami in 2022 to reunite
  with family. He worked at a tattoo studio while painting before settling in
  St. Petersburg, Florida.

  His work is contemporary surrealism in mixed media — acrylic, oil, spray
  paint. Bold abstractions balancing vibrant color, texture, and form.
  Fragmented figures, dreamlike landscapes, hybrid beings. Recurring symbols
  include pathways and doorways, jellyfish (resilience and immortality), and
  apples (knowledge and identity). Light drives everything: "Color for me means
  light...and also good energy." He is represented by Patti Suzette Art and has exhibited in South Carolina
  and multiple galleries nationwide.

  For SHINE Origins 2025 he painted the tallest wall of his career — a
  surrealist design with melting clocks (a nod to Dali) on the Melting Pot
  restaurant. Instagram: @isacgres.art.

searchMuralDescription: |
  A massive two-story mural wrapping around the corner of a building in swirling
  cosmic surrealism. The composition features molten planetary spheres, a city
  skyline encased in a dripping glass orb, melting candles nodding to Dalí, and
  a sculptural elephant form emerging from fiery nebula clouds. The palette is
  dominated by deep space blues and purples contrasted with blazing oranges,
  reds, and golds. Signed "Isac Gres" in the lower corners of both walls.

muralInspiration: |
  The mural is on a restaurant called the Melting Pot, and Gres appreciated how
  the work represents a melting pot of cultures. The melting clocks are a nod to
  Dalí.

