artistBio: |
  Ashley Cantero is a Tampa native who paints murals, illustrations, and
  immersive installations steeped in '60s psychedelia, Atomic Age design, and
  B-movie sci-fi. Her style is built on precise black outlines, bold color
  blocking, and characters that look like they walked off a drive-in movie
  poster — UFOs, aliens, and retro femme fatales are recurring motifs. She's
  a resident artist at Kress Contemporary in Ybor City, where she shares a
  studio space called DLUANCE with artist Juan Espinosa. Beyond murals, she
  built dioramas for FloridaRAMA (formerly Fairgrounds St. Pete), including
  "Swamp Motel" and "Drive-In," and painted an 8-wall retro-futuristic piece
  called "Cosmic Beams & Sunshine Dreams" for that venue. She was featured in
  the 2025 exhibition "We Built This City: Women Artists of SHINE" at the
  Morean Arts Center alongside 15 other Tampa Bay women muralists.

muralDescription: |
  A retro sci-fi scene spanning the full wall — three flying saucers beam up
  figures against a teal background loaded with mid-century diamond shapes and
  starbursts. A suited figure stands on a vanishing-point highway while a
  green alien peers out from the right side. The palette is teal, pink, and
  chartreuse with heavy black outlines giving it a vintage comic book feel.

