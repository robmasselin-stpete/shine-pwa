artistBio: |
  Alyssa Marie's sunflower walls start with a bunch of sunflowers from Publix.
  She photographs them, photographs the wall, and moves the pieces around on
  her iPad until the composition sits right.

  Then she hands the painting to strangers. In Adobe Illustrator she cuts the
  design down to as few colors as possible, a field of solid, numbered shapes.
  She projects the outlines onto the wall and traces them in black marker.
  Volunteers sign up for a slot, collect a numbered cup of paint and fill in
  the matching shapes, children down low and the ladder-comfortable up high.
  Most are beginners. "It's just magic watching people come out," she told the
  Tampa Bay Times.

  She runs the format through The Happy Mural Project, which she started in
  2020. She and Braden Everly launched it that March with a sunflower wall
  near St. Petersburg High School. Lockdown cancelled the plan to hand out
  flowers, so they put up a sign: "Honk If You're Happy." The first
  paint-by-numbers wall, "Hands of Change" at the St. Petersburg City Theatre
  for SHINE 2020, drew 175 volunteers. In 2024 about 600 people painted
  "Compassion in Action," 105 feet long, for Gulf Coast Jewish Family and
  Community Services. The client called it her largest paint-by-numbers mural
  yet.

  She grew up in Littleton, Colorado, earned a BFA in communication design
  with an emphasis on fine art, and moved to St. Pete in February 2017. She
  ran a gallery on Beach Drive from 2018 to January 2020. On canvas she paints
  wildlife in oil, often photographed herself, with additions like a sunflower
  crown on a great white shark.

  She led SHINE walls in 2022, an alligator for the Florida Wildlife Corridor,
  and 2023, "Girl Power" with the Girl Scouts. For SHINE 2026, the festival's
  twelfth year, she is painting the north perimeter wall at Skyline Campus.

searchBio: |
  Alyssa Marie's sunflower walls start with a bunch of sunflowers from Publix.
  She photographs them, photographs the wall, and moves the pieces around on
  her iPad until the composition sits right.

  Then she hands the painting to strangers. In Adobe Illustrator she cuts the
  design down to as few colors as possible, a field of solid, numbered shapes.
  She projects the outlines onto the wall and traces them in black marker.
  Volunteers sign up for a 30-minute slot, collect a numbered cup of paint and
  fill in the matching shapes, children down low and the ladder-comfortable up
  high. Most are beginners. "It's just magic watching people come out," she
  told the Tampa Bay Times. "They just take such ownership of their job that
  day of whatever shape or color they're filling in." She borrowed the idea
  from the paint-by-number books she did as a kid. "I had painted murals for
  years by myself," she told Northeast Journal, "and when I did, I would find
  people were so interested in the process."

  She runs the format through The Happy Mural Project, which she started in
  2020, in her words "as an effort to just inspire more joy across the globe
  through larger-than-life sunflowers painted on walls." She and Braden Everly
  launched it in March 2020 with a sunflower wall at the future home of
  Lolita's Catering + Events, 2735 5th Ave N at 28th Street, in the shadow of
  St. Petersburg High School. Everly, a former summer house painter, brought
  experience with paint, ladders and scaffolding. The plan was to hand a
  sunflower to everyone who stopped by. Lockdown cancelled that, so they put
  up a sign: "Honk If You're Happy." The project's motto: "Happy people
  inspire others. Inspired people change the world." Sunflowers are the
  project's signature. Her favorite color is yellow, and sunflowers, she says,
  remind people of joy and beauty.

  The first paint-by-numbers wall, "Hands of Change," went up on the St.
  Petersburg City Theatre, 4025 31st St. S, as an early start to SHINE 2020.
  Its front wall shows a row of six hands, each one a community member's,
  holding giant sunflowers. Around the corner, two clasped hands hold three
  more beside a John Lennon line: "You may say I'm a dreamer, but I'm not the
  only one." It took 49 colors of paint, about 12 of them for a single hand's
  skin tones, and 175 volunteers. She has since pared the palette to about 13
  colors. Later walls include "Girl Power" for SHINE 2023 at CrossFit 9, 2727
  6th Ave S, completed by the Girl Scouts of West Central Florida. In June
  2023 she led a 90-foot paint-by-numbers wall at Pro Karting Experience in
  Lealman, finished in three days instead of five, with a Sasquatch added as a
  surprise for the track's manager. A lion's head went on Winthrop Charter
  School in Riverview in 2024. Other community walls are at Tampa General
  Hospital's peace garden and food pantry. The Artesia Arts Council in
  Artesia, New Mexico, was one of the first to answer her call for walls.
  There, residents painted every detail but the logo.

  "Compassion in Action," at 929 1st Ave N, marked Gulf Coast Jewish Family
  and Community Services' 50th anniversary. It reaches 16 feet at its tallest
  and runs 105 feet long, and about 600 people painted it over Mother's Day
  weekend 2024. Gulf Coast JFCS called it the largest paint-by-numbers mural
  she had done.

  She grew up in Littleton, Colorado, and spent her first 27 years in the
  Rocky Mountains. She earned a BFA in communication design with an emphasis
  on fine art in Denver and moved to St. Petersburg in February 2017. In 2018
  she opened Alyssa Marie Gallery on Beach Drive NE. It closed in January
  2020. On canvas she paints wildlife in oil, often animals she photographs
  herself, with additions like a sunflower crown on a great white shark.
  SPAA's bio says she "pushes the realms of realism by playfully altering what
  is expected of traditional wildlife and nature scenes."

  Her other walls include a yellow Stearman biplane bursting out of a hangar
  at Albert Whitted Airport, unveiled in January 2024, also a paint-by-numbers
  design. In July 2025 she was one of six artists chosen to paint murals for
  the St. Pete Pier's fifth anniversary. Hers puts pelicans front and center
  with the old pier in the distance, and she invited passersby to paint with
  her.

  She led SHINE walls in 2022, a mother alligator for the Florida Wildlife
  Corridor at St. PetersBark, 3001 Central Ave, and 2023. For SHINE 2026, the
  festival's twelfth year, she is painting the north perimeter wall at Skyline
  Campus, 2600 Dr. MLK Jr St N.

