artistBio: |
  The compass on this wall is a question. Will you follow the siren?

  Josh at Zen Glass Studio gave Sarah Sheppard free rein on this 2014 commercial
  commission. She built the design around his glassblowing subjects — an octopus
  and a mermaid in a golden porthole, the octopus tentacle and the mermaid
  forming a yin-yang inside the circle to fold in the "zen." The compass rose
  asks the viewer to choose.

  The piece landed her in Creative Loafing Tampa Bay's December 2014 "8 murals
  that make us heart the Burg," alongside Sebastian Coolidge, Chad Mize, Derek
  Donnelly, J&S Signs, Bask, and Jennifer Kosharek. One of her first major
  exterior walls.

  Sarah Sheppard grew up in Dallas in a family of artists (both parents — her
  father was her mother's college art teacher), studied at the University of
  North Texas, and trained in metalsmithing at Creative Side Jewelry Academy in
  Austin to continue work her late father began. She moved to Florida during the
  housing boom and ran her own faux-finishing and Venetian-plaster business
  before pivoting to murals. Her style is colorful, high-contrast figurative
  work — new romanticism, movement as metaphor for continuous loss and seeking.

  Other St. Pete walls include "Life Reimagined" on the back of the Morean Arts
  Center (commissioned by AARP, 2015) and multiple SHINE festival murals.

searchBio: |
  She studied metalsmithing to continue work her late father began. Art runs in
  the family — both her parents were artists, and her father was her mother's
  art teacher in college.

  Sarah Sheppard grew up in Dallas and studied photography, drawing, painting,
  graphic design, ceramics, and fabric art at the University of North Texas. Art
  surrounded her from childhood and held her attention through school and at
  home. While still in college she moved from Texas to Florida, where her
  parents were living, for a change of scenery. The housing market was booming
  and construction was widespread, so her parents helped her start her own
  business doing Venetian plaster, faux finishing, and murals in model homes,
  businesses, and residences. The work involved tight deadlines and 14-hour
  days. She has lived in St. Petersburg for over twelve years.

  In 2008 she became pregnant with her son, Sebastian, as the economy turned.
  She stepped away from scaffolding work and spent the next three years as a
  stay-at-home mom. When she returned to working, she took a part-time job at
  her favorite coffee shop, Brew D' Licious, in St. Petersburg. While working
  there she painted her first mural, for the spa across the street. The wall was
  about 30 feet long and 10 feet high, the largest canvas she had worked on. She
  has since completed roughly 15 exterior murals.

  After moving back to Texas, she enrolled in a metalsmith class at Creative
  Side Jewelry Academy in Austin. She initially took Jewelry 101 to finish a few
  pieces her father had given her when he passed away, then continued taking
  courses. She makes large pieces in both jewelry and painting, working at scale
  through size, color, or both.

  Her style is colorful, high-contrast figurative work — new romanticism,
  movement as metaphor for continuous loss and seeking. Her personal work draws
  from life events and the natural world, and she sources from varied historical
  motifs and historical symbolism, sometimes mixing in modern touches through
  color or application. The goal is a sense of beauty, romanticism, and
  mysticism. When working for clients on businesses or homes, she takes in their
  focus and message — for businesses the design centers on brand and visual
  attention to the building, for homes the work runs more personal — but always
  carries her personal style.

  Her mural at Sixth Avenue South and 27th Street in the Warehouse Arts District
  of St. Petersburg was painted for Zen Glass Studio, on the property where the
  mural is located. Josh from Zen Glass Studio gave her free rein over the
  design. Because Zen Glass does glassblowing incorporating sea life and
  mermaids, Sheppard built the composition around an octopus and a mermaid. The
  octopus tentacle inside the circle that contains the mermaid forms a yin and
  yang to incorporate the "zen" aspect, and a compass asks what direction the
  viewer will take with the siren — whether to follow temptation or not. The
  piece was featured in Creative Loafing Tampa Bay's December 2014 roundup "8
  murals that make us heart the Burg" by Julie Garisto, alongside work by
  Sebastian Coolidge, Chad Mize, Derek Donnelly, Jeffrey Sincich and Josh Stover
  of J&S Signs, Bask, and Jennifer Kosharek.

  In September 2015 she completed "Life Reimagined" on the back wall of the
  Morean Arts Center at Central Avenue and Seventh Street in downtown St.
  Petersburg, commissioned by AARP and the Morean to engage the ideas of "Life
  Reimagined" and "Disrupt Aging." The narrative she built into the piece uses
  gears to represent the grind of daily life, the lapse of time, and the
  mechanics of the working world. The central figure is a Banyan tree sinking
  and spreading her roots into the community, reaching out to a Phoenix that
  represents her rebirth into the next stage of life. AARP's involvement,
  Sheppard noted, came from the organization's work in Tampa Bay supporting the
  arts as a way to connect older Americans to community life. Creative Loafing's
  Julie Garisto covered the unveiling.

  She has multiple SHINE murals across St. Petersburg. For SHINE 2023, she
  returned to paint in the city. Her work also appears on the massive wall of
  Skull & Cakebones Vegan Craft Bakery in Dripping Springs, Texas.

  On the challenges of mural work she points to weather (rain and wet paint),
  the unique demands of each wall, and painting in front of passersby where
  mistakes are visible. The upside is the people she meets on the street, the
  conversations with the community, and seeing children smile at the work or
  hearing from commuters that the mural is the best part of their drive. On the
  broader struggle artists face she names the difficulty of staying positive
  through the creative process and learning to be gentle with herself, trusting
  the process, taking breaks, and shaking up perspective with new experiences.

  Her work can be seen on her website at sarahsheppardsart.com and on Instagram
  at @thee.divine.sarah.

searchMuralDescription: |
  A nautical-themed piece centered on a golden porthole frame containing a
  mermaid/siren figure with flowing dark hair and pale skin, entwined with
  bright red octopus tentacles that curl through and around the circular frame.
  The porthole is set within an elaborate compass rose or ship's wheel pattern
  in gold, teal, and white, with geometric Art Deco-style rays radiating
  outward. The background alternates between teal triangles and white
  cross-hatched sections. The title "THE SIREN" appears in gold lettering on a
  dark plaque at the bottom center. The composition has a strong symmetrical,
  heraldic quality.

muralInspiration: "Commissioned by Josh of Zen Glass Studio, who gave Sheppard free reign. The octopus and mermaid reflect his glassblowing subjects. The tentacle inside the circle creates a yin-yang incorporating the 'zen' aspect, while the compass poses a question about temptation and direction."
