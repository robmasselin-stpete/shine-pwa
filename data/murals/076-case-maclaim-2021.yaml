artistBio: |
  Case Maclaim is the working name of Andreas Von Chrzanowski, born in 1979
  in Frankfurt am Main, Germany. He studied restoration at the University of
  Applied Sciences in Erfurt before turning to art full-time. In 2000 he
  co-founded the Maclaim Crew in Frankfurt with Akut and several other
  writers — the collective became one of the first to push photorealistic
  technique in the graffiti world, and their early jams in abandoned East
  German factories helped establish an entire movement. Case's technique is
  entirely freehand aerosol with no projectors or grids, which makes the
  level of anatomical detail he achieves at building scale genuinely hard to
  believe. His signature subject is intertwined hands — clasping, pulling,
  reaching — which he uses to explore connection, struggle, tenderness, and
  human fragility. He's painted walls in over 20 countries across Europe,
  the Americas, and Asia, and his work has been featured in galleries from
  Berlin to New York. He's widely considered one of the most technically
  skilled spray paint artists working today, and his work has been collected
  by institutions and private collectors internationally.

muralDescription: |
  A massive photorealistic portrait of a healthcare worker in teal scrubs and
  a surgical cap, one gloved hand reaching directly toward the viewer. To the
  right, another pair of hands gently holds a small teddy bear sitting in a
  red toy car — a warm, personal touch against the clinical setting. The
  dark background makes the figures pop off the wall, and the skin and fabric
  detail is rendered at a level that reads as a photograph from across the
  parking lot.

