artistBio: |
  He earned a diploma in art restoration. Then he picked up a spray can and
  started painting hands the size of buildings.

  Andreas von Chrzanowski — Case Maclaim — was born in 1979 in Frankfurt am Main
  and raised in East Germany. He studied art restoration and conservation at
  Erfurt University of Applied Sciences. He started spraying in 1995 and
  co-founded Ma'Claim, an East German crew that pioneered photorealistic aerosol
  art.

  His signature is overlapping, intertwined hands symbolizing unity and power —
  freehand spray can work combining photorealism with surrealism. He has painted
  in twenty-plus countries: Eastern Market in Detroit, Historic Third Ward in
  Milwaukee, Bushwick in Brooklyn, Wynwood in Miami, and URBAN NATION in Berlin.
  For SHINE 2021, he painted in St. Petersburg.

searchBio: |
  He earned a diploma in art restoration. Then he picked up a spray can and
  started painting hands the size of buildings.

  Andreas von Chrzanowski works under the name Case Maclaim, sometimes shortened
  to CASE. He was born in 1979 in Frankfurt am Main and raised in East Germany.
  He studied at the Erfurt University of Applied Sciences and graduated with a
  diploma in Art Restoration and Conservation. He started spraying in 1995,
  working out his style with a can in his hand before any formal collaboration
  took shape.

  His path as a street artist properly began in 1999, when Akut — the male half
  of the Herakut duo — teamed up with Case and Rusk to start collaborating on
  mutual projects. In 2000, the trio became a crew. Tasso joined in 2001, and
  the four-person group came to be known as the Maclaim Crew. Case is a founding
  member. The crew built its name producing photorealistic graffiti of body
  forms and portraits, and is widely credited as the East German pioneer of
  photorealistic aerosol art, a position it has held for over two decades. Akut,
  Tasso and Rusk are his named long-time collaborators inside the crew.

  Even in those early Maclaim years, Case stood apart with a personal,
  surrealistic approach. His signature motif is overlapping, intertwined hands —
  many hands, in different positions — symbolizing unity and power, both
  physical movement and political and societal action. He has said he rejects
  the mass-produced century, and works hard at making hand-painted images that
  are obviously special and next to impossible to copy. His visual vocabulary
  leans on components of the human body abstracted from their origin and given
  new narrative, frightful, animalistic or mythic elements. The figurative
  subject carries the work, with technical execution underlining the pictorial
  pureness and high narrative value. Critics describe him as one of the finest
  photorealistic aerosol authors in the world, working primarily in spray paint
  because the medium lets him reach the level of perfection his life-like
  graffiti requires.

  He has traveled to over twenty countries and left aerosol pieces in each of
  them. The work, he and his chroniclers note, speaks a universal language — a
  hand gesture can tell more than words across any geography. Documented
  locations for individual pieces include Düsseldorf, Germany (Mains à Garath,
  April 2026); Le Mans, France (a hyperrealist outstretched hand piece, April
  2023); and Madrid, Spain (a young woman in a wheelchair, March 2023). In the
  United States, his murals appear in Eastern Market in Detroit, the Historic
  Third Ward in Milwaukee, Bushwick in Brooklyn, and Wynwood in Miami. In
  Holyoke, Massachusetts, working with the Beyond Walls placemaking organization
  in Lynn, he painted the north wall of 284 Maple Street — a project he had
  carried for years, a portrayal of an abolitionist for which Holyoke offered an
  ideal canvas.

  In Berlin, his work is held by URBAN NATION Museum for Urban Contemporary Art,
  the institution at Bülowstrasse 7, 10783 Berlin, which presents street art,
  graffiti and urban contemporary art free of charge. He was featured in the
  URBAN NATION 2018 exhibition UN-DERSTAND The Power of Art as a Social
  Architect. URBAN NATION has documented his contributions to PROJECT M/8 and
  PROJECT M/11, the museum's serial outdoor painting commissions on the building
  façade.

  He has been a recurring presence at Art Basel Miami's Wynwood activations.
  Brooklyn Street Art and writers Steven P. Harrington and Jaime Rojo covered
  his Miami work in their 2016 Art Basel dispatches, including the December 2016
  Wynwood wrap-up "Parade of Eye-Popping Beauty at a Portentous Time" and the
  dispatches "Paint, Protest, Party // BSA X ART BASEL Miami '16" and "Clubhouse
  Chemistry in a Warehouse." Critic Andreja Velimirović has also written on his
  practice. Beyond Walls, the non-profit placemaking agency that brought him to
  Holyoke, lists him among its commissioned artists.

  For SHINE 2021 in St. Petersburg, Florida, he contributed a mural in his
  familiar register of intertwined hands — freehand spray can work combining
  photorealism with surrealism. He is based in Germany and continues to paint
  internationally. Online he is @case_maclaim on Instagram.

searchMuralDescription: |
  A massive photorealistic portrait of a healthcare worker in teal scrubs and a
  surgical cap, one gloved hand reaching directly toward the viewer. To the
  right, another pair of hands gently holds a small teddy bear sitting in a red
  toy car — a warm, personal touch against the clinical setting. The dark
  background makes the figures pop off the wall, and the skin and fabric detail
  is rendered at a level that reads as a photograph from across the parking lot.

