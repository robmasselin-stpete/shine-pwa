artistBio: |
  He painted a 27-story building for the Super Bowl. He was the only Latin
  American artist selected.

  Dasic Fernandez was born in Rancagua, Chile. He studied architecture at the
  University of Chile for four years, leaving in his final year to pursue art
  full-time. His style is portraiture with an "inverse drip" — rivulets of color
  floating upward from subjects. Light impressionism with political undertones,
  influenced by graffiti, Van Gogh, Kandinsky, and Roberto Matta.

  He co-filmed Pan-American Graffiti, a documentary tracing a 100-day journey
  from New York to Santiago with thirteen large-scale murals. He worked with the
  Rebel Diaz Arts Collective on a 70-foot rooftop protest mural reading "No
  human being is illegal." He has painted at Wynwood Walls and was recognized by
  The New York Times and Americas Quarterly as an Arts Innovator.

  For SHINE 2016, he painted in St. Petersburg.

searchBio: |
  He painted a 27-story building for the Super Bowl. He was the only Latin
  American artist selected.

  Dasic Fernández was born in Rancagua, a small rural town in Chile, and grew up
  immersed in the country's burgeoning hip-hop culture of the 1990s. By age 14
  he had found his way into graffiti, beginning by tagging buildings with the
  stylized letters of his name. He moved to Santiago to study architecture at
  the University of Chile, where he explored the impact of art on urban spaces
  while experimenting with content, themes and style for his own work. "I became
  more in love with painting on the street than with being in class," he
  recalls. In his fourth year he left the university to pursue art full-time,
  traveling through Rio de Janeiro, Buenos Aires and Montevideo before moving to
  New York in December 2009.

  His style is portraiture with an "inverse drip" — rivulets of color floating
  upward from his subjects. He cites graffiti as the root of everything he
  paints, alongside Vincent Van Gogh, Wassily Kandinsky and Roberto Matta as
  core influences. He prefers street art for what he calls its "essential"
  quality: a space to connect with the public directly. "Painting on the street
  carries great responsibility — both artistic and social."

  Fernández is a member of the New York-based Rebel Díaz Arts Collective, whom
  he calls his "family from the Bronx." With them he helped paint a 70-foot
  rooftop mural in 2010 protesting Arizona's anti-immigration law. Dominated by
  giant yellow block letters spelling "No human being is illegal," the mural is
  interspersed with silhouetted human figures of all shapes and sizes, including
  a pregnant woman, a dancing child and an old man walking with a cane. "Our
  intent with the design was to restore humanity and respect" to the individual
  immigrant, he explained. Earlier in Santiago, after a Chilean TV station
  distorted his remarks in an interview, he painted a graffito of a person with
  a lock on his mouth near his apartment in the heart of the city. The piece
  became a well-known protest of censorship, a consequence he never anticipated.

  His documentary project Pan-American Graffiti, three years in the making, sent
  him on a 100-day journey from New York to Santiago, painting 13 large-scale
  murals along the way. The goal was to document street art across the continent
  and to build a pan-American art gallery and network. "It is a project for the
  long term," he said, "but I believe I am laying the foundations for a
  community as I journey through this marvelous continent [which is] full of
  talent yet short on resources."

  In 2010, at age 24, he was named an Arts Innovator by Americas Quarterly in a
  profile by Nina Agrawal. He has been recognized by The New York Times. He was
  selected as a Wynwood Walls artist, with works at the Miami complex spanning
  2016 to 2021.

  For Super Bowl LIV in February 2020, Fernández was commissioned by the NFL and
  Goldman Global Arts to create a mural on a 27-story downtown Miami building,
  the only Latin American artist among the five chosen for the project. Because
  the building's facade is entirely windows, the painting was vectorized and
  printed as a large-scale wrap rather than painted directly. The work centers
  on the fans — the people around football — and aims to be universal rather
  than tied to any single community, age or culture. "My personal mission
  through art is to talk to the people, to remind people what we are, where we
  are from, where we come from, what we are made of and we are all the same," he
  said. After roughly a decade in New York, he calls Miami his second or third
  city in the States: "I always felt the love of the people for my work in
  general and for my person too."

  His broader catalog of named projects spans murals, floor and wall
  installations, and canvas work, including Terrazas de Arroz, Aprobemos
  Dignidad, The Clock, Paseo Bandera, Super Bowl, Dolphins Stadium, New York,
  Ultra Music Festival, Plaza de Bolsillo, The Covenant, Miami Basel Blooming,
  Pow Wow Worcester, Pichilemu, Bob Marley's Crib, Newburgh, Estadio Monumental,
  San Miguel and Viva Las Vegas. His mural locations and clients include Miami,
  New York, Santiago, Worcester, Newburgh, Las Vegas, Pichilemu, San Miguel, the
  Dolphins Stadium, Ultra Music Festival, Art Basel Miami, the Pow Wow Worcester
  festival and Estadio Monumental.

  For SHINE 2016, he painted in St. Petersburg.

  Website: dasicfernandez.com.

  Additional projects documented on his archival blog (dasic.blogspot.com)
  include "Virgin and Child" in Brooklyn, NY (2014), A3C HipHop Music Festival
  in Atlanta, Georgia (2014), tagging work in 1st Ave Manhattan and Queens, NY
  (2014), an IPic Manhattan commission (2018), and a documented session being
  photographed by Martha Cooper in Miami (2018). The blog also chronicles 2018
  activity in Santiago (Chile), Atlanta, Toronto, Brooklyn, Philadelphia
  ("PHI"), Miami including the Dolphins Stadium piece, Pow Wow Worcester, and a
  2018 "Florida!" post that aligns with his SHINE St. Pete stop. Contact email
  listed on the blog: dasic7@gmail.com.

searchMuralDescription: |
  A 90-by-17-foot mural on the east side of the FRSTeam by Rogers building,
  facing 17th Street. On a black background, a woman tilts her face upward with
  her eyes closed and arms spread wide, receiving multicolored rain. Her skin
  and flowing hair are rendered in dripping layers of blue, purple, magenta,
  orange, green, and gold — Dasic's signature "inverse drip" style that gives
  the colors a sense of upward motion. She wears a pale translucent blue
  sleeveless top that contrasts with the rich colors streaming across her body.
  White clouds float in the dark sky and white puddles frame the base of the
  composition. Near each shoulder, a hummingbird hovers — the one on the left
  sipping a colored raindrop as it falls.

