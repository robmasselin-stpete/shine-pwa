artistBio: |
  He co-founded SHINE with his wife Michelle. He has also designed gig posters
  for Foo Fighters, Queens of the Stone Age, Iggy Pop, and Jimi Hendrix.

  Chris Parks — Palehorse — earned a BA in Graphic and Interactive Communication
  from Ringling College of Art and Design. His style is intricate digital
  illustration blending Eastern mysticism, sacred iconography, esoteric
  symbolism, and global mythologies. His practice is rooted in Kriya Yoga — he
  hosts weekly meditation circles called "Seekers of the Eternal."

  Clients include National Geographic, Nike, Mini Cooper, FX, World of Warcraft,
  Hasbro, Under Armour, WWE, Harley Davidson, Red Bull, Wired Magazine, and DC
  Comics. He was featured in the Dali Museum and co-created the FloridaRAMA
  immersive art experience.

searchBio: |
  He co-founded SHINE with his wife Michelle. He has also designed gig posters
  for Foo Fighters, Queens of the Stone Age, Iggy Pop, and Jimi Hendrix.

  Chris Parks works under the name Palehorse, also styled Pale Horse. He is
  based in St. Petersburg, Florida. He earned a BA in Graphic and Interactive
  Communication from Ringling College of Art and Design. In 2006, he opened his
  own studio, Pale Horse Design. His style is intricate digital illustration
  that draws on Eastern mysticism, sacred iconography, esoteric symbolism,
  global mythologies, archetypes, and personal devotion. He describes the work
  as both invocation and offering, with each form carrying a vibration and each
  symbol an opportunity for inner reflection.

  In 2015, Chris and his wife Michelle were founding members, curators, and
  organizers of the Shine Mural Festival in St. Petersburg. The festival has
  brought world-renowned mural artists to the city and helped revive storefronts
  and local businesses during the recession years. He continues to co-run the
  festival with Michelle.

  His commercial client list spans entertainment, apparel, action sports,
  beverage, and toy categories. Brands that have commissioned Palehorse work
  include National Geographic, Nike, Mini Cooper, FX, DC Snowboards, X-Games,
  World of Warcraft, G.I. Joe, Transformers, Hasbro, Arnette Sunglasses, Under
  Armour, WWE, Brisk Iced Tea, Modelo, Jagermeister, Bud Light, PBR, Live
  Nation, Red Bull, Wired Magazine, DC Comics, Harley Davidson, Iron Fist, Vans,
  Etnies, and The Cartoon Network. He has created entrance artwork for some of
  the largest music festivals in the world.

  His screen-printed gig poster catalogue includes officially licensed posters
  for Foo Fighters, Queens of the Stone Age, Puscifer, 108, Converge, Primus,
  Iggy Pop, Jimi Hendrix, and Rush, plus earlier work such as a Baroness /
  Torche gig poster. Other named illustration and product projects include La
  Calavera Catrina, Japanese Koi, the 7 Skate Deck Totem series, Yamī, The Pale
  Horse, The Book of Five Rings, the Geisha Samurai print, the Super7 Florida x
  Pale Horse collaboration, and a board graphic for Zap Skimboards. He has also
  taken part in self-initiated projects such as Back in Black, a live printing
  t-shirt exhibit featuring top apparel artists from around the world, and ran
  Golden/Black, a royalty-free stock vector art and fonts website. He regularly
  curates, hosts, and participates in gallery exhibits throughout the year.

  His work has been exhibited in local, national, and international galleries,
  including the Salvador Dali Museum in Florida. He co-created the FloridaRAMA
  immersive art experience.

  Palehorse has also designed masked pro wrestling personas for luchadors,
  including AEW's Serpentico and Arena Mexico's CMLL star Oraculo.

  His practice is rooted in Kriya Yoga. Since 2018, he has hosted a weekly local
  meditation circle called Seekers of the Eternal. He frames the current body of
  work as an expression of love that invites viewers into subtle resonance with
  their own inner landscape, calling viewers into sacred presence whether the
  work appears in museums, galleries, personal spaces, on T-shirts, or in city
  streets. He has more than 20 years of experience as a professional artist, and
  he describes the catalogue as a breadcrumb trail of his curiosity and quest
  for deeper meaning and self-discovery through creativity.

  He maintains an online store and a podcast and meditations section on his
  official portfolio at palehorsedesign.com. Contact email is
  chris@palehorsedesign.com. Instagram: @palehorse (portfolio handle
  @palehorsedesign). Additional portfolios have been published on Behance and
  Facebook.

searchMuralDescription: |
  An intricate Southeast Asian temple composition on a jet-black background. A
  central Thai-style pagoda structure with layered flame-shaped spires rises in
  the middle, flanked by two elaborate Naga serpent-dragons that coil outward in
  ornamental detail. The entire piece is rendered in fine linework using teal,
  red, gold, and white — giving it the look of a traditional temple painting
  scaled up to cover a freestanding wall. A thin white circle frames the central
  temple like a halo, and a trident symbol sits in the upper right corner. The
  level of detail is remarkable at this scale, with every scale, flame tip, and
  architectural ornament individually rendered.

muralInspiration: "Inspired by the Sanskrit concept of 'Sat Chit Ananda' — existence, consciousness, bliss. Painted in collaboration with brother Matt Parks."
