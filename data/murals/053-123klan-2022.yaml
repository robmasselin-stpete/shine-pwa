artistBio: |
  They named the crew after their zip code — 59123, Bray-Dunes, France. That was
  1992.

  Scien (Sebastien) and Klor (Carole) are 123Klan, a married graffiti duo who
  started on the walls of northern France and ended up designing for Nike,
  Adidas, Marvel, Netflix, Sony, MTV, ESPN, Stussy, and Vans. They moved from
  France to Montreal in 2007, then to Venice, California. Along the way they
  founded the BANDIT1SM streetwear brand and published three books.

  Their style is what happens when street knowledge meets graphic design —
  sharp-angled letters, vivid colors, razor-sharp color blocks, influenced by
  Japanese cartoons, North American mascots, and pop art. They have exhibited in
  over sixty shows globally, from Pow Wow Hawaii to Art Basel Miami to Urban Art
  Fair Paris.

  For SHINE 2022, they painted in St. Petersburg.

searchBio: |
  They named the crew after their zip code — 59123, Bray-Dunes, France. That was
  1992.

  Scien (Sebastien) and Klor (Carole) are 123Klan, a married graffiti duo who
  started on the walls of Bray-Dunes, a small town in northern France where they
  were the only graffiti artists in the area. The crew name began as "123KINGS"
  — a sarcastic nod to their local dominance — then shortened to "123K" and
  finally "123KLAN," reflecting both the literal couple-as-clan and the broader
  crew of close friends. Other crew members listed in early documentation
  include Dean, Sper, Skam, Meric, and Reso 1. The Wu-Tang Clan was a stated
  influence on the name.

  Their style was shaped by 1990s graffiti out of Europe and New York, and they
  crafted what they describe as a hybrid language that transcended the
  traditional graffiti schools — huge, sharp-angled letters in acid colors
  paired with characters drawn with futuristic manga features and experimental
  type. Beginning in 1994, they applied graphic design (citing Neville Brody as
  an influence) to their graffiti and vice versa. Their motto: "When street
  knowledge meets technology." In 2001, the crew "invaded the web," treating the
  internet as a new surface and a tool for creation, expression, and
  dissemination.

  Their work spans canvases, walls, record sleeves, posters, stickers, toys,
  skateboards, shoes, and t-shirts. Their creative studio handles graphics and
  branding. In 2007 they launched their own streetwear brand, BANDIT1SM (also
  written BANDIT1$M), giving them financial independence and creative freedom
  after years of collaborating with leading streetwear brands. The same year
  they relocated from France to Montreal, Canada, where they were based for
  fifteen years before moving to Venice, California.

  Their published books include 123klan (Pyramyd, Paris, 2003), Style is the
  Message (123klan, 2003), 123KLAN, version 2: Design Designer (Pyramyd
  editions, 2007), and 123KLAN respect and loved (Ankama Editions, Label 619,
  2013).

  Documented exhibition history is extensive. Recent shows include World Wide
  Walls in Honolulu, Hawaii (2023), the Bishop Museum in Honolulu (2019 and
  2023), Shine on St Pete in Saint Petersburg, Florida (2023), and the Teenage
  Kicks Festival in Rennes, France (2023). 2018 included Urban Art Fair Paris,
  Kolly Gallery in Zurich, Above the Radar in Burlington, Art Souterrain and
  Quartier des Spectacles in Montreal, Gallery 123klan in Canada, and Pow Wow
  San Jose. 2017 included Miami Art Basel (Basel House — Sentience WYN317
  Gallery), Pow Wow Worcester, and the 22nd edition of Under Pressure in
  Montreal. 2016 included the 21st Under Pressure, Amalgam Festival in
  Sherbrooke, Pow Wow Long Beach, and 123KLAN solo shows at 1AM Gallery in San
  Francisco and The HUB in Paris.

  Earlier years: SHINE at the Morean Arts Center, St Petersburg, in 2015,
  alongside Violent By Design at Stay Gallery in Downey, the 20th Under Pressure
  in Montreal, Screaming Hand at The Seventh Letter Gallery in Fairfax (Los
  Angeles), and Street Ahead at Vivid-Sydney. 2014 included Pow Wow Hawaii at
  the Honolulu Art Museum, Mural Festival Montreal, Urban Art Gallery Stuttgart,
  Montana Gallery Barcelona, All City Style New York, Jardin Rouge in Marrakech,
  and Scope New York. They returned to Pow Wow Hawaii at the Honolulu Art Museum
  every year from 2011 through 2014. 2012 marked their 20th-anniversary show in
  Bushwick, New York. 2011 included Faces And Laces in Moscow, Gamma Proforma in
  London, Against The Grain at 1AM Gallery in San Francisco, UrbanArt — Graffiti
  21 (New York, Paris, Berlin, Völklingen), BRONX in Singapore, and Sudala in
  Tijuana. They opened a Nike Store exhibition in Mexico City in 2010 and showed
  at Agnes B in Paris and New York in 2008 and 2010. 2003 included
  Semi-Permanent in Sydney, Australia, alongside Shepard Fairey and Banksy. They
  have toured exhibitions in Brussels, Berlin, Lisbon, Marrakech, Mexico City,
  Moscow, Rio, São Paulo, San Francisco, Singapore, Tokyo, Lille, Dunkirk,
  Toulouse, Strasbourg, Eindhoven, Rome, and Munich.

  123KLAN was a featured artist duo at the 2019 SpraySeeMO Mural Festival in
  Kansas City, painting on the side of the local Crossroads Artist & Craftsman
  store along Southwest Boulevard, loosely inspired by the colors of the Kansas
  City Royals. Scien was interviewed by Matt Gondek on the Clean Break Podcast
  during that festival. Their client and collaboration list includes Nike,
  Adidas, Marvel, Netflix, Sony, MTV, ESPN, Stussy, and Vans.

  Website: 123klan.com. Streetwear brand: BANDIT1SM. Contact: info@123klan.com.

searchMuralDescription: |
  A large mural on the side of Tri-J Towing in 123Klan's signature
  cartoon-graffiti style on a lavender background. The central figure is a
  cowboy outlaw character in a dark fedora with an arrow pierced through it,
  wearing an open Hawaiian shirt with a tropical print, rendered in their
  angular vector-meets-spraypaint aesthetic. To his left, a ghost-like figure
  with X'd-out eyes holds a flag, surrounded by cacti, a skull, and bold
  graffiti-style lettering reading "123" and "Go." The text "Libre et Sauvage"
  ("Free and Wild") runs across the bottom — a recurring 123Klan motif
  representing the untamed spirit of graffiti culture. Bullet hole details and
  crossed arrows anchor the composition at the base. The palette is muted
  pastels — lavender, sage green, rust, and navy — a departure from their
  typical acid brights.

