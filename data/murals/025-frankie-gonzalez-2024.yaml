artistBio: |
  He spent nine years in corporate shipping before coming back to paint.
  Twenty-five days after hand surgery, he painted Tom Brady.

  Francisco "Frankie G" Gonzalez was born in Miami to parents from Denmark and
  Cuba. He started drawing comic book scenes as a kid, began painting seriously
  at fifteen, and attended the Atlanta College of Art. After school he landed in
  Salt Lake City and spent nine years in corporate transportation before
  returning to Florida, quitting the desk, and going full-time on art. He took a
  part-time job at a Tampa art store to learn the local scene while rebuilding.

  His style blends traditional painting techniques with spray paint and latex —
  bold lines, vivid colors, compositions rooted in Latin heritage that range
  from realism to pop art. He orchestrates mural camps with local schools and
  aspiring young artists, and partners with Habitat for Humanity and the Down
  Syndrome Foundation of Florida.

  Clients include ESPN, the Tampa Bay Buccaneers, the Miami Heat, Norwegian
  Cruise Lines, the Houston Astros, Ducati, and PODS Moving & Storage. He
  painted "Tampa's LIGHT" at Tampa Fire Rescue headquarters — a visual timeline
  of the department's 128-year history — and two murals for the Pinellas County
  Tax Collector.

  For SHINE 2024, he painted at FloridaRAMA on Fairfield Avenue South.

searchBio: |
  He spent nine years in corporate shipping before coming back to paint.
  Twenty-five days after hand surgery, he painted Tom Brady.

  Francisco "Frankie G" Gonzalez was born and raised in Miami, Florida, to
  parents who migrated from Denmark and Cuba at a young age. He started drawing
  as early as he can remember, began painting seriously around age fifteen
  during high school, and after graduating attended the Atlanta College of Art.
  He moved to Salt Lake City, Utah and lived there roughly nine years, falling
  into a corporate job in the shipping and transportation industry. Despite
  success in that field, he was unfulfilled and relocated to Tampa, Florida,
  where he has reinvented his career as an artist working with galleries,
  private collectors, and high-profile clients.

  After leaving corporate America in Tampa, he found himself with no immediate
  support behind his work and took a part-time job at a local art store to
  understand the city's arts opportunities and reinvest in supplies. Those
  connections proved instrumental as his career grew. He now identifies as a
  Hispanic mixed-media artist whose work combines traditional painting methods
  with an urban art twist, used across paintings, design, and murals. He blends
  spray paint with latex paint to build cohesive designs emphasizing vivid
  colors and a range of styles from realism to illustration. He juxtaposes
  figurative subject matter with interpretations of other styles, drawing
  inspiration from Street Art and Pop Art, building bright, bold colors around
  subject matter that always carries a narrative — whether a sports icon or
  something more personal — to create harmony between figures and abstraction.

  His city commission portfolio includes work for the Cities of Tampa,
  Clearwater, Largo, and St. Petersburg. In February 2023, the City of Tampa
  Arts & Cultural Affairs Division dedicated "Tampa's LIGHT" — a site-specific
  mural commissioned at Tampa Fire Rescue headquarters showcasing a visual
  timeline of Tampa Fire Rescue's 128-year history, honoring the department's
  core values of integrity, honesty, loyalty, and trust. In December 2024, he
  installed two murals at the reimagined Pinellas County Tax Collector location
  at 13025 Starkey Road in Largo, a project produced in partnership with
  Creative Pinellas and Tax Collector Adam Ross. The Tax Collector's office also
  runs the Kids Tag Art Pinellas program, which raises funds for local
  elementary art classrooms.

  Commercial collaborations include ESPN, the Tampa Bay Buccaneers, the Miami
  Heat, Norwegian Cruise Lines, the Houston Astros, Ducati, PODS Moving &
  Storage, and Habitat for Humanity. He has painted Super Bowl champion Tom
  Brady, completed roughly 25 days after hand surgery — a project he cites as
  the kind of "once seemed impossible" work he aims for. He dedicates time to
  local schools, orchestrating mural camps with aspiring young artists and
  community partners to add public art to their communities. He partners with
  Habitat for Humanity and the Down Syndrome Foundation of Florida to give back
  through art and empower his community.

  For SHINE 2024 he painted at FloridaRAMA on Fairfield Avenue South in St.
  Petersburg. He was profiled by VoyageTampa in August 2022 ("Life & Work with
  Francisco 'Frankie G' Gonzalez") and is featured on Creative Pinellas. His
  work has been described as boldly lined and culture-infused, with rich color
  stories and compositions rooted in his Latin heritage and Florida upbringing —
  a steady presence across Tampa Bay through murals, paintings, sculptural
  objects, custom apparel, and limited-edition merchandise. He offers payment
  plans on listed and commissioned work and pushes into high-end spaces and
  major projects nationwide.

  Website: frankiegart.com. Instagram: @frankieg_art. Facebook: frankiegartwork.

searchMuralDescription: |
  A wide, energetic mural on the side of FloridaRAMA blending photorealism with
  street art. At center, a boy in a baseball cap and tan shirt launches a paper
  airplane, his outstretched arm dissolving into bold black calligraphic strokes
  and cartoon-style characters. Oversized pink peonies, sunflowers, and white
  daisies bloom along the bottom, while swirls of pink, yellow, orange, and
  turquoise fill the background. The composition moves from lush botanical
  realism on the left through the figurative center to playful abstraction on
  the right, creating a dynamic sense of childhood imagination taking flight.

