searchMuralDescription: |
  A wild, multi-story mural wrapping the corner of a commercial building. A
  massive photorealistic T-Rex with jaws wide open dominates the upper half,
  rendered in detailed brown-orange tones with textured scales and green eyes.
  Below and around it: a chaotic pop-culture collage against a sky-blue
  background — green aliens in flying saucers, UFOs, a grinning Slimer-like
  ghost, a robot in overalls, an Alfred E. Neuman-style figure in a Hawaiian
  shirt, a gorilla in a sweatshirt, crystal skulls, purple flowers, palm trees,
  and tropical foliage. The overall effect is a fever dream mashup of B-movies,
  sci-fi, and Florida kitsch in Donnelly's signature playful illustrative style.

