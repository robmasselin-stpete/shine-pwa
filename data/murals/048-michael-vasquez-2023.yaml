artistBio: |
  His work hangs in the Smithsonian. Swizz Beats and Michael B. Jordan collect
  him.

  Michael Vasquez earned his BFA cum laude from the New World School of the Arts
  in Miami in 2005. His figurative paintings explore identity in marginalized
  neighborhoods — transforming personal photographs into dramatic compositions
  where clothing, hand signs, tattoos, and neighborhood landmarks establish who
  someone is and where they come from.

  He was included in "Portraiture Now: Staging the Self" at the Smithsonian
  National Portrait Gallery (2014-15) and "The Culture: Hip Hop and Contemporary
  Art in the 21st Century" at the Baltimore Museum of Art (2023). His work is in
  the Perez Art Museum Miami, the Microsoft Art Collection, and the Rubell
  Museum. He has shown at the Saatchi Gallery in London, Wynwood Walls, and the
  Kemper Museum of Contemporary Art.

  He is a three-time SHINE artist — 2015, 2023, and 2025.

searchBio: |
  His work hangs in the Smithsonian. Swizz Beats and Michael B. Jordan collect
  him.

  Michael Vasquez was born in 1983 in St. Petersburg, Florida, the only child of
  a Polish-American single mother. His Puerto Rican father was present but did
  not take on a parental role, and he passed away when Vasquez was twelve.
  Vasquez began drawing in the second grade after watching a classmate get
  attention for his drawings, and pursued it through library books on how to
  draw horses and people. He attended a magnet high school for the arts, then
  enrolled at the New World School of the Arts in Miami intending to study
  graphic design with an interest in apparel. While there he shifted to fine art
  after watching peers a few years ahead of him make and sell the work they
  wanted to make. He earned his BFA cum laude from the New World School of the
  Arts in 2005.

  His student work used imagery from old Dick and Jane books, removing every
  character but Dick and his mother. His teacher, the Miami gallerist Fredric
  Snitzer, gave him an internship and then a job after graduation, and went on
  to represent him — placing Vasquez in the lineage of Snitzer's star artists
  after Hernan Bas, Naomi Fisher, and Bhakti Baxter. Snitzer took his work to
  the Armory Show and Art Basel, building an international audience.

  Vasquez's figurative paintings explore identity and the cultivation of
  community in marginalized neighborhoods. He cites growing up without a father
  figure or siblings as the source of his attraction to social situations where
  notions of "extended family" were prevalent. He photographs friends and
  familiar environments, sometimes shooting subjects in their own neighborhoods
  and sometimes in the studio with backgrounds Photoshopped in afterward,
  including aerial Google Maps-style views. He often cuts the photographs into
  collages — combining different guys, backgrounds, and objects — recreates them
  digitally, then translates them into large acrylic and acrylic spray paint
  canvases. Visual cues like clothing, hand signs, symbols, tattoos, and color
  carry identity; maps, neighborhood landmarks, signage, and native foliage
  establish location. He paints at large scale to position the viewer beneath
  the subjects, looking up at people they might otherwise pass without a second
  look. One close friend and frequent subject, AJ Hernandez, still lives in St.
  Pete and has spoken publicly about seeing his own image projected outside the
  Smithsonian.

  His exhibition history runs deep. Solo museum shows include "Neighborhood
  Reclamation" at the Miami Dade College Museum of Art + Design (MOAD) — where
  associate curator and director of campus galleries Wanda K. Texon worked with
  him on an installation built from canvases stood up on triangles of wood
  secured with sandbags — as well as solo exhibitions at the Kemper Museum of
  Art in Kansas City, Missouri, and at the University of Tennessee, Chattanooga.
  Other solo bodies of work include "We'll Weather the Storm Well" (2017),
  "Rites of Passage" (2012), "What Comes With The Territory" (2010), "How The
  Land Lies" (2009), "Authority Figures" (2007), and "Family Jewels" (2007).
  Group exhibitions include "Portraiture Now: Staging the Self" at the
  Smithsonian National Portrait Gallery in Washington, D.C. (August 2014–April
  2015), which traveled to the Americas Society in New York City and the
  National Hispanic Cultural Center in Albuquerque. Curators from the National
  Portrait Gallery first visited his Little Haiti studio on June 13, 2013. Seven
  of his paintings were included alongside the work of five other artists of
  Latin American descent. He has also shown at the Saatchi Gallery in London,
  the Frost Art Museum, MOCA North Miami, the Orlando Museum of Art, the Naples
  Museum of Art, the Bass Museum, and the Miami Art Museum.

  His work is currently included in "The Culture: Hip Hop and Contemporary Art
  in the 21st Century," which debuted at the Baltimore Museum of Art in 2023 and
  travels to the Saint Louis Art Museum, the Schirn Kunsthalle Frankfurt in
  Germany, the Cincinnati Art Museum, and the Art Gallery of Toronto in Canada.

  His paintings are held in the collections of the Perez Art Museum Miami, MOCA
  North Miami, the Nova Southeastern University Museum of Art, The Dean
  Collection (Swizz Beatz and Alicia Keys), The Franks-Suss Collection, the
  Microsoft Art Collection, the Montblanc Cutting Edge Art Collection, and The
  Rubell Family Collection. Michael B. Jordan is also among his collectors.

  Named paintings include "275 North-OZ and Red" (2016, acrylic and acrylic
  spray paint on canvas, 96 x 72"), "C9: Ultimate/Imperial – Carol Mart" (2016,
  72 x 96"), and "Where There's Smoke, There's Fire (Trap House)" (2015, 72 x
  90"). His "Neighborhood Reclamation" series turns photographs of dilapidated
  and blighted properties into collages and paintings that improve and
  reinvigorate the structures while keeping their history visible.

  Vasquez was a Wynwood Walls artist in 2019–2021 and is a three-time SHINE
  Mural Festival artist — 2015, 2023, and 2025. He was profiled by the National
  Endowment for the Arts in October 2016 ("Art Talk with Michael Vasquez" by
  Paulette Beete) and by Miami New Times in June 2015 ("Artist Michael Vasquez
  Brings Humanity to the Underrepresented" by Liz Tracy). He lives and works in
  Miami. His website is michaelvasquez.info.

searchMuralDescription: |
  A large photorealistic scene depicting a group of young men hanging around a
  beige Datsun 280Z parked at a waterfront spot with mangroves visible in the
  background. One figure sits shirtless on the hood, another leans against the
  car in a white t-shirt, and others stand or crouch nearby — all in jeans and
  casual wear that evoke a timeless, late-70s or early-80s Florida vibe. The
  painting captures a specific moment of youthful camaraderie, with the car as
  the gathering point. The detail in the faces, clothing, and vehicle is
  remarkably precise, and the mangrove setting grounds the scene in coastal
  Florida.

muralInspiration: "Depicts a displaced Lao family finding refuge at Gandy Beach circa 1980. The 1978 Datsun 280Z is a point of pride fusing car culture and masculinity. Clothing and style signal togetherness while solitary gazes allude to deeper personal histories."
