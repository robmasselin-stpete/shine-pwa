artistBio: |
  She has an MFA and a law degree. She represented the United States at the
  Dakar Biennale in Senegal.

  Ya La'Ford is a first-generation American of Jamaican heritage, from the
  Bronx. She earned her MFA from the Art Institute of Boston (now Lesley
  University) and her Juris Doctor from the University of Florida. She maintains
  studios in St. Petersburg, the Bronx, Jamaica, and Maine.

  Her work spans painting, sculpture, sound, print, video, and immersive
  installations using light, water, sound, and motion. Sharp geometric lines,
  bold contrasting colors, vibrant circles and triangles. She sits on the Board
  of Trustees of the Museum of Fine Arts in St. Petersburg. She designed an
  Arrow McLaren SP IndyCar and was a featured artist for Super Bowl 2021.

  Clients include the Tampa Bay Rays, Toronto Blue Jays, and Nike. Her work is
  in the collections of Tropicana Field, Al Lang Stadium, the Morean Arts
  Center, and the Boston Public Library. She has shown at The James Museum, The
  Ringling Museum of Art, and Florida CraftArt.

  For SHINE 2021, she painted in St. Petersburg.

searchBio: |
  She has an MFA and a law degree. She represented the United States at the
  Dakar Biennale in Senegal.

  Ya La'Ford is a first-generation American of Jamaican heritage, born and
  raised in the Bronx. She earned her MFA from the Art Institute of Boston (now
  part of Lesley University) and her Juris Doctor from the University of
  Florida, with additional training in engineering. Family shaped her
  trajectory: her grandfather was an influential figure in the arts, her uncle
  is a musician with the band Third World, and her godfather wove cultural
  storytelling into his music. She has lived in Washington DC, Houston, South
  Florida, and Boston, and has called the Tampa Bay area home for nearly a
  decade. She lives in St. Pete's Historic Kenwood neighborhood and maintains
  additional studios in the Bronx, Jamaica, and a 30-acre property in Maine
  where she is building her largest immersive public artwork.

  Her practice spans painting, sculpture, sound, print, video, and immersive
  installations using light, water, sound, and motion. The visual signature is
  consistent: sharp geometric lines, bold contrasting colors, vibrant circles
  and triangles, spirals representing unity, change, and growth. Her discovery
  of large-scale mural work came during a secluded residency when her canvas and
  materials were lost in delivery — she transferred her canvas-intended patterns
  to the studio wall and never went back.

  She sits on the Board of Trustees of the Museum of Fine Arts in St.
  Petersburg. She designed an Arrow McLaren SP IndyCar and was a featured artist
  at Super Bowl 2021, with work collected by all National Football League Owners
  as part of the Super Bowl collection. Her client list includes the Tampa Bay
  Rays, Toronto Blue Jays, and Nike. Her work is held in the collections of
  Tropicana Field, Al Lang Stadium, the Morean Arts Center, and the Boston
  Public Library.

  Documented installations and locations across St. Petersburg include the Hyatt
  entrance, the back entrance of the Morean Arts Center, the entryway of the
  Rowdies, inside the Rays entryway to the stadium, inside Nike, "The King's
  Dream Unite" (2016) at the Historic Manhattan Casino, "Intersections" wrapping
  the second level and rooftop terrace of the St. Petersburg Museum of History,
  the entryway of the James Weldon Johnson Public Library, multiple local
  schools, the entryway of the Warehouse Arts District, and a blue tunnel
  leading to the baseball stadium at Tropicana Field. Her largest St. Pete solo
  exhibition to date is "Survey the West: A Cross-Continental Reflection" at The
  James Museum.

  Other public art and installations include "Boulevard Flow," a sculptural
  landscape with a labyrinth-shaped park and a 10-foot metal sphere; "The Silver
  Lining," which debuted at the London Art Fair using light, water, sound, and
  motion; "American/Rōōts," a mixed-media installation at The John and Mable
  Ringling Museum of Art; "The Impenetrable Intersection: Jamaican Ja Rasta
  Visible L'Invisible" at the Atlantic Center for the Arts (three walls, spray
  paint, acrylic, gold leaf, and found objects); "Survey: The West" at Ogden
  Contemporary Arts (2022); and "Distance," a solo full-environmental immersive
  show at Gallery 221, HCC Gallery. She has large-scale public-art sculptures
  and installations in Orlando, Gainesville, Pompano Beach, Hawaii, and New
  Jersey, plus public-art projects in South Africa. International exhibitions
  include shows in Dubai, Thailand, and China, and a project working with
  children in Cuba.

  Group and museum shows include The James Museum, The Ringling Museum of Art,
  Florida CraftArt, the Baker Museum in Naples, Studio@620, Tampa Museum of Fine
  Arts, and The Florida Museum of Photographic Arts. Joanna Robotham, Curator of
  Modern and Contemporary Art at the Tampa Museum of Art, has spoken publicly
  about watching her work grow over the past eight years.

  A defining moment came in November when she represented the United States at
  the Dakar Biennale in Senegal, hosted by the U.S. Embassy. She is preparing
  for an artist residency with the Urban League in Ghana. She is a wife, mother
  of two, and pet parent, and is working on more than 100 concurrent projects.
  She has spoken publicly about future installations incorporating rare metals,
  gems, and augmented and virtual reality.

  For SHINE Mural Festival 2021, she painted in St. Petersburg.

  Website: yalaford.com. General contact: ya@yalaford.com. Press:
  contact@yalaford.com. The Creative Pinellas "Arts In" podcast episode
  profiling her was published February 25, 2019, hosted by Sheila Cowley with
  executive producer Barbara St. Clair for Creative Pinellas.

searchMuralDescription: |
  A bold graphic mural on a charcoal-gray wall featuring a large heart filled
  with Ya La'Ford's signature intricate geometric line pattern — dense, angular,
  interlocking shapes in bright orange-red. The words "Love Shines" are written
  across the heart in flowing white neon-style script, with a small illuminated
  element at the top. The heart is centered on the wall with clean negative
  space around it, creating a striking contrast between the dark background and
  the vibrant pattern. Signed "Ya La'ford @yalaford" in white at the bottom. An
  orange Smith & Associates plaque with the mural's backstory is mounted to the
  lower right. The piece was part of "The Love Line Project," one of three SHINE
  2021 Bright Spots community projects — the phrase "Love Shines" was voted on
  by the public.

