artistBio: |
  On January 1, 1914, a Benoist flying boat lifted off the St. Pete waterfront,
  climbed to 50 feet, and crossed Tampa Bay in 23 minutes. First scheduled
  airline flight in history. Tony Jannus at the controls. The mayor — Abram
  Pheil — had paid $400 at auction for the seat next to him.

  Justin Bass painted the sequel. A flamingo glides across the sky carrying
  St. Pete itself, a figure perched on its back, a boombox along for the ride.
  A flamingo flies escort. Same route the Benoist took, retold in pastel.

  Bass works under the name DropTheLove — artist, designer, restoration
  specialist out of South Florida. He's collaborated with Miami scenic painter
  Ryan Zook on projects around the region. Beyond that the trail goes quiet:
  an Instagram, a LinkedIn, no interviews, no press packet. The wall does
  the talking.

  It wraps the Tru by Hilton parking garage on Central Avenue, blocks from
  the bay the Benoist crossed.

searchBio: |
  On January 1, 1914, the world's first scheduled commercial airline flight
  took off from the St. Petersburg Municipal Pier. The aircraft was a Benoist
  XIV flying boat — a pontoon-equipped biplane carrying one pilot and one
  passenger. The pilot was Tony Jannus. The passenger was former St. Petersburg
  mayor Abram C. Pheil, who had won the seat at auction for $400. They climbed
  to 50 feet, crossed Tampa Bay in 23 minutes, and landed near the mouth of the
  Hillsborough River. A crowd of over 3,000 lined the St. Pete waterfront to
  watch them go. The St. Petersburg–Tampa Airboat Line, conceived by Florida
  entrepreneur Percival Fansler in partnership with aircraft manufacturer
  Thomas Benoist, ran for nearly four months and carried 1,205 passengers
  before shutting down. It is the origin point of commercial aviation.

  Justin Bass turned that flight into a mural on Central Avenue 112 years later.
  In his version a flamingo stands in for the Benoist, a rider for Mayor Pheil,
  and the city of St. Petersburg itself is the cargo. A pink flamingo flies
  escort. A second winged flamingo dives in from the upper right. Puffy
  blue-gray clouds and small triangular shapes fill the teal-green sky. The
  flamingo is the 112-year update — same route, different vibe.

  Bass works as an artist, designer, and restoration specialist under the brand
  DropTheLove. His LinkedIn title is "Artist / Designer / Restorations at
  DropTheLove." He has collaborated with Miami-based scenic artist and designer
  Ryan Zook (@zookart, ryanzookart.com) — the pair were described as "the
  dynamic duo" by Project In The Paint. He also goes by "Jb Jb" on Instagram
  and "jmovement" on Facebook and Flickr.

  The mural wraps the parking garage wall at the Tru by Hilton on Central
  Avenue in St. Petersburg. It is an exterior piece, distinct from the hotel's
  interior lobby art by Mike Traina. Two blocks from the waterfront where the
  Benoist took off in 1914.

  Instagram: @dropthelove. TikTok: @justinbass511.

searchMuralDescription: |
  A wide mural along a parking garage wall on a teal-green background. A surreal
  aviation scene features a pink flamingo in flight on the left, a figure riding
  atop a giant flamingo carrying a boombox through the sky at center, and a
  winged flamingo diving from the upper right. Puffy blue-gray clouds and small
  triangular shapes fill the sky. The style is playful and illustrative with a
  pastel palette of teal, pink, lavender, and gray.

muralInspiration: |
  The world's first scheduled commercial airline flight took off from the
  St. Petersburg waterfront on January 1, 1914 — a Benoist XIV flying boat
  piloted by Tony Jannus, carrying former mayor Abram C. Pheil to Tampa in
  23 minutes. Pheil paid $400 at auction for the seat. Bass's mural retells
  that flight in surreal pastel: the flamingo stands in for the Benoist, the
  rider for Mayor Pheil, and St. Pete itself is along for the ride. The
  boombox is the 112-year update.
