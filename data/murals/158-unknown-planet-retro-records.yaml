artistBio: |
  The signature hides on the electrical box: a yellow spade outline over
  "J. Thomas," painted in the same yellow as the rest of the wall. That is
  all the wall says about who made it. No published source names the artist.

  The piece wraps the side of Planet Retro Records, a vinyl shop on Dr. MLK
  Jr. St N, and it is built for the store — bearded heads wired to the wall
  by long ribbed hoses, a turntable panel, and a red "RECORDS" arrow pointing
  the way in.

searchBio: |
  Signed "J. Thomas" with a spade outline, painted in yellow on the electrical
  box set into the mural. No published source found that names or profiles the
  artist, the year, or who commissioned the wall (searched 12 Nov 2026). The
  mural covers the Burlington Ave N side wall of Planet Retro Records, a vinyl
  record store at 226 Dr. MLK Jr. St N in downtown St. Petersburg, FL. Not a
  SHINE piece; a music-themed wall for the record store. Planet Retro is home
  to other murals too: Derek Donnelly painted the store's rear wall in 2022,
  which is a different piece from this one.

searchMuralDescription: |
  Yellow line-drawn figures on a dark gray wall gridded with thin yellow
  rectangles. At the left corner, a red vertical "RECORDS" sign ends in a red
  arrow pointing down and left. Next to it, two bearded heads in profile, one
  above the other, in yellow caps, their long beards drawn as wavy yellow
  lines; a ribbed hose runs from one ear. Below them, a yellow panel holds a
  black turntable with a record. Two glass-block windows are painted with
  rows of yellow concentric circles like speaker cones. At the right, a large
  front-facing bearded head in a yellow cap stares out, with ribbed hoses
  running from both ears across the wall. The electrical box near it carries
  the signature: a yellow spade outline over "J. Thomas." Only yellow, red,
  and gray/black are used.

