artistBio: |
  Artist unknown. Yellow line-drawn characters on the side of Planet Retro
  Records — bearded figures wearing headphones, a turntable, and a "RECORDS"
  sign in red. The style is illustrative and music-themed, matching the record
  store.

searchBio: |
  Artist unknown. A mural on the side of Planet Retro Records in St. Petersburg,
  FL. Yellow line-drawn characters on a dark gray background — bearded figures
  wearing headphones, a turntable, and a "RECORDS" sign in red neon-style
  lettering. The style is illustrative and music-themed. Not a SHINE piece —
  likely a commercial commission for the record store. Note: Derek Donnelly
  painted a nearby mural but this is a different piece.

searchMuralDescription: |
  Yellow line-drawn characters on a dark gray wall. On the left, a red "RECORDS"
  sign and a figure with headphones and a yellow hat. At center, a yellow vinyl
  record on a turntable. On the right, two bearded figures with flowing yellow
  hair and headphones — their beards and hair rendered as tangled line work. The
  entire piece uses only yellow, red, and gray/black, giving it a graphic,
  illustrative quality that matches the record store aesthetic.

