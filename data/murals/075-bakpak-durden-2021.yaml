artistBio: |
  His first solo museum exhibition sold out at Cranbrook Art Museum. He is a
  Black trans postgender artist painting in the tradition of Dutch Baroque.

  Bakpak Durden is a self-taught artist from Detroit. His style is
  hyperrealistic and conceptual — Afro-Surrealist work exploring human emotion,
  identity, consciousness, and spiritual existence, inspired by Baroque painting
  and cinematic language. He works in oil, acrylic, graphite, and fine art
  photography.

  His "Eye of Horus" at Cranbrook was the inaugural Fresh Paint exhibition
  series. He has shown at the Muskegon Museum of Art, Arab American National
  Museum, Heron Arts in San Francisco, and Paradigm Gallery in Philadelphia. He
  won the 2021 Gilda Award and a Modern Ancient Brown Foundation Grant. He is
  represented by B&A Reps. For SHINE 2021, he painted a vanitas-style mural in
  St. Petersburg.

searchBio: |
  His first solo museum exhibition sold out at Cranbrook Art Museum. He is a
  Black trans postgender artist painting in the tradition of Dutch Baroque.
  Bakpak Durden is a self-taught artist born and raised in Detroit, where he
  currently lives and works. He is an interdisciplinary fine artist describing
  his practice as multi-hyphenate, post-disciplinary, and hyper-surrealistic.
  Through extensive research, introspective examination, and an antidisciplinary
  approach, he fuses narrative and visual elements of the Baroque and
  Afro-Surrealist movements to create deconstructed cinematic experiences he
  calls "films," exploring human consciousness and Spiritual Existence.

  His hyperrealistic and conceptual work draws on dramatic cinema and Dutch
  Baroque painting, illuminating the complexity and precarity of human emotion
  and identity by meticulously examining his own. He works across a wide range
  of mediums — oil paint, acrylic paint, graphite, and fine art photography. His
  subjects are typically depicted in transitional states or moments of reverie
  and introspection, with an emphasis on connecting to surrounding communities.
  His practice highlights Black trans and queer visibility, mental health,
  neurodiversity, and disability advocacy and representation as a Detroiter in
  the city's art scene.

  "Bakpak Durden: The Eye of Horus" was his first solo museum exhibition, held
  in the Upper Galleries at Cranbrook Art Museum in Bloomfield Hills, Michigan,
  from November 5, 2022 to March 12, 2023. It was the inaugural show of
  Cranbrook Art Museum's Fresh Paint series, which highlights new work from
  Detroit-based artists. The Eye of Horus is an ancient Egyptian symbol thought
  to have healing and protective powers, also used in ancient mathematical and
  neurological contexts; for the exhibition Durden explored the physiological
  and psychological functions relating to vision and the mind through paintings
  and sculpture that dissect the physical processes of vision and the anatomical
  magic shaping emotion and identity. The exhibition was curated by Kat
  Goffnett, Assistant Curator of Collections, and Laura Mott, Chief Curator at
  Cranbrook Art Museum. It was supported by the George Francoeur Art Museum
  Exhibition Fund and the Gilbert Family Foundation, with additional assistance
  from the Ruth Ellis Center and Playground Detroit. As part of the project,
  Cranbrook Art Museum partnered with the Ruth Ellis Center, a non-profit
  providing trauma-informed services for LGBTQ+ youth and young adults of color,
  and Durden created a permanent mural for the new Ruth Ellis Clairmount Center
  in Detroit.

  Works from the Cranbrook show included "Hope/Less" (2021, oil on wood panel,
  Collection Cranbrook Art Museum, Gift of Rose M. Shuey from the Collection of
  Dr. John and Rose M. Shuey, by exchange) and "The Refrigerator" (2020, oil on
  wood panel, courtesy the artist and Playground Detroit, photo Samantha Bankle
  Schefman). His mural "Evocative of Ingenuity" (2021) is located at 952 Clay
  Ave in Detroit, Michigan, and was completed during the 2021 BLKOUT Walls Mural
  Festival. Exhibition views were photographed by PD Rearick.

  His work has been presented in exhibitions at Cranbrook Art Museum (Bloomfield
  Hills, MI); Muskegon Museum of Art (Muskegon, MI); The Stamps Art Gallery (Ann
  Arbor, MI); The Arab American National Museum (Dearborn, MI); Heron Art (San
  Francisco, CA); Morean Arts Center (St. Petersburg, FL); Paradigm Gallery
  (Philadelphia, PA); and Gangway Gallery (Honolulu, HI), among others. His work
  has been shown both nationally and internationally.

  He won the 2021 Gilda Award through Kresge Arts in Detroit, which is funded by
  The Kresge Foundation and administered by the College for Creative Studies. He
  has also received a Modern Ancient Brown Foundation Grant. He has completed a
  number of murals across the nation, including one for the GUCCI VS EVERYBODY
  campaign. For SHINE 2021, he painted a vanitas-style mural in St. Petersburg.

  He is represented for mural art by B&A Reps, alongside artists including Will
  Barras, Kitt Bennett, Ewok, Taj Francis, George Rose, Georgia Hill, INSA,
  Ornamental Conifer, Roids, Tatiana Suarez, Victor Reyes, and Vizie. Agent
  contact: info@ba-reps.com. Project inquiries: bakpakmgmt@gmail.com. Website:
  bakpakdurden.com. Instagram: @bakpakdurden. Photo credits include Cody Samuel
  and MARS Marshall.

searchMuralDescription: |
  A dark, moody mural stretches across the long wall of The Bends. On a
  near-black background, a skull and exposed jawbone with visible teeth emerge
  from tangled, organic forms in deep greens and grays. The text "TELL ME HOW
  YOU FEEL" appears in the upper right corner. The hyperrealistic rendering and
  somber palette give it the gravity of a classical vanitas painting at massive
  scale.

