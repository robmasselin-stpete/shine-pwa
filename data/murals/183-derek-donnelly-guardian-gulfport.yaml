artistBio: |
  He painted a T-Rex in a Hawaiian shirt going fishing — for AARP. That tells
  you most of what you need to know about Derek Donnelly.

  A Pinellas County native, Donnelly grew up in Pinellas Park, graduated from
  the Center for the Arts at Gibbs High School in 2001, and studied graphic
  design and digital illustration at IADT Tampa. He went full-time on murals in
  2010. A year later he opened Saint Paint Arts gallery on the 600 block of
  Central Avenue. His style sits at the intersection of illustration and realism
  — playful without being childish, bold without being loud.

  His client list runs from Fender Guitars to the Tampa Bay Rays to Sirata Beach
  Resort. Multiple Best of the Bay wins. Inaugural Artmaker 2026 at Ruth Eckerd
  Hall. For SHINE 2025, he ran operations and served as artist liaison for the
  entire festival while producing two murals of his own.

searchBio: |
  He painted a T-Rex in a Hawaiian shirt going fishing — for AARP. That tells
  you most of what you need to know about Derek Donnelly. A Pinellas County
  native, Donnelly grew up in Pinellas Park, graduated from the Center for the
  Arts at Gibbs High School in 2001, and studied graphic design and digital
  illustration at IADT Tampa. He went full-time on murals in 2010. A year later
  he opened Saint Paint Arts gallery on the 600 block of Central Avenue in St.
  Petersburg. His style sits at the intersection of illustration and realism —
  playful without being childish, bold without being loud. His client list runs
  from Fender Guitars to the Tampa Bay Rays to Sirata Beach Resort. Multiple
  Best of the Bay wins. Inaugural Artmaker 2026 at Ruth Eckerd Hall. For SHINE
  2025, he ran operations and served as artist liaison for the entire festival
  while producing two murals of his own.

  In May 2025, Donnelly painted "Guardian of Gulfport" on the exterior of
  Stormrunners Tavern in Gulfport, Florida. The Gabber Newspaper covered the
  mural in a May 5, 2025 piece by Maggie Duffy. The work depicts the
  mythological god of the sea — Neptune in Roman mythology, Poseidon in Greek —
  rendered in the style of classical sculpture, set into an underwater scene
  populated with coral, fish, and sharks. Donnelly conceived the piece as a
  reflection on the city's resilience after Hurricanes Helene and Milton struck
  the coast in 2024. He described the mural as "a symbol of hope and resilience
  for the people of Gulfport and all the coastal communities that we live in."

  The Stormrunners commission came together opportunistically. Donnelly was
  originally hired to repaint interior murals at Stormrunners Tavern that had
  been damaged in the storms. He was not involved in the building's other
  exterior murals, which had been painted by a different company in a
  stylistically distinct manner. When Donnelly noticed the blank exterior wall,
  he pitched owner Dave Burton on adding a new mural ahead of the tavern's
  reopening, and the two of them planned the design together. Donnelly painted
  "Guardian of Gulfport" over the course of a week, and reported that passersby
  stopped to comment on the work constantly while he painted — at one point
  three people in a five-minute span remarking on what the mural meant to the
  community.

  "Guardian of Gulfport" is Donnelly's first mural in Gulfport, despite his
  having painted murals throughout St. Petersburg and Pinellas Park. He has
  described Gulfport as friendly and charming, with what he characterizes as an
  unparalleled sense of community. The Gabber piece quoted him calling
  Gulfport's spirit "steadfast" and noted his hope that the Stormrunners
  commission won't be his last in the city.

  Donnelly wrote a poem to accompany the mural, also honoring Gulfport. The poem
  reads: "Beneath the waves where silence sings, A crowned titan watches, forged
  in storm and salt. His gaze holds the memory of winds that howled, Of waters
  that rose to test the heart of a city. But Gulfport did not break — it bent
  like seagrass, rooted deep. The hurricanes of 2024 carved their mark, Yet from
  the ruin, resilience bloomed. He stands for them now — not as myth, but as
  memory, A reminder that even the ocean cannot drown The spirit of a steadfast
  shore."

