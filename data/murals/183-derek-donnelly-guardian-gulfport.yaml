searchMuralDescription: |
  A monochromatic teal mural covering the entire side wall of Stormrunners
  Tavern. A massive Neptune/Poseidon figure dominates the right side — a
  weathered bearded face with flowing hair that merges into coral, sea fans, and
  marine growth. His expression is stern and watchful. Sharks swim through the
  water to the left. The entire composition is rendered in variations of a
  single deep teal-green, creating the effect of an underwater bas-relief
  sculpture. The textured stucco wall surface adds to the carved-stone illusion.
  Signed "Donnelly" at upper left.

