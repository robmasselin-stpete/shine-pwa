artistBio: |
  PHYBR is the tag name of Ken Dushane III, a self-taught muralist originally from the Detroit area. He got into art through graffiti and skateboard culture, studied IT and graphic design, and worked early on in airbrushing, custom car painting, and pinstriping before transitioning to full-time mural work around 2013. He has painted over 250 large-scale murals across the United States. His style fuses modern surrealism, pop aesthetics, hyper-realistic portraiture, and optical illusions. He has served as creative director for A$AP Rocky and done work for Universal Pictures and Tee Grizzley. He taught as adjunct faculty at the College for Creative Studies in Detroit and spent four years as an instructor in Toledo's Young Artists at Work program. He relocated to Kansas City's West Bottoms neighborhood in 2022, where he is currently based.

muralDescription: |
  An exterior mural on the side of The Neon Lunchbox, an 80s/90s-themed restaurant and cocktail bar at 1756 Central Avenue. The piece is a swirling optical-illusion vortex of hyper-realistic 80s and 90s toys and pop culture icons against a dark background. Items spiral inward toward a central vanishing point: Tom and Jerry mid-chase, a Rubik's cube, a pink-and-black Furby with glowing blue eyes, a grey Beanie Baby elephant with its red TY heart tag, a Game Boy, porcelain dolls, a Tamagotchi, and other childhood artifacts of the era. The rendering is photorealistic — each toy casts its own shadow and catches light as if tumbling through space. The vortex effect creates a sense of being pulled into a nostalgic time warp, matching the restaurant's retro theme.

