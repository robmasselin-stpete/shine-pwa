artistBio: |
  He spent two weeks as A$AP Rocky's creative director. He has a background in
  horticulture.

  Ken Dushane III — PHYBR — grew up in Toledo, Ohio, started in graffiti and
  skateboarding, got into lowrider culture in high school, and learned
  airbrushing and pinstriping along the way. He studied IT security and graphic
  design before returning to art. He started painting graffiti seriously in
  Detroit around 2013.

  He has painted over 250 murals in twelve-plus years — hyperrealistic
  portraits, animals, objects, creatures, and the "pop-esque tropical foliage"
  that his horticulture background feeds. Clients include Universal Pictures
  (advertising for the movie Night Swim), rapper Tee Grizzley, the Truman music
  venue and Lyric Opera House in Kansas City.

  He relocated to Kansas City in 2022 and completed a residency at Upper Level
  Gallery. He has worked with youth through the Young Artists at Work program in
  Toledo and after-school programs at the College for Creative Studies in
  Detroit.

searchBio: |
  He spent two weeks as A$AP Rocky's creative director. He has a background in
  horticulture.

  Kenneth "Ken" Dushane III — PHYBR — grew up in Toledo, Ohio, originally
  getting into art through graffiti and skateboarding culture. In high school he
  discovered lowrider culture and learned airbrushing and pinstriping. He
  studied IT security and graphic design, then returned to visual art and
  started painting graffiti seriously in Detroit around 2013-2014.

  He has painted over 250 murals professionally in twelve-plus years. His style
  fuses hyperrealistic portraits, animals, objects, and creatures with
  "pop-esque tropical foliage" informed by his background in horticulture. He is
  expanding into fine art and 3D sculptural work, debuting with his "Poison
  Garden" show. Specializations include landscape, figurative, and typography.

  Clients include A$AP Rocky (creative director for two weeks, multiple
  projects), Universal Pictures (advertising for Night Swim), rapper Tee
  Grizzley, the Truman music venue (Kansas City), and the Lyric Opera House
  (Kansas City). He has also painted at the From The Earth dispensary in Kansas
  City as part of a collaboration with the artist Skela. He has shown at
  Epiphany Center for the Arts in Chicago ("Foliage #3") and completed a
  residency at Upper Level Gallery in Kansas City.

  He has worked with youth through the Young Artists at Work program in Toledo,
  Ohio and after-school art programs at the College for Creative Studies in
  Detroit. He relocated to Kansas City in 2022 from Toledo via Detroit.

  Festival credits include SpraySeeMO Mural Festival (participated every year
  2017-2021+) and work in Detroit, Chicago, Kalamazoo, Kansas City, Toledo,
  Miami, Los Angeles, and St. Petersburg. His Neon Lunchbox mural on Central
  Avenue is a commercial commission, not a SHINE piece.

  Instagram: @phybr. Website: phybrart.com.

searchMuralDescription: |
  An exterior mural on the side of The Neon Lunchbox, an 80s/90s-themed
  restaurant and cocktail bar at 1756 Central Avenue. The piece is a swirling
  optical-illusion vortex of hyper-realistic 80s and 90s toys and pop culture
  icons against a dark background. Items spiral inward toward a central
  vanishing point: Tom and Jerry mid-chase, a Rubik's cube, a pink-and-black
  Furby with glowing blue eyes, a grey Beanie Baby elephant with its red TY
  heart tag, a Game Boy, porcelain dolls, a Tamagotchi, and other childhood
  artifacts of the era. The rendering is photorealistic — each toy casts its own
  shadow and catches light as if tumbling through space. The vortex effect
  creates a sense of being pulled into a nostalgic time warp, matching the
  restaurant's retro theme.

