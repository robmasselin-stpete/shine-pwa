artistBio: |
  This one is on their own wall. Johnny Vitale launched Overspray in 2023 — a
  street-art shop and graffiti school in Gulfport — and this green-skinned
  cartoon monster with a spray-can-cap head guards the side of the building,
  red can in one claw, "O.S." (Overspray) branded on its belly. Signed
  "VITALE BROS" lower right.

  Johnny Vitale and his brother Paul started Vitale Bros in Tampa Bay in 1992
  hand-lettering signs and painting storefront windows. Their parents are
  artists. So were their grandparents. No formal training — just family
  tradition and thirty-plus years of practice.

  In the late 1990s they opened a warehouse studio that hosted group art,
  music, and fashion shows that helped birth St. Pete's emerging art scene.
  They collaborated on set design for Harmony Korine's Spring Breakers. They
  have painted for the Tampa Bay Rays, the Buccaneers, L'Oreal, and dozens
  of local businesses. They call themselves the "mural police" — restoring
  damaged walls around the city for free.

  They have painted SHINE every year since its inception.

searchBio: |
  Vitale Bros — see full bio on their other entries (ids 27, 73, 142, 156,
  174). This is the side wall of Overspray, the Vitale Bros' own street-art
  shop and graffiti school in Gulfport (launched by Johnny Vitale in 2023).
  Cartoon graffiti subject: a fanged green monster with a spray-can-cap for a
  head, holding a red spray can in its left claw, branded "O.S." (Overspray)
  across its belly, drool dripping from its long red tongue. Heavy
  black-outline cartoon style, signed "VITALE BROS" in wildstyle lettering
  lower right.

  Johnny and Paul Vitale grew up in a family of artists across three
  generations. No formal training. They have painted for the Tampa Bay Rays,
  the Buccaneers, L'Oreal, and dozens of local businesses. They have painted
  every SHINE since 2015 — including "The Cool Kids" (2015) and "Bait and
  Switch" (2019). After Hurricane Milton, they painted free signs for
  businesses that lost theirs. Johnny launched Overspray in Gulfport in 2023
  and teaches tagging, block letters, Wildstyle, and advanced mural technique
  to classes of up to twenty students.

  Instagram: @vitalebros.

searchMuralDescription: |
  A large vertical mural on a white horizontal-clapboard exterior wall. The
  subject is a chunky cartoon monster, full-figure, facing the viewer. Its
  head is a stylized spray-paint can cap — silver dome with a black spray
  nozzle. The face is bright green with bulging bloodshot eyes (one rolled
  up, one rolled side), a wide fanged grin showing pointed teeth, and a long
  red tongue lolling out. In its left claw it holds a red spray can with a
  green cap, pointed away from the body, drips of paint dribbling off. Its
  green body is hairy/scruffy around the edges, with the letters "O.S."
  branded in red on its belly inside a black outline. The legs are stubby
  with blue cuffs and bare green clawed feet planted on the ground. A small
  navy-blue squiggle floats in the upper left, possibly representing motion
  or stink. Signed in dark-blue wildstyle lettering at the lower right:
  "VITALE BROS."

