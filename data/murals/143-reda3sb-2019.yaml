artistBio: |
  Reda3sb (Ricardo Delgado) is a self-taught urban artist and illustrator originally from Mexico. He started painting graffiti at 17 and spent over a decade honing his craft on the streets before moving to the Tampa Bay area. He was introduced to SHINE by Spanish artist Belin, who painted for the festival in 2018. His work centers on hyper-realistic portraiture rendered entirely in spray paint.

muralDescription: |
  A panoramic composition of hyper-realistic female faces and features — eyes, lips, a full portrait — arranged across geometric pastel shapes in pink, mint green, and warm peach tones. A blue-toned face gazes out from within a dark inverted triangle at center, flanked by golden circles and spheres. The piece spans the full width of a low-slung commercial building, blending photorealism with abstract geometry.

