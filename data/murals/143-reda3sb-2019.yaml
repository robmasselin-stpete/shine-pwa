artistBio: |
  He started painting graffiti at seventeen — "just for fun and as a hobby."
  That was over a decade ago. He has been refining the same craft ever since.

  Ricardo Delgado — Reda3sb — is a self-taught urban artist, illustrator, and
  designer originally from Mexico, now based in Gulfport. He was already an
  established muralist in Mexico before moving to the Tampa Bay area. His style
  is hyper-realistic portraiture executed primarily in spray paint — refining
  "the narrative quality of images through urban art and illustration." He tries
  to leave a little of himself in every mural.

  He was introduced to SHINE by the Spanish photorealist graffiti master Belin,
  who painted the festival in 2018. Reda3sb and Belin had collaborated years
  earlier in Mexico.

  For SHINE 2019 he painted "Feelings" at Hell's Bells CrossFit on 22nd Street
  South — hyper-realistic female faces and features arranged across geometric
  pastel shapes in pink, mint green, and warm peach. The premise is plain: "We
  laugh, we cry, we get angry, etcetera. We are all the same. Regardless of skin
  color, socioeconomic status, or country of origin, we all experience the same
  universal feelings."

searchBio: |
  He started painting graffiti at seventeen — "just for fun and as a hobby."
  That was over a decade ago. He has been refining the same craft ever since.

  Ricardo Delgado — Reda3sb — is a self-taught urban artist, illustrator, and
  designer originally from Mexico, now based in Gulfport. He was already an
  established muralist in Mexico before moving to the Tampa Bay area. His style
  is hyper-realistic portraiture executed primarily in spray paint — refining
  "the narrative quality of images through urban art and illustration." He tries
  to leave a little of himself in every mural.

  He was introduced to SHINE by the Spanish photorealist graffiti master Belin
  (Miguel Angel Belinchon Bujes), who painted the festival in 2018. Reda3sb and
  Belin had collaborated years earlier in Mexico. Belin is internationally known
  for photorealistic portrait murals that fuse realism with cubist fragmentation
  — Reda3sb shares that hyper-real portrait lineage.

  For SHINE 2019 he painted "Feelings" at Hell's Bells CrossFit, 131 22nd St S
  in St. Petersburg — hyper-realistic female faces and features arranged across
  geometric pastel shapes in pink, mint green, and warm peach. The premise is
  plain: "We laugh, we cry, we get angry, etcetera. We are all the same.
  Regardless of skin color, socioeconomic status, or country of origin, we all
  experience the same universal feelings." The piece functions as a humanist
  statement about shared emotional experience.

  He also runs Delgado's Painting LLC. Instagram: @reda3sb.

searchMuralDescription: |
  A panoramic composition of hyper-realistic female faces and features — eyes,
  lips, a full portrait — arranged across geometric pastel shapes in pink, mint
  green, and warm peach tones. A blue-toned face gazes out from within a dark
  inverted triangle at center, flanked by golden circles and spheres. The piece
  spans the full width of a low-slung commercial building, blending photorealism
  with abstract geometry.

