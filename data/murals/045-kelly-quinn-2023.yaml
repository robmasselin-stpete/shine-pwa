artistBio: |
  She was Artist-in-Residence at The Florida Aquarium — live-painting, teaching
  classes, collaborating with educators. Conservation is the work.

  Kelly Quinn grew up in rural Florida and graduated from the University of
  Florida's College of Fine Arts in 2016. That same year she founded Kelly of
  the Wild. In 2018 she co-founded Canvas of the Wild with Blake Wheeler, where
  she serves as art director. Her focus is wildlife and nature — digital
  illustration, acrylic painting, and large-scale conservation-driven murals.

  Clients include The Florida Aquarium, the Florida Wildlife Corridor Foundation
  (Crystal River Mural), Weedon Island Preserve, Coral Restoration Foundation,
  Biscayne National Park, the National Parks Association, the Oceanic
  Preservation Society, and the International Sea Keepers Society — which named
  her Artist of the Year in both 2021 and 2022.

  She is based in St. Petersburg. For SHINE 2023, she painted locally.

searchBio: |
  She was Artist-in-Residence at The Florida Aquarium — live-painting, teaching
  classes, collaborating with educators. Conservation is the work.

  Kelly Quinn was born and raised in rural Florida on the headwaters of the
  Everglades, surrounded by conservation land. She explored the area looking for
  critters and drew them with paper and pencil, which set the trajectory. She
  graduated from the University of Florida College of Fine Arts in 2016 and is
  based in St. Petersburg, Florida.

  That same year, 2016, she founded her personal brand, Kelly of the Wild. In
  2018 she co-founded Canvas of the Wild with Blake Wheeler, a creative design,
  development, and publishing studio focused on supporting STEAM education and
  engaging individuals with environmental science through the creative process.
  The studio works through infographics, books, workshops, and interactive
  environments. Kelly serves as Art Director, designing natural landscape murals
  for educational campaigns, creating illustrations for coloring and activity
  books, and developing scientific graphics for communicating research.

  Her practice spans digital illustration, acrylic painting, and large-scale
  conservation-driven murals. She has worked with small businesses, large
  nonprofits, local government, and corporate brands on educational content —
  children's books, murals, social media campaigns, infographics, team building,
  art lessons, and personal art commissions.

  Clients and partners include The Florida Aquarium, the Florida Wildlife
  Corridor Foundation, Weedon Island Preserve, Coral Restoration Foundation,
  Biscayne National Park, the National Parks Association, the Oceanic
  Preservation Society, and the International Sea Keepers Society. The
  International Sea Keepers Society named her Artist of the Year in both 2021
  and 2022. The Oceanic Preservation Society named her its Featured Artist for
  2022.

  A central project is the Crystal River Mural, a partnership between the
  Florida Wildlife Corridor Foundation and Canvas of the Wild. The mural
  campaign aims to raise awareness of the Florida Wildlife Corridor — an
  18-million-acre statewide network of connected lands and waters, with 10
  million acres protected as Federal lands, state parks and forests, or private
  lands under conservation easements, and 8 million unprotected acres considered
  opportunity areas for conservation. Crystal River is a critical link in the
  Corridor. The mural builds on the 2021 teen expedition from Rainbow Springs to
  Homosassa Bay with three local high school students, documented in the film
  Home Waters by Jennifer Adler and Ian Segebarth. Sponsors of the Crystal River
  Mural include Burt Eno (a local wild Florida advocate) and the Citrus County
  Chamber of Commerce. In-kind sponsors include Lumen and Sunbelt Rentals.
  Partners include Canvas of the Wild, the City of Crystal River, and Crystal
  River Main Street, with special thanks to the Citrus County Education
  Foundation. The Florida Fish and Wildlife Conservation Commission contributed
  species information for the mural, which features the Wood Duck, Florida Black
  Bear, Belted Kingfisher, Eastern Screech Owl, Red-Eared Slider, American
  Alligator, Anhinga, Largemouth Bass, Everglades Crayfish, Spotted Sunfish,
  Bluegill, Redbreast Sunfish, Roseate Spoonbill, Eastern Tiger Salamander,
  Manatee, Striped Mullet, Atlantic Blue Crab, Florida Gar, Great Blue Heron,
  River Otter, Osprey, Yellow-crowned Night Heron, and Purple Gallinule.

  Her work has been featured in Biscayne National Park, the National Parks
  Association, and on ABC Action News. Press and editorial features include The
  Tampa Bay Business Journal, Sun & Surf Magazine, Connect Magazine, Fox 13
  News, Marine Diaries, Sharks 4 Kids, the Tampa Bay Arts & Education Network,
  Jupiter Inlet Magazine, and Hobe Sound Magazine.

  Her shop and personal portfolio at kellyofthewild.com sells framed prints,
  scientific posters, coloring books, small original paintings, and daily
  paintings — including framed watercolor reef fish, sea turtle surfacing
  pieces, framed watercolor sea turtles, and the original Octopus Explorations.
  She also offers commissions and works as an art instructor and educator
  alongside her wildlife artist and wildlife photographer practice.

  In her own words: "I was born and raised on the headwaters of the Everglades,
  where I learned the land and water were a part of my identity, and the
  charismatic animals I shared my home with were my fellow neighbors, all of
  which had a story worthy of being shared. Today, I use art to communicate
  these wild stories and highlight the underlying science behind each
  inspiration to help form deeper connections between people and nature."

  For SHINE 2023, she painted locally in St. Petersburg. Find her at
  kellyofthewild.com and on Instagram at @kellyofthewild.

searchMuralDescription: |
  A nature-focused mural on a black background depicting the mangrove ecosystem
  of Tampa Bay. A central mangrove tree with tangled brown roots and dense green
  foliage spans the full height of the wall, with a large golden sun glowing
  behind it. Blue ocean waves splash outward on both sides. Above the canopy, a
  pink roseate spoonbill takes flight on the left while a brown pelican perches
  on the right. Below the waterline, the mangrove roots reveal an underwater
  world — a smalltooth sawfish (an endangered Florida species), a dolphin, a
  snook, a red snapper, and smaller fish swim among the roots. The piece was
  created in collaboration with the Oceanic Preservation Society to celebrate
  the 50th anniversary of the Endangered Species Act, and includes interactive
  NFC-tag technology linking viewers to a digital knowledge base about each
  species depicted.

