artistBio: |
  Kelly Quinn is a Florida-born wildlife artist, illustrator, and muralist who grew up near Kissimmee at the edge of the Everglades headwaters, surrounded by cypress wetlands and conservation land. She got serious about art at Harrison School for the Arts in Lakeland, then earned her degree from the University of Florida College of Fine Arts in 2016. After graduating, she moved to the Tampa Bay area and launched her personal brand, Kelly of the Wild. She served as artist-in-residence at The Florida Aquarium, where she live-painted for guests, ran art classes, and collaborated on scientific illustrations — including a mural featuring six endangered shark species during Shark Week coverage on ABC. In 2018, she co-founded Canvas of the Wild with Blake Wheeler, a creative design and production studio focused on STEAM education. As art director, she designs large-scale interactive murals, scientific infographics, animations, and educational coloring books for museums, science organizations, and researchers. Her conservation work has earned real recognition: she was named Artist of the Year by the International SeaKeepers Society in 2021 and 2022, and the Oceanic Preservation Society's Featured Artist for 2022. Major projects include the Crystal River mural for the Florida Wildlife Corridor Foundation, the Sea of Connections interactive mural campaign with the Oceanic Preservation Society in Miami, and this "Mangrove Connections" mural for SHINE 2023. She is an avid scuba diver who has painted reefs she has visited in the Florida Keys and Southeast Asia.

muralDescription: |
  A nature-focused mural on a black background depicting the mangrove ecosystem of Tampa Bay. A central mangrove tree with tangled brown roots and dense green foliage spans the full height of the wall, with a large golden sun glowing behind it. Blue ocean waves splash outward on both sides. Above the canopy, a pink roseate spoonbill takes flight on the left while a brown pelican perches on the right. Below the waterline, the mangrove roots reveal an underwater world — a smalltooth sawfish (an endangered Florida species), a dolphin, a snook, a red snapper, and smaller fish swim among the roots. The piece was created in collaboration with the Oceanic Preservation Society to celebrate the 50th anniversary of the Endangered Species Act, and includes interactive NFC-tag technology linking viewers to a digital knowledge base about each species depicted.

