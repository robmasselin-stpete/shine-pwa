artistBio: |
  Lili Yuan is a Chinese-born, Jacksonville-based artist who blends Eastern
  and Western visual traditions through hyperrealistic painting and muralism.
  She uses her own photography as source material, building large-scale works
  that merge figurative realism with cultural symbolism — often incorporating
  Chinese calligraphy, water imagery, and references to Taoist philosophy.

  Her mural work bridges fine art technique with street-scale ambition, and
  she has painted walls across Florida and beyond. She participated in SHINE
  2020 in St. Petersburg and continues to explore the tension between her
  Chinese roots and American life through her studio and public work.

muralDescription: |
  A large circular composition on a cream-colored wall depicting a woman
  with long dark hair floating in turquoise water, seen from above. She
  wears a flowing red dress with deep pleats that billow and spread around
  her like a blooming flower. The water is rendered with photorealistic
  light caustics and ripples. Her hands gently push against the fabric as
  her hair trails out beyond the circle's edge. To the left, bold Chinese
  calligraphy reads "shang shan ruo shui" (the highest good is like water)
  — a passage from the Tao Te Ching. A small red seal stamp appears at the
  bottom left corner. The @oliooolio tag is visible near the circle's edge.
