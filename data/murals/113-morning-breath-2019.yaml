artistBio: |
  They met at Think Skateboards in San Francisco in 1996. They have designed
  over a hundred album covers since.

  Doug Cunningham and Jason Noto are Morning Breath Inc., a Brooklyn-based
  design studio they formalized in 2002. Cunningham studied at the Academy of
  Art University in San Francisco. Their style pulls from 1950s-1980s Americana
  — comics, Mad magazine, punk rock, hip-hop, heavy metal, and skateboard
  graphics — rendered in limited color palettes with bold lines.

  The client list is absurd: Foo Fighters, Kanye West, Jay-Z, Eminem, Slayer,
  Queens of the Stone Age, AFI. Brands: Vans, Adidas, Ray-Ban, Absolut Vodka,
  MTV, KFC (a full restaurant redesign). They won the Grammy for Best Recording
  Package in 2021 for Desert Sessions Vols. 11 and 12 — a Josh Homme project
  with a mix-and-match booklet and sticker set. They have published two
  monographs: The Early Bird (2007) and By the Skin of Our Teeth (HarperCollins,
  2016).

  Their SHINE 2015 mural on Central Avenue is mostly hidden behind new
  construction — only a narrow vertical slice survives. They returned for SHINE
  2019 with a 101-foot-wide piece at 250 Dr. MLK Jr. Street North in their
  signature black-white-and-red style: open lips, aviator sunglasses, a smiling
  devil face.

searchBio: |
  They met at Think Skateboards in San Francisco in 1996. They have designed
  over a hundred album covers since.

  Doug Cunningham and Jason Noto are Morning Breath Inc., a Brooklyn-based
  design studio. The two began as the in-house design department at Think
  Skateboards in San Francisco in 1996, where they developed the shared visual
  language and collaborative approach that still defines their work. They
  formalized the partnership in 2002 as Morning Breath, Inc., a boutique design
  studio based in Brooklyn, New York. Cunningham studied at the Academy of Art
  University in San Francisco.

  What started in skateboarding culture expanded into a multidisciplinary
  practice covering music packaging, apparel, advertising, and poster design,
  plus a steady output of personal and gallery work. Their style pulls from
  1950s-1980s Americana — comics, Mad magazine, punk rock, hip-hop, heavy metal,
  and skateboard graphics — rendered in limited color palettes with bold lines
  and a modern punk twist. The results are clean, bright, and frequently funny.

  The client list is absurd. In music: Foo Fighters, Kanye West, Jay-Z, Eminem,
  Slayer, Queens of the Stone Age, AFI. In brands: Vans, Adidas, Ray-Ban,
  Absolut Vodka, MTV, Pepsi, and KFC, where they handled a full restaurant
  redesign. Album packaging, graphics, and brand collaborations across two
  decades have left a long trail through contemporary pop culture.

  In 2021 they won the Grammy Award for Best Recording Package for Desert
  Sessions Vols. 11 and 12, a Josh Homme project. The credited art directors on
  the win were Doug Cunningham and Jason Noto, with the performing artist listed
  as The Desert Sessions. The package featured a mix-and-match booklet and
  sticker set. The category, presented by the National Academy of Recording Arts
  and Sciences, goes to the art director rather than the performer, and traces
  back to the Best Album Package award introduced in 1974 before being renamed
  Best Recording Package in 1994.

  They have published two monographs. The Early Bird came out in 2007. By the
  Skin of Our Teeth: The Art and Design of Morning Breath was published by
  HarperCollins in 2016 (also cited as released in 2017), a comprehensive volume
  chronicling the studio's work and creative evolution. The Daily Beast covered
  the book in December 2017, framing the duo as a pop-art design duo whose blend
  of retro themes and fonts with a modern punk twist defines their output. They
  have been featured in numerous design publications and have been invited to
  speak about and present their work internationally.

  Morning Breath painted a mural at SHINE 2015 on Central Avenue in St.
  Petersburg, Florida. Most of that piece is now hidden behind new construction,
  with only a narrow vertical slice still visible. They returned for SHINE 2019
  and painted a 101-foot-wide piece at 250 Dr. MLK Jr. Street North in St.
  Petersburg, executed in their signature black-white-and-red palette: open
  lips, aviator sunglasses, and a smiling devil face.

  Cunningham and Noto continue to divide their time between commercial and
  personal projects out of Brooklyn. The studio website is morningbreathinc.com.

