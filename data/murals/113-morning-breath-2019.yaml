searchMuralDescription: |
  A 101-by-15-foot brush-painted mural in black, white, and red on a pale blue
  background, designed to look like a vintage comic book pamphlet held open
  wide. At left, the Steeplechase "Funny Face" from Coney Island grins with a
  missing tooth. The center features a sinister figure in a red jacket holding a
  "Welcome to Fear City" pamphlet — a reference to the real 1975 New York City
  scare pamphlet. Phrases like "GHASTLY," "STARTLING SECRETS of Mystery,"
  "JITTERY NERVES," and "Picture You NERVOUS" are scattered across the
  composition in retro horror-comic typography. At far right, a large red devil
  face with curling mustache and horns looms above the wall. The mural was
  inspired by the Coney Island Sandwich Shop (operating since 1926) and contains
  subtle nods to New York City throughout.

