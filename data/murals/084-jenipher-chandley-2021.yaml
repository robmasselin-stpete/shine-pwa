artistBio: |
  Giant lemons and orange blossoms, with a tiny self-affirmation tucked into the
  design: Be-you-tiful!

  Jenipher Chandley was born and raised in St. Petersburg. She earned degrees in
  interior design and graphic design from IADT Tampa, is a mother of four, and
  recently became a grandmother. She works predominantly in oils —
  representational figurative work infused with surrealism and symbolism. The
  female form recurs, embodying fragility and strength. Her central theme, in
  her own words, is "the story of love" — seeking, experiencing, losing,
  rediscovering.

  She started painting outside Sake Bomb on Central Avenue around 2011 and
  turned those nights into something permanent. Twelve-plus years later she is
  the lead curator at Bar@548 (the same building, new name), hosts a free weekly
  Wednesday-night art meetup taking no commission, and curates monthly
  emerging-artist shows. Her studio is at the ArtsXchange, Studio Gallery 104.

  She received a 2023 Emerging Artist Grant from Creative Pinellas and has been
  a Local Artist Spotlight at the Gasparilla Festival of the Arts and American
  Stage Theater. SHINE 2021 was her first festival mural — this wall on 23rd
  Street.

searchBio: |
  She started painting outside Sake Bomb on Central Avenue around 2011. She is a
  survivor — of economic hardship, of domestic abuse — and she paints that
  survival into everything.

  Jenipher Chandley was born and raised in St. Petersburg, Florida. She earned
  degrees in interior design and graphic design from IADT Tampa. She is a mother
  of four and a recently new grandmother. She works predominantly in oils,
  making representational figurative artwork infused with surrealism and
  symbolism. Her paintings explore the relationship between nature and the human
  condition, with recurring themes of strength, beauty, loss, pain, and
  resilience. The female form recurs in her work, embodying both fragility and
  inner power, and she returns often to the divine feminine. Her central theme
  is the story of love — the journey to find it, revel in it, cherish and
  protect it, lose it, and rediscover it.

  Her own quote on the work: "Humans are complex and ever-changing, so our art
  should be as well." She describes her process as incorporating the desire to
  heal, to be happy, and to find inner peace, the common thread in all humanity.
  The work is emotionally charged, sometimes raw, and expressed through
  symbolism and poetic gestures. Imagery includes peach-complexioned girls
  dreaming of summer and dark-haired beauties floating in rose hip waters.

  Her imprint on the St. Petersburg creative community started in 2011, over
  eleven years ago, when she gathered like-minded artists and started painting
  in front of what was then Sake Bomb on Central Avenue in downtown St.
  Petersburg. Then-owner Tai Swank encouraged her, and what began with home-made
  flyers and neighboring dive bars grew into an ongoing artist meet-up and
  exhibition space. As ownership changed, the venue became Bar@548. Current
  owner Michael Kellem continues to support the program. For more than twelve
  years she has worked with nonprofit organizations and community initiatives.

  She is lead curator at Bar@548 in downtown St. Pete, where she hosts a free
  weekly Wednesday Night art meetup for local artists of all skill levels — no
  commission taken — and curates monthly shows that showcase emerging artists.
  She has co-curated and exhibited in hundreds of shows throughout the Tampa Bay
  Area, selling her work directly off the walls of the bar and encouraging other
  artists to do the same. Her studio is at the ArtsXchange, Studio Gallery 104,
  located at 515 22nd St S, St. Petersburg, FL 33712.

  Recognition includes the 2023 Emerging Artist Grant from Creative Pinellas — a
  grant aimed at artists on the upward trend of their career, with an
  established practice — which carries obligations including keeping a blog,
  working with an artist mentor, and creating a new body of work for an
  exhibition. She has been named Local Artist Spotlight by the Gasparilla
  Festival of the Arts in Tampa and featured as the local spotlight artist with
  the American Stage Theater in St. Petersburg, where an exhibition of her work
  ran in the lobby alongside the play Crimes of the Heart through February 5th.
  An additional exhibition was scheduled at The Fairgrounds. She is a member of
  The Portrait Society of America and the Warehouse Arts District Association.

  Articles she has written for Creative Pinellas include "Beyond the Exhibition:
  The Artistic Journey Continues," "Navigating the Artistic Path: A Guide for
  Emerging Artists," "Embracing Growth: My Journey as an Emerging Artist in
  2023," "A Visual Artist's Journey of Inspiration," "Tranquil Reflection:
  Finding Inner Peace through the Thorns of Life," "Resilience Blooms:
  Surrendering to Growth," "Lotus Unfolding: Embracing Healing and Growth," "The
  Hollowed Resilience: A Woman Shielded from the Storms of the Past," "Journey
  to Serenity: Embracing Home amidst Life's Trials," "Unfounded Terror: The
  Petrification of Unhealed Trauma," "Transcendence: A Deep Connection Through
  Art," "Ophidian Epiphanies: A Journey of Healing and Renewal," "The
  Transformative Power of Art," and "Difficulty Creates Inspiration. What to
  paint, what to say?" She was profiled by Robin O'Dell for The Artisan Magazine
  in June 2025 in a piece titled "The Original-Jenipher Chandley."

  Beyond oil painting and large-scale mural installations, she works across
  mediums including fashion, choreography, poetry, and public arts
  installations, framing the work as amplifying the healing power of art and
  fostering connection between individuals and their surroundings. She describes
  herself not as a victim but a survivor, and works to instill that mentality in
  others through her curation and mentorship.

  For SHINE Mural Festival 2021 she painted her first festival mural. For SHINE
  Origins 2025 she returned with "Stronger Together" at 31st Street and 7th
  Avenue South, assisted by her daughter Becka.

  Website: jenipherchandley.com. Instagram: @jenipherchandley. Facebook:
  jenipher.chandley.

searchMuralDescription: |
  A vibrant mural on the side of Cimco Tile featuring oversized lemons, halved
  citrus slices, and white orange blossoms scattered across a deep navy blue
  background. The lemons glow in warm yellows and oranges, their green leaves
  curling between the fruit in multiple shades of sage and emerald. A large
  cross-section of a lemon dominates the center of the wall, painted around a
  small door. The words "Be-you-tiful!" appear in flowing white script on the
  left side. Signed "@JenipherChand" in the lower right corner. The bold,
  graphic botanical style and uplifting message make it a standout on the 23rd
  Street corridor.

