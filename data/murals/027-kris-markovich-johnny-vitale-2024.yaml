artistBio: |
  Kris Markovich turned pro for Dogtown Skateboards in 1990 and spent three
  decades riding for 14 different board sponsors — including 101, Foundation,
  Blind, and Element — earning Transworld covers, filming parts in major
  videos, and touring with Tony Hawk. He started painting in the late '90s,
  first on skate decks, then walls. His art zeroes in on eyes and faces
  rendered in a raw, expressive style. He now rides for Anchor Skate Supply
  in St. Pete and runs Black Griptape Company. His largest mural is at
  Harrah's Casino in San Diego, and he's painted walls from Augusta, Maine
  to Dubai. Johnny Vitale co-founded the Vitale Bros in 1992 with brother
  Paul, following a family tradition started by their grandparents. They
  began by hand-lettering signs and painting storefronts — their first mural
  came from a napkin sketch pitched to a restaurant owner. Over 30+ years
  they've become St. Pete's most prolific muralists, painting for the Tampa
  Bay Rays, Buccaneers, and L'Oreal's SalonCentric nationally. They also
  did set design for Harmony Korine's Spring Breakers. Johnny now runs
  Overspray Art Space in Gulfport with graffiti workshops and rotating
  gallery shows. This SHINE 2024 collaboration drew inspiration from the
  Tampa Bay Rays' City Connect uniforms, which were themselves inspired by
  St. Pete's skate and street art culture.

muralDescription: |
  A bold, graphic mural wrapping around the entire exterior of Anchor Skate
  Supply. The building is painted in a black base with vibrant tropical and
  tiki-inspired imagery. A large pink and green sugar skull or tiki mask
  dominates the left side, while cartoon-style palm trees and waves in neon
  green and teal sweep across the front. A character with sunglasses peers
  over the roofline. The right side features more black-and-white tribal/tiki
  patterns and the text "OVER SPRAY ART COLLECTIVE." The whole building reads
  as a single immersive artwork, turning the skate shop into a neighborhood
  landmark.

muralInspiration: "Inspired by the Tampa Bay Rays' City Connect uniforms, which drew from St. Pete's skate culture, neon signs, tattoo culture, and street art."
