artistBio: |
  He turned pro for Dogtown Skateboards in 1990. Thirty years later, he paints
  the walls.

  Kris Markovich is a professional skateboarder who rode for Dogtown, appeared
  on the cover of Transworld Magazine, featured in Tony Hawk's video games, and
  was named one of the 15 Most Influential People in the Tampa Art Scene by
  MergeCulture. He is self-taught as an artist, coming up through skateboard
  graphics and graffiti. His largest mural is at Harrah's Casino in San Diego.
  He has painted from the US West Coast to Dubai.

  Johnny Vitale is the co-founder of Vitale Bros, painting Tampa Bay walls since
  1992. Together they are Anchor Skate Supply's resident artists.

  For SHINE 2024, they collaborated on a mural at 501 16th Street South (Anchor
  Skate Supply), inspired by the Tampa Bay Rays City Connect uniforms, and
  produced a limited-edition SHINE mural skateboard called "L'Orange."

searchBio: |
  He turned pro for Dogtown Skateboards in 1990. Thirty years later, he paints
  the walls.

  Kris Markovich is a world-renowned professional skateboarder and artist
  working since the early 1990s. He grew up in Georgia, then moved to Gulf
  Breeze, Florida, where he got his first board and started skating vert on a
  backyard 8-foot ramp. He shifted to street skating in his teens after breaking
  his elbow on a kickflip, then moved to Pensacola and was already sponsored by
  11th grade. He moved to California with his mother, sister, and Ted Newsome,
  briefly stayed in San Francisco, then settled in Carlsbad through Steve Ortega
  and Dave Crabb in the San Diego area.

  He turned pro for Dogtown Skateboards in 1990 after taking second at the NSA
  Finals, replacing Justin Girard who had left for New Deal. Across his career
  he has ridden for Epic, Toxic, Dogtown, G&S, 101, Color, Prime, Element,
  Foundation, Hollywood, Blind, Crimson, Given, and Elephant — fourteen board
  sponsors by his own count. He filmed video parts for G&S Footage Tapes (Stun,
  Winona Ryders), 101's Falling Down, the Union Wheels Right to Skate video
  (filmed by Jamie Mosberg), the Color Video (Bigmouth Strikes Again by the Tree
  People), Prime's Fight Fire with Fire, and Element's Third Eye View, plus
  Foundation's Art Bars. He worked with filmer Ricki Bedenbaugh and photographer
  Daniel Sturt on the iconic Water Gap ollie and Carlsbad High School gap shots.
  He worked alongside Natas Kaupas at 101, Rick Howard at Blockhead, Mike
  Vallely at Elephant, Tod Swank at Foundation/Tum Yeto, Steve Rocco at World
  Industries, and art director Milo at Tum Yeto on Hollywood. With Paul Schmitt
  at PS Stix he co-developed Featherlight construction, which pushed Element to
  #1 in board sales. He has done skateboard graphics for many companies and is
  known for the Tony Hawk's Trick Tip video in 2000 and the Tony Hawk's Pro
  Skateboard Tour 2000–2003. His Transworld Magazine cover featured his iconic
  artwork drawn on it.

  He is self-taught as an artist, coming up through skateboard graphics and
  graffiti, and his murals run from the West Coast of America to Dubai, UAE. His
  largest mural is at Harrah's Casino in San Diego, California. He sells artwork
  through his own website, owns a griptape company called Black Griptape
  Company, has a pro deck model with his artwork on Technê Skateboards, rides
  for his local Saint Petersburg skate shop Anchor Skate Supply with a guest
  artist board he designed, and has a signature Kris Markovich wheel made by
  Acid Chemical Company. He had a Thrasher Magazine Mail Drop Book release.
  MergeCulture named him one of the 15 Most Influential People in the Tampa Art
  Scene of the last two decades, citing his collaborations with Skatepark of
  Tampa for Tampa Am and Tampa Pro, where he has painted the pro course and
  shown alongside Neckface, Stephen Palladino, Lucas Beaufort, Shepard Fairey,
  Jeremy Fish, and Lance Mountain in Ybor City and at Transitions Art Gallery.

  Johnny Vitale co-founded the Vitale Bros. with his brother Paul in Tampa Bay
  in 1992, following in the artistic tradition of their grandparents. They
  started by hand-lettering signs and painting storefront windows, then landed
  their first mural after approaching a restaurant owner with a sketch on a
  paper napkin. Youngest brother Joey joined soon after, and the crew painted
  murals and billboards for businesses throughout the bay area. A dabble with
  commercial design work gave them their first warehouse space, which became
  their studio and the site of group art, music, and fashion shows in the late
  '90s and early 2000s — a marketing machine that fostered St. Petersburg's
  emerging art scene by giving exposure to other local artists. Today Johnny and
  Paul work with Nick and Jason Kekllas, Bruce Statton, and Jake Gerow under the
  Vitale Bros. moniker. The crew has created campaigns for the Tampa Bay Rays
  and L'Oréal's SalonCentric national locations, and has executed murals for the
  Tampa Bay Buccaneers, many local businesses, and private residences. Their
  skill set also covers commercial exterior painting, fine art reproductions,
  and interior faux finishing. Johnny has more than 30 years of painting
  experience and blends fine art with pop art in his work. The Vitale Bros. are
  based in St. Petersburg, FL, and have had a major hand in St. Petersburg
  becoming a world-class arts destination. Their tagline is "Elevating Spaces
  Through Art."

  Together Markovich and Vitale are Anchor Skate Supply's resident artists. For
  SHINE 2024 they collaborated on a mural at 501 16th Street South — Anchor
  Skate Supply — inspired by the Tampa Bay Rays City Connect uniforms. They
  produced a limited-edition SHINE mural skateboard called "L'Orange" as part of
  Anchor Skate Supply and SHINE St. Petersburg Mural Festival's collaboration
  honoring the festival's 10th anniversary. The deck series featured five SHINE
  artists — Kris Markovich, Johnny Vitale, Jared Wright, Hannah Eddy, and Max
  Sansing — crafted with premium Rock Hard Great Lakes Maple. Markovich, Vitale,
  and Wright signed their skateboard designs.

  Find Kris Markovich at krismarkovich.com. Find the Vitale Bros. at
  vitalebrothers.com.

searchMuralDescription: |
  A bold, graphic mural wrapping around the entire exterior of Anchor Skate
  Supply. The building is painted in a black base with vibrant tropical and
  tiki-inspired imagery. A large pink and green sugar skull or tiki mask
  dominates the left side, while cartoon-style palm trees and waves in neon
  green and teal sweep across the front. A character with sunglasses peers over
  the roofline. The right side features more black-and-white tribal/tiki
  patterns and the text "OVER SPRAY ART COLLECTIVE." The whole building reads as
  a single immersive artwork, turning the skate shop into a neighborhood
  landmark.

muralInspiration: "Inspired by the Tampa Bay Rays' City Connect uniforms, which drew from St. Pete's skate culture, neon signs, tattoo culture, and street art."
