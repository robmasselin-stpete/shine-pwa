searchMuralDescription: |
  A massive great white shark painted in dark gray and black across the east
  wall of the State Theater, a pink/coral building with arched windows on
  Central Avenue. The shark's head dives downward with its mouth wide open,
  baring rows of white teeth, positioned above a red metal-grate door. The piece
  was completed over four days using approximately 100 cans of aerosol paint on
  the 55-by-33-foot wall. The shark's menacing form contrasts with the ornate
  architectural details of the historic theater building.

