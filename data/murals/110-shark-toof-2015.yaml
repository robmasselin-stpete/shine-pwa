  Amsterdam, Chinese American Museum, Everhart Museum, Pennsylvania, Portsmouth
  Museum of Art, Zero+ Publishing, Claremont, Heavy Metal Magazine Issue 288,
  Apple, Samsung, LeBron James, iPad, Ritz Carlton, Heineken, Burton, Hurley,
  Toyota, Adidas, Axl Rose, tour jacket, Wynwood, Cambodia, BBC, United States
  District Court for the Central District of California, SHINE 2015, SHINE Mural
  Festival, St. Petersburg, Florida, graffiti, stencillist, muralist, activist,
