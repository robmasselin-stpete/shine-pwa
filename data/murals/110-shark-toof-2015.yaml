artistBio: |
  Samsung put his shark in a commercial with LeBron James. Apple put it in an
  iPad ad.

  David Lew — Shark Toof — studied at the Art Center College of Design in
  Pasadena. His iconic image is a hand-drawn wheat-pasted great white shark that
  has appeared on walls from Wynwood to Cambodia. His other series include
  "Guilty Pleasures" (cigarette packs and slot machines) and "Mayday"
  (pulp-comic romance).

  Clients include Apple, Samsung, Ritz Carlton, Heineken, Burton, Toyota,
  Adidas, and Axl Rose (a personal tour jacket). He has shown at Corey Helford
  Gallery, Thinkspace, Inner State Gallery in Detroit, and GO Gallery in
  Amsterdam. His work is in the permanent collection of the Chinese American
  Museum in Los Angeles. He painted the Heavy Metal Magazine cover (Issue 288).

  For SHINE 2015, he painted in St. Petersburg.

searchBio: |
  Samsung put his shark in a commercial with LeBron James. Apple put it in an
  iPad ad. David Lew, working under the name Shark Toof, is an American graffiti
  artist, stencillist, muralist, painter, and activist based in Los Angeles. He
  is a graduate of ArtCenter College of Design in Pasadena, California, and his
  work grew out of the California underground graffiti scene.

  His signature image is a hand-drawn, gape-mouthed great white shark with the
  word "TOOF" lettered in its mouth, reproduced as a wheat-paste and pasted on
  walls in urban neighborhoods across multiple countries. Although the shark's
  reputation is often fearsome, Toof uses the image to convey strength,
  optimism, and possibility, treating the icon as a voice of rebellion, a
  conduit for the unheard, and an homage to graffiti art and its purpose. His
  broader practice creates gritty juxtapositions between animals — most often
  sharks — and anachronistic situations, layering comic and advertising
  iconography with street-art sensibilities.

  Beyond the shark wheat-paste, his ongoing series include "Guilty Pleasures,"
  iconographic paintings of cigarette packs and slot machines, and "Mayday," a
  pulp-comic-inspired series of idealized romance imagery. He has also produced
  pop-culture caricature shark heads, which anchored his solo exhibition "I'm
  Shark Toof, Who The Hell Are You?" at Inner State Gallery (also written as
  Innerstate Gallery) in Detroit. A more recent solo show, "Red Everything," was
  mounted at CASS Contemporary, with attention to juxtaposition of shapes, line
  quality, composition, varying materials, and tension of content — fine-art
  paintings framed as an intimate look at belief systems and boundaries.

  Shark Toof's commercial client list spans global brands, including Apple,
  Samsung, Ritz Carlton, Heineken, Burton, Hurley, Toyota, Adidas, and Axl Rose,
  for whom he painted a personal tour jacket. His murals have appeared in
  commercials for Samsung and Apple Inc., the Samsung spot featuring LeBron
  James and an Apple iPad ad. He painted the cover of Heavy Metal Magazine,
  Issue 288.

  His gallery and museum credits include Corey Helford Gallery, Thinkspace,
  Inner State Gallery in Detroit, GO Gallery in Amsterdam, and CASS
  Contemporary. He has had a second showing at the Chinese American Museum in
  Los Angeles, where his work is held in the permanent collection. He has also
  exhibited with The Everhart Museum in Pennsylvania and the Portsmouth Museum
  of Art. A monograph titled "Shark Toof" was published in 2012 by Zero+
  Publishing in Claremont, California (ISBN 978-1937222109).

  In 2020 he sued the Chinese American Museum in Los Angeles after it
  accidentally threw out his work; the case was dismissed by the United States
  District Court for the Central District of California in an order granting the
  defendants' motion to dismiss dated August 31, 2021. The dispute was covered
  by the BBC under the headline "David Lew: Artist sues Los Angeles museum after
  work thrown out."

  His hand-drawn great-white wheat-pastes have appeared on walls from Wynwood to
  Cambodia, and his work is collected globally — from young graffiti writers who
  peel the icon from the streets to contemporary collectors who pursue the full
  repertoire. Writers describe him as possessing the technical skills of an Old
  Master and the spirit of an art-minded vandal, moving between styles while
  keeping the shark icon as a through-line.

  For SHINE 2015, the St. Petersburg Mural Festival in St. Petersburg, Florida,
  he painted on-site as one of the graffiti artists putting up murals around the
  city that week. He is also listed in the SHINE St. Pete artist portfolio for
  the festival.

  Keywords and proper nouns associated with Shark Toof include: David Lew, Shark
