artistBio: |
  Cristi Lopez is a first-generation Dominican-American artist born in 1993. Her parents immigrated from the Dominican Republic and the family settled first in New England before moving to Florida. She earned her BFA in Illustration from Ringling College of Art and Design in Sarasota in 2016, then relocated to Chicago, where she completed a Drawing & Painting residency at Lillstreet Art Center. After several years building her career in Chicago, she moved back to Florida and is now based in St. Petersburg. Her art blends surrealism, folk traditions, and figurative painting into richly layered compositions that draw from the Vienna Secession, Klimt and Schiele, Dominican artist Candido Bido, Ukiyo-e, Catholic iconography, and Dominican folk art. She paints powerful female figures surrounded by animals, tropical imagery, and allegorical objects, exploring themes of mental health, femininity, cultural identity, and faith. She has been open about living with OCD, and much of her work channels intrusive thoughts into visual storytelling. Her exhibition history includes 10 Corso Como in Milan, the Zhou B Art Center in Chicago, and two solo shows at VSG Contemporary (formerly A Very Serious Gallery) in Chicago: "Unravel: Portraits of My Obsessions" (2023) and "Anima: The Feral Femme" (2024). She has painted murals for Google's Chicago headquarters, the University of Florida Arts in Medicine program, and the St. Pete Pier's fifth anniversary celebration in 2025. She received an Individual Artist Grant from the St. Pete Arts Alliance in 2025.

muralDescription: |
  A large surrealist mural on the side of Groove Haven on a pale blue sky background. A central female figure with dark hair, green eyeshadow, rosy cheeks, and red lips gazes outward, wearing a pearl necklace and dark clothing. She holds a large maroon sphere with a single eye painted on it — a recurring motif in Lopez's work. Behind her, a full white moon glows against the horizon where a turquoise ocean meets the sky. Green tropical fern fronds frame the left side, while small white goats balance on a red clothesline to the right. A blue monkey sits among decorative green mandala patterns at the lower right. The composition blends Dominican folk art, Catholic iconography, and surrealist symbolism into a dreamlike tropical scene. Signed "Cristi López 24" in the lower right corner. Lopez described the piece as "a love letter to my visual and cultural influences."

