artistBio: |
  In college, she used unerasable media on purpose. It was exposure therapy —
  she has OCD, and the inability to fix a line was the point.

  Cristi Lopez is a first-generation American of Dominican, Spanish, and Cuban
  descent. Her parents immigrated from the Dominican Republic. She grew up in
  New England, relocated to Florida as a kid, and earned a BFA in Illustration
  from Ringling College of Art and Design in 2016. She completed a drawing and
  painting residency at Lillstreet Art Center in Chicago (2017-18) and moved to
  St. Petersburg around 2023.

  Her work explores mental illness, femininity, faith, and heritage. The
  influences are specific: Vienna Secession, Symbolist painters, Candido Bido,
  Dominican folk art, Ukiyo-e, Catholic iconography. Recurring motifs include
  scissors — reclaiming a symbol of fear — cows, and Florida wildness. Her solo
  show "Unravel: Portraits of My Obsessions" at A Very Serious Gallery in
  Chicago (2023) featured fifteen paintings about her OCD, partnered with NAMI
  Chicago.

  She co-hosts Queer Contours, a donation-based figure drawing series with Queer
  Expression St. Pete. She teaches vinyasa yoga. She received a 2025 Individual
  Artist Grant from the St. Pete Arts Alliance and was nominated for Creative
  Loafing's Best of the Bay in both Best Muralist and Best Mural.

  For SHINE 2024, she painted "Moo" at Groovehaven Music on Fairfield Avenue
  South — her first Tampa Bay mural. She called it "a love letter to my visual
  and cultural influences."

searchBio: |
  In college, she used unerasable media on purpose. It was exposure therapy —
  she has OCD, and the inability to fix a line was the point. She made herself
  draw with unerasable media for six months, bought sketchbooks she could not
  tear pages out of without compromising the binding, and let ugly drawings live
  in the book until the discomfort stopped registering.

  Cristi López (born 1993) is a first-generation American of Dominican, Spanish,
  and Cuban descent. Her parents immigrated from the Dominican Republic before
  she was born. The family started in New England and moved to Florida in her
  childhood, where she has lived since. She earned a BFA in Illustration from
  Ringling College of Art and Design in Sarasota in 2016. After graduating,
  illustration agencies told her the work belonged in galleries, and she shifted
  toward fine art.

  She completed the Drawing & Painting Artist Residency at Lillstreet Art Center
  in Chicago in 2017-18, then relocated to St. Petersburg around 2023. Her first
  solo exhibition, "Unravel: Portraits of My Obsessions," opened at A Very
  Serious Gallery in Chicago (April 7 – May 13, 2023) — fifteen paintings about
  her relationship with OCD, partnered with the Chicago chapter of NAMI, which
  provided mental health resources and a lecture panel. Her second solo, "Anima:
  The Feral Femme," opened at VSG Contemporary in Chicago in 2024.

  Group exhibitions include "Slaps Show" Vol. 4 at Elephant Room Gallery in
  Chicago (2025), "BLISS! Group Exhibition" at The Factory in St. Pete (2024),
  "Wag your Tail" at Vertical Projects Space in Chicago (2023), "It Was All A
  Dream" at Vertical Gallery in Chicago (2022), "#ink" at Vertical Gallery in
  Chicago (2020), "Love Adjacent" at Sally Centigrade Gallery in Boulder,
  Colorado (2020), and the "Slaps! Show" at Young Chicago Authors in Chicago
  (2019).

  Her work explores mental illness, femininity, faith, and heritage. Influences
  she names directly: the Vienna Secession, Symbolist painters, Cándido Bidó,
  Dominican folk art and pastoral paintings, Ukiyo-e, Japonisme, Catholic
  iconography, powerful women, Florida, and a love of cows. Recurring motifs
  include scissors — a symbol of intrusive-thought fear she reclaimed by drawing
  them — cows, and Florida wildness. Female figures appear naked but not
  coquettish, with the artist describing them as "unapologetically" present, her
  counter to the male-gaze poses she grew up seeing.

  Her first OCD memory was as a young child afraid of sleepwalking and harming
  her family in her sleep. She made her parents hide all the sharp objects in
  the house. The diagnosis came as an adult. She works as a mental health
  advocate alongside her studio practice. The Made of Millions Foundation
  interviewed her in 2023 ("The Unseen and Unerasable: Cristi López on Bringing
  Intrusive Thoughts to Light," by Esther Fernandez) about the "Unravel" show,
  OCD, and the role of art in recovery.

  Her work has been collected privately, including by the owners of Apollo's
  Praise Winery, who commissioned a tasting-room mural and her bottle-label
  designs. She received an Individual Artist Grant from the St. Petersburg Arts
  Alliance in 2025, and was nominated for Creative Loafing Tampa Bay's Best of
  the Bay in both Best Muralist and Best Mural in summer 2025.

  She co-hosts Queer Contours, a donation-based bimonthly figure drawing series
  in collaboration with Queer Expression St. Pete, an organization that
  cultivates LGBTQ+ community spaces in the Tampa Bay area. The series began as
  "Reunion Drawing" when she lived in Chicago and celebrated its first
  anniversary in St. Pete on August 11, 2025. She also teaches vinyasa yoga at
  SukhaLife.

  For SHINE Mural Festival 2024 — November 2024 — she painted "Moo" at
  Groovehaven Music on Fairfield Avenue South. It was her first Tampa Bay mural.
  She described it as "a love letter to my visual and cultural influences." In
  July 2025 she completed "Shared Shores" at the St. Petersburg Pier as part of
  a temporary five-artist exhibition celebrating the Pier's fifth anniversary,
  organized by No Good Deeds Art, the nonprofit founded by former SHINE Festival
  Director Jenée Priebe. "Shared Shores" is part of her FloriDiosa series —
  homage to wild Florida, femininity, and wildness — and centers the Brown
  Pelican, the official city bird, as a symbol of resilience. The exhibition was
  scheduled to remain on display until at least October 2025.

  She frames her preference for murals over gallery work as the "stumble-upon"
  aspect — the public, accessible, communal access to art that gallery walls
  keep behind private doors. She participated in a street mural chalk protest in
  St. Petersburg's Grand Central District in September 2025 in response to the
  Florida Department of Transportation painting over street art including the
  Pride crosswalk and Black History Matters murals.

  Website: cristilopezart.com. Email: cristilopezsalazar@gmail.com. Instagram:
  @cristi.lopez.s.

searchMuralDescription: |
  A large surrealist mural on the side of Groove Haven on a pale blue sky
  background. A central female figure with dark hair, green eyeshadow, rosy
  cheeks, and red lips gazes outward, wearing a pearl necklace and dark
  clothing. She holds a large maroon sphere with a single eye painted on it — a
  recurring motif in Lopez's work. Behind her, a full white moon glows against
  the horizon where a turquoise ocean meets the sky. Green tropical fern fronds
  frame the left side, while small white goats balance on a red clothesline to
  the right. A blue monkey sits among decorative green mandala patterns at the
  lower right. The composition blends Dominican folk art, Catholic iconography,
  and surrealist symbolism into a dreamlike tropical scene. Signed "Cristi López
  24" in the lower right corner. Lopez described the piece as "a love letter to
  my visual and cultural influences."

