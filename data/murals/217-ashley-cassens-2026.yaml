artistBio: |
  Ashley Cassens's favorite mural subject is flora and fauna, and her walls
  take their color from Florida. She is partial to cadmium red.

  Since she quit full-time teaching in 2022 she has painted 62 murals, by
  Creative Pinellas's count, for schools, nonprofits, national corporations,
  design firms and homes. In Pinellas she painted "Sweet Disposition," orange
  blossoms, a bumblebee and strawberries on a Lealman deli, for Creative
  Pinellas and the Lealman CRA in 2025, and a lorikeet-and-citrus wall at
  Florida Orange Groves Winery in South Pasadena in 2026.

  She grew up in Daytona Beach, the child of a hairdresser and a carpenter,
  and found oil paint at 19. She earned a BFA from Florida Southern College in
  2006, studying classical figure painting methods. After an internship at the
  Ringling Museum in 2016 she taught K-5 art for five years.

  "Eye Traps" started in 2021, after the true-crime podcast "Some Place Under
  Neith" introduced her to the Institute in Basic Life Principles. The
  portraits are small oils on retro-patterned fabric stretched over wood
  panel. The women are bold and dressed loud, and she reached out to models
  and photographers around the world online, connecting with people from
  Brazil and Vietnam. HomeGoods licensed two of the paintings.

  She earned an MFA from Florida Atlantic University in 2017. Her line is that
  paint is "a conduit for touch in a digital world." Her MFA thesis came out
  of three years living apart from her husband. She painted the parts of him
  she missed touching: his brow, a freckled shoulder, the crook of his arm.
  For SHINE 2026, the festival's twelfth year, she is painting a wall at The
  Factory.

searchBio: |
  A fundamentalist group's pamphlet warned women about "eye traps": jangling
  jewelry, garish colors, anything she wears that might pull a man's eye away
  from her smiling face. Ashley Cassens took the phrase and made it the name
  of her portrait series. She uses a lot of cadmium red.

  She grew up in Daytona Beach, the child of a hairdresser and a carpenter,
  and found oil paint at 19. As a kid she drew, wrote stories and kept up with
  pen pals. She earned a BFA from Florida Southern College in 2006, practicing
  classical figure painting and focused on representational work and
  traditional oil methods, and an MFA from Florida Atlantic University in
  2017, where she held a full Graduate Teaching Assistantship. She has also
  won the Provost Fellowship, two Graduate Advisory Board Grants, a Friedland
  Grant, a Rothenberger Scholarship, an Ambassador of the Arts Scholarship
  and, twice, the Women in the Visual Arts Scholarship. She has studied in
  workshops with Julian Schnabel and the figurative painter Steven Assael.

  After an internship at the Ringling Museum of Art in Sarasota in 2016 she
  taught K-5 art for five years. She made her art an official business in July
  2021, hired an art-business coach, and started pitching local media herself.
  An art podcast about making money as a muralist convinced her she could do
  it. She started painting walls on summer and winter breaks, and found work
  through Thumbtack. In 2022 she quit teaching full-time to paint murals. She
  still teaches adults to paint realistically in her online course "Let's Get
  Real." She works from Tampa's Northdale area.

  Her line is that paint is "a conduit for touch in a digital world." Her MFA
  thesis came out of three years living apart from her husband. She painted
  the parts of him she missed touching: his brow, a freckled shoulder, the
  crook of his arm. An earlier body of work, the "Projection Series," painted
  herself and her husband in charged color, looking at life as it comes
  through a screen.

  "Eye Traps" started in 2021, after the true-crime podcast "Some Place Under
  Neith" introduced her to the Institute in Basic Life Principles (IBLP). The
  paintings are oils on retro-patterned fabric stretched over wood panel. The
  first ones were eight by eight inches, small enough to hold. The women are
  bold and dressed loud, and none of them look alike. She reached out to
  models and photographers around the world on the stock-photo site Pexels,
  and connected with people from Brazil and Vietnam. The series showed at
  Elevation Coffee Roasters in Tampa through January 2022. HomeGoods licensed
  two of the paintings.

  She says that fabric method shapes her favorite mural subject, which is
  flora and fauna. Her walls take their color from Florida and their process
  from oil painting. Her site puts the count at hundreds of murals, painted
  for schools, nonprofits, national corporations, design firms and private
  homes. She got into what she calls a fence niche, painting over ugly wooden
  fences, and designed an early-1900s Ybor City scene for a 1906 Tampa house,
  a job she painted with fellow former art teacher Olga Gunz. She once said
  murals are "very physical," and that the physical work of walls gives her a
  mental break from portraits, and vice versa.

  In Pinellas she painted "Sweet Disposition" on the side of 54th Avenue Deli
  Mart in Lealman for Creative Pinellas and the Lealman CRA in 2025: orange
  blossoms, a bumblebee and strawberries, about two weeks of work. The owner
  says people who never knew the store was there now stop to look. In 2026 she
  painted a lorikeet-and-citrus wall at Florida Orange Groves Winery in South
  Pasadena. Creative Pinellas has also awarded her a South Pasadena Grant.
  Other grants include an Innovative Art Grant and a 1st National Bank of
  Pasco Grant.

  She has exhibited at ARC Gallery in Chicago, the Cornell Museum in Delray
  Beach, the Box Gallery in West Palm Beach and Palm Beach State College.
  Collaborations include Ann Cox Design and Cori Rose Handmade. She
  hand-painted the illustrations for the children's book "Down in the Pasture"
  and wrote her own journal, "Painting Possibilities." Coverage includes FOX
  13 Tampa Bay, Daytime, News Channel 8, ABC Action News, Creative Loafing
  Tampa, HAVEN Magazine, CanvasRebel, VoyageTampa and Artsy Shark, plus the
  podcasts "Colour Me Happy" and "The Artist Academy Podcast." She makes a
  point of arguing against the starving-artist myth.

  For SHINE 2026 (November 6–15), the festival's twelfth year, she is painting
  a wall at The Factory, 2606 Fairfield Avenue South.

  Instagram: @ashley.cassens. Website: ashleycassens.com.

