artistBio: |
  Justin Bieber collects him. So does Diplo. His "MAD CANS" NFT series generated
  three million dollars.

  Greg Mike — Gregory Michael Mensching — started graffiti at thirteen in
  Atlanta and became a muralist in his late twenties. His style is Surrealist
  Pop Art — vivid explosions of color, gleefully twisted characters inspired by
  mid-century American cartoons and skate culture. His signature character Larry
  Loudmouf is everywhere.

  He founded ABV Gallery and Agency in Atlanta in 2008 and launched the
  OuterSpace Project in 2015, producing over a hundred murals across the city.
  Clients include Nike, Coca-Cola, Google, Spotify, BMW, Adidas, Converse, the
  Atlanta Braves and Falcons, Ford Mustang, and Topgolf. He received the Key to
  the City of Worcester, Massachusetts, and was named Best Established Visual
  Artist and a Notable Georgian by Georgia Trend.

  For SHINE 2021, he painted in St. Petersburg.

searchBio: |
  Justin Bieber collects him. So does Diplo. His "MAD CANS" NFT series generated
  three million dollars.

  Greg Mike — Gregory Michael Mensching — was raised in Danbury, Connecticut,
  skateboarding in summer and snowboarding in winter. He fell in love with art
  through the graphics on skate decks. His parents divorced when he was young,
  and he turned to his sketchbook to process what he could not say out loud. The
  early drawings were dark and creepy. He started graffiti at thirteen and went
  on to study at Florida State University, where classmates were unsettled by
  the gloom in his work. He pivoted toward the afternoon-cartoon nostalgia of
  his childhood — Ren and Stimpy, The Simpsons, Disney, Powell Peralta skate
  graphics — and the reactions changed. He transitioned into murals in his late
  twenties.

  His style is Surrealist Pop Art — vivid explosions of color, gleefully twisted
  characters inspired by mid-century American cartoons and skate culture. He
  calls his classic mode "intertwined" — forms weaving in and out, sinister but
  joyful, sampled from sources rather than copied. His urban murals sometimes
  feature majestic carnivores like tigers and wolves watching over Atlanta. His
  signature character Larry Loudmouf — a turquoise, often square creature with a
  shifting number of eyes and a mouthful of pearly teeth — started as a
  sketchbook doodle. The chipped tooth came from a near-death experience in his
  twenties: he had a vivid dream, sleepwalked off a second-floor balcony, and
  woke up in a pool of blood with a cracked skull and a chipped tooth. The
  jagged tooth became a symbol of life's imperfection and fragility. Larry's
  dialogue bubbles began as Mike's own thoughts and grew into the Loudmouf Says
  project, where followers worldwide submit one-liners that get published on
  billboards, stickers, canvases and merch.

  In 2008 he founded ABV Gallery and Agency in Atlanta — ABV stands for A Better
  View — after a 2009 solo show at Medicine Agency in San Francisco showed him
  the gallery/agency model. He started in a $1,500-a-month space at Studioplex
  in Inman Park. ABV runs on three tiers: his personal artist brand, a design
  agency for client work, and a brick-and-mortar gallery showing local and
  international artists. The operation now works with a global network of more
  than 600 contemporary artists. After eight years of searching and four years
  of renovation, ABV reopened in September 2024 in a converted church at 1206
  Metropolitan Ave SE in East Atlanta — 8,500 square feet, with a
  5,000-square-foot two-story main gallery, polished concrete floors, the
  original stained-glass windows in the foyer, a 950-square-foot personal studio
  for Mike in the rear, and ABV Agency upstairs. The opening solo show, Chapter
  New, ran through October 20, 2024 — more than 100 new works, twenty-four
  canvases, fiberglass and resin sculptures, and a twelve-foot Larry Loudmouf at
  the center. It included the NFT series The Loud Ones, designed in
  collaboration with software that recombines his elements.

  He launched the OuterSpace Project in 2015, an annual Atlanta mural and arts
  celebration that has produced over a hundred murals across the city. Clients
  include Nike, Coca-Cola, Google, Spotify, BMW, Adidas, Converse, the Atlanta
  Braves and Falcons, Ford Mustang, and Topgolf. He has painted in the United
  States, Australia, Canada and Switzerland. Festival and project credits
  include the 2012 With Your Friends Festival in Nashville, a 2015 mural
  unveiling at Whisky Park, the 2015 Vision Art Festival, 2016 Atlanta Art
  Culture, 2016 Outside Lands Art Festival, the 2016 LA Public School street art
  project alongside Shepard Fairey and Kenny Scharf, Pow! Wow! Worcester in
  2016, Murals in the Market in Detroit, the Richmond Mural Project in 2013, and
  a 2015 collaboration with deadmau5 on a Miami mural. He has revamped Atlanta's
  Phoenix II basketball court with Mountain Dew Green Label, painted a mural on
  the Modera Midtown building, and a piece at the W Hotel pool in Atlanta. He
  was invited to paint at Wynwood Walls after recovering from a snowboarding
  collision in Colorado that shattered the collarbone of his painting arm in six
  feet of powder; doctors said he might not paint again, and a surgically bolted
  plate plus months of physical therapy got him back.

  His 2014 solo show "Pigment of My Imagination" opened at Maxwell Colette in
  Chicago. He has been selling NFTs since 2021 on Nifty Gateway; the MAD CANS
  series of digital collectible cans, each paired with a physical Infinite
  Object, raised over three million dollars. Awards include the Key to the City
  of Worcester, Massachusetts, presented by Mayor Joseph Petty in September 2016
  after Pow! Wow! Worcester; Best Established Visual Artist from Creative
  Loafing in 2017; and a 2017 Notable Georgians Award from Georgia Trend.

  For SHINE 2021, he painted in St. Petersburg. Website gregmike.com.

searchMuralDescription: |
  A massive wall covered edge-to-edge with Greg Mike's signature cartoon
  characters — bug-eyed, grinning figures in electric pinks, greens, and
  yellows. The word "SMILE" runs across the center in bold lettering, surrounded
  by the crowd of manic, playful characters that make the building impossible to
  walk past without looking.

