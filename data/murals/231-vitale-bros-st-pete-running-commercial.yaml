artistBio: |
  Their first mural came from a sketch on a paper napkin, handed to a restaurant
  owner. That was 1992.

  Johnny Vitale and his brother Paul started Vitale Bros in Tampa Bay
  hand-lettering signs and painting storefront windows. Their parents are
  artists. So were their grandparents. No formal training — just family
  tradition and thirty-plus years of practice. Their late aunt Nancy, who had
  Down syndrome and attended Parc Center for Disabilities, turned out to be an
  artist too, discovered in her final decade.

  In the late 1990s they opened a warehouse studio that hosted group art, music,
  and fashion shows that helped birth St. Pete's emerging art scene. They
  collaborated on set design for Harmony Korine's Spring Breakers. They have
  painted for the Tampa Bay Rays, the Buccaneers, L'Oreal, and dozens of local
  businesses. They call themselves the "mural police" — restoring damaged walls
  around the city for free.

  In 2023, Johnny launched Overspray, a street art shop and graffiti school now
  based in Gulfport, teaching tagging, block letters, Wildstyle, and advanced
  mural technique to classes of up to twenty students. After Hurricane Milton,
  they painted free signs for businesses that lost theirs.

  They have been involved with SHINE since its inception — "The Cool Kids" in
  2015, "Bait and Switch" in 2019, and multiple walls since. For SHINE Origins 2025, Johnny painted two murals: a solo wall on the 600
  block where it all began, and another at The Factory on Fairfield Ave South
  shared with his collaborator Sionna Sio MacLeish.

searchBio: |
  See Vitale Bros entries (ids 11, 12, 27, 73, 129, 142, 156, 174, 208) for
  full search bio. This wall is on the St. Pete Running Company store at 2601
  Dr. MLK Jr. St. N, the shop's second location (with a coffee bar), which
  opened in December 2025 with a grand opening on 11 January 2026.

searchMuralDescription: |
  A long single-storey building side painted edge to edge in bold pop-art
  colour: overlapping rainbow arcs, halftone dots, geometric blocks, a
  yellow lightning bolt and sunburst stripes. "Believe. Achieve." is lettered in
  large white script across a black panel in the centre. On the left, three
  running silhouettes in green, maroon and blue run in a line, with a white
  bird-like swoosh shape above them. On the right, a large white coffee cup
  with heart latte art sits on a saucer, carrying the St. Pete Running Company
  logo. Signed "Vitale Bros." at bottom left; small white text at bottom right
  begins "Mural prov…".

