artistBio: |
  Two walls of giant citrus slices at Green Bench Brewing. Brush only. Nine
  days.

  Angela Faustina was born in 1986, grew up in South Florida, and is now based
  in Atlanta. She graduated summa cum laude with a BA in fine art and history
  from New College of Florida in Sarasota, with additional coursework at Parsons
  and Ringling. Her style is hyperrealistic contemporary oil painting of fruit
  in extreme close-up — pomegranate, peaches, figs, kiwi, citrus — magnifying
  the textures and patterns beneath the peel. She lives with lupus, and the work
  runs through that frame: vibrant color and delicate intricacy, strength and
  fragility together.

  She has had 80-plus exhibitions since 2006 across the US, Italy, Portugal, the
  UK, Singapore, Australia, and Hong Kong. She is represented by Signet
  Contemporary Art in London. She won a Georgia Visual Artists Grant (2020) and
  Best Book Cover of 2023 from Electric Literature. Her "Flourishing Florence"
  mural in Florence, Alabama spans 246 feet.

  For SHINE 2018 she painted "Citrus Medley" — two seven-by-sixteen panels
  flanking a sliding metal gate at Green Bench, oversized cross-sections of
  blood oranges, grapefruits, lemons, limes, and navel oranges. It was her
  largest work at the time.

searchBio: |
  She lives with Lupus. She paints fruit at macro scale — beauty, fragility,
  strength, resilience, all in one orange.

  Angela Faustina was born in 1986 and grew up in South Florida. She has called
  the Atlanta, Georgia area home since 2015. She is an American contemporary
  realism painter whose body of work consists mainly of oil paintings and
  outdoor murals depicting close-ups of fruit — pomegranate, peaches, figs,
  kiwi, and citrus — capturing the macro details of fresh fruit cut open when
  ripe. Her work walks the line between realism and idealism, treating
  close-cropped fruit as a complex landscape that bridges the universal and the
  personal. Magnifying overlooked details, textures, and patterns beneath the
  peel parallels the heightened awareness her body demands due to her lupus,
  with the dichotomy between vibrant color and delicate intricacy echoing the
  strength and fragility inherent to chronic illness.

  In 2009 she graduated summa cum laude from New College of Florida in Sarasota,
  Florida, with concentrations in Studio Art and History (described in the
  display bio as a BA in Liberal Arts covering fine art and history). She
  completed additional coursework at Ringling College of Art & Design in
  Sarasota and at Parsons: The New School for Design in New York, NY. She
  credits her schooling with grounding her in the essentials of form, value, and
  color theory, fundamentals she returns to whenever a painting stalls.

  Her artwork has been collected and exhibited internationally for 16 years,
  with shows across North America, Europe, Asia, and Australia — specifically
  the United States, Italy, Portugal, the United Kingdom, Singapore, Australia,
  and Hong Kong. The display bio notes 80-plus exhibitions since 2006. She is
  represented by Signet Contemporary Art in London, England, which has described
  her work as "intimate, surprising, enigmatic, and bold." She is also
  represented by The Loft in Marietta, Georgia. Educators around the world
  include her artwork in their still life, photorealism, and color curricula.

  Her murals are located throughout the Southeastern United States, in cities
  including Atlanta, Marietta, St. Petersburg, and Florence, Alabama. The
  display bio notes a Georgia Visual Artists Grant in 2020 and a Best Book Cover
  of 2023 award from Electric Literature, plus a 246-foot mural titled
  "Flourishing Florence" in Florence, Alabama. Her downtown Florence mural was
  covered by Bernie Delinski in TimesDaily in June 2021. Her Atlanta murals were
  profiled by Aileen Farshi for ARTS ATL in April 2020 in a piece titled "Today
  in street art: Angela Faustina's mouthwatering murals grew from still-lifes."
  Her Marietta work was covered by Kristal Dixon in The Atlanta
  Journal-Constitution in April 2019, and by Cobb Life Magazine via
  MDJOnline.com.

  She competed in the 2018 SHINE St. Petersburg Mural Festival and the 2019
  OuterSpace Project Mural Festival. For SHINE 2018 she painted "Citrus Medley"
  (also referenced as "Citrus Melody" by stpeteartsalliance.org) in
  collaboration with Green Bench Brewing — two seven-by-sixteen-foot panels,
  brush only, completed in nine days. The St. Petersburg muralist lineup was
  announced August 30, 2018, by Tampa Bay Reporter (tbreporter.com), and Maggie
  Duffy covered the Tampa Bay fall art scene including her work in the Tampa Bay
  Times in September 2018. Bill DeYoung wrote about her in St Pete Catalyst in
  April 2020 in connection with the Arts Relief Fund. Her SHINE mural is
  documented at visitstpeteclearwater.com and stpeteartsalliance.org. Creative
  Loafing has profiled her as well.

  She describes her oil paintings as sticky-sweet, transforming glistening fruit
  into its own world, capturing perfectly ripe juicy flesh in each brushstroke.
  The paintings are bright, lively, intimate, and bold, close-cropped but not
  confined. She says the common subject matter of fruit represents a universally
  shared experience that spans borders, religion, and culture, and her stated
  mission is to teach people to slow down and explore the beauty and vibrancy of
  life in unexpected places. She learned her craft through trial and error,
  making many bad fruit paintings before the good ones came, and has spoken
  about how fear of judgment held her back early on before she pushed past it.

  Online she can be found at angelafaustina.com, on Instagram as @angelafaustina
  (instagram.com/angelafaustina), on Facebook at facebook.com/AngelaFaustina, on
  YouTube at youtube.com/angelafaustina, and via linktr.ee/AngelaFaustina. Her
  studio shop offers original oil paintings, featured interiors, murals and
  public art, and commissions for paintings or murals. She was profiled by
  CanvasRebel Magazine in September 2024.

searchMuralDescription: |
  Two matching wall sections flanking a sliding metal gate at Green Bench
  Brewing Company, each approximately seven feet high by sixteen feet long. The
  mural features oversized cross-section slices of citrus fruits — blood
  oranges, grapefruits, lemons, limes, and navel oranges — painted in vivid
  reds, purples, magentas, yellows, greens, and oranges against a warm
  background. The fruit slices are rendered in Faustina's signature
  hyperrealistic style, showing the detailed membrane structure, seeds, and
  juice of each variety. The left wall leans toward warmer tones with more blood
  orange and grapefruit, while the right wall balances warm and cool with
  prominent lemon and lime slices. Both walls are signed "ANGELA FAUSTINA" at
  the bottom. She completed the piece in nine days using only a brush — it was
  her largest work at the time.

