artistBio: |
  He designed creatures for Zack Snyder's Sucker Punch. He made the album art
  for The Used. He calls his monsters "Brightmares."

  Alex Pardee was born in 1976 in Antioch, California. He is self-taught — no
  formal art education. His style is dark, fantastical worlds filled with
  ghoulish creatures in unexpectedly vibrant, saturated colors, inspired by
  Garbage Pail Kids and Tales From the Crypt.

  He was art director, executive producer, and creature designer for Digging Up
  The Marrow (2014, directed by Adam Green). He has designed album art for The
  Used, In Flames, Aesop Rock, and Cage. Clients include Hurley International,
  KidRobot, and Upper Playground. He shows at Spoke Art, Corey Helford Gallery,
  and Gallery 1988.

  For SHINE 2016, he painted in St. Petersburg.

searchBio: |
  He designed creatures for Zack Snyder's Sucker Punch. He made the album art
  for The Used. He calls his monsters "Brightmares."

  Alex Pardee was born February 5, 1976 in Antioch, California. He is
  self-taught — no formal art education. His style is dark, fantastical worlds
  filled with ghoulish creatures in unexpectedly vibrant, saturated colors,
  inspired by Garbage Pail Kids and Tales From the Crypt. He works in pens, ink,
  watercolors, and dye, and has been moving toward more acrylics, oils, and
  latex. He has spoken about using his art to work through depression, anxiety
  disorders, and emotional struggles.

  Pardee is a freelance artist, apparel designer, and comics creator. He is best
  known for illustrating The Used's album artwork, which includes In Love and
  Death ("All That I've Got," "I Caught Fire"), Berth ("The Bird and the Worm"),
  Lies for the Liars ("Liar Liar (Burn in Hell)," "Pretty Handsome Awkward"),
  Shallow Believer, and the single "Take It Away." Beyond The Used, he has
  designed album and single art for In Flames (the cover of their ninth studio
  album A Sense of Purpose and its first single "The Mirror's Truth"), Aesop
  Rock (The Impossible Kid), Aiden (Conviction), Street Drum Corps (Street Drum
  Corps, We Are Machines), Bay Area rapper TopR (Cheap Laughs for Dead
  Comedians, Marathon of Shame), and Cage (Hell's Winter, Kennylz, I Never Knew
  You EP, Depart from Me). He directed and produced music videos including "All
  That I've Got," LiveLavaLive (Mitchell Davis), and the WWE Theme Song, and
  produced Dredg's "The Thought of Losing You."

  In film, Pardee designed the artwork for Zack Snyder's Sucker Punch (first
  revealed at Comic-Con in 2009). In 2014 he served as Art Director, Executive
  Producer, and Creature Designer on Adam Green's biographical creature film
  Digging Up The Marrow. In 2015 he collaborated with hip hop artist Justin Bua
  on a piece titled "I Got Your Back."

  His commercial client list includes Hurley International, Twenty Twenty
  Skateboards, Upper Playground, Kid Robot, Aiden, and Street Drum Corps. He is
  a member of the artist groups Cardboard City and Zerofriends, and runs the
  website EyeSuck Ink, which links to his blog and store. He shows at Spoke Art,
  Corey Helford Gallery, and Gallery 1988 (1988 Gallery).

  Pardee released his first official art book, Awful Homesick, in October 2008.
  His comics and published works include And So He Bathed in the Blood of the
  Lepers, Bunnywith, My Book of Poetry, My Book of Feelings, The Ugliest Fairy
  (2006), Good Night Lava (2007 Upper Playground limited edition), Into the
  Marrow (2009 1988 Gallery limited edition), and The Secrets of Hollywood
  (2004). He has also produced calendars: Astrology Is Dead (2002), The
  Beautiful People Calendar (2003), and Snoring Blood Calendar (2004). His web
  series Chadam premiered in 2010, and he worked on a motion picture for Chadam
  (not to be confused with Chadam Mihlberger). He appeared at the 2012 New York
  Comic Con.

  Justin Bua has described Pardee as "a prolific artist whose imagination is
  populated with wicked, warped, and wacky characters that walk a tightrope
  between playful and grotesque. His artistic world inspires all artists to not
  only strive for greatness, but more importantly, to have fun."

  For SHINE 2016, he painted in St. Petersburg, Florida. His series of monster
  characters, which he has nicknamed Brightmares, brings the same
  dark-yet-saturated palette he uses in his album art and creature design into
  mural form.

  Online: EyeSuck Ink (official website), Zerofriends (official webstore), and
  his work has been featured in WWA gallery shows including Color Ink Book's 3rd
  Anniversary Show "Shade's of Ray."

searchMuralDescription: |
  A 46-by-19-foot mural depicting an emaciated, skeletal gray figure hunched
  beneath an enormous dripping concentric-circle orb in pink, blue, green,
  yellow, and orange — like a deflating rainbow balloon where the figure's head
  should be. The creature has elongated bony limbs and stands on bulbous white
  and tan blobs that spurt upward from the ground. A swirling black vortex fills
  the background. Colors drip downward from the orb as if melting in the Florida
  heat. This was the largest mural Pardee had ever attempted at the time,
  completed with assistance from fellow artist Ricky Watts.

