artistBio: |
  "It's not kids doodling on walls. This is significant, professional work."

  The Gibbs High School Mural Club is run by Brian McAllister, Department Chair
  of Visual Arts at the Pinellas County Center for the Arts at Gibbs High — the
  same magnet program that produced Derek Donnelly and Reid Jenkins. McAllister
  earned his BFA in Illustration from Ringling, freelanced across the US, taught
  mural painting in Saipan, and came back to St. Pete to start the club. He
  donates his time. Donations and commissions cover paint, lifts, and materials.

  Thirty-six students. Two to three murals a year. Thirteen years running.
  McAllister estimates comparable professional murals would cost $20,000 each.
  Notable projects include the Royal Theater (six feet by 133 feet, with Boys &
  Girls Club members), the Alden Suites in St. Pete Beach for the resort's 50th
  anniversary, and the "Fighting Chance" mural at the Morean Arts Center
  commemorating COVID — designed with Leadership St. Pete Class of 2020 to
  support the Fighting Chance Fund for affected businesses.

  Their St. Petersburg Distillery mural at 800 31st Street South is "Raising
  Local Spirits" / "Voyage Under the Sea" — a sponge diver and a giant octopus
  retrieving rum barrels from a sunken ship. It references the site's
  rum-running history. Senior club president Anderson Bray, a four-year member,
  painted with the octopus team. His take: "It is really exciting to have it
  right across the street because I can tell my friends, 'Hey I did this.'"

  McAllister's principle: "Once you're in the mural club, you're always in the
  mural club."

searchBio: |
  "It's not kids doodling on walls. This is significant, professional work."

  The Gibbs High School Mural Club is run by Brian McAllister, Department Chair
  of Visual Arts at the Pinellas County Center for the Arts (PCCA) at Gibbs High
  School — the same magnet program that produced Derek Donnelly and Reid
  Jenkins. PCCA was founded in 1984 as Pinellas County's arts magnet high
  school. McAllister earned his BFA in Illustration from Ringling College of Art
  and Design in Sarasota, freelanced across the US, taught mural painting in
  Saipan in the Northern Mariana Islands, and came back to St. Petersburg to
  start the club. He donates his time entirely. Donations and commission revenue
  cover paint, lifts, and materials.

  His own studio is JBM Studios. He works in oil, acrylic, mixed media, digital
  painting, and printmaking. He is the official artist for the Tampa Bay Rays /
  MLB featured print series. His personal mural projects include "The Spirit of
  St. Pete" at Ulele, work at The Schu, the Gulf Coast Alliance Skyway series,
  the Tichenor Orthopedic Clinic for Children in Long Beach CA, and the Fred
  Held South Pasadena Habitat.

  The Mural Club has thirty-six students and produces two to three murals a
  year. It has been running for thirteen-plus years. McAllister: "Everything we
  do, everything we receive, goes back into the club." And: "Not only are they
  learning things they can use in the classroom and in their own artwork — they
  are learning about community, learning how to work together as a team,
  building relationships."

  Notable club projects: - "Raising Local Spirits" / "Voyage Under the Sea" at
  the St. Petersburg Distillery (800 31st St S) — a 10-day project depicting a
  sponge diver and a giant octopus retrieving rum barrels from a sunken ship,
  referencing the site's rum-running history. Partnership with Matt Risley,
  Director of Brands and Marketing at SPD. - "Great Futures Start Here" — SHINE
  2019, collaboration with Boys & Girls Club members. - Royal Theater mural —
  historic Royal Theater, six feet tall by 133 feet long, with Boys & Girls Club
  participants. - Alden Suites, St. Pete Beach — commemorating the resort's 50th
  anniversary (2019). - "Fighting Chance" mural at the Morean Arts Center, 719
  Central Ave — designed with Leadership St. Pete Class of 2020 to commemorate
  COVID-19. Features native Florida passion vine (community diversity), masked
  children — one reading with doves emerging from book pages, another with a
  camera documenting history — a pelican against the St. Pete skyline, a "+"
  symbol for healthcare workers, and the MLK quote "What are you doing for
  others?" Proceeds supported the Fighting Chance Fund for pandemic-affected
  businesses. - Morean Arts Center mural. - Gulf Coast Arts Alliance mural. -
  Northeast Little League.

  Senior club president Anderson "Andy" Bray, a four-year member, worked on the
  Distillery octopus team. He said: "Usually when we paint, we paint on a
  smaller canvas, but this is a huge wall, so we have to use our technique and
  skills in different ways." McAllister's recurring line: "Once you're in the
  mural club, you're always in the mural club."

  Instagram: @gibbs_mural_club. McAllister's site: jbmstudios.com.

searchMuralDescription: |
  A massive underwater scene spanning the side of the distillery building along
  31st Street. A giant orange octopus wraps its tentacles around the left side,
  its suckers curling around rum barrels from a sunken ship. Sharks and a
  spotted eagle ray glide through turquoise water around ghostly gray shipwreck
  masts and rigging. On the right, a vintage deep-sea diver in a copper helmet
  explores the wreckage. The title "Voyage Under the Sea" and "Just Add Water!"
  appear in retro lettering. The concept references St. Pete's rum-running
  history — sponge divers recovering barrels from sunken sailboats.

