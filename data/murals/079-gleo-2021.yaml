artistBio: |
  Gleo is the working name of Natalia Gallego Sanchez, born in 1992 in Cali,
  Colombia. She started painting street art at 17, juggling chemistry classes
  during the day and fine arts at night, before studying Visual Arts and
  Graphic Design at Universidad del Valle. Her style layers dreamlike
  portraits of women and children with botanical motifs, pre-Columbian
  cultural references, and ornamental masks — everything rendered in soft
  earth tones and pastels with her signature glowing yellow orbs as a
  recurring element. She paints primarily with rollers and brushes at massive
  scale. Her 2018 mural "El Sueno Original" on a grain elevator in Wichita,
  Kansas covered 50,000 square feet and was recognized by the World Record
  Academy as the world's largest mural by a single artist. She's painted
  major walls across the Americas and Europe — Montreal, The Hague, Mexico
  City, Sao Paulo, Barcelona, Charlotte, and Rabat among them. Dinero, a
  major Colombian business magazine, named her one of their "40 Under 40"
  Colombians leading their fields.

muralDescription: |
  A wide panoramic mural across the full building wall showing multiple
  overlapping faces and hands rendered in soft pinks and mauves. The figures
  intertwine with ornate mandala-like patterns in warm golds and oranges,
  with sunflowers and botanical details woven between the portraits. The
  color palette is dreamy — mostly blush pink, sage green, and amber against
  a pale background. The faces gaze in different directions, creating a
  layered, contemplative composition.

