artistBio: |
  She painted a 50,000-square-foot grain elevator in Wichita, Kansas. It broke
  the record for the largest acrylic mural by a single artist.

  Nathalia Gallego Sanchez — Gleo — was born in 1992 in Cali, Colombia. She
  studied chemistry by day and fine arts at a night institute before earning her
  bachelor's in visual arts and graphic design from Universidad del Valle. She
  found formal study too theoretical and went her own way. She uses acrylics,
  brushes, and rollers — no spray cans. "I let myself be guided by the moment."

  Her murals feature mystical beings, pre-Columbian figures, women with
  patterned face-paint and floral-decorated hair, and signature bright yellow
  orbs. She draws from Colombian folklore and ancestral cosmology. She has
  painted across France, Portugal, Morocco, Brazil, Mexico, Belgium, the
  Netherlands, and the US. Her name is wordplay — derived from her surname
  GALLEGO.

  For SHINE 2021, she painted in St. Petersburg.

searchBio: |
  She painted a 50,000-square-foot grain elevator in Wichita, Kansas. It broke
  the record for the largest acrylic mural by a single artist.

  Nathalia Gallego Sánchez — Gleo — was born in 1992 and grew up in Cali,
  Colombia from age nine. She studied chemistry by day and fine arts at a night
  institute before earning her bachelor's in visual arts and graphic design at
  Universidad del Valle. She found formal art study too theoretical and went her
  own way. The pseudonym Gleo is wordplay derived from her surname GALLEGO. She
  does not reveal her face to media.

  She began experimenting with street art at seventeen, painting sea creatures
  in her neighborhood. Her first piece on a wall in front of her house was
  nearly painted over by a more experienced graffiti artist; her mother stepped
  outside and told him she would call the police if he covered her daughter's
  work. The confrontation ended with Gleo joining the local crew. Her real
  training came on the street and through travel. Her work has since reached
  Argentina, Paraguay, Peru, Brazil, Ecuador, Costa Rica, Mexico, the United
  States, Spain, Portugal, Belgium, Sweden, the Netherlands, France, and
  Morocco. Her path into Mexico opened through a scholarship that did not come
  through, then through work she found at an urban art gallery.

  She works in acrylic outdoor vinyl, brushes, and rollers — no spray cans. She
  sketches the design, then builds an irregular grid for proportions and
  perspective before adding splatters, textures, and color. Her murals depict
  mystical beings, pre-Columbian figures, women with patterned face-paint and
  floral-decorated hair, mythical creatures with yellow glowing eyes, and
  signature bright yellow orbs. She draws from Colombian folklore, ancestral
  cosmology, antiquity, and the primary arts of the world. Her stance: "I let
  myself be guided by the moment I'm painting." She has spoken about street art
  as political engagement — a protest against the concrete grid called "city"
  and an invitation to remember that humans are living creatures inside a larger
  whole.

  In 2016 she exhibited "Origo," a departure from her typical street work that
  included canvas, sculpture, and intervened objects. In 2017 she completed a
  wall in São Paulo, Brazil that she has named her favorite project — a
  challenge years in the anticipating that pushed her past her existing skills.

  In 2018 she painted "El Sueño Original" ("The Original Dream") on the Beachner
  Grain Elevator at 519 E 20th Street N, Wichita, Kansas, as part of the
  Horizontes Mural Project. The mural was commissioned by artist and community
  organizer Armando Minjarez, who designed and directed the project after
  immigrating to Wichita in 2001. At 50,000 square feet, "El Sueño Original"
  surpassed Spain's previous 38,701-square-foot record to become the World
  Record Academy and Guinness-recognized largest acrylic mural by a single
  artist. The grain elevator sits in the industrial corridor that separates
  Wichita's predominantly Latino NorthEnd from its historically Black Northeast
  neighborhoods. The mural depicts people of color from those neighborhoods
  looking toward the horizon, with a young woman at the center representing
  Wichita; many figures are based on local residents and migrant laborers who
  built the railroad tracks around the elevator. Photographers Ashwin
  Govindarajan, Alexis Rivierre, Juan Carlos Garcia, and Xavier Leija
  contributed source portraits for the project. Mural production was led by
  Fellipe Ribeiro; art assistants included Quintis Pinkston and Rob Lewis;
  logistics assistant was Mason Talbott. The piece is visible from Interstate
  135 and Highway 96.

  In 2022 she painted "Flower Woman in the Window," one of the largest murals in
  the Netherlands, opposite Moerwijk Station in The Hague. It was commissioned
  through Mauritshuis and inspired by Ambrosius Bosschaert's painting "Vase of
  Flowers in a Window." The wall took twenty-one days to complete. Through
  Beyond Walls, the Lynn, Massachusetts–based public art organization, she has
  also painted "Child Flower" on the former Boys Club building at Yellow Brick
  Management in Holyoke, Massachusetts.

  For SHINE Mural Festival 2021, she painted in St. Petersburg, Florida.

  Website: gleo.com. Instagram: @gleo_co.

searchMuralDescription: |
  A wide panoramic mural across the full building wall showing multiple
  overlapping faces and hands rendered in soft pinks and mauves. The figures
  intertwine with ornate mandala-like patterns in warm golds and oranges, with
  sunflowers and botanical details woven between the portraits. The color
  palette is dreamy — mostly blush pink, sage green, and amber against a pale
  background. The faces gaze in different directions, creating a layered,
  contemplative composition.

