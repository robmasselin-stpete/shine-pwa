artistBio: |
  He spent 14 years as a park ranger, by Creative Pinellas's count, before he
  quit his day job to paint. Eric Hornsby goes by Esh, short for "Eat, Sleep,
  Hustle."

  His family moved to Thonotosassa, in rural Hillsborough County, after his
  grandfather, a retired New York police officer, bought a mobile home park
  there. He was "a nature lover from the go," and he used to swim the
  Hillsborough River from Sargent's Park to Morris Bridge, "for the adventure
  of it." The work followed the woods: canoe guide, then park ranger, then
  on-site land manager for Hillsborough County's conservation department. A
  Tim Ferriss book changed the plan. If you're not choosing the life you want,
  he says, you're living a false life.

  He taught himself to draw mostly by copying manga, cartoons and comic books.
  He has always considered himself a graffiti artist. Florida animals fill his
  walls, and he has painted, in his words, "quite a bit of osprey." On
  Gasparilla Music Foundation's Tampa headquarters in 2023 he painted a
  Florida swamp band: a red-winged blackbird on a guitar neck, a Florida
  panther on keys, an owl on sax, an alligator working the turntables. In 2020
  he put Tom Brady, Rob Gronkowski and Mike Evans on a wall on East Busch
  Boulevard, Brady 20 feet tall, with at least 100 cans of spray paint. He has
  been a Bucs fan since the days of Reggie Cobb.

  He co-founded Tampa Bay Fresh Fest, the Tampa urban-art festival. He says
  the St. Petersburg artists who welcomed him early "almost had a bit of
  celebrity" to him. He has also made art for The Cube in the Straz Center's
  Jaeb Courtyard, drawn from shows like "Wicked" and "RENT."

  He called his 2024 osprey painting for Bellwether Beach Resort "Another
  Storm Weathered," because to him the bird looked like it had just weathered
  a really hard storm. Then it blew off the back of his car at the Gandy
  Bridge exit and broke into three pieces. Fellow muralist Merritt Horan
  Capurro fused it back together with gold leaf paint. He admits the damage
  was not his idea.

  For SHINE 2026 he is one of fifteen artists in the festival's twelfth year,
  painting a wall at 939 Dr. MLK Jr St S.

searchBio: |
  He spent 14 years as a park ranger, by Creative Pinellas's count, before he
  quit his day job to paint. Eric Hornsby goes by Esh, short for "Eat, Sleep,
  Hustle," and posts as Artist Esh.

  His family moved to Thonotosassa, in rural Hillsborough County, after his
  grandfather, a retired New York police officer, bought a mobile home park
  there. He was "a nature lover from the go," borrowing an uncle's canoe to
  paddle out on a lake and camping out, and he used to swim the Hillsborough
  River from Sargent's Park to Morris Bridge, "for the adventure of it." The
  work followed the woods: canoe guide, then park ranger, then on-site land
  manager for Hillsborough County's conservation department. A Tim Ferriss
  book changed the plan. If you're not choosing the life you want, he says,
  you're living a false life. He dropped to part time and set out to become a
  professional artist, and the motto became the name.

  He taught himself to draw mostly by copying manga, cartoons and comic books,
  and mixes those styles with nature. He has always considered himself a
  graffiti artist, and he argues for graffiti as a craft: "I really want
  people to see that it's technically difficult to produce." Florida animals
  fill his walls, and he has painted, in his words, "quite a bit of osprey."

  On Gasparilla Music Foundation's Tampa headquarters in 2023 he painted a
  Florida swamp band: a red-winged blackbird perched on the neck of a guitar,
  a Florida panther on keys, a tree frog latched onto a microphone, an owl on
  sax, a fox on drums and an alligator working the turntables, playing under a
  Tampa skyline at sunset. He had 15 days to finish it, painting mornings
  until the heat drove him off and returning in the evening until dark. The
  foundation found him through an alligator he painted on the side of Muay
  Thai in Tampa Heights. He has painted other music-themed murals at Showbar
  in Ybor City, at the Straz Center and at a music studio in Lakeland.

  In 2020 he put Tom Brady, Rob Gronkowski and Mike Evans on a mural that
  measures 40 by 60 on the Cobb Rehab and Wellness building, 4205 East Busch
  Boulevard in Tampa, with at least 100 cans of spray paint and a 20-foot
  Brady. He got rained out a few times and overheated a few times. He painted
  "home team" in the bottom left corner. He has been a Bucs fan since the days
  of Reggie Cobb. "Any mural that I paint, I want it to be something
  positive," he says.

  He co-founded Tampa Bay Fresh Fest, the urban-art and graffiti festival in
  Tampa, organizing it with Mark Stevens. Creative Loafing called it "Tampa's
  brand-new mural festival" in February 2019, when its main event was a block
  party at Robertson Billiards in Tampa Heights. He says the St. Petersburg
  artists who welcomed him early "almost had a bit of celebrity" to him, and
  before long they were all working together on projects.

  For a few years he made art for The Cube in the Straz Center's Jaeb
  Courtyard, drawn from productions including "The Threepenny Opera,"
  "Wicked," "RENT" and "The Curious Incident of the Dog in the Night-Time." In
  2018 he curated the Straz's Art on the Walk show with Tampa-area mural
  artists.

  He called his osprey painting for Bellwether Beach Resort's 727 Day in 2024
  "Another Storm Weathered," because to him the bird looked like it had just
  weathered a really hard storm. Then it blew off the back of his car at the
  Gandy Bridge exit and broke into three pieces. He ran into traffic to grab
  them, and fellow muralist Merritt Horan Capurro fused the painting back
  together with gold leaf paint. He admits the damage was not his idea: "As
  much as I like to act like that was intentional, that was all just a freak
  accident."

  For SHINE 2026 he is one of fifteen artists in the festival's twelfth year,
  painting a wall at 939 Dr. MLK Jr St S.

