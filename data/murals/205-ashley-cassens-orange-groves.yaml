artistBio: |
  Florida Orange Groves Winery wanted oranges. She gave them oranges — plus a
  rainbow lorikeet diving past hibiscus, plumeria, monstera leaves, and lime
  slices at the base. Full Florida palette on cinder block.

  Ashley Cassens is a Tampa-based representational painter and muralist. She
  grew up in Daytona Beach, earned a BFA from Florida Southern College in 2006
  and an MFA from Florida Atlantic University in 2017, and taught K-5 art for five years before going full-time in 2022. Two of her oil paintings
  ended up licensed to HomeGoods.

  Her studio work is intimate figurative portraiture in layered oil. Her
  commercial walls run botanical — citrus, blossoms, pollinators, tropical
  foliage rendered with the same fine-painting eye. Signed lower-left "ASHLEY
  CASSENS @ashley.cassens."

searchBio: |
  Florida Orange Groves Winery wanted oranges. She gave them oranges — plus a
  rainbow lorikeet diving past hibiscus, plumeria, monstera leaves, and lime
  slices at the base. Full Florida palette on cinder block.

  Ashley Cassens is a Tampa-based representational figure painter and
  muralist, native Floridian from Daytona Beach. She earned a BFA from Florida
  Southern College (2006) focused on representational work and traditional oil
  painting methods, then an MFA from Florida Atlantic University (2017), where
  she received a Graduate Teaching Assistantship, Provost Fellowship, two
  Graduate Advisory Board Grants, the Friedland Grant, Rothenberger
  Scholarship, Ambassador of the Arts Scholarship, and the Women in the Visual
  Arts Scholarship (twice).

  She taught K-5 art for five years and was a teaching assistant at FAU
  before becoming a full-time artist in 2022. She works from Tampa's Northdale
  area.

  Her studio work is intimate figurative portraiture in oil — layered,
  chromatic paint on canvas and wood panels, often focused on body parts and
  details of loved ones. Notable series include "Eye Traps" (small oil
  portraits of women on patterned fabric, named for an IBLP pamphlet on how
  women should dress; she learned of the group through the true-crime podcast
  "Some Place Under Neith"; two pieces licensed to HomeGoods; shown at
  Elevation Coffee Roasters, Tampa) and "Projection Series" (vibrant portraits
  exploring experiences filtered through screens).

  Commercial clients include HomeGoods (licensing), Ann Cox Design, Cori Rose
  Handmade, Creative Pinellas, and various schools, non-profits, national
  corporations, and private residences. She has been featured on Fox 13 Tampa
  Bay (January 2023), Creative Loafing Tampa, CanvasRebel Magazine, Artsy
  Shark, and Daytime TV on News Channel 8.

  This wall at Florida Orange Groves Winery (1500 Pasadena Ave S, South
  Pasadena) features two large oranges with white citrus blossoms hanging from
  branches at left, a rainbow lorikeet in mid-flight at center, and a cluster
  of hibiscus and plumeria flowers on the right — anchored at the base by
  three sliced limes. The background is a cobalt-to-teal blue wash with
  lavender silhouette shapes suggesting leaf shadows. Painted on a
  cinder-block exterior in May 2026.

  Instagram: @ashley.cassens. Website: ashleycassens.com.

searchMuralDescription: |
  A large exterior mural on a cinder-block wall of Florida Orange Groves
  Winery in South Pasadena. The composition spreads across the full wall
  against a cobalt-blue background overlaid with lavender silhouette shapes of
  oversized leaves and citrus. On the left, two large ripe oranges hang from a
  brown branch with deep green leaves and white five-petaled citrus blossoms.
  In the center, a rainbow lorikeet flies in profile with wings fully spread —
  cobalt-blue head with red eye and orange beak, yellow-and-green underwings,
  red breast, slate-blue body, and yellow-tipped flight feathers. Behind the
  bird, dark green monstera leaves with characteristic splits frame the
  upper-right register. On the right side, a cluster of large flowers fills
  the wall: a pink-and-teal-streaked hibiscus at the top, a smaller pink
  hibiscus below it, and a white-and-yellow plumeria bloom to its right. At
  the bottom-center, three sliced lime halves with visible green segments rest
  along the base, framed by additional green foliage. Signed in white block
  lettering at the lower left: "ASHLEY CASSENS" with "@ashley.cassens"
  beneath.

