artistBio: |
  Regan McCreight paints walls, canvases and people. As Chroma Creature she
  does murals, face and body painting and special-effects makeup, and she
  taught herself all of it.

  Her subject is the feminine and its tie to the natural world. She works in
  acrylic, gouache, airbrush and spray paint. For her, making art starts with
  paying attention: noticing the urge to create, then giving shape to the
  things people feel more than they can say.

  Creative Pinellas calls her creations surreal and vibrant, rooted in nature
  and the divine feminine, with themes of love, hope and freedom — "a
  colorful, dreamlike world that bridges femininity and nature." Besides
  murals she paints signs and logos, custom canvases, and airbrush face and
  body paint for parties and festivals. Creative Pinellas also lists her as a
  curator.

  She works out of studio #208 at the ArtsXchange, the Warehouse Arts District
  Association's studio building at 515 22nd St S. Her portfolio runs to local
  businesses and homes: Muddy Root kava cafés in St. Pete and Gulfport, Beau &
  Mo's Italian Steakhouse, a house in Historic Kenwood, BSA Design in Tampa,
  and a 2026 traveling mural for the We Belong Here music festival. In Lealman
  her design "Stuck on Venus & Swamp Puppy" wraps a traffic signal box at 28th
  St N and 54th Ave N, part of Creative Pinellas's 2025 signal box program.

  For SHINE 2026, the festival's twelfth year, she is painting a wall at VIV.

searchBio: |
  Regan McCreight paints walls, canvases and people. As Chroma Creature she
  does murals, face and body painting and special-effects makeup, and she
  taught herself all of it. Her Instagram, @chromacreature, signs off "Art by
  Regan McCreight" and lists her as muralist, body painter and artist.

  Her subject is the feminine and its tie to the natural world. She works in
  acrylic, gouache, airbrush and spray paint. For her, making art starts with
  paying attention: noticing the urge to create, then giving shape to the
  things people feel more than they can say. Her SHINE artist record calls her
  a multidisciplinary artist with a lifelong pull toward making things, and
  lists body art and special-effects makeup alongside painting and murals.

  She starts from nature. Creative Pinellas, the Pinellas County arts agency,
  describes her as a St. Petersburg muralist, artist, body painter and
  curator, "renowned for her surreal and vibrant creations," who draws on
  nature and the divine feminine. Her work, in the agency's words, invites
  viewers to connect with themes of love, hope and freedom, and reflects "a
  colorful, dreamlike world that bridges femininity and nature" — whether on
  canvas, skin or large-scale murals. Her own site says she is "inspired by
  the beauty found within nature" and lists her mediums as acrylic, spray
  paint, airbrush and oil.

  Murals are one of four services. She also paints custom signage and logos,
  custom canvas commissions — portraits, pets, landscapes — and airbrush face
  and body painting for parties, festivals and celebrations.

  She works out of studio #208 at the ArtsXchange, 515 22nd St S in St.
  Petersburg. The Warehouse Arts District Association, a 501(c)(3), bought the
  nearly three-acre ArtsXchange property in 2014 to give artists affordable
  space; her Instagram calls her a studio artist at WADA.

  Her portfolio runs to local businesses and homes. It lists, for 2025: Muddy
  Root Kava in St. Pete, a second Muddy Root job in St. Pete, Beau & Mo's
  Italian Steakhouse in St. Pete, a residence in St. Pete, and a commercial
  pool company. For 2026: Muddy Root in Gulfport, a residence in Historic
  Kenwood, Healing House Chiropractic, BSA Design in Tampa, and a traveling
  mural for the We Belong Here music festival.

  In 2025 Creative Pinellas picked her for its signal box program, which turns
  artists' designs into vinyl wraps on traffic signal control boxes as a
  graffiti deterrent, in partnership with Pinellas County and the Lealman
  Community Redevelopment Area. Her design, "Stuck on Venus & Swamp Puppy,"
  went up in May 2025 on the box at 28th St N and 54th Ave N in Lealman.

  SHINE 2026, the festival's twelfth year, runs Nov. 6–15. The lineup lists
  her as Regan "Chroma Creature" McCreight, of Florida. Her wall is at VIV,
  1000 1st Ave N.

