artistBio: |
  He painted his two daughters in sunflowers on the side of a distillery. His
  son Syre shows up in murals across the rest of the city.

  Reid Jenkins is a St. Petersburg native. He graduated from the Pinellas County
  Center for the Arts at Gibbs High School — the same program that produced
  Derek Donnelly — then earned a BFA from the Maryland Institute College of Art.
  He tattoos at Fabled Trade Tattoo Company, a queer-owned studio in the Lealman
  area, and keeps a studio at the ArtsXchange in the Warehouse Arts District.

  His murals tend toward photorealistic portraiture and botanicals. For SHINE
  2021 he painted at St. Pete Distillery — the daughters, the sunflowers, and a
  yellow butterfly between them on a deep teal wall. He has noted that roughly a
  third of mural pay goes to supplies alone. He collaborated with Iboms and Zulu
  Painter on "Imagine Gas Plant & Laurel Park" at Campbell Park Recreational
  Center, and painted the cheetah with geometric 90s-inspired colors at Star
  Booty Salon on 16th Street South.

  For SHINE Origins 2025, he painted a botanical piece at Founders Pro using a
  projection method for the outline.

searchBio: |
  He paints the people seldom seen in the 'Burg. He also tattoos them.

  Reid Jenkins is a St. Petersburg native. He graduated from the Pinellas County
  Center for the Arts (PCCA) program at Gibbs High School, then earned a BFA
  from the Maryland Institute College of Art (MICA). He is a muralist, painter,
  illustrator, and tattoo artist. He tattoos at Fabled Trade Tattoo Company
  (formerly Ink Werkz Tattoo Studio), a queer-owned studio at 4195 54th Ave N in
  the Lealman area of St. Petersburg. He keeps a studio at the ArtsXchange in
  the Warehouse Arts District.

  His aim is to "paint the human experience and the experience of those seldom
  seen in the 'Burg," focusing on capturing small, overlooked moments. His work
  tends toward photorealistic portraiture and botanicals. He has noted that
  roughly 33% of mural pay goes to supplies alone. He supports MIZE Gallery,
  COVE in Pinellas Park, Woodfield Fine Art, and d-gallerie.

  For SHINE 2021, he painted at the St. Pete Distillery — portraits of his two
  daughters with sunflowers and greenery. He collaborated with Iboms and Zulu
  Painter on "Imagine Gas Plant & Laurel Park" at Campbell Park Recreational
  Center. Other murals include the large cheetah with geometric 90s-inspired
  colors at Star Booty Salon (1741 16th St S). He exhibited in "Renew," a group
  show with Bekky Beukes at Mergeculture, Tampa (February 2022).

  For SHINE Origins 2025, he painted a botanical piece at Founders Pro, using a
  projection method for the outline. Instagram: @reidmjenkins.

searchMuralDescription: |
  Two large-scale portraits of young women — the artist's daughters — surrounded
  by lush greenery, golden sunflowers, and cascading white jasmine vines against
  a deep purple and teal background. A yellow butterfly floats between the
  figures. Painted across the facade of St. Petersburg Distillery.

