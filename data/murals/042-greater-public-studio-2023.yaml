searchMuralDescription: |
  A colorful, illustrative mural spanning a large wall near the USF St. Pete
  campus. The composition features a fantastical townscape with stacked
  buildings, winding paths, and small figures exploring the scene. Bright blues,
  oranges, and greens fill the design in a style that feels like an oversized
  storybook illustration.

