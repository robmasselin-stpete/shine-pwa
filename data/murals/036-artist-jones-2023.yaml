artistBio: |
  Her great-great grandmother was a Chester County painter. The family has been
  at it for generations.

  Tracey Jones — Artist Jones — is based in Tampa. She holds a degree in graphic
  design and spent ten-plus years as a graphic and web designer before
  transitioning to fine art painting. She was born in Trinidad and Tobago, and
  the Caribbean tones show — vibrant-colored portraits of powerful Black and
  brown people in mixed media, with composition informed by her design training.

  Clients include the Tampa Bay Lightning, the Tampa Bay Buccaneers, Outback,
  and Walmart. She participated in the City of Tampa's Art on the Block program
  and the Tampa Bay Born Murals series. For SHINE 2023, she painted in St.
  Petersburg.

searchBio: |
  Her great-great grandmother was a Chester County painter. The family has been
  at it for generations.

  Tracey R. Jones — Artist Jones — is a graphic designer, painter, and muralist
  based in Tampa Bay, and the great-great granddaughter of Ida Ellen Ruth Jones,
  the Chester County painter. Her family traveled across the world during her
  childhood, which she credits with shaping her ability to draw artistic
  perspectives from many cultures and lifestyles. She began illustrating early
  and treated art as the lifeblood of her future. In high school, with digital
  content beginning to boom, her guidance counselors and mentors steered her
  toward graphic design as a career path. She landed her first graphic design
  job at a local newspaper after college, taking the position over a
  higher-paying deli job because it justified the student loans she had signed
  for. She spent the next ten years evolving into the new-age graphic designer —
  proficient in design, video, web, coding, and Word — and the more skill she
  absorbed, the less appreciated and respected she felt. She has said that
  became the exact reason she began painting: to make work that was hers,
  untouched by the pressures of business hierarchy.

  Her style is vibrant mixed media, with composition shaped by her design
  background and a recurring focus on history, culture, and powerful Black and
  brown subjects. Originals listed for sale on her site include "Black Cowboy in
  St. Louis," "All My Life I Had to Fight," "Neo-Duafe Sovereign," "Clouds are
  Crowns: Future Baddie," "Olukun," "Key to Becoming," the "Head in the Clouds"
  series (including #5 Nairobi, #6 Amara, and #7 Jelani), the "Basquiat Series"
  (including #5: The Meaning), "Tlaloc," "Cat on Red Chair," "Astral Ethereal,"
  "The Birds and the Trees," "Yema(r)ya," "The Power Chapter," "Deception,"
  "BEYOND: A Space Cadet Story," "Rise, Black Girl," and "The Story of Mawu
  Lisa." Her practice spans painting, sculpting, printmaking, murals, and
  digital art.

  Her first mural in Tampa Bay sits at 901 7th Ave S in St. Petersburg on the
  exterior of Brookwood Florida, painted as part of the SHINE Mural Festival
  Unity project in 2022 in collaboration with members of the community and girls
  from Brookwood. The piece carries the message "Always Forward Together." She
  was one of sixteen muralists featured in the "We Built This City" exhibition
  at the Morean Arts Center in St. Petersburg.

  Commercial clients on her roster include Outback Restaurants, Tampa Bay
  Lightning, Tampa Bay Buccaneers, and Walmart. She participated in the City of
  Tampa's Art on the Block program and the Tampa Bay Born Murals video series
  produced by I Love the Burg and That's So Tampa, made possible by Neptune
  Flood Insurance CEO Trevor Burgess and his husband Gary Hess in partnership
  with Metro Inclusive Health. The series profiles Tampa Bay muralists, many of
  them persons of color, LGBTQ+ artists, and women working in a historically
  non-inclusive industry.

  Over the three years leading into her February 2024 CanvasRebel interview, she
  networked, showed, and shared with a wide range of Tampa Bay artists, and
  during that period collaborated with Vanessa Oatman of EVOZ Marketing on a
  year-long project bringing local artists together for a single event. She has
  spoken about social media as a deliberate balance — taking almost four years
  to grow her Instagram, refusing to chase follower counts at the expense of
  growth and experience, and pushing other creatives to find what she calls "a
  beautiful dream come true" rather than a metric. She frames mentorship as the
  most rewarding part of her practice, more satisfying than selling paintings.

  Upcoming public appearances include the JHOP Art Battle at John Hopkins Middle
  School (701 16th St S, St. Petersburg) on April 28, 2026, where ten muralists
  go head-to-head racing the clock. Her CanvasRebel feature ran February 26,
  2024, and she has been profiled in the I Love the Burg Tampa Bay Born Murals
  series.

  Website: theartistjones.com (also traceyrjones.com). Instagram:
  @theartistjones. Facebook: Artist Jones Creations. Twitter: @theartistjones.
  YouTube channel: UCmhhq_kPat_moyvLK0aARrA.

searchMuralDescription: |
  A vibrant full building wrap covering every surface of the small PSTA Ticket
  Office at Williams Park. The mural is a patchwork of bold, densely layered
  abstract patterns — oversized fan-shaped leaves in hot pink and sky blue,
  swirling navy spirals, lime green tiger stripes, red-orange organic shapes,
  yellow leopard spots, teal swirls, and geometric black-and-white dashes and
  lines. The patterns collide and overlap in irregular blocks, creating a
  quilt-like effect that draws from African textile traditions and graphic
  design. The saturated color palette — pink, blue, green, orange, yellow, navy,
  and teal — wraps seamlessly around corners and over utility boxes,
  transforming the entire structure into a single vibrant artwork. Signed
  "@theartist jones" in white at the bottom left.

