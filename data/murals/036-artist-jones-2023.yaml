artistBio: |
  Tracey "Artist" Jones is a multidisciplinary artist and muralist originally from Coatesville, Pennsylvania. Art runs in her blood — she's the great-great-granddaughter of Ida Ella Ruth Jones, a celebrated African American folk painter from Chester County who completed over 300 works in her 70s and 80s. Tracey's father nurtured her artistic interests from age six, and by fifteen she was already selling her own artwork. She attended Arcadia University on a basketball scholarship, studying graphic design, and after graduating spent over eighteen years in the field before pivoting to painting full-time. She moved to Tampa Bay over a decade ago and has built a serious presence there. Her work blends her graphic design eye for composition with fine art techniques, heavily influenced by culture, color, and storytelling — she cites Kehinde Wiley and DJ Black Coffee as major inspirations. Her brand collaborations include work with Outback, the Tampa Bay Buccaneers, Walmart, and the Tampa Bay Lightning, for whom she designed the 2025 Pride Night puck. Her first mural in the Tampa Bay area was the SHINE Unity Project piece at Brookwood Florida in 2022, a three-wall mural reading "Always Forward Together." In 2023, she was selected as one of six local artists for the main SHINE Mural Festival, painting this full building wrap on the PSTA Ticket Office at Williams Park. In 2025, she was honored as one of 16 women muralists in the "We Built This City: Women Artists of SHINE" exhibition at Morean Arts Center.

muralDescription: |
  A vibrant full building wrap covering every surface of the small PSTA Ticket Office at Williams Park. The mural is a patchwork of bold, densely layered abstract patterns — oversized fan-shaped leaves in hot pink and sky blue, swirling navy spirals, lime green tiger stripes, red-orange organic shapes, yellow leopard spots, teal swirls, and geometric black-and-white dashes and lines. The patterns collide and overlap in irregular blocks, creating a quilt-like effect that draws from African textile traditions and graphic design. The saturated color palette — pink, blue, green, orange, yellow, navy, and teal — wraps seamlessly around corners and over utility boxes, transforming the entire structure into a single vibrant artwork. Signed "@theartist jones" in white at the bottom left.

