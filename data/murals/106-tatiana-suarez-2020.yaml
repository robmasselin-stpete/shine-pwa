artistBio: |
  Tatiana Suarez is a Miami-born pop surrealist painter and muralist with Brazilian and El Salvadorian roots. She earned a BFA in Illustration and Design from the University of Miami in 2005, worked briefly in advertising, and then pivoted to painting full-time. Her signature style features dreamy, doe-eyed female figures floating in lush, surreal worlds filled with tropical plants, insects, and animals — drawing heavily from indigenous mythology, Brazilian folklore, and South American visual traditions. She works in oil on wood panels for gallery pieces and uses spray paint with a grid-transfer system for her large-scale murals. On the gallery side, she's shown at Spoke Art in San Francisco, Corey Helford Gallery and Thinkspace Projects in Los Angeles, and GGA Gallery in Miami. Her mural resume includes Wynwood Walls (2016–2021), Pow! Wow! Hawaii, Long Beach Walls at the Museum of Latin American Art, and Sea Walls: Artists for Oceans projects in Cozumel, Mexico and St. Petersburg, Florida. Commercial collaborations include Netflix, L'Oreal, Reebok, Secret Deodorant, and JanSport. She is represented by Bernstein & Andriulli for commercial mural work.

muralDescription: |
  A building-wrap mural covering the entire facade of the St. Petersburg Sailing Center in muted greens, teals, and warm browns. A young woman with flowing auburn hair swims among Florida manatees, her hand resting gently on a large manatee in the foreground. Schools of striped sheepshead fish swim to the right, while teal mangrove leaves and sea plants fill the left side and edges. Bubbles drift upward throughout the composition. The palette is naturalistic and subdued — deep greens, sage, and sandy tones — giving the whole piece an underwater, dreamlike quality. Signed "Tati 2020 @tatunga" in the lower right corner. Painted for SHINE x Sea Walls 2020, sponsored by Ocean Conservancy, the mural highlights the fragile mangrove and manatee ecosystems of Florida's coast.

