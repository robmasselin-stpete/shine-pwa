  Center in muted greens, teals, and warm browns. A young woman with flowing
  auburn hair swims among Florida manatees, her hand resting gently on a large
  manatee in the foreground. Schools of striped sheepshead fish swim to the
  right, while teal mangrove leaves and sea plants fill the left side and edges.
  Bubbles drift upward throughout the composition. The palette is naturalistic
  and subdued — deep greens, sage, and sandy tones — giving the whole piece an
  underwater, dreamlike quality. Signed "Tati 2020 @tatunga" in the lower right
  corner. Painted for SHINE x Sea Walls 2020, sponsored by Ocean Conservancy,
  the mural highlights the fragile mangrove and manatee ecosystems of Florida's
  coast.

