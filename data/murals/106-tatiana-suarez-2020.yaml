artistBio: |
  Her mother is Brazilian. Her father is Salvadoran. The tropical palette of
  greens and yellows comes from both.

  Tatiana Suarez (also @tatunga) earned her BFA in Illustration and Design from
  the University of Miami in 2005. Her style is pop surrealism — ethereal
  feminine creatures with doe-eyes surrounded by dense flora, fauna, and
  underwater life. She is represented by Spoke Art in San Francisco and Corey
  Helford Gallery in Los Angeles, with mural representation through BA-Reps. Her
  work has shown at Thinkspace Projects and Wow x Wow.

  Her walls have gone up at Wynwood Walls (Miami), POW!WOW! Hawaii, Long Beach
  Walls, and festivals in Okinawa, Detroit, Mexico, and Sweden. Brand clients
  include Netflix, L'Oreal, Reebok, and JanSport.

  For SHINE 2020 — the festival's Sea Walls / PangeaSeed ocean conservation
  edition, sponsored by Ocean Conservancy — she painted "Mangroves and Manatees"
  wrapping the entire facade of the St. Petersburg Sailing Center. A young woman
  swims among Florida manatees with her hand resting on the largest one, schools
  of sheepshead fish to her right, mangrove leaves filling the edges. Signed
  "Tati 2020 @tatunga."

searchBio: |
  Her mother is Brazilian. Her father is Salvadoran. The tropical palette of
  greens and yellows comes from both.

  Tatiana Suarez (also @tatunga) lives and works in Miami. She received her BFA
  in illustration and design from the University of Miami in 2005, and has since
  become a mainstay in the world of pop surrealism and muralism. Her style
  centers on ethereal feminine creatures with oversized doe-eyes set against
  dense flora, fauna, and underwater life — pop surrealism with a tropical color
  register pulled from her Brazilian-Salvadoran upbringing.

  She has shown in galleries nationwide, with primary representation at Spoke
  Art in San Francisco and Corey Helford Gallery in Los Angeles. She is also
  rostered as a muralist with B&A (ba-reps.com), the international
  representation agency, alongside Will Barras, Bakpak Durden, Kitt Bennett,
  Ewok, Taj Francis, George Rose, Georgia Hill, INSA, Ornamental Conifer, Roids,
  Victor Reyes, and Vizie.

  Her brand and commercial collaborations include Netflix, L'Oreal, Reebok,
  Secret Deodorant, Olukai, JanSport, and Becks. She has logged mural locations
  across Okinawa, Hawaii, Detroit, Texas, Los Angeles, San Francisco,
  Cincinnati, Mexico, Sweden, and Miami's Wynwood Walls. The Wynwood Walls
  inclusion places her among the canonical roster of contemporary muralists
  associated with the Wynwood Arts District in Miami, the project founded by
  Tony Goldman in 2009 that turned the neighborhood's warehouse exteriors into a
  permanent open-air mural collection.

  For SHINE Mural Festival 2020 in St. Petersburg, Florida — the festival's Sea
  Walls / PangeaSeed Foundation ocean-conservation edition — she painted
  "Mangroves and Manatees" wrapping the entire facade of the St. Petersburg
  Sailing Center at 250 2nd Ave SE. The composition shows a young woman with
  flowing auburn hair swimming among Florida manatees, her hand resting gently
  on the largest one in the foreground; schools of striped sheepshead fish swim
  to her right, while teal mangrove leaves and sea plants fill the left side and
  edges. Bubbles drift upward through the composition. The palette is
  naturalistic and subdued — deep greens, sage, and sandy tones — giving the
  whole piece an underwater, dreamlike quality. Signed "Tati 2020 @tatunga" in
  the lower right corner. The mural was painted as part of the Sea Walls
  activation in St. Petersburg, the SHINE x PangeaSeed Foundation collaboration
  sponsored by Ocean Conservancy, focused on the fragile mangrove and manatee
  ecosystems of Florida's coast.

  Her practice spans large-scale public murals, gallery painting (oil on canvas,
  acrylic), and brand collaborations. She works in a recognizable visual
  vocabulary across all formats: large eyes, small mouths, downturned heads,
  jewel-toned skin tones, and dense botanical or aquatic surroundings. The
  figures often read as somewhere between portraiture and folkloric icon, with
  the surrounding flora rendered at a level of detail usually reserved for the
  face.

  Her work has been documented across the contemporary mural and pop-surrealism
  press, including Wow x Wow's artist-interview series and Miami Artzine's
  "Talking With Miami Artist Tatiana Suarez." She is also represented in Long
  Beach Walls (longbeachwalls.com) and POW!WOW! Hawaii participant rosters, and
  her gallery work appears on Artsy, Spoke Art, Corey Helford Gallery, GGA
  Gallery (ggagallery.com), and Thinkspace Projects.

  She is part of the broader Sea Walls / PangeaSeed lineage of artist-activists
  whose murals are staged to draw attention to ocean conservation issues —
  sea-level rise, marine biodiversity loss, mangrove ecosystem decline,
  fisheries collapse — through public art rather than text. The St. Pete Sailing
  Center placement was deliberate: the building sits on the downtown waterfront
  where the manatees she painted actually swim.

  Website: tatisuarez.com (sections for Murals, Gallery, About, Contact, Store).
  Instagram: @tatunga. Mural representation: B&A (ba-reps.com). Gallery
  representation: Spoke Art (San Francisco) and Corey Helford Gallery (Los
  Angeles).

searchMuralDescription: |
