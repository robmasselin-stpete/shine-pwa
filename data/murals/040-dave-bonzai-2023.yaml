artistBio: |
  He paints in chrome. No chrome paint — just black, white, and grey, layered
  until it looks like liquid metal.

  Dave Bonzai is from Southampton, England, now based in London. He has been
  doing street art for over twenty years. In 2016 he developed a technique he
  calls "Liquid Chrome" — hyper-realistic chrome effects created entirely with
  spray paint, incorporating reflections of the surrounding environment (buses,
  windows, buildings) for realism. One of those early pieces, "One Liquid
  Chrome," is in the permanent collection of the STRAAT Museum in Amsterdam.

  He has painted across the UK, Northern Ireland (Get Up Derry festival), and
  internationally. Clients include Triumph Motorcycles (a mural at their factory
  visitor experience in Hinckley) and Denham's House Guest Artist series. Nature
  runs through the chrome — animals and organic forms rendered in metallic
  illusion.

  For SHINE 2023, he painted "Sunshine City" at 1229 Central Avenue.

searchBio: |
  He paints in chrome. No chrome paint — just black, white, and grey, layered
  until it looks like liquid metal.

  Dave Bonzai is a street artist originally from the South Coast of England,
  specifically Southampton, who has spent many years based in London. Like many
  of his UK counterparts, he was influenced when hip hop first reached the UK,
  and he has been doing street art for over twenty years. Nature plays a big
  part in his pieces, and he takes photos wherever he goes to help shape his
  work — animals and organic forms rendered in metallic illusion run through his
  catalogue.

  In 2016 he developed the technique he calls "Liquid Chrome" — hyper-realistic
  chrome effect art created entirely with spray paint, with the ambition to
  create photo-realistic pieces. He has refined the craft over the years to
  achieve a high-end finish through a method of layering different colored
  paint, predominantly black, white, and grey. A key element in Bonzai's chrome
  street art is referencing his surroundings in the work itself: when he paints
  in London, if he knows the wall is on a bus route, he adds highlights of red
  to imitate the reflection of a bus, bringing the piece to life. The
  reflections of buildings, windows, and sky are folded into the chrome to
  imitate its natural reflective properties.

  One of his early Liquid Chrome pieces, "One Liquid Chrome" (2016), is in the
  permanent collection of the STRAAT Museum in Amsterdam at NDSM-Plein 1, 1033
  WC Amsterdam. Painted in spray paint on polyester, the piece displays the
  world map in the liquid chrome style, melting as if coated in chromium.
  According to the museum, the painting represents the artist's desire for
  equality, since we are all connected to one another and live on the same
  planet.

  In May 2023 he collaborated with Triumph Motorcycles on Triumph X Bonzai, a
  one-of-a-kind piece at the Triumph Factory Visitor Experience in Hinckley,
  created to celebrate the Triumph Chrome Collection. The mural was created
  entirely with spray paint over a two-day period and is described as an
  abstract interpretation of the Triumph chroming process — an explosion of
  liquid metal in predominantly black, white, and grey. He and Triumph went back
  and forth on initial designs, referencing the scale of the wall, until the
  design had the right flow and energy. Negative space was left toward the
  bottom of the mural so a Chrome Edition bike could be situated there; when
  photographed, the bike appears to come alive and become part of the artwork.
  He included reflections of the building's windows and the open blue sky in the
  piece. A Triumph X Bonzai film documents the work from start to finish on
  Triumph's YouTube channel. Bonzai has said, "This piece really captures the
  beauty and quality of the chrome that's on the bikes," and "I'm always
  interested in seeing the progression of certain artists and how they push the
  boundaries and for me I feel like the liquid Chrome is my way of doing it."

  He is represented among the artists working with Wood Street Walls in
  Walthamstow, East London, alongside ATM, ATMA, Axel Void, Bread Collective,
  Carl Cashman, Conor Harrington, Dale Grimshaw, Eelus, Elno, Fanakapan, Frankie
  Strand, HATCH, Invader, Irony, Jane Laurie, Lillylou, Louis Masai, Malarky,
  Marc Craig, Mark McClure, Maser, Mr Cenz, Phlegm, Remi Rough, Ronzo, Shok-1,
  Static, Teddy Baden, Toasters, and Xenz. His Wood Street Walls piece is
  located at the Ravenswood Industrial Estate, Walthamstow, E17 9HQ.

  Other clients and projects include Denham's House Guest Artist series. He has
  also painted at the Upside Gallery in Bournemouth, a series of eleven separate
  pieces created under an overpass and documented by Inspiring City. He has
  painted across the UK and Northern Ireland, including the Get Up Derry
  festival, as well as internationally.

  For SHINE 2023 in St. Petersburg, Florida, he painted "Sunshine City" at 1229
  Central Avenue, applying his Liquid Chrome technique to the Florida wall.

