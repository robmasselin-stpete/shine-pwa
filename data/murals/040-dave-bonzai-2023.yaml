searchMuralDescription: |
  A striking mural on the side of Cappa & Cappa on Central Avenue featuring the
  words "Sunshine City" in Bonzai's signature Liquid Chrome technique — the
  script lettering appears to be made of dripping, reflective molten metal,
  rendered entirely with spray paint in shades of silver, white, and grey. The
  chrome text floats over a tropical sunset scene of palm tree silhouettes
  against a gradient sky of deep purple, hot pink, and fiery red. A green
  geometric tree shape with horizontal stripes rises behind the lettering, and
  sharp diagonal lines in pink and white cut across the black background, giving
  the piece a retro synthwave energy. Signed "@DaBonzai" in the lower right
  corner. Bonzai described it as "a modern piece with a retro twist that the
  people of St Pete could relate to."

