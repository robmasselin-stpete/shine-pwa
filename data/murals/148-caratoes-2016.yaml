artistBio: |
  Two faces dissolve into waves and leaves on a grayscale wall. The only color
  is a single sweep of soft pink. That contradiction — black-and-white realism
  colliding with a slash of vibrant linework — is her signature.

  Cara To — Caratoes — was born and raised in Zottegem, a small Belgian village
  near Ghent, to Hong Kong immigrant parents. She studied two years of
  biochemistry, switched to game design, then took a post-production job at
  Wieden+Kennedy in Amsterdam. She discovered street art there in 2011, quit the
  agency a few years later, and moved to Hong Kong to dig into where her parents
  came from. She has been nomadic since 2013, with Hong Kong as her base.

  Her practice spans murals, metal sculptures, installations, wearable
  performance suits, and immersive environments. The STRAAT Museum in Amsterdam
  holds her "Untitled" (2016, spray and latex on polyester); she has shown at
  the Urban Nation Museum Berlin (Wall Poetry, 2015), painted at HKwalls Sham
  Shui Po (2016), Mural Festival Montreal, and Wide Open Walls Sacramento, and
  been featured in Juxtapoz and Hi-Fructose. Clients include Nike, Facebook,
  Four Seasons, and Tiger Beer (the Air-Ink campaign — ink made from
  air-pollution particles, painted on Tai Ping Shan Street in Sheung Wan).

  "Making a wall pretty isn't my sole responsibility," she has said. "It's also
  my chance to put a message on a wall for everyone to see in their own time."
  She painted SHINE 2016 (this wall) and returned for SHINE 2022.

searchBio: |
  Two faces dissolve into waves and leaves on a grayscale wall. The only color
  is a single sweep of soft pink. That contradiction — black-and-white realism
  colliding with a slash of vibrant linework — is her signature.

  Cara To — known professionally as Caratoes — is a Belgian-born street artist,
  illustrator, sculptor, costume designer, and immersive-art maker of Hong Kong
  descent. She was born and raised in Zottegem, a small Belgian village near
  Ghent, to Hong Kong immigrant parents. She studied two years of biochemistry
  before switching to game design at university, then took a post-production /
  3D-artist role at the Amsterdam office of advertising agency Wieden+Kennedy.
  She discovered street art in Amsterdam in 2011, quit the agency several years
  later to dig into her parents' homeland, and moved to Hong Kong as her base.
  She has been nomadic since 2013.

  Her practice spans large-scale murals, metal sculptures, installations,
  wearable performance suits, and immersive environments. The STRAAT Museum's
  curatorial note describes her work as a "fusion of fragmented realism and
  abstract shapes," with compositions balancing black-and-white realistic
  portraits against vibrant — often neon — juxtaposing linework. She
  self-describes as a "space designer who increases the beauty and serenity of a
  place with my artwork and a precise message." Her stated approach to
  commercial walls: "Making a wall pretty isn't my sole responsibility — it's
  also my chance to put a message on a wall for everyone to see in their own
  time." On gender bias: "I wanted to do things people say girls can't do."

  Documented mural and festival credits include HKwalls 2016 in Sham Shui Po,
  Hong Kong; Mural Festival Montreal; Wide Open Walls Sacramento; the Urban
  Nation "Wall Poetry — We Paint the Music, You Love to Hear" project (Berlin,
  September 30, 2015), pairing ten street artists with ten audio artists; the
  inaugural Urban Nation Museum opening (Berlin, 2017); and "Ode to Mother" in
  Reykjavik, Iceland. Her self-described count is 30-plus murals across 24
  locations including Bali and Iceland. The STRAAT Museum Amsterdam holds a 2016
  "Untitled" piece in spray and latex paint on polyester.

  Named commercial / brand projects include Nike, Facebook, Four Seasons, and
  Tiger Beer's Air-Ink campaign — a wall painted on Tai Ping Shan Street in
  Sheung Wan, Hong Kong, using ink manufactured from air-pollution particles.
  Press features include Juxtapoz, Hi-Fructose, the South China Morning Post (HK
  Magazine cover-style profile by Adrienne So, September 13, 2016, "Graffiti
  Artist Cara 'Caratoes' To on Materialism, Gender Bias and Repping Hong Kong
  Art"), Sassy Hong Kong's "That Girl: Caratoes" feature, and a Frankie Beane
  WordPress profile (May 21, 2015) describing her then-base in Zottegem, Belgium
  / Hong Kong.

  For SHINE Mural Festival 2016 in St. Petersburg, Florida, she painted at 2125
  1st Avenue South — a wide monochromatic wall with two surrealist female faces
  emerging from flowing organic forms (waves, leaves, curving lines), pale pink
  accents the only color in an otherwise grayscale palette of grays, whites, and
  blacks, geometric bridge-like structures and dashed road lines weaving through
  the organics. Signed "CARATOES" in the lower left. She returned for SHINE
  2022.

  Instagram: @caratoes. Website: caratoes.com.

searchMuralDescription: |
  A wide monochromatic mural spanning a concrete block wall. Two surrealist
  female faces emerge from flowing organic forms — the larger face on the right
  gazes forward with one visible eye, features dissolving into waves, leaves,
  and curving lines. The smaller face on the left peers out from behind swirling
  abstract shapes. Soft pink circles and a pale pink swooping curve on the left
  provide the only color against the otherwise grayscale palette of grays,
  whites, and blacks. Geometric elements — bridge-like structures, dashed road
  lines — weave through the organic forms. Signed "CARATOES" in the lower left.
  The wall shows weathering and graffiti tags near the door.

