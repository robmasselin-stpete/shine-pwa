artistBio: |
  He painted a T-Rex in a Hawaiian shirt going fishing — for AARP. That tells
  you most of what you need to know about Derek Donnelly.

  A Pinellas County native, Donnelly grew up in Pinellas Park, graduated from
  the Center for the Arts at Gibbs High School in 2001, and studied graphic
  design and digital illustration at IADT Tampa. He went full-time on murals in
  2010. A year later he opened Saint Paint Arts gallery on the 600 block of
  Central Avenue — not as a vanity project, but as a launchpad. Several artists
  got their first real exposure there before he closed it in 2014 to focus on
  walls.

  His style sits at the intersection of illustration and realism — playful
  without being childish, bold without being loud. His son shows up in
  murals across the city. So does Florida wildlife. He doesn't separate the
  personal from the public work. In 2012, when mentor Bill "Woo" Correira died,
  Donnelly organized the Woomorial — a 40-artist tribute mural on the 600 block
  that became a landmark. He founded COVE gallery in Pinellas Park and started
  Public Art Project Inc., a nonprofit that pushes public art into places it
  wouldn't otherwise reach.

  His client list runs from Fender Guitars to the Tampa Bay Rays. Multiple Best
  of the Bay wins. Inaugural Artmaker 2026 at Ruth Eckerd Hall. For SHINE 2025,
  he ran operations and served as artist liaison for the entire festival while
  producing two murals of his own.

  Here the wildlife takes the whole wall: green parakeets in flight over a
  sprouting plant whose roots run down through the soil to the sidewalk.

searchBio: |
  See Derek Donnelly entries (ids 5, 6, 115) for full search bio.

  This wall on Baum Ave N in the EDGE District shows green parakeets with pale
  grey faces flying across a sky-blue facade above a leafy plant, its roots
  spreading through a brown underground layer of soil, bones and buried
  creatures. Signed "Donnelly @saintpaintarts" at lower right.

searchMuralDescription: |
  The back of a two-storey building is painted sky blue across the upper floor.
  Four green parakeets with pale grey faces and blue-tipped wings fly across it,
  around the windows. In the middle, a tall green plant with broad heart-shaped
  leaves sprouts from a strip of grass. Below the grass line the lower floor is
  painted as brown underground soil: the plant's roots and long green tendrils
  run down through it, past buried bones, a bird skull and a small lizard
  skeleton, around the doors and boarded window. A tiny palm tree sits on the
  horizon at left. Signed "Donnelly @saintpaintarts" at lower right.

