  Their signature is oversized sunflower murals in vibrant color, plus
  community-participatory "color by number" walls. Florida wildlife — manatees,
  gators, birds — runs through a lot of the work. They were commissioned by the
  Florida Wildlife Corridor Foundation for a mural celebrating the state's
  ecological connectivity efforts.

  They are three-time SHINE artists (2020, 2022, 2023). For SHINE 2022 they
  painted "Wild Ride" at St. Petersbark on Central Avenue — a full-wall American
  alligator in rich browns against a field of golden sunflowers and teal sky.
  For SHINE 2020 they painted "Hands of Change" at the St. Petersburg City
  Theatre — hands holding sunflowers representing racial and cultural diversity.
  For SHINE 2023 they painted "Girl Power," a color-by-number mural completed by
  Girl Scouts of West Central Florida.

searchMuralDescription: |
  A full-wall painting of an American alligator in profile, stretching from
  snout to tail across the entire building. The gator is rendered in rich
  browns, tans, and dark chocolate with detailed scale texturing throughout.
  Behind it, oversized golden sunflowers on green stems fill the background
  against a teal sky. The composition makes the gator feel massive — its head
  alone takes up about a third of the wall. The color contrast between the warm
  gator tones and the cool teal background gives it a Florida postcard quality.

