artistBio: |
  The Happy Mural Project's first wall came with a sign: "Honk if You're Happy." It went up the week the world shut down.

  Alyssa Marie started The Happy Mural Project in 2020 and leads it. She is a fine artist from Colorado who moved to St. Petersburg in 2017 and ran a gallery on Beach Drive from 2018 to January 2020. She launched the project with Braden Everly, who brought house-painting experience, with a sunflower wall at Lolita's Catering in early March 2020, days before lockdown.

  The project's signature is oversized sunflower murals in vibrant color, plus
  community-participatory "color by number" walls. Wildlife runs through Alyssa Marie's work. The Florida Wildlife Corridor commissioned the project's SHINE 2022 wall.

  For SHINE 2022 the project led "Wild Ride," a paint-by-numbers wall at St. Petersbark on Central Avenue: a mother alligator with a baby alligator lying on her, in rich browns against golden sunflowers and teal sky. SHINE 2026 is Alyssa Marie's fourth festival, after 2020, 2022 and 2023.

searchBio: |
  The Happy Mural Project's first wall came with a sign: "Honk if You're Happy." It went up the week the world shut down.

  Alyssa Marie started The Happy Mural Project in 2020 and leads it. She is a fine artist from Colorado who moved to St. Petersburg in 2017 and ran a gallery on Beach Drive from 2018 to January 2020. She launched the project with Braden Everly, who brought house-painting experience, with a sunflower wall at Lolita's Catering in early March 2020, days before lockdown.

  The project's signature is oversized sunflower murals in vibrant color, plus
  community-participatory "color by number" walls. Wildlife runs through Alyssa Marie's work. The Florida Wildlife Corridor commissioned the project's SHINE 2022 wall.

  For SHINE 2022 the project led "Wild Ride," a paint-by-numbers wall at St. Petersbark on Central Avenue: a mother alligator with a baby alligator lying on her, in rich browns against golden sunflowers and teal sky.
  For SHINE 2020 the project painted "Hands of Change" at the St. Petersburg City
  Theatre — hands holding sunflowers representing racial and cultural diversity.
  For SHINE 2023 it painted "Girl Power," a color-by-number mural completed by Girl Scouts of West Central Florida. SHINE 2026 is Alyssa Marie's fourth festival, after 2020, 2022 and 2023.

searchMuralDescription: |
  A full-wall painting of an American alligator in profile, stretching from
  snout to tail across the entire building. The gator is rendered in rich
  browns, tans, and dark chocolate with detailed scale texturing throughout.
  Behind it, oversized golden sunflowers on green stems fill the background
  against a teal sky. The composition makes the gator feel massive — its head
  alone takes up about a third of the wall. The color contrast between the warm
  gator tones and the cool teal background gives it a Florida postcard quality.

