artistBio: |
  The alligators' skin was the big job on "Wild Ride": so many colors, in a
  camouflage pattern of numbered shapes. Filling it in was "like a magic
  trick," Alyssa Marie told the Tampa Bay Times, because "you don't really
  know what it's going to be until you fill in all the shapes."

  For SHINE 2022 her Happy Mural Project led the wall at St. Petersbark on
  Central Avenue, commissioned by the Florida Wildlife Corridor: a mother
  alligator with a baby lying on her, in rich browns against golden sunflowers
  and teal sky. Volunteers painted it by number.

  Wildlife is her subject in the studio too. She is an oil painter, and her
  SHINE artist record says her paintings start from animals she has met on her
  travels, each one a real encounter, painted to make people care about the
  creatures in them. She started The Happy Mural Project in 2020, after moving
  to St. Petersburg from Colorado in 2017. SHINE 2026 is her fourth festival,
  after 2020, 2022 and 2023.

searchBio: |
  The alligators' skin was the big job on "Wild Ride": so many colors, in a
  camouflage pattern of numbered shapes. Filling it in was "like a magic
  trick," Alyssa Marie told the Tampa Bay Times, because "you don't really
  know what it's going to be until you fill in all the shapes."

  For SHINE 2022 her Happy Mural Project led the wall at St. Petersbark on
  Central Avenue, commissioned by the Florida Wildlife Corridor: a mother
  alligator with a baby lying on her, in rich browns against golden sunflowers
  and teal sky. Volunteers painted it by number.

  Wildlife is her subject in the studio too. She is an oil painter, and her
  SHINE artist record says her paintings start from animals she has met on her
  travels, each one a real encounter, painted to make people care about the
  creatures in them. She started The Happy Mural Project in 2020, after moving
  to St. Petersburg from Colorado in 2017. SHINE 2026 is her fourth festival,
  after 2020, 2022 and 2023.

  The project began with sunflowers. Its first wall went up at Lolita's
  Catering in March 2020, days before the COVID-19 lockdown; she launched it
  with Braden Everly, who brought house-painting experience, and when
  distancing rules ruled out handing out flowers they put up a sign asking
  drivers to honk if they were happy. Its first paint-by-numbers wall was
  "Hands of Change" at the St. Petersburg City Theatre for SHINE 2020, hands
  holding sunflowers for racial and cultural diversity. For SHINE 2023 Girl
  Scouts of West Central Florida painted "Girl Power." Yellow flowers and
  butterflies, Fox 13 has noted, are a staple of her art.

searchMuralDescription: |
  A full-wall painting of an American alligator in profile, stretching from
  snout to tail across the entire building. The gator is rendered in rich
  browns, tans, and dark chocolate with detailed scale texturing throughout.
  Behind it, oversized golden sunflowers on green stems fill the background
  against a teal sky. The composition makes the gator feel massive — its head
  alone takes up about a third of the wall. The color contrast between the warm
  gator tones and the cool teal background gives it a Florida postcard quality.

