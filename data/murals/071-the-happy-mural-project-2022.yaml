artistBio: |
  The Happy Mural Project is a collaborative mural initiative founded and
  directed by Alyssa Marie Everly, a St. Pete-based artist who grew up in
  the Rocky Mountains of Colorado. She earned her BFA from Metropolitan
  State University of Denver before relocating to Florida. Alyssa designs
  the murals and organizes groups of artists to help execute them — the
  project brings together various painters to collaborate on large-scale
  public works. Her designs specialize in nature and wildlife subjects,
  taking realistic animal forms and setting them against stylized, slightly
  impressionistic backgrounds. She's been leading mural projects
  professionally since 2017 and has done work for clients across the U.S.
  and internationally. She was commissioned by the Florida Wildlife Corridor
  Foundation for a mural celebrating the state's ecological connectivity
  efforts. In St. Pete the project has become a go-to for Florida wildlife
  subjects — manatees, gators, birds, and marine life on walls around the
  city. The Happy Mural Project is a three-time SHINE participant, having
  painted walls for the festival in 2020, 2022, and 2023.

muralDescription: |
  A full-wall painting of an American alligator in profile, stretching from
  snout to tail across the entire building. The gator is rendered in rich
  browns, tans, and dark chocolate with detailed scale texturing throughout.
  Behind it, oversized golden sunflowers on green stems fill the background
  against a teal sky. The composition makes the gator feel massive — its
  head alone takes up about a third of the wall. The color contrast between
  the warm gator tones and the cool teal background gives it a Florida
  postcard quality.

