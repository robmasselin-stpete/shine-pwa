artistBio: |
  Three friends painted this at SHINE's first year in 2015. A decade later, a
  building covers most of it. The signatures are still there.

  The Ink Werkz Crew was Reid Jenkins, Scott Hillis, and Sovoth Chan — three St.
  Petersburg-based artists who painted together at the inaugural SHINE Mural
  Festival in late 2015. Their collaborative style leans into bold geometric
  forms, lightning-bolt linework, and saturated color blocks — a vocabulary that
  reads as graffiti-influenced public art.

  This wall at 1610 Central Avenue dates to the festival's first year. A new
  building was constructed directly in front of it, covering nearly all of the
  original artwork. What remains visible is the slice of blue, yellow, and white
  geometric work along the edge — and the crew's three Instagram tags
  (@reidjenkinsart, @hillis727, @duke_727) in the lower-left corner.

