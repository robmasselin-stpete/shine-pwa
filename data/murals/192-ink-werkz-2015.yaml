searchMuralDescription: |
  A geometric SHINE 2015 mural on the side of a Central Avenue commercial
  building, now mostly hidden behind a new building constructed directly in
  front of the wall. Only a slice of the original artwork is visible — layered
  blue tones (light blue base, navy mid-band, yellow zigzag at the top) overlaid
  with jagged white lightning-bolt linework — along with the crew's three
  Instagram handles (@duke_727, @hillis727, @reidjenkinsart) and a stylized
  signature in the lower-left corner. A SHINE Mural Festival sticker is affixed
  near the signage. The full composition was bold, graphic, graffiti-influenced
  public art.

