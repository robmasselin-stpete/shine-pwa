artistBio: |
  She has a degree in electrical engineering. She worked as a radio-frequency
  design engineer. Then she quit to paint.

  Carrie Jadus was born in 1976 in Tampa and moved to St. Petersburg at five.
  She graduated from the Pinellas County Center for the Arts at Gibbs High
  School, traveled to Europe, fell for Impressionism, and then — detour — earned
  a BS in Electrical Engineering from USF and designed RF circuits for several
  years. She creates 200 to 300 pieces annually, working primarily in oils at
  every scale from notecards to fifty-foot walls.

  Her SHINE 2015 Nikola Tesla portrait is on 22nd Street South. For Grand
  Central Brewhouse she painted "Last Call" — six musical icons chosen because
  "they're all extremely talented and socially conscious."

  This wall at Green Bench Brewing was produced by the Florida Wildlife
  Corridor Foundation, part of its statewide mural campaign, and sponsored by
  ARK Invest. Manatees, sunfish and an alligator drift through seagrass around
  a woman's face, while two tubers float overhead.

searchBio: |
  She has a degree in electrical engineering. She worked as a radio-frequency
  design engineer. Then she quit to paint.

  Carrie Jadus was born in 1976 in Tampa, FL. Her family moved to St. Petersburg
  when she was five. She comes from an artistic lineage — family populated with
  creatives. She attended the Pinellas County Center for the Arts magnet program
  at Gibbs High School, training across multiple mediums. A post-graduation trip
  to Europe sparked a fascination with Impressionism. She then earned a BS in
  Electrical Engineering from the University of South Florida and worked as a
  radio-frequency design engineer for several years before quitting to pursue
  art full-time.

  She works primarily in oils, comfortable at every scale from notecards to
  fifty-foot murals. She occupies "the rich and fertile ground between realism
  and impressionism" with a "distinctive, soft and subtly subversive style." Key
  influences: Winslow Homer (storytelling) and Egon Schiele (the human figure).
  She creates 200-300 pieces annually. She has expanded into large-scale
  sculpture through collaboration with MGA Sculpture Studio. Licensed as a
  professional artist since 2016, she uses "the business plan of a Toymaker as a
  model" — multiple product lines to sustain income.

  Her SHINE 2015 murals include the Nikola Tesla portrait at 22nd St S and 5th
  Ave S, painted over two weeks with an
  all-female crew — Tara Radosevich, Jules Cozine and Suzy Shultz, and "Little Miss
  Sisyphus," a girl pushing an enormous reflective sphere up a mountain. At
  Grand Central Brewhouse she painted "Last Call" (2020), a 50x30 ft mural of
  six musical icons: Bob Marley, Bono, Bruce Springsteen, Lady Gaga, Eddie
  Vedder, and John Legend — chosen because "they're all extremely talented and
  socially conscious." Heads roughly 8 ft tall, completed in three weeks,
  commissioned by Kevin Milkey. "Awakening Bodhisattva" at Dog Bar (2020) is a
  memorial to Bodhi, dog of artist Marianne Wysocki — a double entendre: the dog
  waking up, and the Buddhist concept of a being who delays nirvana out of
  compassion. Her studio is at Soft Water Studios in the Warehouse Arts District.

  This wall at Green Bench Brewing Company, 1133 Baum Ave N, was produced by the
  Florida Wildlife Corridor Foundation as part of its state-wide mural campaign,
  sponsored by ARK Invest, with Jenee Priebe / No Good Deeds Art as public art
  consultant (on-site sign). An underwater spring scene: manatees, striped fish
  and an alligator among seagrass around a woman's face, two tubers floating at
  the surface above. Instagram: @jadusfineart.

searchMuralDescription: |
  A long, low painted wall along the sidewalk, in blues, teals and purples. It
  shows an underwater spring scene seen from below the surface. A large woman's
  face sits at the centre, half hidden behind long ribbons of
  seagrass. Two manatees swim on the left. Striped sunfish-type fish swim across
  the middle, one placed so its eye lines up with the woman's eye. An alligator
  rests low on the right among the grasses. At the top right, two people float
  on inner tubes at the water's surface, seen from underneath. A sandwich-board
  sign at the left end credits the artist and the Florida Wildlife Corridor
  Foundation.

