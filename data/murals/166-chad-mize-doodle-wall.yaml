searchMuralDescription: |
  A teal wall packed edge to edge with hundreds of hand-drawn doodle icons in
  pink, blue, white, orange, and navy. The composition is a maximalist collage
  of Florida and pop culture imagery: flamingos, octopus, dolphins, sharks,
  jellyfish, a UFO, smiley faces, mushrooms, a VW bus, lightning bolts, pizza
  slices, anchors, palm trees, suns, moons, an all-seeing eye, a hot air
  balloon, starfish, seahorses, and countless other playful figures. Two windows
  and a white door are incorporated into the design. Signed "Mize" in the upper
  right. Small trees flank the base.

