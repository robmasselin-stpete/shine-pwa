artistBio: |
  He painted Tlaloc, the Aztec god of water and rain, as an offering — an
  ofrenda — to protect St. Petersburg from drought and storms.

  Daniel "R5" Barojas (also known as Rope5) is a Mexico-born muralist based in
  St. Petersburg. His work blends traditional cultures, ancient mythologies, and
  popular fables with urban influences — bold geometric patterns, vibrant color,
  sharp linework. The Tlaloc face on this wall — green-skinned with spiral eyes
  and a fanged mouth, framed by interlocking cube patterns and crashing ocean
  waves — is a representative example.

  He painted this wall for SHINE 2017. He went on to win the 2018 St. Pete Arts
  Alliance Individual Artist Award and a Creative Pinellas Emerging Artist
  Award. Signed "@R5Imaging."

searchMuralDescription: |
  A wide mural on the upper half of a two-story commercial building depicting
  Tlaloc, the Aztec god of fertility and rain. The central figure is a massive
  green-faced deity with spiral eyes, fanged mouth, and a golden crown or
  headdress, rendered in sharp geometric patterns. The face is framed by
  outstretched wing-like forms filled with interlocking cube patterns in coral,
  teal, and brown. Crashing ocean waves in deep blues and teals flank both
  sides. A teal hexagonal cube pattern fills the background. Signed "@R3Imaging"
  in the lower right. The palette is dominated by teal, coral, green, gold, and
  deep blue.

