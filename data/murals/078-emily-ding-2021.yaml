artistBio: |
  She draws inspiration from flora, fauna, and human temperament — wild
  creatures telling stories about emotions we recognize but cannot name.

  Emily Ding is based in Los Angeles and represented by Thinkspace Projects. Her
  expressive animals and figures are rendered in bold color gradients with a
  fluid, painterly style — acrylics on canvas, wood panels, and cradled wood.
  Recent Thinkspace gallery work runs through the same themes as her walls:
  pieces titled "Refuge," "Revival," "Resilience," "Rewilding," "Convalescent."

  She has painted murals in Shanghai, Salt Lake City, Sacramento, Washington DC,
  Oakland, Austin, Flint, Harrisburg, and Houston. She works with Street Art for
  Mankind, the nonprofit that uses public art to advance human rights and fight
  child trafficking.

  For SHINE 2021, she painted in St. Petersburg.

searchBio: |
  She draws inspiration from flora, fauna, and human temperament — wild
  creatures telling stories about emotions we recognize but cannot name.

  Emily Ding is an American muralist based in Los Angeles, California. Her
  large-scale work centers on expressive animals and figures, rendered through
  bold color gradients and a fluid, painterly style. The work resonates with the
  phenomena of the natural world, and she uses wild creatures and people as the
  vehicles for storytelling about emotion and experience.

  She is represented by Thinkspace Projects, the Los Angeles gallery at 4217 W.
  Jefferson Blvd., Los Angeles, CA 90016. Her studio practice is acrylic on
  canvas, acrylic on wood panel, and acrylic on cradled wood panel, in sizes
  ranging from small format pieces at 5 by 7 inches and 6 by 6 inches up to 24
  by 30 inch canvases. Recent and past works at Thinkspace include
  "Convalescent" (2025), a 24 by 30 inch acrylic on canvas shown in
  Extracurricular Activities and Stand Strong; "Rewilding" (2025), a 12 by 12
  inch acrylic on cradled wood panel shown in Extracurricular Activities and The
  Earth Laughs In Flowers; "Refuge" (2025), "Revival" (2025), and "Resilience"
  (2025), each a 16 by 20 inch acrylic on cradled wood panel in the EMPOWER
  show; "Sorry You're Dead" (2018), a 12 by 12 inch acrylic on wood panel shown
  in LAX / MSY and SCOPE MIAMI BEACH 2018; "Fire Spin" (2024), a 16 by 20 inch
  acrylic on wood shown in Nerdstalgia (Gallery IV); and "Flutter" (2025) and
  "Tiptoe" (2025), small format acrylic on wood panel pieces from SMOL 2.0
  (Gallery I).

  Her mural work has appeared across the United States and internationally. She
  has painted walls in Shanghai, Salt Lake City, Sacramento, Washington DC,
  Oakland, Austin, Flint, Harrisburg, and Houston. Her work can also be seen in
  China.

  She has worked with Street Art for Mankind, the nonprofit that uses street art
  to advance human rights and the fight against child trafficking. Street Art
  for Mankind organizes mural campaigns and art walks including Seattle World
  Cup 26, Los Angeles LA28 & Bigger Dreams, New York Climate Action, New York
  ILO100, New York Free Children, New York NRNY, Houston Big Art Bigger Change,
  Houston Legacies of Change, Houston World Cup 26, Houston I Choose to Rise,
  Houston John Biggers, Detroit Be the Change, USA Zero Hunger, France
  Impressionist Land, World Ecosystem Restoration, and World Generation
  Equality, and runs the BehindTheWall audio guide app.

  For SHINE 2021, she painted in St. Petersburg.

  Her website is emilyding.art, with sections for ABOUT, MURALS, PAINTINGS, and
  ORIGINALS. She can be followed on Instagram.

searchMuralDescription: |
  A young fawn sleeps curled in a gentle pose, its spotted fur rendered with
  painterly realism. White flowers bloom from the deer's back and around its
  body, growing up toward a window that's incorporated into the design. The deep
  emerald-green background gives the whole wall the feeling of a forest
  clearing. Emily Ding's signature is visible in the lower right.

