artistBio: |
  Their SHINE wall was the first public art project in the country funded by
  NOAA. It took over four hundred cans of spray paint and eight days.

  Jeremy Nichols — PlasticBirdie — was born in Tokyo in 1982, grew up in
  suburban Columbus, Ohio, and earned a BFA in Printmaking from Ohio State.
  Blaine Fontana was born in Seattle, raised on Bainbridge Island, and earned a
  BFA in Communication Art/Design from Otis College. Both are based in Portland,
  Oregon.

  Nichols paints the tension between urban growth and nature — layered graphic
  environments that feel familiar and not quite right at the same time. His
  clients include the Port of Portland (a mural in the PDX Airport pedestrian
  tunnel), Oregon Zoo, and Gerber Gear. Fontana works across murals, sculpture,
  fine art, and product design, drawing on Asian calligraphy, found objects, and
  graffiti palettes. His clients include Nike, adidas, Patagonia, TEDx, and
  VANS.

  For SHINE 2019 they collaborated on "The 8th Funky Fish Town" at Bama Sea
  Products on 28th Street South — a hundred-spray-paint mural spanning roughly
  twenty-five by a hundred and seventy-five feet along the Pinellas Trail,
  partnered with PangeaSeed Foundation's Sea Walls program and funded by NOAA.
  The piece highlights Florida's small fishery towns and ocean fragility,
  inspired by classic school-book infographics. It was the largest SHINE mural
  of 2019.

searchBio: |
  Their SHINE wall was the first public art project in the country funded by
  NOAA. It took over four hundred cans of spray paint and eight days.

  Jeremy Nichols — PlasticBirdie — was born in 1982 in Tokyo, Japan, grew up in
  the suburbs of Columbus, Ohio, and traveled regularly between upstate New York
  and Tokyo as a child. He earned a BFA in Printmaking from Ohio State
  University, studying under Charles Massey, Jr. and Philip von Rabbe. He moved
  to Portland, Oregon around 2009-2010. His work focuses on "the energy,
  movement, balance, and harmony of the chaos around us" — layered graphic
  design and nature elements exploring urban growth versus preserving nature,
  motivated by childhood displacement across cultures. He has been featured in
  Hi-Fructose magazine. Notable murals include "A Place We Call Home" in the PDX
  Airport North Pedestrian Tunnel (with Alex Chui, via Portland Street Art
  Alliance and Port of Portland), "Hello Bear!" at Groundwork Coffee in
  Portland, a mural celebrating historically significant Black women at the
  Black United Fund of Oregon (with Mehran Heard, 2014), and a wall at Plaza
  Walls in Oklahoma City (2019). Clients include Port of Portland, Oregon Zoo,
  Gerber Gear, Lexus, NW Natural, OMSI, and City of Tigard. Festivals include
  SHINE 2019, Forest for the Trees (Portland), and Canvas Miami.

  Blaine Fontana was born in Seattle, Washington, raised on Bainbridge Island,
  spent ten years in Los Angeles, and has lived in Portland for nearly twenty
  years. He earned a BFA in Communication Art/Design from Otis College of Art
  and Design (2002), receiving "Best in Show" for his senior thesis and later
  named one of seven distinguished Otis alumni (2000-2010). He worked as art
  director at Abound LLC, Metro.Pop magazine, and Drifter apparel before going
  self-employed in January 2003. He runs Fontana Studios with his wife. His
  multidisciplinary practice spans murals, fine art, illustration, graphic
  design, sculpture, installations, and furniture, drawing on Asian calligraphy,
  found objects, graffiti palettes, and wabi-sabi principles. Clients include
  Nike, adidas, Patagonia, TEDx, VANS, Quiksilver, Kid Robot, Upper Playground,
  Umpqua Bank, and Toyota. He has exhibited in New York, LA, Tokyo, London, and
  many other cities. He published the monograph "Amalgamate" through ZERO+
  Publishing (covering 2002-2006). Festivals include SHINE 2019, Forest for the
  Trees (Portland, 2013-2015), and Colorado Crush.

  For SHINE 2019 they collaborated on "The 8th Funky Fish Town" at Bama Sea
  Products, 756 28th St S, St. Petersburg — approximately 25 feet tall by 175
  feet wide, 100% spray paint, over 400 cans, completed in 8 days. It was the
  largest SHINE mural of 2019. The project was a partnership with PangeaSeed
  Foundation's Sea Walls: Artists for Oceans program and NOAA — the first public
  art project in the US funded by NOAA. The mural highlights small fishery towns
  of the Florida region and ocean fragility, inspired by "iconic infographics
  found in classic school books." The artists researched and visited local
  fisheries before painting. A panel discussion was held October 26, 2019 at The
  Factory St. Pete with PangeaSeed founder Tre' Packard, NOAA's Jeff Pulver, and
  Ocean Conservancy's Catherine Bruger.

  Instagram: @plasticbirdie, @blainefontana. Websites: plasticbirdie.com,
  thefontanastudios.com.

searchMuralDescription: |
  A massive mural spanning roughly twenty-five by a hundred and seventy-five
  feet along the Pinellas Trail at Bama Sea Products. A stylized bald eagle head
  dominates the right side — sharp blue eye and curved beak rendered in warm
  yellows, oranges, and teal with mosaic-like geometric patterning. The left
  side dissolves into abstract geometric triangles in teal, coral, mint,
  lavender, and white, creating a crystalline fractured effect that transitions
  from the figurative eagle into pure abstraction. The palette shifts from cool
  teals and mints to warm golds and corals. The piece highlights Florida fishery
  culture and ocean ecology through a graphic, infographic-inspired style. It
  was the largest SHINE mural of 2019.

