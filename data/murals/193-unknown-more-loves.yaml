artistBio: |
  Wall signed "Chris Dyer" but attribution unverified. No public source
  documents this wall as work by the visionary Peruvian-Canadian artist Chris
  Dyer (@chris_dyer, of Gulfport via Montreal and Lima), and the Tiki-totem
  style on this wall does not match his documented catalog. "Chris Dyer" is a
  common name; this may be a different artist by the same name, an early-career
  piece, or an imitation. Listed here as Unknown until the attribution can be
  confirmed.

searchBio: |
  Wall at 1628 Central Avenue, St. Petersburg. Signed "Chris Dyer" in pink
  graffiti lettering across the top, with "More Loves" hand-lettered in green
  across the bottom plinth. Attribution unverified — no public source
  (positivecreations.ca, FindMASA, SHINE Arts Alliance, The Gabber, Creative
  Pinellas, Wikipedia) documents this wall as work by the well-known visionary
  Peruvian-Canadian artist Chris Dyer (born Ottawa 1979, based in Gulfport since
  ~2022, @chris_dyer on Instagram). His documented St. Pete / Gulfport walls are
  different locations: the SHINE 2023 "sPEACEship" at 2875 7th Ave S, the
  Drunken Taco patio crocodile in Gulfport, and a piece at the Zaza Smoke Shop
  at 49th Street and 22nd Avenue South. The Tiki-totem style on this wall
  (skulls perched at the crown, third eye with rays, large teardrop eyes flanked
  by stars, lightning bolt down the bridge of the nose, wide-fanged mouth
  opening over a fiery heart in a pink-and-yellow halo, layered scrollwork in
  pink/yellow/green/blue/orange) does not match the visionary Chris Dyer's
  documented catalog. Could be a different artist by the same name, an
  early-career piece, or an imitation. Listed here as Unknown until confirmed —
  recommend DM-ing @chris_dyer directly for attribution.

searchMuralDescription: |
  A tall narrow mural on the side of a Central Avenue building, signed "Chris
  Dyer" in pink graffiti lettering across the top and "More Loves" in green
  hand-lettering across the bottom plinth. The composition centers on a totemic
  Tiki-style figure: two skulls perched at the crown, a third eye with rays at
  the forehead, two large teardrop-shaped eyes flanked by stars, a lightning
  bolt running down the bridge of the nose, and a wide-fanged mouth opening over
  a fiery heart suspended in a pink-and-yellow halo. Layered scrollwork in pink,
  yellow, green, blue, and orange surrounds the central figure. Painted on a
  pale-grey horizontal-plank wall.

