artistBio: |
  In 2010 she painted a 700-square-metre wall along the Berlin-Halle train line.
  It is likely the largest graffiti mural ever painted by a single person. She
  has broken her own record twice since.

  Claudia Walde — MadC — was born in 1980 in Bautzen, Germany and raised in
  Ethiopia. She studied at Burg Giebichenstein University of Art and Design,
  Central Saint Martins in London, and earned a master's in graphic design. Her
  style evolved from street lettering to transparent layered compositions in
  spray paint — including her own "Spectra" transparent paint.

  She has painted a control tower at Punta Cana airport, a permanent
  installation at the Hessisches Landesmuseum Darmstadt, and glass works with
  Maki and Associates architects. Her work appeared on a Deutsche Post stamp
  (2023). She has published four books. Clients include the Dulwich Picture
  Gallery in London, Mural Arts Philadelphia, the City of Abu Dhabi, and Wynwood
  Walls. For SHINE 2022, she painted in St. Petersburg.

searchBio: |
  In 2010 she painted a 700-square-metre wall along the Berlin-Halle train line.
  It is likely the largest graffiti mural ever painted by a single person. She
  has broken her own record twice since.

  Claudia Walde — MadC, nicknamed "The Mad One" for her radical approach to
  graffiti — was born in 1980 in Bautzen, Lusatia, Germany and raised in
  Ethiopia. She painted her first graffiti piece in 1996 at age sixteen. She
  studied at Burg Giebichenstein University of Art and Design in Halle and at
  Central Saint Martins College in London, and holds a master's degree in
  graphic design. She is based in Berlin and has worked in over 35 countries.

  Her early reputation came from burner walls with dynamic wildstyle pieces
  placed in detailed sceneries — themes drawn from fantasy and science fiction,
  including dragons and dinosaurs. Her tagging style cites Vincent Van Gogh and
  the late graffiti artist Dare (Siegfried von Koeding), with whom she
  collaborated on his piece Basel. She dedicated her own piece "6313 — Here to
  Stay" to Dare.

  The 700-Wall, painted in 2010 along the train line between Berlin and Halle,
  took four months to complete and is likely the largest graffiti mural created
  by a single person. She broke her own record in 2018 with the 1000-Wall in
  Chicago. Other large-scale walls include 500Wall in Leipzig (2013), the Chance
  Street Mural in Shoreditch, East London (2013), Le Mur Paris (2013), the
  Tahiti Mural (2014), and an 18-story mural in Jersey City (2019).

  After the 700-Wall, Walde shifted into abstract work characterized by
  transparent, glass-like layers and energetic calligraphic forms. The body of
  work appeared at Reflections at Kolly Gallery, Zurich (2014). She moved
  between street and studio practice, experimenting with Spectra transparent
  paint, ink, watercolor, acrylic paint, and acrylic markers on canvas, carton,
  and the cardboard of spray-paint boxes themselves. In 2022 she translated the
  visual language into NFTs with the generative project Color Rhythms, using
  machine learning to construct and title the compositions — published as a HENI
  Publishing book in 2023 (ISBN 978-1-912122-71-4).

  Recent commissioned work includes a permanent floor installation at the church
  of Saint-Martin in Limésy, France (completed 2025), painted to represent the
  souls who walked into the holy place; a floor-to-walls intervention at the
  Hessisches Landesmuseum Darmstadt, Germany (May 2024); and five permanent
  glass pieces at the Museum Reinhard Ernst in Germany, produced with Derix
  Glasstudios and Maki and Associates architects of Japan (2024). She painted a
  control tower at Punta Cana airport. Deutsche Post issued a stamp featuring
  her work in 2023. Since 2022 she has won Open Call competitions for artists in
  Germany and Spain. She also won the Art in Architecture commission to paint a
  bridge abutment in Magdeburg (Phase 1 finished 2022) and an Art in Public
  Space project at Schiller Gymnasium Königs Wusterhausen (August 2025).

  Other commissions include murals for Sinkka Museum in Finland, the Dulwich
  Picture Gallery in London, the Mural Arts Program in Philadelphia, the City of
  Abu Dhabi in the UAE, and Wynwood Walls. She participated in the Women's Forum
  Street Art Project, contributing "Little Red Riding Hood" (mixed media on
  canvas, 160 x 100 cm, 2014) representing Germany.

  Selected solo shows: Color Rhythms at HENI Gallery, London (2025); Thank God
  it's Friday at Cammann Studios, Chemnitz (2024); Returning Flow of Colors at
  GAOS Gallery Beijing (2023); Street to Canvas at HENI Gallery London
  (2021-2022); Goddess at GAOs Gallery, Taiyuan, China (2020); Inside/Outside at
  Brugier-Rigail, Paris (2019); Dialog at Brenners Park-Hotel, Baden-Baden
  (2019); Pink Power at Kolly Gallery, Zurich (2018); Rush Hour at Wallworks New
  York (2018); Southern Lights at Galerie Nicolas-Xavier, Montpellier (2018);
  Daydreaming at 44309 Gallery, Dortmund (2018); Home Sweet Home at Galerie
  Brugier-Rigail (2016); Kaleidoscope at Kolly Gallery, Zurich (2016); Bits and
  Pieces at Wallworks New York (2015); Night and Day at 44309 Gallery, Dortmund
  (2015); Character at Pure Evil Gallery, London (2015); MadABC at Pure Evil
  Gallery, London (2011); and Over the Edge at 1AM Gallery, San Francisco
  (2012).

  Selected group shows: Knotenpunkt at Affenfaust Galerie, Hamburg (2025); Field
  Day at Design Museum Chicago (2024); Wonderwalls at NRW-Forum, Düsseldorf
  (2022-2023); Next Wave at Fort Wayne Museum of Art (2022); Iconoclast at Miaja
  Gallery, Singapore (2019-2020); Conquête Urbaine at Musée des Beaux-Arts,
  Calais (2019); Calligraphy Now at the National Museum of Korea, Seoul (2018);
  Street Color at Institute Bernard Magrez, Bordeaux (2018); Searching for
  Surfaces at Vertical Gallery, Chicago (2017); For the Love of Freedom at
  Sinkka Museum, Kerava, Finland (2017); Urban Art Biennale at Völklinger Hütte
  (2017); Radius at Urban Nation, Berlin (2017); and the Marrakech Biennale
  (2016).

  Books authored as Claudia Walde: Sticker City — Paper Graffiti Art (Thames &
  Hudson, 2007); Street Fonts — Graffiti Alphabets From Around The World (Thames
  & Hudson, 2011), featuring work from 154 artists across 30 countries collected
  over two years of travel; Mural XXL (Thames & Hudson, 2015); MadC: Street to
  Canvas, monograph by Luisa Heese (HENI London, 2021); MadC: Color Rhythms
  (HENI London, 2023). She is featured in the 2021 documentary "Wir und die
  Kunst" by Milan Skrobanek.

  For SHINE 2022 she painted in St. Petersburg, Florida. Website: madc.tv.

searchMuralDescription: |
  A multi-story abstract mural on the side of an apartment building. Sweeping
  translucent ribbons of hot pink, cyan, orange, and white crisscross at sharp
  angles over a vivid yellow background. Where the color bands overlap they
  create new hues — purple where pink meets blue, warm peach where orange meets
  white. The effect is like looking through stacked sheets of colored glass.
  White paint splatter near the top right adds a calligraphic flourish.

