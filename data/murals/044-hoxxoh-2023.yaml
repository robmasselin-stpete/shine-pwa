artistBio: |
  HOXXOH is the working name of Douglas Hoekzema, a Miami-based artist known
  for massive abstract murals built around concentric rings, ripple patterns,
  and optical illusions. He studied architecture and double-majored in Art
  History and Painting before turning to mural work full-time. He started in
  graffiti and evolved into a style that's hard to categorize — part Op Art,
  part organic abstraction, with a heavy emphasis on movement and rhythm. His
  signature "RainBird" technique uses modified irrigation systems to apply
  paint in flowing, controlled patterns at enormous scale, creating hundreds
  of thin undulating lines that give his walls the illusion of three-
  dimensional depth and motion. He's painted major walls at Art Basel Miami,
  Wynwood Walls, and mural festivals across the Americas and Europe. This is
  his second SHINE mural — his first was in 2015. His pieces tend to be
  enormous, often spanning entire building facades, and they have a hypnotic
  quality that shifts depending on your viewing distance and angle. He was
  named an honorable mention in Miami New Times' MasterMind awards in 2016.

muralDescription: |
  A huge panoramic piece spanning the full length of the Morean Workshop
  building. Three birds in flight — likely roseate spoonbills or herons —
  are rendered in HOXXOH's signature black-and-white ripple-line technique,
  their bodies made up of dense, undulating wave patterns that give them an
  almost holographic shimmer. The birds soar across a luminous teal and
  aquamarine background that itself ripples with flowing white and dark
  streaks, making the entire wall feel like it's in motion. The scale is
  impressive — each bird spans a full story of the building. It reads as
  abstract pattern from a distance and resolves into recognizable bird forms
  as you get closer.

