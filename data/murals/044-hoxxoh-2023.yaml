artistBio: |
  "I'd rather be more like Diego Rivera than Banksy. I'm an artist; I'm a
  painter who sometimes paints murals."

  Douglas Hoekzema — HOXXOH — was born in 1980 in Boulder, Colorado and grew up
  in Fort Lauderdale. He started graffiti at fifteen. He earned a five-year
  degree in architecture with double majors in art history and painting, plus a
  philosophy minor, graduating in 2008. After school he worked at a
  salvaged-wood lumber mill while developing his spray technique behind a tattoo
  shop.

  His signature is massive-scale op-art — concentric circles, psychedelic
  spirals, logarithmic patterns executed freehand in spray paint. He also uses
  paint pendulums, garden sprinklers, and dust pans. His work is guided by
  sacred geometry and time. He joined Miami Style Graffiti crew around 2008 and
  now works from a studio in Little River, Miami.

  He painted a 135-foot mural on Miami's Arlo Hotel, walls across Wynwood and
  Overtown, and projects in Paris, Grenoble, New York, Philadelphia, Detroit,
  and Sacramento. He is a two-time SHINE artist — 2015 and 2023.

searchBio: |
  "I'd rather be more like Diego Rivera than Banksy. I'm an artist; I'm a
  painter who sometimes paints murals."

  Douglas Hoekzema — HOXXOH — was born in 1980 in Boulder, Colorado and moved to
  South Florida as a kid, growing up in Fort Lauderdale before relocating to
  Miami in 2008. He painted his first wall in high school in 1995 at age
  fifteen, with parents who supported his interest in art from the start and
  encouraged a balance between studio and public work. In 1999 architect Michael
  Krupnick selected him to paint a mural for a jazz club. He went on to earn a
  five-year degree in architecture with a double major in art history and
  painting and a minor in philosophy, graduating in 2008.

  When the real estate market crashed the year he graduated, his planned
  architecture career evaporated. He took a job at a lumber mill that worked
  with salvaged wood, spending a year there during the day and painting at night
  behind a friend's tattoo shop. That period is when he discovered the spray
  paint mark-making technique he still works with today and developed his
  interest in mark-making devices and mechanisms. Around 2008 he joined the
  Miami graffiti crew Miami Style Graffiti — also known as Miami Style God and
  MSG — where he describes himself as a "background guy" on big mural
  productions. His studio sits next to the train tracks in Little River, Miami,
  where freight trains passing remind him of using train sides as traveling
  canvases when he started in graffiti.

  His signature is large-scale op-art — concentric circles, psychedelic spirals,
  parabolic curves and logarithmic patterns executed freehand in spray paint.
  The curve technique uses a U-shape with half the cone of the paint; the can
  never touches the wall, all wrist. Beyond aerosol, he works with paint
  pendulums (a suspended one-liter bottle of paint anchored to the ceiling that
  produces spirals and parabolic curves), dust pans, trays, troughs, industrial
  airless paint sprayers, garden irrigation tools and sprinklers, and a
  hosepipe-and-sprinkler mechanism he coined "The RainBird." His practice is
  process-driven and experimental with a focus on technique, guided by sacred
  geometry and time, organizing chaos and finding the moment when a pattern
  slips out of it.

  Notable works include a 135-foot mural on the Arlo Hotel in Miami, completed
  by HOXXOH and a team of five over a little more than two weeks — his largest
  piece to date. The RainBird technique was christened in summer 2019 on a
  120-foot by 40-foot piece at the Jewish Health Centre in North Miami, painted
  with acrylic and an airless sprayer over two weeks. His psychedelic spirals
  appear on buildings throughout Wynwood and Overtown, and his murals reach
  Paris, Grenoble, New York, Philadelphia, Detroit, and Sacramento. Grenoble,
  Paris and Miami are his three favorite places to paint. His favorite spot in
  Miami is the Miami Marine Stadium, abandoned after Hurricane Andrew in 1992
  and converted by artists into an informal "wall of fame."

  He completed a month-long residency in Paris in February 2020 that produced
  the HOX.TRANSFER series, including HOX.TRANSFER 1.1 — selected for his 2021
  solo show at LoftDu34 in Paris and licensed to ARTXPUZZLES as a 12" x 16.5",
  285-piece jigsaw puzzle. ARTXPUZZLES, organized by Rachel Vancelette with
  Rachel Margolin from Underground, is a global initiative supporting artists
  through Artist Relief and the First Responder Children's Foundation during the
  COVID-19 pandemic; the roster also includes Banksy, Idris Khan, Marilyn
  Minter, and Donald Baechler. He has also released NFTs during the early stages
  of that market.

  In 2016 he received an Honorable Mention in the Miami New Times MasterMind
  Awards. He has shown with Wide Open Walls in Sacramento and is a two-time
  SHINE artist — Tampa Bay's St. Pete mural festival — in 2015 and 2023. Summer
  2023 trips included The Netherlands, Italy, and Hawaii. Has been a full-time
  practicing artist for the past decade-plus of a 25-year-and-counting career.

  He cites Futura 2000 as a foundational influence — the abstract street artist
  who blurred virtual reality and hyperrealism with a retro-futuristic twist and
  confirmed his approach to pictorial projection techniques. His other
  inspirations are nature, music, and the urban environment — the interplay of
  light and shadow, the movement of the wind, the pulse of city streets. He
  takes long hikes, kayaks, and camps to step away from horns, traffic, alarms,
  and footsteps, fascinated by the correlation between order and chaos in
  nature. Off the wall he spends time at home with his wife and dog, and brings
  family on the road when he can.

  He has a separate venture, HOXXOH Champagne, producing fully luminous
  champagne bottles — Hoxxoh Gold, Hoxxoh Ruby, Hoxxoh Grand Cru, and Hoxxoh
  Saphir Demi-Sec, plus the Hox cuvée line including HOX Grand Cru Blanc de
  Blancs 2014, HOX Grande Réserve, HOX Grande Réserve Blanc de Blancs and HOX
  Grande Réserve Rosé. The Saphir label includes a 0.45-carat sapphire cut in a
  champagne-drop shape. Best sommelier in the world Andreas Larsson endorsed the
  Grand Cru.

  Website: elhoxxoh.com and hoxxoh.com. Instagram: @hoxxoh. TikTok: @hoxxoh.

searchMuralDescription: |
  A huge panoramic piece spanning the full length of the Morean Workshop
  building. Three birds in flight — likely roseate spoonbills or herons — are
  rendered in HOXXOH's signature black-and-white ripple-line technique, their
  bodies made up of dense, undulating wave patterns that give them an almost
  holographic shimmer. The birds soar across a luminous teal and aquamarine
  background that itself ripples with flowing white and dark streaks, making the
  entire wall feel like it's in motion. The scale is impressive — each bird
  spans a full story of the building. It reads as abstract pattern from a
  distance and resolves into recognizable bird forms as you get closer.

