artistBio: |
  Out of 60 artists considered, a committee of Prince's family, friends and
  collaborators chose Hiero Veiga to paint the 100-foot Prince mural in
  downtown Minneapolis. The vote was unanimous.

  He grew up in Brockton, Massachusetts, and started spray painting at 12. "I
  started spray painting around 1999 after seeing somebody do it, and that
  same individual ended up teaching me how to paint," he says. He is
  self-taught. Graffiti, he says, "gave me a sense of purpose." No one could
  judge him on his looks or his hometown: "They could only judge my talent
  based on my work."

  Over two decades his work moved from graffiti writing to hyperrealism:
  portraits, natural scenery and psychedelic art. His recent backgrounds are
  abstract and kaleidoscopic, with Groucho glasses, chattering teeth and
  rubber ducks in them. His portrait subjects include Kobe Bryant, Muhammad
  Ali, Al Pacino and George Floyd. "My work is about honesty," he says. "It's
  about who I am."

  Through Pow Wow! Mural Festivals he painted a mural at the Bishop Museum in
  Honolulu, and in 2019 he painted part of the outside of Miami's Museum of
  Graffiti with Bacon and Quake. He works out of Florida, and his walls are in
  the United States, Jamaica and Canada.

  For SHINE 2026 he is one of fifteen artists in the festival's twelfth year,
  painting a wall at VIV.

searchBio: |
  Out of 60 artists considered, a committee of Prince's family, friends and
  collaborators chose Hiero Veiga to paint the 100-foot Prince mural in
  downtown Minneapolis. The vote was unanimous. The mural is on Ramp A, a
  parking garage at First Avenue and Eighth Street owned by the City of
  Minneapolis and the Minnesota Department of Transportation, and it faces the
  First Avenue nightclub. The idea started in 2015 with organizers Sharon
  Smith-Akinsanya and Joan Vorderbruggen. A committee narrowed 60 muralists to
  10 and then to 3 finalists, who interviewed with Prince's family and drew
  designs. All 16 committee members voted for Veiga. They had wanted an artist
  from a community of color who could do large-scale photorealistic portraits.
  "He understood that the mural needed to inspire and represent all walks of
  life," Smith-Akinsanya said. U.S. Bank, the Minnesota Twins, Target and Best
  Buy sponsored the half-million-dollar project, and the money raised also
  covers 30 years of upkeep. He started on May 16, 2022, and the mural was
  unveiled on June 2 at the Purple Block Party, as it neared completion. "It
  is an honor to be selected to paint the mural of Prince," he said. "I have
  worked my entire life for an opportunity like this."

  He comes from Brockton, Massachusetts, 24 miles south of Boston. He started
  painting graffiti at 12. "I started spray painting around 1999 after seeing
  somebody do it, and that same individual ended up teaching me how to paint,"
  he says. "No matter how bad I was, though, I loved it." He is self-taught.
  At Brockton High School he took darkroom photography. Graffiti "gave me a
  sense of purpose and an understanding that the world around me couldn't
  refuse me," he says. "They could only judge my talent based on my work."

  Over more than two decades with a spray can his work moved from graffiti
  writing to hyperrealism: portraits, natural scenery and psychedelic art. His
  recent work pairs abstract backgrounds and kaleidoscopic designs with
  Groucho glasses, chattering teeth and rubber ducks. He uses bold color and
  has a reason for it: "Colors are significant in the sense that they convey
  tone, plot, theories and ideas." His portrait subjects include Kobe Bryant,
  Muhammad Ali, Al Pacino and George Floyd. "My work is about honesty. It's
  about who I am. It's all I am."

  Through Pow Wow! Mural Festivals he painted a mural at the Bishop Museum in
  Honolulu. In 2019 he painted the outside of Miami's Museum of Graffiti in
  Wynwood with Bacon and Quake, one of more than a dozen murals on and around
  the building, curated by the museum's co-founder Alan Ket. With Quake he
  also painted a wall at Wynwood Walls. In Lynn, Massachusetts, he has painted
  for Beyond Walls at 1 Central Square. He works out of Florida, and his work
  is in streets, businesses and galleries in the United States, Jamaica and
  Canada.

  For SHINE 2026 he is one of fifteen artists in the festival's twelfth year,
  painting a wall at VIV.

