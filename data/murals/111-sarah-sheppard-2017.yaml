artistBio: |
  She studied metalsmithing to continue work her late father began. Art runs in
  the family — both her parents were artists.

  Sarah Sheppard grew up in Dallas, studied photography, drawing, painting,
  graphic design, ceramics, and fabric art at the University of North Texas, and
  has lived in St. Petersburg for over twelve years. She also trained in
  metalsmithing at the Creative Jewelry Academy.

  Her style is colorful, high-contrast figurative work — new romanticism,
  movement as metaphor for continuous loss and seeking. She started her mural
  career painting for a spa in St. Petersburg after earlier work in Venetian
  plaster and faux finishing for model homes. She has multiple SHINE murals
  across the city, including "Life Reimagined" on the back wall of the Morean
  Arts Center, commissioned by AARP.

  For SHINE 2023, she returned to paint in St. Petersburg.

searchBio: |
  She studied metalsmithing to continue work her late father began. Art runs in
  the family — both her parents were artists.

  Sarah Sheppard's father was her mother's art teacher in college, so as she has
  put it, her life as an artist started from conception. Art surrounded her
  growing up and dominated her attention in school and at home. She studied
  photography, drawing, painting, graphic design, ceramics, and fabric art at
  the University of North Texas — pretty much anything she could get her hands
  into. While in college she moved from Texas to Florida, where her parents were
  living, for a change of scenery during the housing market boom.

  Her parents helped her start her own business doing Venetian Plaster, Faux
  Finishing, and Murals in model homes, businesses, and residences. The work
  meant tight deadlines and 14-hour days, with the satisfaction of transforming
  sparse white rooms into spaces with character and ambiance. In 2008 she became
  pregnant with her son Sebastian, right as the economy started to slide. She
  did not want to be on scaffolding 20 feet in the air while pregnant, and the
  calls for work slowed anyway. She spent the next three years as a stay-at-home
  mom.

  When she returned to working life, she started part-time at Brew D'Licious,
  her favorite coffee shop in St. Petersburg, Florida. While working there she
  painted her first mural — for the spa across from the coffee shop. The wall
  was 30 feet long and 10 feet high, the biggest canvas she had ever worked on.
  She has since painted approximately 15 exterior murals as of her March 2019
  Voyage Houston interview.

  Her best-known St. Pete piece is "Life Reimagined" on the back wall of the
  Morean Arts Center at Central Avenue and Seventh Street. AARP and the Morean
  approached Sheppard in 2015 to create a mural responding to the themes of
  "Life Reimagined" and "Disrupt Aging." She built a narrative on the wall:
  gears representing the grind of daily life and the mechanics of the working
  world; the central figure rendered as a Banyan tree sinking and spreading
  roots into the community; and a Phoenix reaching outward to symbolize rebirth
  and the next stage of life. AARP framed its involvement as supporting the arts
  in Tampa Bay because a vibrant cultural life connects people to their
  community. Coverage by Julie Garisto in Creative Loafing Tampa Bay (September
  26, 2015) documented the piece.

  Sheppard moved back to Texas about two years before her March 2019 Voyage
  Houston interview but continued to paint murals in both states. Documented
  out-of-state work includes a large mural on Skull & Cakebones Vegan Craft
  Bakery in Dripping Springs, Texas. Around the same period she began working in
  metal — initially Jewelry 101 at the Creative Side Jewelry Academy to finish
  pieces her late father had given her, then continuing with further courses.
  Jewelry became, in her words, a new love. Both her painting and her jewelry
  tend toward large, statement-making pieces, with size and color doing the
  heavy lifting.

  Her style is colorful, high-contrast figurative work with elaborate narrative
  elements and rich color. She describes her aim as conveying a sense of beauty,
  romanticism, and mysticism. Personal artworks draw from her life events and
  the surrounding natural world, with motifs and symbolism pulled from various
  historical sources — sometimes mixed with modern touches in color or
  application. For client work, she focuses on what the business or home wants
  to communicate: commercial murals build around the brand message and visual
  attention to the building, while residential murals tend to be more personal.

  Sheppard has lived in St. Petersburg for over twelve years across her two
  stints in the city and has multiple SHINE Mural Festival pieces across St.
  Pete. For SHINE 2023, she returned to paint in St. Petersburg.

  Website: sarahsheppardsart.com. Instagram: @thee.divine.sarah. Facebook:
  theedivinesarah. Contact: 727.417.2687.

searchMuralDescription: |
  A mural on the back wall of the Morean Arts Center framed with a navy blue
  border and ornate gold trim, giving it the appearance of a steampunk painting.
  At center, a woman merges with a banyan tree — her body becoming the trunk,
  her roots spreading into the ground. She reaches out to a red phoenix bird at
  left, symbolizing rebirth. The right side features massive interlocking bronze
  and gold gears representing the passage of time and the mechanics of working
  life. Teal water fills the base. Commissioned by AARP as part of the "Age
  Friendly St. Pete" SHINE All Year program in 2017.

