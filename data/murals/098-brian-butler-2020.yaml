searchMuralDescription: |
  "Carbon Punishment" is a dual-wall environmental piece on the MUV Dispensary
  building addressing ocean acidification. Sea life is rendered in the colors of
  the pH spectrum — shells painted in acidic hues, riddled with polluted cracks
  and small skulls, illustrating how a carbon-saturated, acidifying ocean
  physically damages marine life. The lettering is a jagged, heavy typographic
  treatment that nods to Tampa Bay's death-metal heritage. Painted for SHINE
  2020 / PangeaSeed's Sea Walls: Artists for Oceans, the mural spans two walls of
  the single-story building at 1101 1st Ave N, and is paired with original
  grindcore music tracks composed to accompany it (the "enviro-METAL" concept).

