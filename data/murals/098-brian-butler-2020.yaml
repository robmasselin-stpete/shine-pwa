artistBio: |
  He drew over two thousand live concert performances from the audience. He
  calls the series "Show Drawn."

  Brian Butler is based in Miami. He studied at the Massachusetts College of Art
  and Design. His style is playful, illustrative, bold color — driven by music.
  He adapts to darker, grittier work for serious subjects. He founded The Miami
  Palmist independent music publication and toured colleges with Microsoft and
  Cut & Paste.

  Festival credits include SXSW, Bonnaroo, Governors Ball, Riot Fest, Ultra, and
  the Motorhead Motorboat. Clients include Vice, Target, Tumblr, Red Bull,
  Converse, the Miami Heat, Pabst Blue Ribbon, Vans, Live Nation, and Liquid
  Death. Music clients: Wu Tang Clan and The Mighty Mighty Bosstones.

  For SHINE 2020 / Sea Walls, he painted "Carbon Punishment" in the Edge
  District — an enviro-METAL multimedia project combining a mural with grindcore
  music tracks.

searchBio: |
  He drew over two thousand live concert performances from the audience. He
  calls the series "Show Drawn." The work has been exhibited at iiiPoints 2023,
  the Coral Springs Museum, and in the "Odd Cod" Cape Cod exhibition, and has
  been compiled into a Show Drawn 10 Year Book.

  Brian Butler is a Miami-based illustrator, muralist and designer. Before
  moving to South Florida he studied at the Massachusetts College of Art and
  Design. Early in his career he toured colleges across the country with
  Microsoft and Cut & Paste, a global design tournament, while simultaneously
  launching a parallel practice as a muralist and illustrator. His style is
  playful, illustrative, bold color and music-driven; he adapts to darker,
  grittier work for serious subjects.

  Butler founded and spearheaded The Miami Palmist, an independent music
  publication, and has organized group exhibitions and consulted on
  artist-driven activations led by major brands and agencies. His studio
  operates as Upper Hand Art Studio, reachable at BrianButler@upperhandart.com.

  Festival illustration credits include SXSW, Bonnaroo, Governors Ball, Riot
  Fest, Ultra, the Motorhead Motorboat, Levitate Music Festival, III Points, and
  Wigwood. Brand and commercial clients include Vice, Target, Tumblr, Red Bull,
  Converse, Superfly, the Miami Heat, Pabst Blue Ribbon, Vans, Live Nation,
  Liquid Death, Heineken, Shake Shack, Sesame Street, Lenovo, Girl Skateboards,
  Shoe Palace, McCann Worldgroup, and the Los Angeles Football Club. Music
  clients include the Wu Tang Clan and The Mighty Mighty Bosstones, with
  additional projects for Tove Lo, Pearl Jam (gigposter mural), New Found
  Glory's "Makes Me Sick," Gouge Away (for Vans), Erick the Architect, GZA
  (album art), and Little Dragon (with Tumblr IRL).

  For SHINE 2020 / Sea Walls he painted "Carbon Punishment" in the Edge
  District, an enviro-METAL multimedia project combining a mural with grindcore
  music tracks. Aventura Mall holds his mural "Paradise and Fries," located near
  the Treats Food Hall.

  Other named projects and walls include i.d. Show Drawn; a Tattoo Mural; Secret
  Project x III Points; Space Park; work at Felix Varela Senior High with
  BAGHEAD; OVER UNDER; POW WOW Hawaii with BAGHEAD; SHELVIS PAINTING; MIAMI
  ROADSIDE DRAWING; an Interactive Mural at III Points; Atlanta painting;
  Detroit painting; Miami Palmist Concert Flyers; a Colombia Zine; an AR / 3D
  Residency at Montserrat College of Art; a Seinfeld Mural; Target Miami; the
  Miami Heat work; Small Press Fair; Shake Shack at Aventura Mall; Flagler St
  for Art Basel 2017; Denver Crush Walls with BAGHEAD; POW WOW Worcester;
  Heineken's Restoring Miami Marine Stadium; RBSS – 3 Days in Miami; Parts
  Unknown – Flag Show; Secret Walls; Blacklight Mini Golf Poster; a Puerto Rico
  project; an NTL CRU mural; Dirty Decks at LIV Miami; United States of Bass:
  Miami; the Shoe Palace HQ mural in San Jose; a Carol City Middle School mural;
  a Paraguay Zine; Gigi's; the III Points Mural; Converse Rubber Tracks Live
  Boston; the McCann Worldgroup work; the Duck Show in LA; Miami Beach Pabst
  Mural; the Double Vision Concert Art Exhibit; a Tokyo / Bangkok Zine; and "GET
  LOST OPENING." His work has been featured in Juxtapoz, Summer 2019.

