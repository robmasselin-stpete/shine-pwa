searchMuralDescription: |
  A stencilled black-and-white mural of 1960s fashion icon Twiggy's face in the
  alley behind the 600 block of Central Avenue. The image references the iconic
  1966 photograph by Barry Lategan, showing Twiggy's signature doe eyes with
  stars, rendered with an iridescent sheen against a faded light blue wall. The
  deliberately muted, pastel-hued palette contrasts with the bolder murals in
  the surrounding area.

