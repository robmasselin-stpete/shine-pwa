artistBio: |
  CHAD MIZE is a multimedia artist, designer and curator residing in St.
  Petersburg, Florida. He was born in New Orleans, Louisiana in 1974, and then
  moved to Tampa Bay Florida, where he spent most of his childhood. An early
  interest in art resulted in his earning a BFA in Visual Communications at
  the University of Mississippi.

  His early career included drawing caricature portraits at Faneuil Hall in
  Boston and illustrating Flash animations for a digital textbook company in
  the late 1990s. In 2003, MIZE moved to St. Petersburg, FL and has been
  championing the Tampa Bay art scene ever since.

  MIZE created the "Paris/Tokyo/London/St. Pete" shirt in 2010. After 16
  years, it is still selling in local shops, popular among both locals and
  tourists.

  MIZE co-founded BLUELUCY gallery on Central Avenue in 2010 (representing
  450-plus artists before closing in 2015).

  In 2018, Mize opened the gallery MIZE in the Historic Uptown neighborhood of
  St Petersburg. Following the closing of MIZE in 2022 he set his sights on a
  larger gallery project entitled SPACE. Currently he is curating exhibits
  throughout Tampa Bay at various venues.

  He served on SHINE's organizing committee for a decade (2015-2025).

  With a love for past and contemporary culture, he takes a humorous,
  tongue-in-cheek approach to his designs, which include playful doodles,
  colorful patterns, political art and graphics with text.

  Mize's client list has included Aids Healthcare Foundation, The Dali Museum,
  Facebook, COACH, NUTRL, Tampa Bay Lightning, Tampa Bay Rays, Sprouts, Kahwa,
  Busch Gardens, The Vinoy Hotel, and JW Marriott.

  Mize's work is held in numerous private and corporate collections nationally
  and internationally.

searchBio: |
  He created the "Paris/Tokyo/London/St. Pete" shirt in 2010. It is still
  everywhere. Chad Mize was born in 1974 in New Orleans, Louisiana, and spent
  most of his childhood in Tampa Bay — raised in Bradenton, south of St.
  Petersburg, where family trips to the Dali Museum and Jannus Live first hooked
  him on the area. He earned a BFA in Visual Communications from the University
  of Mississippi (Ole Miss), near Oxford, Mississippi, then moved to Boston in
  his twenties. There he drew sidewalk character portraits in front of Faneuil
  Hall, an unpolished gig that laid the groundwork for the improvisational style
  he still uses. In 1998 he took a job as an illustrator for a digital textbook
  company, building Flash animations for educational content. Laid off a week
  before 9/11, he pivoted, co-founding the creative studio Bluelucy with partner
  Phillip Clark and moving back to Florida. He considered Sarasota but chose St.
  Petersburg in 2003, reasoning that any small city supporting a world-class
  institution like the Dali Museum had room for more.

  In the early 2000s St. Pete had few galleries or open downtown businesses, but
  the renaissance was beginning. Mize was part of the warehouse-party scene with
  the Vitale Brothers, alongside a regular cast of artists and dreamers.
  Galleries opened along Central Avenue — Craftsman House, Shapiro's, Davidson
  Fine Art — and in 2009 the 600 block became a hub for artist-run shops.
  Bluelucy, at 653 Central Avenue, thrived there. Some of the city's first
  murals were painted by Mize behind Bluelucy, including the iconic "Twiggy" and
  "Mr. Sun" images, both of which still remain (partially obscured by later
  upgrades). Bluelucy hosted monthly themed exhibitions featuring dozens,
  sometimes more than a hundred, local artists, representing 450-plus artists in
  total before closing in 2014/2015 due to rising rents.

  In 2010 Mize met his now-husband Dan Schmidt, and on a trip spotted a
  "Paris/Tokyo/London/Torrance" shirt that inspired his "Paris/Tokyo/London/St.
  Pete" version — a design now seen on sidewalks and in shops across the city.
  In 2015 he was asked to help launch the brand-new SHINE Mural Festival,
  coordinating closely with director Jenee Priebe and serving on the organizing
  committee for six-plus years. He has personally painted over 120 murals,
  mostly in Tampa Bay but also in Miami and other cities. In 2018 he opened MIZE
  Gallery in the Historic Uptown neighborhood on MLK Jr. Street, running monthly
  exhibitions of Bay Area talent for five years and adapting with virtual shows
  and online sales during the pandemic. After MIZE closed in 2022, he opened
  SPACE Gallery in 2023 in a former PSTA bus depot on south 28th Street, hosting
  boisterous performance-and-art nights with Bay-area stalwarts including Bask,
  Zulu Painter, the Vitale Brothers, IBOMBS, Frank Strunk III, and Andrea
  Pawlisz, who collaborated closely with him at both SPACE and MIZE Gallery. The
  city objected to the large gatherings and SPACE shuttered after a few shows.
  He now curates art pop-ups at Green Bench Brewery and runs "Side Spot," a
  mini-gallery next to his husband Dan's restaurant Uptown Eats. He also helped
  start the St. Pete Shuffle in 2005.

  His client list includes AIDS Healthcare Foundation, The Dali Museum, COACH,
  NUTRL, Tampa Bay Lightning, Tampa Bay Rays, Sprouts, Kahwa, Busch Gardens, The
  Vinoy Hotel, and JW Marriott. His unmistakable cartoon-like imagery — playful
  doodles, colorful patterns, political art, graphics with text, commentary on
  politics, religion and contemporary culture — has appeared on Coach bags,
  paddle-ball rackets, t-shirts and walls across the city. Recent and current
  mural work includes University Town Center in Sarasota (2026), AIDS Healthcare
  Foundation in St. Petersburg (2025), Fit 2 Run in St. Petersburg (2025), IMG
  Academy in Bradenton (2025), The Factory in St. Petersburg (2025), the St.
  Pete Pier (2025), the Troyer Residence (2025), the Dali Museum (2025), 821
  16th Street N in St. Petersburg (2025), the Jackson Residence (2025), The
  Adderley in Ft. Lauderdale (2025), the Antoinette Residence (2025), the
  Gibson/DeSomery Residence (2025), Wyndham Grand Clearwater Beach (2024), the
  Wagner Residence (2024), Creative Contractors in Clearwater (2024), Element in
  Tampa (2024), and the NUTRL x Hollander Hotel collaboration in St. Petersburg
  (2024). His work is held in private and corporate collections nationally and
  internationally.

  In 2025 he is a featured artist at the James Museum, displaying work in the
  stone entry canyon, and was included in "Outside In: New Murals Inspired by
  Dali" at the Dali Museum, opening May 24, 2025 — a show featuring twelve
  former SHINE mural artists painting inside the museum walls. Keith Haring is a
  stated influence; Mize visited Haring's Pop Shop in New York as a kid and
  embraces Haring's belief that art should be accessible. His mantra is "make
  time," and he credits a year of saying yes to everything with pushing his
  career forward. The Artisan Magazine, in an April 2025 cover story by Robin
  O'Dell, called him "St. Pete's Godfather of Art." Contact: info@chadmize.com,
  727-251-8529, chadmize.com.

