<!doctype html><html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Mural Quest — Progress Capture</title>
<style>
 :root{--teal:#0E918C;--teal-dark:#0A706C;--bg:#111;--panel:#1c1c1e;}
 *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
 body{margin:0;font:15px/1.4 -apple-system,Helvetica,Arial,sans-serif;background:var(--bg);color:#eee}
 header{padding:10px 14px;background:#000;display:flex;align-items:center;gap:10px}
 header h1{font-size:16px;margin:0;font-weight:700}
 header .v{font-size:11px;color:#666;margin-left:auto}
 .wrap{padding:12px;max-width:640px;margin:0 auto}
 label{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:#888;display:block;margin:12px 0 4px}
 select,input[type=text],input[type=date]{width:100%;padding:10px;border-radius:8px;border:1px solid #333;background:var(--panel);color:#eee;font-size:15px}
 .row{display:flex;gap:8px;align-items:center}
 .chk{display:flex;align-items:center;gap:6px;font-size:13px;color:#aaa;margin-top:8px}
 button{font:15px inherit;padding:11px 16px;border-radius:9px;border:none;background:var(--teal);color:#fff;font-weight:600;cursor:pointer}
 button.sec{background:#333;color:#eee}
 button:disabled{opacity:.4}
 .stage{position:relative;width:100%;aspect-ratio:4/3;background:#000;border-radius:12px;overflow:hidden;margin-top:12px}
 .stage video,.stage img,.stage canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
 .ghost{pointer-events:none}
 .grid{position:absolute;inset:0;pointer-events:none;
   background-image:linear-gradient(rgba(255,255,255,.25) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.25) 1px,transparent 1px);
   background-size:33.33% 33.33%}
 .opacity-row{display:flex;align-items:center;gap:10px;margin-top:10px}
 .opacity-row input[type=range]{flex:1}
 .actions{display:flex;gap:10px;margin-top:12px}
 .actions button{flex:1}
 .hint{font-size:12px;color:#888;margin-top:8px}
 .out{background:var(--panel);border:1px solid #333;border-radius:10px;padding:12px;margin-top:12px;font:12px ui-monospace,Menlo,monospace;white-space:pre-wrap;color:#cfe}
 .badge{display:inline-block;background:var(--teal);color:#fff;font-size:11px;font-weight:700;border-radius:10px;padding:2px 8px;margin-left:6px;text-transform:uppercase}
 .err{background:#3a1f1f;border:1px solid #a33;color:#fbb;padding:10px;border-radius:8px;margin-top:10px;font-size:13px}
 .cap-row{margin-top:12px}
 .cap-row label{display:block;font-size:12px;color:#888;margin-bottom:4px}
 .cap-count{float:right;font-size:11px;color:#666;font-variant-numeric:tabular-nums}
 .cap-count.over{color:#f88;font-weight:700}
 .hidden{display:none}
</style></head><body>
<header><h1>Progress Capture</h1><span class="v">v2 · sends over OTA</span></header>
<div class="wrap">

  <label>Mural</label>
  <select id="mural"><option value="">Loading…</option></select>
  <div class="chk"><input type="checkbox" id="uc-only"> <label style="margin:0;text-transform:none;letter-spacing:0;color:#aaa">Under-construction only</label></div>

  <label>Date taken</label>
  <input type="date" id="date">

  <div id="ref-info" class="hint"></div>

  <!-- Camera / capture stage -->
  <div class="stage" id="stage">
    <video id="video" playsinline autoplay muted class="hidden"></video>
    <img id="ghost" class="ghost hidden" alt="">
    <canvas id="canvas" class="hidden"></canvas>
    <div class="grid hidden" id="grid"></div>
  </div>

  <div class="opacity-row hidden" id="opacity-row">
    <span style="font-size:12px;color:#888">Align overlay</span>
    <input type="range" id="opacity" min="0" max="100" value="45">
    <span class="chk" style="margin:0"><input type="checkbox" id="grid-toggle" checked> grid</span>
  </div>

  <div class="cap-row hidden" id="cap-row">
    <label for="caption">Caption <span class="cap-count" id="cap-count">0/140</span></label>
    <input type="text" id="caption" maxlength="140" placeholder="Optional — e.g. Outlines up">
    <span class="chk" style="margin-top:8px"><input type="checkbox" id="to-photos" checked> Offer a full-size copy for Photos after sending</span>
  </div>

  <div class="actions">
    <button id="start" class="sec">Start camera</button>
    <button id="shoot" class="hidden">● Capture</button>
    <button id="retake" class="sec hidden">Retake</button>
    <button id="send" class="hidden">Send to app</button>
    <button id="dl" class="sec hidden">Download</button>
  </div>

  <div id="err" class="err hidden"></div>
  <div id="out" class="out hidden"></div>
</div>

<script type="module">
const CDN = 'https://cdn.muralquest.app';
const $ = id => document.getElementById(id);
let murals = [], current = null, refImg = null, capturedBlob = null, fullBytes = null;

// ── today's date default (browser Date is fine here) ──
$('date').value = new Date().toISOString().slice(0,10);

// ── load live murals from the CDN manifest ──
(async () => {
  try {
    const c = await (await fetch(CDN + '/content.json', {cache:'no-store'})).json();
    murals = c.murals || [];
    renderList();
  } catch (e) { showErr('Could not load murals from the CDN: ' + e.message); }
})();

// live caption counter — maxlength caps typing, this makes the limit visible
$('caption').addEventListener('input', () => {
  const n = [...$('caption').value].length;
  const el = $('cap-count');
  el.textContent = n + '/140';
  el.classList.toggle('over', n >= 140);
});

$('uc-only').addEventListener('change', renderList);
function renderList(){
  const ucOnly = $('uc-only').checked;
  let list = murals.filter(m => !ucOnly || m.uc);
  list.sort((a,b)=> (b.uc?1:0)-(a.uc?1:0) || a.id-b.id);
  const sel = $('mural');
  sel.innerHTML = '<option value="">— pick a mural —</option>' +
    list.map(m => `<option value="${m.id}">#${m.id} ${m.a}${m.uc?' — being painted':''}${m.t?' · '+m.t:''}</option>`).join('');
}

$('mural').addEventListener('change', () => {
  current = murals.find(m => String(m.id) === $('mural').value) || null;
  refImg = null;
  if (!current) { $('ref-info').textContent=''; setGhost(''); return; }
  // Reference = latest progress photo, else the mural's img — for onion-skin alignment.
  const ph = current.ph || [];
  const refU = ph.length ? ph[ph.length-1].u : current.img;
  refImg = refU ? (refU.startsWith('http') ? refU : CDN + '/' + refU) : '';
  const n = ph.length;
  $('ref-info').innerHTML = n
    ? `Aligning to the most recent of <b>${n}</b> photo(s)` + (ph[n-1].d?` (${ph[n-1].d})`:'') + `. This will be photo #${n+1}.`
    : `No progress photos yet — aligning to the mural's base image. This will be the <b>first</b> photo.`;
  setGhost(refImg);
});

function setGhost(url){
  const g = $('ghost');
  if (url) { g.src = url; } else { g.removeAttribute('src'); g.classList.add('hidden'); }
}

// ── camera ──
let stream = null;
$('start').addEventListener('click', async () => {
  if (!current) { showErr('Pick a mural first.'); return; }
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video:{ facingMode:'environment', width:{ideal:3840}, height:{ideal:2160} }, audio:false });
    const v = $('video'); v.srcObject = stream; await v.play();
    v.classList.remove('hidden');
    if (refImg){ $('ghost').classList.remove('hidden'); $('opacity-row').classList.remove('hidden'); applyOpacity(); }
    $('grid').classList.toggle('hidden', !$('grid-toggle').checked);
    $('start').classList.add('hidden'); $('shoot').classList.remove('hidden');
    hideErr();
  } catch (e) { showErr('Camera error: ' + e.message + ' (allow camera access; must be https).'); }
});

$('opacity').addEventListener('input', applyOpacity);
function applyOpacity(){ $('ghost').style.opacity = $('opacity').value/100; }
$('grid-toggle').addEventListener('change', () => $('grid').classList.toggle('hidden', !$('grid-toggle').checked || $('canvas').classList.contains('hidden') && $('video').classList.contains('hidden')));

// ── capture location (a hint for the pin; the server never moves the pin itself) ──
let captureFix = null;
function grabFix(){
  captureFix = null;
  if (!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(
    p => { captureFix = { lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy }; },
    () => {}, { enableHighAccuracy: true, timeout: 10000, maximumAge: 15000 });
}
function metersBetween(a1, o1, a2, o2){
  const R = 6371000, r = Math.PI/180, dA = (a2-a1)*r, dO = (o2-o1)*r;
  const h = Math.sin(dA/2)**2 + Math.cos(a1*r)*Math.cos(a2*r)*Math.sin(dO/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}

// ── capture ──
$('shoot').addEventListener('click', () => {
  grabFix();
  const v = $('video'), cv = $('canvas');
  const vw = v.videoWidth, vh = v.videoHeight;
  // crop the video's centre to the 4:3 stage, then downscale to <=1280 long edge
  const targetAR = 4/3, vAR = vw/vh;
  let sx=0, sy=0, sw=vw, sh=vh;
  if (vAR > targetAR){ sw = vh*targetAR; sx=(vw-sw)/2; } else { sh = vw/targetAR; sy=(vh-sh)/2; }
  let ow = sw, oh = sh, MAX=1600;
  if (Math.max(ow,oh) > MAX){ const s = MAX/Math.max(ow,oh); ow=Math.round(ow*s); oh=Math.round(oh*s); }
  cv.width=ow; cv.height=oh;
  cv.getContext('2d').drawImage(v, sx,sy,sw,sh, 0,0,ow,oh);
  cv.classList.remove('hidden'); v.classList.add('hidden');
  $('shoot').classList.add('hidden');
  $('retake').classList.remove('hidden'); $('send').classList.remove('hidden'); $('dl').classList.remove('hidden');
  $('cap-row').classList.remove('hidden');
  // keep ghost on top so you can verify alignment
  cv.toBlob(b => capturedBlob = b, 'image/jpeg', 0.92);
  // Full-size copy for Photos: same 4:3 crop, no downscale. Kept as bytes so Send can
  // open the share sheet straight away (iOS needs the tap; an await first would lose it).
  fullBytes = null;
  const fc = document.createElement('canvas'); fc.width = Math.round(sw); fc.height = Math.round(sh);
  fc.getContext('2d').drawImage(v, sx,sy,sw,sh, 0,0,fc.width,fc.height);
  fc.toBlob(b => b && b.arrayBuffer().then(a => { fullBytes = new Uint8Array(a); }), 'image/jpeg', 0.92);
});

$('retake').addEventListener('click', () => {
  $('canvas').classList.add('hidden'); $('video').classList.remove('hidden');
  $('retake').classList.add('hidden'); $('send').classList.add('hidden'); $('dl').classList.add('hidden');
  $('cap-row').classList.add('hidden');
  document.querySelectorAll('.fix-caption, .rm-photo').forEach(b => b.remove());
  document.querySelectorAll('.save-photo').forEach(b => b.remove());
  $('send').textContent = 'Send to app'; $('send').disabled = false;
  $('shoot').classList.remove('hidden'); $('out').classList.add('hidden');
  capturedBlob = null; fullBytes = null;
});

// ── Capture Worker: field-autonomous publish over OTA (no Mac) ──
const WORKER_BASE = 'https://capture.muralquest.app';
const WORKER = WORKER_BASE + '/photo';
const WORKER_CAPTION = WORKER_BASE + '/caption';
const WORKER_DELETE  = WORKER_BASE + '/delete';
function getKey(){
  let k = localStorage.getItem('mq_capture_key');
  if (!k){ k = (prompt('Enter the Capture key (one-time; saved on this device):')||'').trim(); if (k) localStorage.setItem('mq_capture_key', k); }
  return k;
}

// Download fallback — save the frame, publish from the Mac if the Worker is down.
$('dl').addEventListener('click', () => {
  if (!capturedBlob || !current) return;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(capturedBlob); a.download = `${current.id}-${$('date').value}.jpeg`; a.click();
});

// ── Save to Photos ──
// A web page can't write to Photos itself; the share sheet's "Save Image" is the way in.
// The canvas frame has no metadata, so write the date, mural and location into it first.
const toPhotosPref = (() => { try { return localStorage.getItem('mq_to_photos'); } catch(e){ return null; } })();
$('to-photos').checked = toPhotosPref !== '0';   // on unless turned off on this device
$('to-photos').addEventListener('change', () => { try { localStorage.setItem('mq_to_photos', $('to-photos').checked ? '1' : '0'); } catch(e){} });

function saveToPhotos(date, cap, mural){
  if (!fullBytes) { showErr('Full-size copy not ready, so it can\'t be saved to Photos.'); return; }
  const t = new Date(), pad = n => String(n).padStart(2,'0');
  const stamp = `${t.getFullYear()}:${pad(t.getMonth()+1)}:${pad(t.getDate())} ${pad(t.getHours())}:${pad(t.getMinutes())}:${pad(t.getSeconds())}`;
  const desc = `#${mural.id} ${mural.a || ''}${cap ? ' - ' + cap : ''}`;
  const bytes = withExif(fullBytes, { desc, stamp, fix: captureFix });
  const file = new File([bytes], `${mural.id}-${date}-${pad(t.getHours())}${pad(t.getMinutes())}${pad(t.getSeconds())}.jpg`, { type: 'image/jpeg' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    navigator.share({ files: [file] }).catch(() => {});      // cancelled = not saved, nothing else changes
  } else {
    const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = file.name; a.click();
  }
}

// Minimal EXIF (big-endian TIFF): description, date taken, GPS. Spliced in after SOI,
// so the JPEG data itself isn't re-encoded.
function withExif(jpeg, { desc, stamp, fix }){
  const enc = s => { const b = new TextEncoder().encode(s); const o = new Uint8Array(b.length+1); o.set(b); return o; };
  const u16 = n => [n>>8 & 255, n & 255], u32 = n => [n>>>24 & 255, n>>16 & 255, n>>8 & 255, n & 255];
  const rat = list => new Uint8Array(list.flatMap(([a,b]) => [...u32(a), ...u32(b)]));
  const dms = x => { x = Math.abs(x); const d = Math.floor(x), m = Math.floor((x-d)*60), s = Math.round(((x-d)*60-m)*60*10000); return rat([[d,1],[m,1],[s,10000]]); };
  // entries: [tag, type, count, bytes]; type 1 BYTE, 2 ASCII, 4 LONG, 5 RATIONAL
  const ifd0 = [[0x010E,2,0,enc(desc)], [0x0132,2,0,enc(stamp)]];
  const exif = [[0x9003,2,0,enc(stamp)]];
  const gps = fix ? [[0x0000,1,4,new Uint8Array([2,2,0,0])],
                     [0x0001,2,0,enc(fix.lat >= 0 ? 'N' : 'S')], [0x0002,5,3,dms(fix.lat)],
                     [0x0003,2,0,enc(fix.lng >= 0 ? 'E' : 'W')], [0x0004,5,3,dms(fix.lng)],
                     [0x001F,5,1,rat([[Math.round((fix.acc||0)*100),100]])]] : null;
  ifd0.push([0x8769,4,1,null]); if (gps) ifd0.push([0x8825,4,1,null]);
  const size = es => 6 + es.length*12 + es.reduce((n,e) => n + (e[3] && e[3].length > 4 ? e[3].length + (e[3].length & 1) : 0), 0);
  const o0 = 8, oE = o0 + size(ifd0), oG = oE + size(exif), total = oG + (gps ? size(gps) : 0);
  const out = new Uint8Array(total); let p = 0;
  const put = arr => { out.set(arr, p); p += arr.length; };
  put([0x4D,0x4D,0,42,...u32(8)]);
  const write = (es, start) => {
    p = start; let data = start + 2 + es.length*12 + 4;
    put(u16(es.length));
    for (const [tag,type,count,b] of es){
      put([...u16(tag), ...u16(type)]);
      if (b === null){ put(u32(1)); put(u32(tag === 0x8769 ? oE : oG)); continue; }
      put(u32(type === 2 ? b.length : count));
      if (b.length <= 4){ const v = new Uint8Array(4); v.set(b); put(v); }
      else { put(u32(data)); out.set(b, data); data += b.length + (b.length & 1); }
    }
    put(u32(0));
  };
  write(ifd0, o0); write(exif, oE); if (gps) write(gps, oG);
  const head = new Uint8Array([0xFF,0xE1, ...u16(total + 8), 0x45,0x78,0x69,0x66,0,0]);
  const res = new Uint8Array(jpeg.length + head.length + total);
  res.set(jpeg.subarray(0,2)); res.set(head, 2); res.set(out, 2 + head.length); res.set(jpeg.subarray(2), 2 + head.length + total);
  return res;
}

// Send → POST to the Capture Worker → live in the app over OTA in ~1 min.
$('send').addEventListener('click', async () => {
  if (!capturedBlob || !current) return;
  const key = getKey(); if (!key){ showErr('No Capture key entered.'); return; }
  const date = $('date').value;
  const btn = $('send'), label = btn.textContent; btn.textContent='Sending…'; btn.disabled=true; hideErr();
  const sentCap = $('caption').value.trim(), sentMural = current;
  let sent = false;
  try {
    const b64 = $('canvas').toDataURL('image/jpeg', 0.92);
    // Card for the app's grid + map pin (shorter side 720, longer capped at 1280 —
    // same as scripts/generate-cards.py). Without it the grid shows "Coming soon".
    let cardB64 = '';
    try {
      const src = $('canvas'), s0 = 720 / Math.min(src.width, src.height);
      let cw = Math.round(src.width * s0), ch = Math.round(src.height * s0);
      if (Math.max(cw, ch) > 1280){ const s1 = 1280 / Math.max(cw, ch); cw = Math.round(cw*s1); ch = Math.round(ch*s1); }
      const cc = document.createElement('canvas'); cc.width = cw; cc.height = ch;
      const cx = cc.getContext('2d'); cx.imageSmoothingQuality = 'high';
      cx.drawImage(src, 0, 0, cw, ch);
      cardB64 = cc.toDataURL('image/webp', 0.8);
      if (!cardB64.startsWith('data:image/webp')) cardB64 = cc.toDataURL('image/jpeg', 0.82);
    } catch (e) { cardB64 = ''; }
    const res = await fetch(WORKER, {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'X-Capture-Key': key },
      body: JSON.stringify({ muralId: current.id, date, imageBase64: b64, cardBase64: cardB64,
                            caption: $('caption').value, gps: captureFix }),
    });
    const j = await res.json().catch(()=>({}));
    if (!res.ok){
      if (res.status===401) localStorage.removeItem('mq_capture_key');
      throw new Error(j.error || ('HTTP '+res.status));
    }
    $('out').classList.remove('hidden');
    $('out').textContent = `✓ LIVE — photo #${j.photoCount} on #${j.muralId} (${date}).`
      + (j.caption ? `\nCaption: “${j.caption}”` : '\nNo caption.')
      + `\n${j.imageUrl}`
      + (j.cardUrl ? '\nGrid card: ✓' : `\n⚠ Grid card NOT saved (${j.cardError || 'none sent'}) — the grid will show "Coming soon" for this photo.`)
      + (j.gps
          ? `\nLocation saved: ±${j.gps[2] ?? '?'} m` + (current.lat && current.lng
              ? `, ${Math.round(metersBetween(j.gps[0], j.gps[1], current.lat, current.lng))} m from the app's pin (that's where you stood, not the wall — the pin is unchanged).`
              : '.')
          : '\nNo location saved (location off or no fix yet).')
      + `\n\nRelaunch the app within ~1 min to see it in the build-viewer.\nCapture another frame for the next day — it aligns to this one.`;
    // Fix a typo spotted seconds later, without sending a duplicate photo.
    addFixCaption(current.id, j.caption || '');
    addRemovePhoto(current.id, j.imageUrl);
    // The share sheet needs its own tap (the Send tap is spent by the time the upload
    // returns), and opening it only now means the ✓ LIVE result is visible underneath.
    if ($('to-photos').checked) addSavePhoto(date, sentCap, sentMural);
    sent = true;
    // Clear the box — otherwise today's caption silently rides along on tomorrow's photo.
    $('caption').value = ''; $('cap-count').textContent = '0/140';
    $('cap-count').classList.remove('over');
    // update local state so the NEXT capture onion-skins against the photo just sent
    current.ph = current.ph || []; current.ph.push({ u: j.imageUrl.replace('https://cdn.muralquest.app/',''), d: date });
    setGhost(j.imageUrl);
  } catch (e) {
    showErr('Send failed: ' + e.message + (String(e.message).includes('unauthorized') ? ' — re-enter the key and retry.' : ''));
  } finally {
    // After a good send the same frame can't go again; Retake re-arms the button.
    if (sent){ btn.textContent = '✓ Sent'; btn.disabled = true; }
    else { btn.textContent = label; btn.disabled = false; }
  }
});

function addSavePhoto(date, cap, mural){
  document.querySelectorAll('.save-photo').forEach(b => b.remove());
  const btn = document.createElement('button');
  btn.className = 'save-photo'; btn.style.marginTop = '10px'; btn.style.marginRight = '8px';
  btn.textContent = 'Save to Photos';
  btn.addEventListener('click', () => saveToPhotos(date, cap, mural));
  $('out').after(btn);
}

// Amend the caption on the photo just sent. Empty input clears it.
function addFixCaption(muralId, currentCaption){
  const btn = document.createElement('button');
  document.querySelectorAll('.fix-caption, .rm-photo').forEach(b => b.remove());
  btn.className = 'sec fix-caption'; btn.style.marginTop = '10px'; btn.textContent = 'Fix caption';
  btn.addEventListener('click', async () => {
    const next = prompt('Caption for the photo just sent (blank clears it):', currentCaption);
    if (next === null) return;                     // cancelled
    if ([...next].length > 140){ showErr('Caption too long: ' + [...next].length + '/140'); return; }
    const key = getKey(); if (!key){ showErr('No Capture key entered.'); return; }
    btn.disabled = true; btn.textContent = 'Saving\u2026';
    try {
      const res = await fetch(WORKER_CAPTION, {
        method:'POST',
        headers:{ 'Content-Type':'application/json', 'X-Capture-Key': key },
        body: JSON.stringify({ muralId, caption: next }),
      });
      const j = await res.json().catch(()=>({}));
      if (!res.ok) throw new Error(j.error || ('HTTP '+res.status));
      currentCaption = (j.photo && j.photo.c) || '';
      $('out').textContent += j.cleared ? '\n✓ Caption cleared.' : `\n✓ Caption now: “${currentCaption}”`;
    } catch (e) { showErr('Caption update failed: ' + e.message); }
    finally { btn.disabled = false; btn.textContent = 'Fix caption'; }
  });
  $('out').after(btn);
}

// Remove the frame just sent — a blurry capture would otherwise be live until Rob
// is back at the Mac. Confirms first: this is destructive and one tap from Send.
function addRemovePhoto(muralId, imageUrl){
  document.querySelectorAll('.rm-photo').forEach(b => b.remove());
  const btn = document.createElement('button');
  btn.className = 'sec rm-photo';
  btn.style.marginTop = '10px'; btn.style.marginLeft = '8px';
  btn.textContent = 'Remove photo';
  btn.addEventListener('click', async () => {
    if (!confirm('Remove the photo just sent from the app?\n\nThe image file stays on the CDN but the app stops showing it.')) return;
    const key = getKey(); if (!key){ showErr('No Capture key entered.'); return; }
    btn.disabled = true; btn.textContent = 'Removing\u2026';
    try {
      const res = await fetch(WORKER_DELETE, {
        method:'POST',
        headers:{ 'Content-Type':'application/json', 'X-Capture-Key': key },
        body: JSON.stringify({ muralId, url: imageUrl }),
      });
      const j = await res.json().catch(()=>({}));
      if (!res.ok) throw new Error(j.error || ('HTTP '+res.status));
      $('out').textContent += `\n\u2713 Removed. ${j.remaining} photo(s) left on #${muralId}.`
        + (j.stillUnderConstruction ? '' : '\nNo photos left \u2014 "Being painted now" badge cleared.');
      btn.remove();
      document.querySelectorAll('.fix-caption, .rm-photo').forEach(b => b.remove());
      // local state must match, or the next capture onion-skins against a dead frame
      if (current && current.ph) current.ph = current.ph.filter(
        p => p.u !== imageUrl.replace('https://cdn.muralquest.app/',''));
    } catch (e) { showErr('Remove failed: ' + e.message); btn.disabled=false; btn.textContent='Remove photo'; }
  });
  $('out').after(btn);
}

function showErr(m){ const e=$('err'); e.textContent=m; e.classList.remove('hidden'); }
function hideErr(){ $('err').classList.add('hidden'); }
</script>
</body></html>
