<script>
const DATA = [{"id": 1, "artist": "Aaron Tullo", "title": "Golden Dawn", "year": 2025, "aud": "https://cdn.muralquest.app/audio/1.mp3?v=2", "text": "The Milwaukee Brewers drafted this artist twice. He picked up a paintbrush instead.\n\nAaron Tullo was born here in St. Petersburg in nineteen eighty-eight and grew up throwing fastballs. He turned the Brewers down once for college, then signed the second time, out of the University of Tennessee. He pitched in their minor league system for about six years before injuries ended it. He was around twenty-five.\n\nThe pivot to painting took. He learned the trade with the Vitale Brothers in Gulfport, and he still letters every sign by hand.\n\nWhat you're looking at is five stories of white peacock, painted for SHINE Origins in twenty twenty-five, on the Cordova Inn \u2014 the festival's title sponsor.\n\nThe plumage runs the full vertical height of the building. It's built to read from blocks away, so let your eye follow the feathers all the way to the top.", "rev": {"date": "2026-08-15", "note": "revised script + Rob's cloned voice"}}, {"id": 4, "artist": "Cecilia Lueza", "title": "Radiance", "year": 2025, "aud": "https://cdn.muralquest.app/audio/4.mp3?v=2", "text": "She once painted an entire intersection with fifty volunteers. A storm washed it away, so they painted it again.\n\nThat's the kind of persistence behind the hummingbird in front of you. Cecilia Lueza calls this one \"Radiance,\" made for SHINE twenty twenty-five. The bird hovers mid-flight, wings spread, in iridescent greens, blues, and oranges, against a field of overlapping translucent circles \u2014 her signature geometry.\n\nLueza was born in subtropical northeast Argentina, all dense flora and fauna, and it still runs through her work. She started out painting in monochrome. Florida's light changed that.\n\nSince twenty thirteen she's made nearly sixty public installations \u2014 the Atlanta BeltLine, the North Carolina Museum of Art, a kinetic angel in Chattanooga.\n\nLook at the wings up close. The color shifts as the light moves, the way it does on a real hummingbird.  Check out her other murals here in St Pete, they are just as amazing", "rev": {"date": "2026-08-15", "note": "revised script + Rob's cloned voice"}}, {"id": 6, "artist": "Derek Donnelly", "title": "Greetings from Hollander Hotel", "year": 2025, "aud": "https://cdn.muralquest.app/audio/6.mp3?v=3", "text": "That boy in the red cap riding a pelican? That's the artist's son. He shows up in murals all over this city. Derek Donnelly doesn't separate the personal from the public work.\n\nThis one's a vintage postcard for the Hollander Hotel \u2014 \"Greetings from the Hollander Hotel\" in classic Florida tourism teals and warm tans. Dolphins leaping, seagulls overhead, and the Sunshine Skyway Bridge way off in the distance.\n\nDonnelly is a Pinellas County native who's painted for the Tampa Bay Rays, Fender Guitars, and, memorably, a T-Rex in a Hawaiian shirt going fishing for AARP. You will see that later on this tour. He also organized a forty-artist tribute mural downtown for a mentor who passed. That instinct to build things for other people keeps showing up.", "rev": {"date": "2026-08-15", "note": "revised script + Rob's cloned voice"}}, {"id": 7, "artist": "Dreamweaver", "title": "Abiding Light", "year": 2025, "aud": "https://cdn.muralquest.app/audio/7.mp3?v=3", "text": "That egret spans several stories, and every petal, every feather, was laid down in spray paint. No brushes. The artist behind it is Taylor Smith, who goes by Dreamweaver. She painted her first mural at seven, on her aunt's backyard shed in Waco, Texas, and hasn't stopped since \u2014 something like a hundred and fifty walls, close to twenty of them here in St. Pete.\n\nShe works almost entirely from a can, blending soft-focus realism with pure color. Nature runs through all of it: birds, water, flowers. This one she painted for SHINE Origins in twenty twenty-five, the festival's return to the block where the whole movement began back in twenty twelve.\n\nFollow the egret's neck as it rises up the wall, threading through the blooms. The plumage is delicate. The petals are the size of doors.  Amazing work by Dreamweaver!  You can check out some of her other work on the Tropicana Field tour.", "rev": {"date": "2026-08-18", "note": "revised script + Rob's cloned voice"}}, {"id": 8, "artist": "Elizabeth Barenis", "title": "Shine On Palms", "year": 2025, "aud": "https://cdn.muralquest.app/audio/8.mp3?v=2", "text": "In two thousand eighteen, Elizabeth Barenis was one of just ten painters invited to the Mark Rothko Art Center in Latvia. What's in front of you now is her language for the tropics.\n\nShe calls it Abstract Precisionism \u2014 generalized shapes, clean lines that borrow from Cubism. Here that means oversized fan palm fronds, layered in green, teal, and soft yellow. Look at how the leaves overlap. The shapes read as translucent, one plane over another, and that stacking is what gives the wall its depth.\n\nBarenis grew up in the Mississippi Delta, where her parents ran a music store. She moved to St. Petersburg in twenty fifteen and stayed for the arts community. She painted this for SHINE Origins twenty twenty-five, alongside a crew of other muralists.\n\nElizabeth is a great artist, we actually have one of her paintings in our own house.", "rev": {"date": "2026-08-15", "note": "revised script + Rob's cloned voice"}}, {"id": 9, "artist": "Isac Gres", "title": "", "year": 2025, "aud": "https://cdn.muralquest.app/audio/9.mp3?v=3", "text": "When EEsac Gress left Cuba in twenty nineteen, he walked through twelve countries to reach the United States \u2014 including the darien gap \u2014 and he brought his brushes. This is the tallest wall he's ever painted.\n\nIt wraps the corner of the Melting Pot, and Gress liked the name. A melting pot of cultures, rendered in swirling cosmic surrealism. Molten planets, blazing nebula clouds, deep space blues against fiery orange and gold.\n\nThe melting clock is his nod to Dali, the surrealist who made clocks droop.\n\nGress trained in Cuba in cubism, hyperrealism, and surrealism, ran a tattoo studio in Uruguay, then settled here in St. Petersburg. Light drives everything he makes. \"Color for me means light,\" he says. Look for the city skyline sealed inside a dripping glass orb, not St Pete's skyline right now, but perhaps soon given the number of high rises going up in the city.", "rev": {"date": "2026-08-18", "note": "revised script + Rob's cloned voice"}}, {"id": 12, "artist": "John Vitale & Sionna MacLeish", "title": "", "year": 2025, "aud": "https://cdn.muralquest.app/audio/12.mp3?v=2", "text": "This wall is two artists, side by side. Johnny Vitale and Sionna MacLeish \u2014 Sio \u2014 They work closely, and for SHINE Origins they shared a single wall.\n\nThe Vitales have made art in Tampa Bay since nineteen ninety-two, when it all started with a sketch handed over on a paper napkin. Signs, storefronts, murals \u2014 no art school, just a family that's painted for generations. Johnny has done SHINE every year since it began.\n\nVintage Florida turned up loud \u2014 a nineteen fifties pin-up, a pink hibiscus, the old Thunderbird motel sign.", "rev": {"date": "2026-08-15", "note": "revised script + Rob's cloned voice"}}, {"id": 16, "artist": "Reid Jenkins", "title": "Ikigai in Bloom", "year": 2025, "aud": "https://cdn.muralquest.app/audio/16.mp3?v=2", "text": "Those flowers look painted from life, but the whole thing was outlined using a projection method \u2014 Reid Jenkins traced the arrangement onto the wall at building scale, then filled it in by hand.\n\nThe deep black background is the trick. It's the same move Dutch still-life painters made four hundred years ago, letting the darkness swallow everything so the blooms seem to glow. King proteas, red ginger, heliconia, orchids, ferns, all in crimson and coral and gold.\n\nJenkins is a St. Pete native. He came up through the arts program at Gibbs High, earned his degree in Baltimore, and now tattoos at a studio out in Leelman when he isn't painting walls this size.\n\nGet close and look at the pincushion proteas \u2014 those spiky pink orbs. Every filament is its own brushstroke.  He calls It \"Ikigai in Bloom\"", "rev": {"date": "2026-08-15", "note": "revised script + Rob's cloned voice"}}, {"id": 18, "artist": "Morning Breath", "title": "", "year": 2015, "aud": "https://cdn.muralquest.app/audio/18.mp3?v=2", "text": "What you're looking at is a survivor. This slim golden strip is all that's left of their twenty fifteen Shine mural. A white building went up next door in twenty nineteen and swallowed the rest.\n\nThat skull grinning at you won a Grammy. Not this mural specifically \u2014 but the two men behind it, Doug Cunningham and Jason Noto, took Best Recording Package in twenty twenty-one for a Josh Homme project.\n\nThey're Morning Breath, a Brooklyn studio that met at a San Francisco skateboard company back in nineteen ninety-six. Since then, more than a hundred album covers \u2014 Foo Fighters, Jay-Z, Eminem, Slayer. They even redesigned a KFC.\n\nReed what remains. \"Warning.\" \"A wicked eyeful.\" \"Signs you need money.\" The all-seeing eye is still watching. And fittingly, one line reads, \"Have a second look.\" So do.  And if you want a third look Morning Breath have another mural on 9th Street North from 2019...", "rev": {"date": "2026-08-15", "note": "revised script + Rob's cloned voice"}}, {"id": 23, "artist": "Emmanuel Jarus", "title": "", "year": 2024, "aud": "https://cdn.muralquest.app/audio/23.mp3?v=3", "text": "She's fourteen stories tall, and Emmanuel Jar-us won't tell you who she is. That's on purpose. This woman in flowing black is a figure he keeps returning to \u2014 he first painted her on a seaside building in Boulogne-sur-Mer, France. Now she's here, roughly a hundred eighty feet tall by sixty wide, the largest mural in SHINE's ten-year history. \n\nJar-us started out painting portraits on freight trains in Saskatchewan. They went viral online before he ever had a gallery show. He works with the plainest tools \u2014 bucket paint, brushes, rollers, sometimes brooms \u2014 and calls each painting an avatar for a city or a mood. \n\nHe finished this one in twenty days, interrupted partway through when Hurricane Milton forced an evacuation. Look at her hand, resting on her chest. Her expression gives away nothing.  Perhaps a modern nod to Mona Lisa?", "rev": {"date": "2026-08-18", "note": "revised script + Rob's cloned voice"}}, {"id": 24, "artist": "Fintan Magee", "title": "", "year": 2024, "aud": "https://cdn.muralquest.app/audio/24.mp3?v=3", "text": "That perfume bottle floating four stories above you is underwater. So is the pineapple, the crystalline formations, the whole rippling teal scene \u2014 Finton MahGhee painted it all submerged, with the light refracting down through a surface that isn't there.\n\nMahGhee grew up in New South Wales around the political murals of the Irish tradition, the son of a sculptor and an architect. He's painted in over twenty countries \u2014 a refugee camp girl in Jordan, endangered species in Bali. Journalists keep calling him the Australian Bank-see. He calls that lazy.\n\nThis one went up for SHINE's tenth anniversary, in twenty twenty-four, after Hurricanes Helene and Milton pushed the festival back.\n\nLook at the top edge, where the blue turns pale and bright. That's the water's surface, seen from below.", "rev": {"date": "2026-08-18", "note": "revised script + Rob's cloned voice"}}, {"id": 25, "artist": "Frankie Gonzalez", "title": "", "year": 2024, "aud": "https://cdn.muralquest.app/audio/25.mp3?v=2", "text": "Twenty-five days after hand surgery, Frankie Gonzalez painted Tom Brady. That's the kind of turnaround you get from a man who spent nine years in corporate shipping before he quit the desk and went back to the thing he'd been doing since he was fifteen.\n\nWhat you're looking at is childhood imagination taking flight, literally. A boy in a baseball cap launches a paper airplane, and watch what happens to his arm \u2014 it dissolves from photorealism into bold black brushstrokes and cartoon characters, the whole wall drifting from lush flowers on the left into pure abstraction on the right.\n\nGonzalez was born in Miami, Danish and Cuban parents, and has painted for ESPN, the Buccaneers, and the Miami Heat.\n\nOversized pink peonies, sunflowers, white daisies. The boy is launching his paper airplane from reality into the world of imagination.", "rev": {"date": "2026-08-15", "note": "revised script + Rob's cloned voice"}}, {"id": 26, "artist": "George F Baker III", "title": "At Your Show", "year": 2024, "aud": "https://cdn.muralquest.app/audio/26.mp3?v=2", "text": "George F. Baker the Third once painted a mural live, on air, during ESPN's College GameDay. This whole back wall of Studio@620 is his \u2014 every dancing, laughing, selfie-taking character on it.\n\nLook up top. In big bubble letters it reads, \"We're all front row at your show.\" That's the thesis. His work runs on cartoon energy and positive messaging \u2014 \"Be You,\" \"Be a Light\" \u2014 pulled from Keith Haring, Nickelodeon, and Dragon Ball Z.\n\nThe client list is a brand deck: Nike, Jordan, the NFL, Cartoon Network, Adult Swim. He's also a sneakerhead with more than seventy-eight pairs.\n\nGeorge made this for SHINE in twenty twenty-four.", "rev": {"date": "2026-08-15", "note": "revised script + Rob's cloned voice"}}, {"id": 29, "artist": "NeSpoon", "title": "", "year": 2024, "aud": "https://cdn.muralquest.app/audio/29.mp3?v=2", "text": "The night before NesSpoon was due to land in Florida, Hurricane Milton came ashore near Siesta Key \u2014 the strongest storm this region had seen. The festival was postponed. She arrived a month later, found broken branches still in the streets, and decided to put the storm into the wall.\n\nSo look at what's happening across this wall. On the left and center, her signature lace \u2014 white and pale blue medallions, floral and geometric, shaded so they seem to lift off the concrete like real draped fabric. Then follow it right, and the lace comes undone. Those flowing swirls are Milton's winds, spinning straight out of the threadwork.\n\nNesSpoon has painted in more than forty countries. She researches each city's lace heritage before she lifts a can. Her name is legal, by the way \u2014 taken from \"there is no spoon\" in The Matrix.\n\nFind the unraveling, right of center. That's the hurricane.  And check out her cool video on the mural in the artist links section.  She sent that link so that I could include it with her work.", "rev": {"date": "2026-08-15", "note": "revised script + Rob's cloned voice"}}, {"id": 30, "artist": "Quinn Cale", "title": "", "year": 2024, "aud": "https://cdn.muralquest.app/audio/30.mp3?v=2", "text": "Quinn Cale builds her paintings to animate \u2014 you scan the wall, and the chase you're looking at comes alive: this leaping cat, that pixelated orange mouse, and a retro cursor hand, all of it running across the brick. Cale is self-taught. No art degree. \n\nShe started painting on wood slats as a teenager because she couldn't afford to go out with friends. Later she worked at Apple, first in sales, then as a Creative teaching kids to make digital art on iPads. That's where the moving pictures come from. Look at the fur. It's broken into bold blocks of purple, teal, orange, and pink.  \n\nCale painted this awesome mural for Shine twenty twenty-four - she also painted a mural in 2025 called Pixel Reacher at the Tyrone Middle School.", "rev": {"date": "2026-08-15", "note": "revised script + Rob's cloned voice"}}, {"id": 32, "artist": "Up & Over", "title": "", "year": 2024, "aud": "https://cdn.muralquest.app/audio/32.mp3?v=2", "text": "Five stories of interlocking color, and you can see it from streets away. This is Up and Over \u2014 a collaboration between Tes One and the Vitale Brothers, three artists whose paths run through Tampa Bay walls going back to nineteen ninety-two.\n\nTes One started tagging at fourteen, came up through the arts program at Gibbs High School, and went on to paint for Nike, Toyota, and the Brooklyn Nets. He also helped found the SHINE Mural Festival, the reason so much of this city is covered in work like this. The Vitale Brothers bring figurative realism and pop sensibility. Together, the style is his bold graphic design fused with their instinct for depth.\n\nLook at how the circles sit nested inside those flowing vertical bands. The colors are doing the work here \u2014 reds against teals against deep blue \u2014 pulling the whole facade forward and back at once.", "rev": {"date": "2026-08-15", "note": "revised script + Rob's cloned voice"}}, {"id": 34, "artist": "Zulu Painter", "title": "", "year": 2022, "aud": "https://cdn.muralquest.app/audio/34.mp3?v=2", "text": "These four faces are people from this community, everyone in some way touched by family turmoil. Zulu Painter said that plainly, and he painted them across two stories of the CASA Family Justice Center, a place for survivors of domestic violence.\n\nLook at the woman cradling a baby. Inside the curls of her hair are words \u2014 drive, bravery, family, growth, hope, empathy, love, community, wisdom, faith, create, unity. On the other side, a young woman reaches out a helping hand, and a young man holds your gaze directly.\n\nThe artist, Carlos Culbertson, calls these his Mindful Murals. A four-time SHINE artist and a Muse Award winner, he works from a studio here in St. Pete.", "rev": {"date": "2026-08-15", "note": "revised script + Rob's cloned voice"}}, {"id": 36, "artist": "Artist Jones", "title": "", "year": 2023, "aud": "https://cdn.muralquest.app/audio/36.mp3?v=3", "text": "Every surface you're looking at is painted \u2014 every corner, every utility box, the whole PSTA ticket office wrapped like a single quilt. Artist Jones covered all of it for SHINE twenty twenty-three. The patchwork comes from African textile traditions, stitched together in blocks that collide on purpose. Oversized fan-shaped leaves in hot pink and sky blue. Navy spirals. Lime green tiger stripes. Follow one pattern around a corner and watch it change into something else. Jones was born in Trinidad and Tobago, and those Caribbean tones run all through her work. She's based in Tampa now, with a degree in graphic design and more than ten years working as a designer before she turned to painting full time. Painting runs in the family \u2014 her great-great grandmother worked as a painter as well.  \n\nOn one side of the mural there is a tribute to John Donaldson.  Donaldson was one of the first pioneers to this area, purchasing 40 acres that would be the beginning of St Petersburg.", "rev": {"date": "2026-08-18", "note": "revised script + Rob's cloned voice"}}, {"id": 38, "artist": "Bunnie Reiss", "title": "Phoebe & Friends", "year": 2023, "aud": "https://cdn.muralquest.app/audio/38.mp3?v=2", "text": "The artist who painted these three flamingos started making murals for a practical reason. Her San Francisco apartments were too small to hold a studio. So she painted outside, on whatever wall she could find, walked away, and treated each one like a modern-day cave painting.\n\nBunnie Reiss now lives on a five-acre desert homestead near Joshua Tree, where she grows food and keeps chickens. Her patterns come from Russian fairy tales, Mexican folk art, and Jewish mysticism, and she's carried them onto walls in more than twenty countries.\n\nLook closely at the flamingos - From a distance they read as pink birds on long dark legs. Up close, each one is packed with tiny flowers and geometric shapes, no two the same. Follow their feet down to the blue-violet rainbow they're stepping over, and the golden blooms on the right, against that teal sky.  \n\nOne of my favorites, the mural so much more impressive from the alley than on central avenue.", "rev": {"date": "2026-08-15", "note": "revised script + Rob's cloned voice"}}, {"id": 39, "artist": "Chris Dyer", "title": "Ride on the sPEACEship!", "year": 2023, "aud": "https://cdn.muralquest.app/audio/39.mp3?v=2", "text": "That spaceship is made entirely of creatures \u2014 tentacles, multiple eyes, geometric patterns, all interlocking into a single vessel blasting across the wall on rainbow flames and lightning. Chris Dyer painted it for SHINE in twenty twenty-three.\n\nDyer was born in Ottawa, moved to Leema at four, and came back to Canada at seventeen. That mix runs through everything here \u2014 Incan and pre-Columbian imagery, sacred geometry, and nineteen-eighties skate culture. He's designed over a hundred skateboard graphics for Santa Cruz and Deathwish, painted in forty-five countries, and has a mural in the Bob Marley Museum. He founded his brand, Positive Creations \u2014 the words are floating right above the ship. These days he lives in a purple house in Gulfport, and his murals are all over the area.\n\nLook for the pilot in the blue bubble cockpit, flashing a peace sign. Then find the smiling sun face in the upper right corner... Definitely. Classic Dyer.  One of my favorites from Shine twenty twenty three", "rev": {"date": "2026-08-15", "note": "revised script + Rob's cloned voice"}}, {"id": 40, "artist": "Dave Bonzai", "title": "Sunshine City", "year": 2023, "aud": "https://cdn.muralquest.app/audio/40.mp3?v=2", "text": "Those letters look like they were poured in molten metal, still dripping. They weren't. There's no chrome or silver paint anywhere. Dave Bonzai builds that effect with black, white, and grey alone, layered until the eye gives up and calls it liquid metal. He named the technique \"Liquid Chrome,\" and one of his early pieces sits in the permanent collection of the STRAAT Museum in Amsterdam.\n\nHe's from Southampton, England, based in London, and has been working the streets for over twenty years. His clients include Triumph Motorcycles. He painted this one for SHINE in twenty twenty-three, and called it a modern piece with a retro twist.\n\nLook at the sky behind the script \u2014 deep purple bleeding into hot pink and fiery red, palm trees in silhouette, sharp diagonal lines cutting the black. Pure synthwave sunset. Now look at the chrome again, and try to find the paint - what a cool effect.", "rev": {"date": "2026-08-15", "note": "revised script + Rob's cloned voice"}}, {"id": 43, "artist": "Hannah Eddy", "title": "With Flying Colors", "year": 2023, "aud": "https://cdn.muralquest.app/audio/43.mp3?v=2", "text": "That purple bird flying to the right, the one with a branch in its beak \u2014 that's a peace dove, reimagined as Florida wildlife. It fits. This wall belongs to the CASA Support Center, which helps survivors of domestic violence, and Hannah Eddy built the whole scene to feel welcoming to visitors.\n\nShe's based in Reno, trained in oil painting, then went straight to work for outdoor brands \u2014 Patagonia, Dakine, Sierra Nevada Brewing. Her style is pop-surrealism: bold black outlines, animals blown up to exaggerated scale, color that feels loud on purpose. She paints murals, she says, because no one has to pay to see them.\n\nLook at how the color moves. The left side burns with orange, yellow, and pink. Then follow it right, where it thins to bare line work on the mint green \u2014 as if the color is still spreading across the wall.", "rev": {"date": "2026-08-15", "note": "revised script + Rob's cloned voice"}}, {"id": 46, "artist": "Loretta Lizzio", "title": "The Sirens Call", "year": 2023, "aud": "https://cdn.muralquest.app/audio/46.mp3?v=2", "text": "Those three women watching you? They're sirens \u2014 the ones from Greek myths who lured sailors to the rocks with a song too beautiful to resist. Look closely and you'll see they aren't just standing in the foliage. Their skin is threaded with leaf patterns and fine line work, so they seem to grow straight out of the plants. Beautiful and a little sinister, all at once.\n\nLoretta Lizzio painted this. She came all the way from the Gold Coast of Australia for SHINE in twenty twenty-three. She was the first woman commissioned to paint Melbourne's Hellenic Museum \u2014 three fearless women from Greek history and myth. Sirens, clearly, are a returning theme.\n\nNow follow their dark hair up. It flows and tangles together across the top of the wall, forming a kind of canopy over all three. One song, three voices.  Very cool stuff.", "rev": {"date": "2026-08-15", "note": "revised script + Rob's cloned voice"}}, {"id": 48, "artist": "Michael Vasquez", "title": "The Mangrove Refuge", "year": 2023, "aud": "https://cdn.muralquest.app/audio/48.mp3?v=2", "text": "That beige Datsun two eighty Z is the focus of the whole scene. This is a displaced Lao family finding refuge at Gandy Beach around nineteen eighty, and the car is where they gather \u2014 a fusion of car culture and pride. Look at the young men around it. One sits shirtless on the hood. Another leans against the door in a white t-shirt. Their clothes say togetherness, but notice how the gazes drift apart, each figure carrying a history the painting only hints at.\n\nMichael Vasquez turns personal photographs into scenes like this, using clothing and landmarks to establish who someone is and where they come from. His work hangs in the Smithsonian's National Portrait Gallery and the Perez Art Museum. Swizz Beatz and Michael B. Jordan collect him.\n\nLook past the car, into the background. Those are mangroves \u2014 the detail that roots this whole moment on the Florida coast...", "rev": {"date": "2026-08-15", "note": "revised script + Rob's cloned voice"}}, {"id": 50, "artist": "Sarah Sheppard", "title": "We Are Magic", "year": 2023, "aud": "https://cdn.muralquest.app/audio/50.mp3?v=2", "text": "Look at those eyes. They hold you before you notice everything around them \u2014 the golden mask, the crescent moons, the starburst crown, the white wings spreading wide across the wall.\n\nThat gold filigree scrollwork isn't a coincidence. Sarah Sheppard trained as a metalsmith, taking up work her late father began. Both her parents were artists. She's lived in St. Petersburg for over twelve years, and she's got murals all over this city, including one on the back wall of the Morayan Arts Center, commissioned by AARP.\n\nShe painted this one for SHINE, in twenty twenty-three. Her thing is movement as metaphor \u2014 continuous loss and seeking.\n\nThe whole piece works like a gilded altar, symmetrical and mystical, but reimagined for a wall on Fifth Avenue South.\n\nReed the script across the lower center, if you haven't already.   We are all magic.", "rev": {"date": "2026-08-15", "note": "revised + Rob's voice. NOTE: 'Morayan' is an intentional PHONETIC spelling for the Morean Arts Center \u2014 do not 'fix' to 'Morean' (voice mispronounces the real spelling)."}}, {"id": 52, "artist": "Chenlin Cai", "title": "The Path We Came / \u6211\u4eec\u6765\u7684\u8def", "year": 2023, "aud": "https://cdn.muralquest.app/audio/52.mp3?v=2", "text": "When the First Transcontinental Railroad was finished in eighteen sixty-nine, they gathered everyone for the photograph. Everyone except the Chinese laborers who built it. This mural puts them back in the picture.\n\nThree workers stand against the sunset. Look closely at what each one is doing. One holds a staff. One reads a letter from home. And on the right, one has taken off his hat and knelt to plant a flower \u2014 hope, on ground that excluded him. Behind them, the golden peaks are the Sierra Nevada. A sun sets on one side, a crescent moon rises on the other. Aspiration and homesickness, in the same sky.\n\nChenlin Cai was born in Fujian, China, and holds master's degrees from Tsinghua University in Beijing and the Pennsylvania Academy of Fine Arts.", "rev": {"date": "2026-08-15", "note": "revised script + Rob's cloned voice"}}, {"id": 55, "artist": "Ashley Cantero", "title": "", "year": 2022, "aud": "https://cdn.muralquest.app/audio/55.mp3?v=2", "text": "Those five flying saucers aren't just decoration \u2014 they're beaming figures right up off the wall, and the whole scene is pure Atomic Age. Teal background, pink and chartreuse, diamond shapes and starbursts, all wrapped in heavy black outlines that make it feel like a vintage comic book page you stepped inside.\n\nAshley Cantero is a Tampa native who leans hard into nineteen-sixties psychedelia and retro-futurism on purpose. She describes her own work as dark, intricate, sensual, and at times humorous. Over at FloridaRAMA she built an eight-wall retro-futuristic mural and full walk-in dioramas \u2014 a drive-in, a swamp motel.\n\nShe painted this one for SHINE in twenty twenty-two.\n\nBefore you move on, find the suited figure being beamed up, all the aliens want to take someone for a ride.", "rev": {"date": "2026-08-15", "note": "revised script + Rob's cloned voice"}}, {"id": 57, "artist": "Ben Johnston", "title": "Rise", "year": 2022, "aud": "https://cdn.muralquest.app/audio/57.mp3?v=3", "text": "Once, Ben Johnston covered nearly sixteen thousand square feet of wall for a brewery using nothing but Sharpies and a scaffold. So the precision you're looking at here is earned.\n\nFour letters. R, I, S, E. Built to look like solid three-dimensional blocks floating off the wall, in graduating shades of cerulean, sky blue, and white. It runs the full height of the building. You caught it from blocks away, which is the point.\n\nJohnston grew up in Cape Town, taught himself, and now works out of Toronto. His clients include Nike, Adobe, and Apple, where he also gives talks. He built this one for SHINE, back in twenty twenty-two.\n\nHe often picks his words with the local community. Keep going. Together. Rise...\n\nLook at the shadows under the letters. That crisp edge is what sells the illusion that the whole word is hovering over Central Avenue.", "rev": {"date": "2026-08-15", "note": "revised script + Rob's cloned voice"}}, {"id": 58, "artist": "Chad Mize", "title": "We Are St. Pete", "year": 2022, "aud": "https://cdn.muralquest.app/audio/58.mp3?v=3", "text": "Back in twenty ten, Chad Myze made a T-shirt that put St. Pete on a list with Paris, Tokyo, and London. Sixteen years later, it's still on the racks here \u2014 worn by locals and tourists who mostly agree with the premise.\n\nThat civic pride is the whole idea behind what you're looking at. It's called \"We Are St. Pete.\"\n\nMyze moved here in two thousand three and has been pushing the Tampa Bay art scene ever since. He co-founded a Central Avenue gallery that represented more than four hundred artists. He spent a full decade on the organizing committee for SHINE, the mural festival that gave this city a lot of its walls.\n\nHis day job clients run from the Dali Museum to the Rays to Coach. His style leans playful, text-driven, tongue-in-cheek.\n\nTake a second and read the words in front of you. He means them...", "rev": {"date": "2026-08-16", "note": "revised script + Rob's cloned voice | 'Myze' = intentional PHONETIC for Chad Mize (voice said 'meeze') \u2014 do not 'fix' to 'Mize'."}}, {"id": 59, "artist": "Dreamweaver", "title": "", "year": 2022, "aud": "https://cdn.muralquest.app/audio/59.mp3?v=2", "text": "She painted her first mural at seven, on her aunt's backyard shed in Waco, Texas. She has not stopped.\n\nThis mural is by Taylor Smith, who signs her work Dreamweaver \u2014 down there in the lower left, in script. This wall is what happens when she gets a big surface and a case of spray cans. It's part flower, part phoenix, exploding outward in neon pink, fiery orange, deep purple, and electric teal against a dark blue field.\n\nNature runs through everything she paints \u2014 birds, water, flora. She works almost entirely in spray paint, and she's left-handed. Somewhere north of a hundred murals, fifteen to twenty of them right here in St. Pete.\n\nShe painted this one for the SHINE festival in twenty twenty-two.", "rev": {"date": "2026-08-15", "note": "revised script + Rob's cloned voice"}}, {"id": 60, "artist": "Egypt Hagan", "title": "", "year": 2022, "aud": "https://cdn.muralquest.app/audio/60.mp3?v=2", "text": "For Juneteenth in twenty twenty-one, Egypt Hagan painted a mural in Vermont commissioned by the state's Office of Racial Equity. The year after that, she brought her brushes here.\n\nLook up. Two faces rise across the full height of the George F. Young building, wrapped in roses and soft washes of warm color. A hand is offering a rose, and another threatens with lightning.  Hagan works in portraiture as storytelling \u2014 bold color carrying narratives that go untold elsewhere. These aren't photographs on a wall. Look closely at the brushwork. It's loose and painterly, detailed enough to read as two specific people, but handled like fine art rather than a copy of a snapshot.\n\nShe's originally from Los Angeles, now based across the bay in Tampa, and her first solo show opened in New York back in twenty fourteen.", "rev": {"date": "2026-08-15", "note": "revised script + Rob's cloned voice"}}, {"id": 61, "artist": "Imagine", "title": "", "year": 2022, "aud": "https://cdn.muralquest.app/audio/61.mp3?v=3", "text": "The gold letters cascading down this hot pink wall aren't decoration. They're a mantra, written in Devanagari script, the same sacred text repeated across the entire wall like a visual chant.  Look closely at the gold clusters. Underneath them, red and pink swirls move like a current behind the words.\n\nThe artist goes by Imagine. Her name is Sneha Shrestha, born in Nepal, based in Boston. She holds a master's from Harvard, where she works at the Mittal South Asia Institute. She founded Nepal's first Children's Art Museum. And she is the first contemporary Nepali artist in the collection of the Museum of Fine Arts Boston.\n\nHer style fuses Buddhist mandala traditions with graffiti and American abstract expressionism. She paints these mantras using a disciplined breathing technique, one letter at a time.\n\nShe made this for SHINE in twenty twenty-two.", "rev": {"date": "2026-08-15", "note": "revised script + Rob's cloned voice"}}, {"id": 62, "artist": "James Bullough", "title": "", "year": 2022, "aud": "https://cdn.muralquest.app/audio/62.mp3?v=2", "text": "Before he was painting buildings eleven stories tall in Berlin, James Bullough was teaching middle school in Baltimore. In twenty ten he moved to Germany and taught himself to paint instead \u2014 realistic oil, learned by studying the Old Masters of the Netherlands.\n\nLook up. That woman in the crimson dress is caught mid-leap, head tilted back, arms flung open. And she's coming apart. Bullough takes a photorealistic figure and shatters it into ribbon-like shards, so she seems to dissolve and reassemble in the same instant against the black.\n\nHis work hangs at Wynwood Walls in Miami, at Lollapalooza, on the URBAN NATION museum in Berlin. He came here for Shine in twenty twenty-two.\n\nFollow one of those coral and navy strips as it peels off her body and drifts into the void. Watch how the color keeps moving...", "rev": {"date": "2026-08-15", "note": "revised script + Rob's cloned voice"}}, {"id": 64, "artist": "Jeff Williams", "title": "", "year": 2022, "aud": "https://cdn.muralquest.app/audio/64.mp3?v=2", "text": "Everything on this wall is hand-painted, and none of it is old. It just looks like it's been here since nineteen fifty-five.\n\nJeff Williams is a St. Petersburg native, and he taught himself this trade in twenty twelve after watching a documentary called \"Sign Painters.\" Before that he was a leather engraver, then a house painter \u2014 making his own work at night with whatever paint was left over. His shop, Sun Signs and Lettering, runs the way one would have run in nineteen fifty-five. His hand is on the signage at Sunken Gardens, and he lettered a truck for Disney Springs.\n\nWhat you're looking at is a stack of vintage Florida tourism signs \u2014 souvenirs, oranges, pin-ups, the whole postcard fantasy...painted in vintage style.", "rev": {"date": "2026-08-15", "note": "revised script + Rob's cloned voice"}}, {"id": 66, "artist": "Marina Capdevila", "title": "", "year": 2022, "aud": "https://cdn.muralquest.app/audio/66.mp3?v=2", "text": "Every one of these orange faces is having a better day than you are. That's the point. Marina Capdevila paints old age as something loud and vital \u2014 her own grandmother is her muse, and she renders elderly people the way most art won't: mischievous, glamorous, fully alive.\n\nShe trained in Barcelona and Amsterdam, and she folds a Renaissance trick into all this chaos \u2014 sfumato, that soft blur the old masters used for shading, here wrapped around cartoon exaggeration and a lot of irony. She's painted in more than fifteen countries. This one she made for Shine in twenty twenty-two.\n\nWhat an odd day in the sunshine city! The giant face in the reflective sunglasses is calmly holding a lobster. To the right, someone in a bucket hat dangles a fish on a line. And up top, tiny palm trees, in case you forgot where you are.", "rev": {"date": "2026-08-15", "note": "revised script + Rob's cloned voice"}}, {"id": 71, "artist": "The Happy Mural Project", "title": "Wild Ride", "year": 2022, "aud": "https://cdn.muralquest.app/audio/71.mp3?v=2", "text": "An American alligator, snout to tail, running the length of an entire building. The head alone eats up about a third of the wall. Look at the scale texturing in those rich browns and chocolates, then the golden sunflowers crowding in behind it against a teal sky. It's a Florida postcard, blown up to the size of a building.\n\nThis is the work of The Happy Mural Project \u2014 Alyssa Marie and Braden Everly, a married couple who moved here from Colorado. Their motto is \"Honk if You're Happy.\" Their first mural went up days before the world shut down in the spring of twenty twenty.\n\nOversized sunflowers are their signature, and Florida wildlife runs through much of their work. They painted this one, \"Wild Ride,\" as three-time SHINE artists.", "rev": {"date": "2026-08-15", "note": "revised script + Rob's cloned voice"}}, {"id": 72, "artist": "Van Der Luc", "title": "Tank School", "year": 2022, "aud": "https://cdn.muralquest.app/audio/72.mp3?v=2", "text": "That polar bear hauling a tattered robot across the grass? That's the artist talking about the environment. No lectures, no melting ice caps \u2014 just a white bear on the move with a passenger strapped to its back.\n\nLucas Franco signs his work Van Der Luc. He's self-taught, born in Bogota, Colombia, now painting out of Pinellas Park. His subjects are huge \u2014 climate, technology, nature \u2014 but the delivery is pure storybook.\n\nHe painted this for SHINE in twenty twenty-two, the same year he became a full festival mural artist.\n\nFind the bees, buzzing and is that one bee carrying a wrench?", "rev": {"date": "2026-08-15", "note": "revised script + Rob's cloned voice"}}, {"id": 73, "artist": "Vitale Bros", "title": "", "year": 2022, "aud": "https://cdn.muralquest.app/audio/73.mp3?v=2", "text": "That paper napkin thing is real. The first mural started as a sketch on a restaurant napkin, handed to the owner, back in nineteen ninety-two. Thirty-plus years later, this is where it lands: a full row of SpongeBob characters, painted at building scale.\n\nJohnny and his brother Paul started out hand-lettering signs and painting storefront windows around Tampa Bay. No formal training. Just three generations of artists in the family. They've painted for the Rays, the Bucs, and L'Oreal, and they call themselves the mural police, restoring damaged walls around the city for free.\n\nThey've painted SHINE every single year since it began.\n\nLook at the outlines. Clean, confident, no wobble. That's what thirty years of practice buys you. And yes, this is the wall everybody stops to photograph...", "rev": {"date": "2026-08-16", "note": "revised script + Rob's cloned voice"}}, {"id": 75, "artist": "Bakpak Durden", "title": "", "year": 2021, "aud": "https://cdn.muralquest.app/audio/75.mp3?v=2", "text": "That question in the upper right corner \u2014 \"tell me how you feel\" \u2014 is doing a lot of work. Below it, a skull and exposed jawbone rise out of tangled green and gray forms on a near-black wall. This is a vanitas, the old Dutch tradition of painting death to make you think about life, blown up to the scale of a building.\n\nBakpak Durden is a self-taught artist from Detroit, working in the language of Dutch Baroque. He's a Black trans postgender painter whose first solo museum show, at Cranbrook, sold out. He painted this for Shine in twenty twenty-one, the same year he won the Gilda Award.\n\nLook closely at the teeth and the jawbone. The realism is exact, almost photographic \u2014 then it dissolves into something organic and strange. Classical technique, asking a very direct question - Are YOU OK?", "rev": {"date": "2026-08-15", "note": "revised script + Rob's cloned voice"}}, {"id": 76, "artist": "Case Maclaim", "title": "", "year": 2021, "aud": "https://cdn.muralquest.app/audio/76.mp3?v=2", "text": "That hand reaching toward you? The artist trained in art restoration before he ever picked up a spray can. Andreas von Chrzanowski \u2014 he works as Case Maclaim \u2014 studied conservation at a German university, then started spraying hands the size of buildings instead.\n\nHands are his signature. Usually he paints them overlapping and intertwined, a symbol of unity and power. He's done it freehand, no stencils, in more than twenty countries \u2014 Detroit, Brooklyn, Miami, Berlin. He painted this one for SHINE in twenty twenty-one, a tribute to healthcare workers.\n\nEverything here is aerosol, worked by hand until it reads like a photograph from clear across the parking lot.  So much detail to explore.", "rev": {"date": "2026-08-15", "note": "revised script + Rob's cloned voice"}}, {"id": 78, "artist": "Emily Ding", "title": "", "year": 2021, "aud": "https://cdn.muralquest.app/audio/78.mp3?v=2", "text": "That fawn is asleep, and there are white flowers growing right out of its back. They climb up the wall toward the window built into the design, blooming against a deep emerald green that turns the whole thing into a forest clearing.\n\nEmily Ding paints wild creatures to tell stories about emotions we recognize but can't quite name. Look at her gallery titles and you get the theme fast: \"Refuge.\" \"Revival.\" \"Resilience.\" \"Rewilding.\"\n\nShe's based in Los Angeles, and her walls have gone up in Shanghai, Oakland, Austin, and Flint. She also works with Street Art for Mankind, a nonprofit that uses public art to fight child trafficking. This one she painted for SHINE, in twenty twenty-one.", "rev": {"date": "2026-08-15", "note": "revised script + Rob's cloned voice"}}, {"id": 79, "artist": "Gleo", "title": "", "year": 2021, "aud": "https://cdn.muralquest.app/audio/79.mp3?v=2", "text": "The faces in front of you were made without a single spray can. Gleo works in acrylics \u2014 brushes and rollers, the slow way. That patience once carried her across a fifty-thousand-square-foot grain elevator in Wichita, Kansas, which set the record for the largest acrylic mural painted by one artist.\n\nShe's Nathalia Gallego Sanchez, born in Cali, Colombia, in nineteen ninety-two. Her name is wordplay pulled from her surname, Gallego. She studied chemistry by day, art by night, and decided the formal training was too theoretical. So she went her own way.\n\nHer work pulls from Colombian folklore and ancestral cosmology \u2014 women with patterned faces, flowers woven through their hair. She painted this for SHINE in twenty twenty-one.", "rev": {"date": "2026-08-15", "note": "revised script + Rob's cloned voice"}}, {"id": 80, "artist": "Greg Mike", "title": "", "year": 2021, "aud": "https://cdn.muralquest.app/audio/80.mp3?v=2", "text": "Justin Bieber collects his work. So does Diplo. And his digital series, called Mad Cans, pulled in three million dollars.\n\nThat's Greg Mike, and you're standing in front of the reason he's collectible. Look at the wall \u2014 bug-eyed, grinning characters packed edge to edge in electric pink, green, and yellow.\n\nHe started tagging Atlanta at thirteen and turned it into a career. Now he paints for Nike, Coca-Cola, Google, and the Atlanta Falcons, and he's produced more than a hundred murals in his home city alone. He painted this one for Shine in twenty twenty-one.\n\nHis signature character is a loudmouth named Larry. Scan the crowd of faces in front of you \u2014 the manic grins, the wide eyes. Once you spot Larry, you won't unsee him.  He's the blue box with the big mouth - at least three Larry's are in this mural!", "rev": {"date": "2026-08-15", "note": "revised script + Rob's cloned voice"}}, {"id": 84, "artist": "Jenipher Chandley", "title": "Be-you-tiful!", "year": 2021, "aud": "https://cdn.muralquest.app/audio/84.mp3?v=3", "text": "This wall was Jenipher Chandley's first festival mural \u2014 SHINE, twenty twenty-one. Before this, she painted on canvas. Now she's got giant lemons glowing against navy blue on the side of a tile shop.\n\nChandley was born and raised right here in St. Petersburg. She  works mostly in oils \u2014 figurative, a little surreal \u2014 and her one recurring subject is the story of love: seeking it, losing it, finding it again. This wall is lighter. Just citrus, orange blossoms, and a small pep talk hiding in the design.\n\nBack around twenty eleven she started painting on nights outside a bar on Central. Today she curates that same building and hosts a free art meetup every Wednesday.", "rev": {"date": "2026-08-15", "note": "revised script + Rob's cloned voice"}}, {"id": 88, "artist": "Miss Crit", "title": "Nowness is the Portal", "year": 2021, "aud": "https://cdn.muralquest.app/audio/88.mp3?v=2", "text": "One of her illustrations traveled to two hundred thirty-eight cities in sixty-nine countries \u2014 chosen for the global Creative Mornings theme \"Rise.\" The artist is Miss Crit, and she's from right here.\n\nLaura Spencer was born and raised in St. Petersburg, trained at Gibbs High School's arts center, then earned an illustration degree from Ringling. She describes her own style as a little bit spooky and a little bit psychedelic. She co-created a fifty-thousand-dollar mosaic at Sunset Park, and she leads SHINE's trolley tour of the murals.\n\nThis one reads \"Nowness is the Portal,\" the cream lettering curving through a jungle of monstera, ti plants, and broad tropical leaves against deep teal. The words are the invitation. The garden is the reward.\n\nLook, where a single white magnolia bloom is opening \u2014 the one bright flower in all that green.", "rev": {"date": "2026-08-15", "note": "revised script + Rob's cloned voice"}}, {"id": 89, "artist": "Mwanel Pierre-Louis", "title": "", "year": 2021, "aud": "https://cdn.muralquest.app/audio/89.mp3?v=2", "text": "Stand close, and it's a photorealistic portrait \u2014 a woman with long locs, every detail sharp. Step back, and the edges dissolve into pure color, warm yellow and maroon bleeding into earth tones. Mwanel Pierre-Louis has built a whole career on that contradiction, the precise subject against the loose wash around it.\n\nHe was born in New York to Haitian parents and works out of Miami. His client list is a lineup: Adidas, Jack Daniel's, Starbucks, the NBA, the Miami Dolphins, Formula One Miami. He painted this one for SHINE in twenty twenty-one, on the side of Green Bench Brewing.\n\nThe whole piece reads differently depending on where you stand, so try it both ways. Look close and then step back - which do you prefer?", "rev": {"date": "2026-08-15", "note": "revised script + Rob's cloned voice"}}, {"id": 90, "artist": "Nicole Salgar", "title": "The Commuter", "year": 2021, "aud": "https://cdn.muralquest.app/audio/90.mp3?v=2", "text": "For seven years, Nicole Salgar designed clothes for Ralph Lauren. Now she paints walls three stories tall.\n\nThe woman looking back at you is a gatekeeper. Salgar built this piece around the idea of transitions and transformation through our lives, and she stands at the transitions between worlds. \n\nSalgar trained in tailoring at the Fashion Institute of Technology, then walked away from fashion to make her first mural on Manhattan's Lower East Side. Her work runs on Latin folk art, horror, and old sci-fi cinema. In twenty twenty-five, the Dali Museum picked her for a show.\n\nShe painted this one for SHINE, back in twenty twenty-one.", "rev": {"date": "2026-08-15", "note": "revised script + Rob's cloned voice"}}, {"id": 93, "artist": "Woes Martin", "title": "", "year": 2021, "aud": "https://cdn.muralquest.app/audio/93.mp3?v=2", "text": "Those pandas are not having a good day. Snarling, bloodshot, fangs out, claws the size of your arm. This is Woes Martin's signature character, a stressed-out panda that stands for struggle and perseverance. Look closely and you'll notice not every bear is fighting. Some are asleep, one eye cracked open, keeping watch.\n\nWoes grew up on Oahu and taught himself everything through graffiti, hip hop, and comics. His work has landed at Urban Nation in Berlin, at Comic-Con, and on projects for Disney, Converse, and Kidrobot. He painted this wall for SHINE in twenty twenty-one.\n\nThe whole pile is black and white against black \u2014 except for one thing. Find the bright green bamboo pushing up through the tangle of fur and limbs. In a wall full of exhausted, furious bears, that's the only living thing that looks calm.", "rev": {"date": "2026-08-15", "note": "revised script + Rob's cloned voice"}}, {"id": 98, "artist": "Brian Butler", "title": "", "year": 2020, "aud": "https://cdn.muralquest.app/audio/98.mp3?v=2", "text": "This one's a warning. Brian Butler called it \"Carbon Punishment,\" and he painted it for Sea Walls \u2014 the ocean-conservation strand of SHINE twenty twenty. The subject is ocean acidification: what happens to the sea as it soaks up the carbon we put in the air.\n\nHe made the science visible. The sea life is painted in the colors of the pH scale, the same scale that measures how acidic the water is turning. The shells wear those acidic hues \u2014 and they're failing, riddled with polluted cracks and small skulls. A healthy ocean doesn't look like this.\n\nThat lettering is a choice too: jagged and heavy, a nod to Tampa Bay's death-metal roots. Butler even had two metal musicians write grindcore tracks to blast alongside the wall.\nLook close at the shells. The cracks aren't decoration \u2014 that's carbon, doing its work.", "rev": {"date": "2026-08-15", "note": "revised script + Rob's cloned voice"}}, {"id": 101, "artist": "IBOMS", "title": "Where the Bloom Begins", "year": 2020, "aud": "https://cdn.muralquest.app/audio/101.mp3?v=4", "text": "That tattooed figure glaring sideways at you? The word across its chest reads \"blooms\" \u2014 and it's not the flower kind. I-bombs painted this for the Sea Walls program, which sends artists after ocean threats. His target here is red tide, the harmful algal bloom that turns Florida's coast toxic and lines the beaches with dead fish.\n\nI-bombs is a St. Petersburg native. The name stands for \"illegal. Beauty. On. My. Streets.\" His solo show at Myze Gallery sold out in forty-eight hours. He works by what he calls the iceberg theory \u2014 a bright, celebratory surface with something heavier underneath.\n\nYou are standing in front of the surface right now. Look low, at the base of the wall, past those piled brown cloud shapes. There's a thin wavy white line, and a few small fish swimming along the bottom edge. That's where the bloom begins.", "rev": {"date": "2026-08-16", "note": "'Myze' = intentional PHONETIC for Chad Mize (voice said 'meeze') \u2014 do not 'fix' to 'Mize'."}}, {"id": 103, "artist": "Lili Yuan", "title": "", "year": 2020, "aud": "https://cdn.muralquest.app/audio/103.mp3?v=2", "text": "That calligraphy to the left reads \u2014 the highest good is like water. It's a line from the Tao Te Ching, and it's the whole idea behind what you're looking at. A woman floats face-up in turquoise water, seen from above, her red dress spreading around her like a flower opening.\n\nLili Yuan paints this way in oil, on canvas, and each piece takes her more than a hundred hours. She left Hangzhou at thirteen, studied economics, and is largely self-taught as a painter. Water is a subject she returns to again and again.\n\nShe titled this one \"Gift,\" painted for SHINE in twenty twenty.\n\nLook at the light on the water \u2014 the ripples, the way it bends and pools across her dress. Then find the small red seal stamp down in the lower left corner. That's her signature...", "rev": {"date": "2026-08-15", "note": "revised script + Rob's cloned voice"}}, {"id": 108, "artist": "Stephen Palladino", "title": "", "year": 2017, "aud": "https://cdn.muralquest.app/audio/108.mp3?v=2", "text": "Tiffany hires this man. So does Lady Gaga. Stephen Palladino was painting large-scale murals across New York City as a teenager, and here he's given ninety-five feet of wall to fill.\n\nFrom where you're standing, it reads as a cheery abstract puzzle \u2014 aqua, orange, lime green, purple. Step closer. The bright color breaks apart into bold black line drawings, faces and distorted figures in a style rooted in German Expressionism. Slick and gritty at the same time.\n\nPalladino was born in the Bronx in nineteen eighty-six. Classical art training at age ten, but the real education happened on the streets.\n\nCheck out the words scrawled across the wall, in his own handwriting. \"Love me.\" \"Nobody but you.\" \"Not true.\"  He painted all of it for SHINE, in twenty seventeen.", "rev": {"date": "2026-08-15", "note": "revised script + Rob's cloned voice"}}, {"id": 109, "artist": "Chad Mize", "title": "Twiggy", "year": 0, "aud": "https://cdn.muralquest.app/audio/109.mp3?v=4", "text": "That face is Twiggy, the sixteen-year-old who became the most famous model of the nineteen sixties. What you're looking at traces back to a single Barry Lategan photograph from nineteen sixty-six \u2014 the doe eyes, the painted lashes, the whole look that made her a household name. \n\nChad Myze stencilled it here, in the alley behind Central. He's a St. Pete fixture. He designed the \"Paris, Tokyo, London, St. Pete\" shirt back in twenty ten, and it's still selling in local shops sixteen years later. He also spent a full decade on the organizing committee for SHINE, the mural festival that put a lot of this work on these walls. Notice how muted this one is \u2014 soft pastel, a faded light blue, quiet against the louder pieces nearby. \n\nThen look at her eyes. Those stars catch an iridescent sheen that shifts as you move, and sometimes when I have walked by, the floodlight in one of her eyes is lit up.  Kinda cool, when you see that.", "rev": {"date": "2026-08-18", "note": "revised script + Rob's cloned voice"}}, {"id": 110, "artist": "Shark Toof", "title": "", "year": 2015, "aud": "https://cdn.muralquest.app/audio/110.mp3?v=2", "text": "I absolutely love this mural - it still looks awesome, despite the fading red.  \n\nThis shark once shared screen time with LeBron James. Samsung put it in a commercial. Apple ran it in an iPad ad. Same great white you're looking at right now, fifty-five feet of it, diving headfirst down the east wall of the State Theater.\n\nThe artist is David Lew, who goes by Shark Tooof. He trained at the Art Center College of Design in Pasadena, and his hand-drawn great white has turned up on walls from Wynwood to Cambodia. His client list runs from Heineken to Toyota to Axl Rose, who got a personal tour jacket.\n\nHe painted this over four days for SHINE, back in twenty fifteen. Roughly one hundred cans of spray paint.\n\nLook at the head. The mouth is wide open, rows of white teeth bared, aimed straight down at that red metal door. Many have someone take their picture while standing in the door - the shark bearing down on them!", "rev": {"date": "2026-08-15", "note": "revised script + Rob's cloned voice"}}, {"id": 111, "artist": "Sarah Sheppard", "title": "Life Reimagined", "year": 2017, "aud": "https://cdn.muralquest.app/audio/111.mp3?v=2", "text": "Those gears on the right side aren't just decoration. This whole mural is built like a steampunk painting, framed in navy blue with ornate gold trim, and those massive interlocking bronze and gold gears stand for the passage of time and the mechanics of a working life. At the center, a woman becomes a banyan tree. Her body turns into the trunk, her roots spread into the ground, as she reaches out toward a red phoenix on the left \u2014 rebirth, quite literally. \n\nSarah Sheppard painted this in twenty seventeen for AARP's Age Friendly St. Pete program. She studied metalsmithing to carry on work her late father began. Both her parents were artists, the family trade runs deep.", "rev": {"date": "2026-08-15", "note": "revised script + Rob's cloned voice"}}, {"id": 114, "artist": "J&S Signs", "title": "Point of Pines", "year": 2018, "aud": "https://cdn.muralquest.app/audio/114.mp3?v=2", "text": "\"Pinellas\" is Spanish for \"point of pines\" \u2014 that's the county's original name, and the title of what you're looking at. These three storefronts never existed. Jeffrey Sincich and Josh Stover invented them: a green motel with a neon sign, a mustard post office, a pink apartment with orange columns. Mid-century St. Pete, if you squint, painted in the style of an old children's book.\n\nThe two met as ceramics majors at the University of Florida, then founded J&S Signs here in twenty thirteen, painting positive-message murals around town. They've since moved to Portland and taken on Nike, Adidas, and Patagonia. For SHINE twenty eighteen, they came back and painted this.\n\nLook, they are still selling oranges for a dollar ninety-nine.", "rev": {"date": "2026-08-15", "note": "revised script + Rob's cloned voice"}}, {"id": 115, "artist": "Derek Donnelly", "title": "365 Million Things To Do", "year": 2018, "aud": "https://cdn.muralquest.app/audio/115.mp3?v=2", "text": "Yes, that's a T-Rex in a Hawaiian shirt going fishing. And yes, it was painted for AARP.\n\nDerek Donnelly made this one in twenty eighteen as part of a series called \"Age Friendly St. Pete.\" The dinosaur, bucket hat and round glasses and fishing rod over the bay, stands in for the older generation of this city enjoying life to the fullest. The joke lands, but it means something.\n\nDonnelly is a Pinellas County native who went full-time on murals back in twenty ten. He builds things for other people, too. When his mentor Bill Correira died, Donnelly organized a forty-artist tribute mural on Central Avenue that's still a landmark.", "rev": {"date": "2026-08-15", "note": "revised script + Rob's cloned voice"}}, {"id": 116, "artist": "Chad Mize", "title": "", "year": 0, "aud": "https://cdn.muralquest.app/audio/116.mp3?v=3", "text": "That \"Paris, Tokyo, London, St. Pete\" shirt you keep seeing around town? Chad Myze drew it back in twenty ten, and sixteen years later it's still selling in local shops. This wall is the same instinct, three stories tall \u2014 every Florida clich\u00e9 he could fit, rendered in bold lines and candy colors. Flamingos, a pink dolphin, an orange slice, a mermaid, a retro couple splashing in the surf.\n\nMyze moved here in two thousand three and has been pushing the Tampa Bay art scene ever since. He co-founded a gallery on Central that showed more than four hundred artists, and he sat on the SHINE mural festival committee for a solid decade.\n\nHis whole style is tongue-in-cheek, and it's all here.", "rev": {"date": "2026-08-16", "note": "revised script + Rob's cloned voice | 'Myze' = intentional PHONETIC for Chad Mize (voice said 'meeze') \u2014 do not 'fix' to 'Mize'."}}, {"id": 119, "artist": "Matt Kress", "title": "", "year": 0, "aud": "https://cdn.muralquest.app/audio/119.mp3?v=2", "text": "Air traffic controllers have a name for the plane this artist painted. They call it \"Skittles.\" Matt Kress covered a nineteen sixty-seven Mooney in forty-five colors, and it won Best Unique Paint Scheme at Oshkosh.  The picture of the plane is truly amazing.\n\nThat same instinct for bold color is right in front of you. These are pets, painted like stained glass \u2014 a Boston terrier, a big dark dog, a tabby cat, all broken into faceted blocks of blue, orange, green and red against a kaleidoscope of diamonds.\n\nKress spent almost sixteen years in a desk job, afraid art wasn't a real career. He visited St. Pete in twenty fourteen, saw a town full of murals, and moved. His first commission paid a thousand dollars for two weeks of work. He's since painted more than thirty walls, including a seventy-foot sea turtle in Tampa.", "rev": {"date": "2026-08-16", "note": "revised script + Rob's cloned voice"}}, {"id": 120, "artist": "Melanie Posner", "title": "", "year": 2023, "aud": "https://cdn.muralquest.app/audio/120.mp3?v=2", "text": "Look closely at those sunglasses. The lenses aren't just reflective \u2014 they're mirroring a waterfront skyline right back at you. That's the whole trick of the piece, hidden in plain sight.\n\nMelanie Posner paints women like this on purpose: strong, confident, the kind you're meant to be inspired by. Oversized eyes, vibrant color, and here, a scatter of polka dots in pink, gold, red, and light blue against cool teal.\n\nShe earned her painting degree at the University of Tampa, and now works out of Los Angeles. Her range is wide. She's done scenic art for Star Wars: Galaxy's Edge at Disney World, and an eighteen-foot mural on the back of the Hollander Hotel that she finished in under five days.", "rev": {"date": "2026-08-16", "note": "revised script + Rob's cloned voice"}}, {"id": 121, "artist": "Palehorse", "title": "Temple of Eternal Bliss", "year": 2019, "aud": "https://cdn.muralquest.app/audio/121.mp3?v=2", "text": "Every scale, every flame tip, every architectural ornament in front of you was drawn individually. Look closely \u2014 that intricate temple, those two coiling serpent-dragons, all of it rendered in fine linework against jet black.\n\nThis is \"Temple of Eternal Bliss,\" painted by Palehorse in twenty nineteen with his brother Matt Parks. The name comes from a Sanskrit idea : existence, consciousness, bliss. Palehorse isn't just borrowing the imagery. His practice is rooted in Kriya Yoga, and he hosts weekly meditation circles called Seekers of the Eternal.\n\nBy day, he's Chris Parks, who co-founded the SHINE mural festival and has drawn gig posters for the Foo Fighters, Iggy Pop, and Jimi Hendrix.\n\nFind the thin white circle framing the central pagoda. It sits behind the spires like a halo, holding the whole composition together.", "rev": {"date": "2026-08-16", "note": "revised script + Rob's cloned voice"}}, {"id": 122, "artist": "Phi Phi Artland Team", "title": "Stronger Together", "year": 2024, "aud": "https://cdn.muralquest.app/audio/122.mp3?v=2", "text": "Every one of these faces was painted by a different pair of hands. Neighbors, families, first-time painters \u2014 this wall came together over four weekends in twenty twenty-four, each weekend led by a different artist from the Phi Phi Artland team.\n\nThe project started small, as a contest to give one local storefront a free mural. Then Hurricanes Helene and Milton hit Florida, and Sara Saylem, who led the whole thing, wanted more than a pretty wall. She wanted people making something together. A grant from the St. Pete Arts Alliance made it happen.\n\nSo look at how the faces work. Each one is a block of bold color \u2014 greens, purples, pinks, oranges \u2014 overlapping and interlocking like puzzle pieces. No single face stands alone.", "rev": {"date": "2026-08-16", "note": "revised script + Rob's cloned voice"}}, {"id": 123, "artist": "DAAS", "title": "We Are Going to Be Friends", "year": 2018, "aud": "https://cdn.muralquest.app/audio/123.mp3?v=2", "text": "Those rabbits didn't start here. This is the fourth chapter in an ongoing story about a young girl and the natural world \u2014 the first three were painted in Italy and China. The title comes from the White Stripes song.\n\nDaas built these bunnies the way he builds everything: from interlocking angular planes, a style he developed during roughly a decade in Osaka, based on the crease patterns of Japanese origami. Soft grays, whites, lavenders, pale blues \u2014 fractured, cubist, and still unmistakably rabbits.\n\nAll of it is spray paint. Twenty-five feet tall, a hundred and three feet wide, finished in seven days.\n\nLook at the background behind the animals \u2014 that patchwork of big triangles in golds, olive greens, corals, and tans. It reads like a quilt. Then find the blocky Dass tag up in the upper right corner, signing off on the whole warm geometric field", "rev": {"date": "2026-08-16", "note": "revised script + Rob's cloned voice"}}, {"id": 125, "artist": "Illsol", "title": "Notice Us", "year": 2018, "aud": "https://cdn.muralquest.app/audio/125.mp3?v=2", "text": "In the nineteen-nineties, the Florida panther nearly vanished. Fewer than two hundred and thirty adults were left in the wild. This one looms twenty-two feet over the intersection, and it is looking right at you.\n\nThe title is \"Notice Us\" \u2014 a plea on behalf of Florida's wildlife, asking you to notice what development costs a fragile ecosystem.\n\nThe panther is the work of Illsol, a Tampa husband-and-wife team. The name means \"illuminated soul.\" Michelle Sawyer trained as a tattoo artist. Tony Krol taught himself stencil work. Together they blend clean, photorealistic portraits with layered abstraction.\n\nYou can see both here. The face is rendered in exact detail \u2014 the fur, the whiskers, the gold-green eyes. Then everything dissolves into turquoise rings, coral halos, and monstera leaves.\n\nFind the eyes. Hold their gaze for a second. That's what the artists want...", "rev": {"date": "2026-08-16", "note": "revised script + Rob's cloned voice"}}, {"id": 129, "artist": "John Vitale", "title": "", "year": 2025, "aud": "https://cdn.muralquest.app/audio/129.mp3?v=2", "text": "His first mural started on a paper napkin, sketched and handed to a restaurant owner back in nineteen ninety-two. That was Johnny Vitale.\n\nHe and his brother Paul built Vitale Brothers in Tampa Bay hand-lettering signs and painting storefront windows. No formal training \u2014 just three generations of artists in the family and thirty-some years of practice. Around here they call themselves the mural police, restoring damaged walls across the city for free.\n\nWhat you're looking at is his solo piece for SHINE Origins twenty twenty-five, painted on the six hundred block where it all began for him. Orange blossoms and ripe citrus climbing the columns of the sage-green building, turning the architecture itself into a Florida grove.", "rev": {"date": "2026-08-16", "note": "revised script + Rob's cloned voice"}}, {"id": 130, "artist": "Angela Faustina", "title": "Citrus Medley", "year": 2018, "aud": "https://cdn.muralquest.app/audio/130.mp3?v=2", "text": "Nine days, one brush. That's how Angela Faustina painted the two walls of giant citrus you're standing between here at Green Bench Brewing. No roller, no spray can \u2014 brush only. At the time, it was the largest work she'd ever made.\n\nLook close at the slices. Blood oranges, grapefruits, lemons, limes, navel oranges, all cut clean through and blown up to a scale you'd never see in your kitchen \u2014 the membrane, the seeds, the juice. Faustina works in hyperrealistic oil, magnifying what lives just under the peel.\n\nShe lives with lupus, and the work carries that: vivid color and delicate intricacy, strength and fragility in the same frame.", "rev": {"date": "2026-08-16", "note": "revised script + Rob's cloned voice"}}, {"id": 131, "artist": "Jimmy Breen & Anthony Freese", "title": "Lucky You", "year": 2019, "aud": "https://cdn.muralquest.app/audio/131.mp3?v=2", "text": "The man who designed album art for the Grateful Dead, Green Day, and Bruno Mars also painted this wall. Jimmy Breen and his Wax and Hive partner Anthony Freese made \"Lucky You\" for the SHINE festival in twenty nineteen. Eighteen feet tall, forty-two feet wide, aimed straight at the interstate so drivers heading north catch it at speed.\n\nIt's a grid of good luck charms borrowed from cultures all over the world. A horseshoe pointing up so the luck doesn't spill out. A four-leaf clover. An Italian cornicello, a Japanese beckoning cat, a hamsa hand watching over an evil eye. The premise is simple: we're all lucky to live in Saint Pete.\n\nBreen died in twenty twenty-two, at thirty-seven, one of this city's most prolific muralists.", "rev": {"date": "2026-08-16", "note": "revised script + Rob's cloned voice"}}, {"id": 133, "artist": "Michael Reeder", "title": "Beneath the Shell", "year": 2016, "aud": "https://cdn.muralquest.app/audio/133.mp3?v=3", "text": "Reed this wall left to right and you're watching a life story run backwards. It starts as pure pattern \u2014 pink, teal, and gold cubes that seem to float off the bricks, right across the roll-up garage door. Then a photorealistic human skull pushes through the illusion. And at the far right, a living face \u2014 just a nose, eyes, and brow in warm flesh tones \u2014 peeks out from behind the bone. Abstraction, death, life. That's the shell, and what's beneath it.\n\nMichael Reeder built his name mixing that kind of lifelike detail with flat graphic space. He earned his painting degree in New York, did a residency at Red Bull House of Art in Detroit, and painted this for SHINE in twenty sixteen.", "rev": {"date": "2026-08-16", "note": "revised + Rob's voice. 'Reed' (first word) = intentional PHONETIC for 'Read' (imperative) \u2014 voice said 'red'. Artist name 'Reeder' unchanged."}}, {"id": 135, "artist": "LOOK the Weird", "title": "Existence is Absurd", "year": 2018, "aud": "https://cdn.muralquest.app/audio/135.mp3?v=2", "text": "Take a close look that this mural, the next time you visit it might not be here.  This whole block is set for redevelopment.\n\nNow Look closer, and the whole mural starts to bend. What reads as color and calm from across the street turns unsettling up close \u2014 melting landscapes, rippling glass, plant tendrils that don't quite behave. That's the point. Lars Wunderlich, who paints as LOOK the Weird, built this piece around Florida's environment: hurricane damage, red tide, the contradictions of living here. He says he loves to provoke questions.\n\nHe's been painting walls since he was fifteen, in East Germany, and he co-founded an international crew called The Weird. These days his work leans into algorithms and glitches \u2014 portraits generated by machine, then distorted by hand.\n\nHe painted this for the SHINE festival in twenty eighteen.", "rev": {"date": "2026-08-16", "note": "revised script + Rob's cloned voice"}}, {"id": 136, "artist": "Ya La'Ford", "title": "", "year": 2022, "aud": "https://cdn.muralquest.app/audio/136.mp3?v=2", "text": "The artist who painted this holds an MFA and a law degree, and once represented the United States at the Dakar Biennale in Senegal. Ya La'Ford designed an IndyCar for Arrow McLaren and was a featured artist for the twenty twenty-one Super Bowl. Here, on the front of an electrical warehouse, she's working in her signature language: sacred geometry and refracted light.\n\nLook at the three white forms against the black wall. Segments of two circles on the sides, one full circle centered. Each is packed with angular white linework, straight segments interlocking like shattered ice or stained glass. The black background does the work of night, so the geometry seems to glow.\n\nLook closer at the white network. She's slipped in faint accents of blue, pink, and warm gold, lighting up a few segments inside the crystal.", "rev": {"date": "2026-08-16", "note": "revised script + Rob's cloned voice"}}, {"id": 138, "artist": "PHYBR", "title": "", "year": 2024, "aud": "https://cdn.muralquest.app/audio/138.mp3?v=2", "text": "Everything on this wall is falling toward a single point, and if you stare too long, you go with it. It's a vortex of childhood \u2014 Tom and Jerry mid-chase, a Rubik's cube, a Game Boy, a Tamagotchi, and a pink Furby with glowing blue eyes, all tumbling into a dark center. Look close: every toy casts its own shadow, catching light as if it's really spinning through space.\n\nThe artist is Ken Dushane the Third, who paints as Phiber. He's put up more than two hundred and fifty murals in twelve years, worked for Universal Pictures, and \u2014 briefly \u2014 spent two weeks as A$AP Rocky's creative director. He also has a background in horticulture, which explains the tropical plants in his other work.\n\nFind the grey Beanie Baby. Its little red heart tag is still attached.  And careful you don't fall into the vortex with Kermit the frog!", "rev": {"date": "2026-08-16", "note": "revised script + Rob's cloned voice"}}, {"id": 140, "artist": "Cecilia Lueza", "title": "Encounter", "year": 2018, "aud": "https://cdn.muralquest.app/audio/140.mp3?v=2", "text": "Two birds, facing each other, mid-greeting. Mirror poses. An avian conversation frozen on a cinder-block wall.\n\nCecilia Lueza painted this in twenty eighteen. Over the years it faded, and nearby construction chipped it up. So in twenty twenty-three she came back and restored it, funded through a National Endowment for the Arts grant. She and the ArtsXchange team could have designed something new. They kept this one. They were fond of it.\n\nLueza has nearly sixty public works to her name, from the Atlanta BeltLine to the North Carolina Museum of Art.\n\nLook at how each feather radiates from a central spiral \u2014 one clean flat wedge of color at a time. Warm bird, cool bird, same open sky between them.  Check her other murals on 10th Street North and Downtown on the One, a residential tower - all stunning colors that jump out from the murals.", "rev": {"date": "2026-08-16", "note": "revised script + Rob's cloned voice"}}, {"id": 151, "artist": "Jade Rivera", "title": "El Templo - Find the Light", "year": 2016, "aud": "https://cdn.muralquest.app/audio/151.mp3?v=2", "text": "That blue ibis standing on the boy's chest is a messenger \u2014 in Jade Rivera's work, birds move between worlds, and they show up again and again, larger than life, watching over sleeping figures.\n\nRivera is a self-taught Peruvian muralist. He picked up graffiti at fourteen, has been painting walls since the late nineties, and now runs his own museum, gallery, and clothing line all on a single street in Lima. He's worked in more than seventeen countries. He painted this one for Shine, back in twenty sixteen.\n\nIt stretches forty-five feet \u2014 a boy on his back, eyes closed, held in dreamlike stillness against a deep blue-black.", "rev": {"date": "2026-08-16", "note": "revised script + Rob's cloned voice"}}, {"id": 156, "artist": "Vitale Bros", "title": "Ride 'em Cowboy", "year": 0, "aud": "https://cdn.muralquest.app/audio/156.mp3?v=2", "text": "That cowboy isn't riding a horse. Look again \u2014 he's swinging a lasso from the back of a green alligator, palm trees and a sunset behind him. Classic Americana postcard, run through a Florida filter.\n\nThis is the work of the Vitale Brothers, Johnny and Paul, out of Tampa Bay. No formal training between them \u2014 just a family line of artists going back to their grandparents, and thirty-plus years of practice. Their very first mural started as a sketch on a paper napkin, handed to a restaurant owner back in nineteen ninety-two.\n\nBefore you move on, look at the frame itself. The wood grain, the nail heads \u2014 all painted.", "rev": {"date": "2026-08-16", "note": "revised script + Rob's cloned voice"}}, {"id": 157, "artist": "PlasticBirdie & Blaine Fontana", "title": "The 8th Funky Fish Town", "year": 2019, "aud": "https://cdn.muralquest.app/audio/157.mp3?v=2", "text": "This is the first public art project in the country funded by NOAH \u2014 the federal ocean agency. Stretch that fact across twenty-five feet tall and a hundred and seventy-five feet long, and you get the wall in front of you. The largest SHINE mural of twenty nineteen. Four hundred cans of spray paint, eight days.\n\nJeremy Nichols and Blaine Fontana, both based in Portland, painted it in partnership with Sea Walls, a program putting ocean science on public walls. The subject is Florida's small fishing towns and the fragility underneath them, borrowed from the look of old school-book infographics.\n\nStart at the right, with the bald eagle \u2014 that sharp blue eye, the curved beak in warm golds and teal. Then follow it left, where the whole bird fractures into geometric triangles and dissolves into pure abstraction. Very impressive mural unfolding along the pinellas trail.", "rev": {"date": "2026-08-16", "note": "revised + Rob's voice. NOTE: 'NOAH' is an intentional PHONETIC spelling for NOAA (the ocean agency) \u2014 do not 'fix' to 'NOAA'."}}, {"id": 163, "artist": "Jujmo", "title": "Aquatic Forest", "year": 2017, "aud": "https://cdn.muralquest.app/audio/163.mp3?v=2", "text": "Those blob creatures peeking out at you with dot eyes and little mouths? Blame anime. The artist, Cheryl Weber, who signs her work Jujmo, grew up a military kid moving between bases overseas, with almost no access to cartoons. When she finally got to watch anime in the States, she decided to become an artist.\n\nShe's Filipina American, based in Tampa, with a fine arts degree from the University of South Florida and more
