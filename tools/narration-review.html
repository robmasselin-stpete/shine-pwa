 than ten years of murals behind her. In twenty twenty, she painted the \"B\" in the Black Lives Matter street mural at the Dr. Carter G. Woodson Museum.\n\nLook closely and you'll notice there isn't a single straight line anywhere here. Everything curves and intertwines \u2014 coral, amoebas, all in soft pinks and deep blues, drawn from Japanese and Filipino folklore. An underwater garden that never quite decides what planet it's on.", "rev": {"date": "2026-08-16", "note": "revised script + Rob's cloned voice"}}, {"id": 166, "artist": "Chad Mize", "title": "", "year": 0, "aud": "https://cdn.muralquest.app/audio/166.mp3?v=3", "text": "Count them if you want. Good luck. There are hundreds of hand-drawn icons packed edge to edge on this teal wall, and no two are the same. Flamingos, an octopus, a UFO, pizza slices, a Volkswagen bus, an all-seeing eye. It's Florida and pop culture crammed together with no space wasted.\n\nChad Myze has been doing tongue-in-cheek work like this around St. Pete since two thousand three. He co-founded the Bluelucy gallery on Central Avenue, later opened his own gallery, and spent a decade helping organize the Shine mural festival. You may already own his handiwork, that \"Paris, Tokyo, London, St. Pete\" shirt that's been selling in local shops for over fifteen years.\n\nLook closely and you'll notice two real windows and a white door built right into the collage. And up in the corner, the trademark signature of Chad Myze.", "rev": {"date": "2026-08-16", "note": "revised script + Rob's cloned voice | 'Myze' = intentional PHONETIC for Chad Mize (voice said 'meeze') \u2014 do not 'fix' to 'Mize'."}}, {"id": 167, "artist": "Jujmo", "title": "", "year": 2021, "aud": "https://cdn.muralquest.app/audio/167.mp3?v=2", "text": "Growing up on military bases overseas, Cheryl Weber had almost no access to cartoons. When her family moved back to the States, anime hit her like a freight train. She decided, on the spot, to become an artist.\n\nShe works under the name Jujmo, and this is what she calls \"cute forward\" \u2014 saturated color, zero straight lines, blob creatures and smiley-faced amoebas piled on top of each other like a candy-colored coral reef. She earned her fine arts degree here in Tampa Bay and went freelance the day after graduation.\n\nYou may know her pastels. This is warmer \u2014 orange, teal, gold, brown. Look for the little smiling faces peeking out of the organic shapes, just dot eyes and a wide grin, tucked between the flowers and sparkles.", "rev": {"date": "2026-08-16", "note": "revised script + Rob's cloned voice"}}, {"id": 168, "artist": "Carrie Jadus", "title": "Are You My Mother?", "year": 0, "aud": "https://cdn.muralquest.app/audio/168.mp3?v=2", "text": "That oversized hundred-dollar bill in front of you swaps Benjamin Franklin for a pair of hands cradling a curled-up newborn. Carrie Jadus started it in twenty fifteen as a study for The Motherhood Project, then blew it up into this wall in twenty seventeen for the ArtsXchange grand opening. What the fetus and the currency have to do with each other, she leaves entirely up to you.\n\nJadus has a degree in electrical engineering. She designed radio-frequency circuits for years, then quit to paint full time. Now she turns out two to three hundred pieces a year, at every scale from notecards to fifty-foot walls.\n\nLook closely at the details. She copied real currency faithfully \u2014 the corners, the scrollwork, the teal and blue-green. But check the signature line. Where a Treasurer's name should be, it reads, \"Are You My Mother? \"", "rev": {"date": "2026-08-16", "note": "revised script + Rob's cloned voice"}}, {"id": 170, "artist": "Paola Delf\u00edn", "title": "La Emperatriz", "year": 2019, "aud": "https://cdn.muralquest.app/audio/170.mp3?v=2", "text": "That whole wall is one color story \u2014 shades of gray and blue-gray, no other pigment anywhere. Paola Delf\u00edn has been working like this since around twenty twelve. Monochromatic women, always tangled in leaves. Her walls run from New Delhi to Berlin to Buenos Aires, and now this one, in the Warehouse Arts District.\n\nShe calls it \"La Emperatriz\" \u2014 the empress. The work is about human bonds, intimacy, the things that connect us. Look at the two faces here: the larger woman on the left, crowned in flowers, looking back at you, and a smaller face to the right, half-hidden in the foliage.\n\nThe whole thing is painted with the precision of a pencil drawing, just blown up to the size of a building.", "rev": {"date": "2026-08-16", "note": "revised script + Rob's cloned voice"}}, {"id": 171, "artist": "Taj Tenfold", "title": "Sewing Seeds", "year": 2019, "aud": "https://cdn.muralquest.app/audio/171.mp3?v=2", "text": "That thread the figure is pulling through the waves is made of water. It's repairing damage to the ocean \u2014 a response to sea rise, told through the artist's Jamaican heritage.\n\nTaj Francis calls his style \"visual reggae.\" You may have seen it without knowing: he painted the cover art for John Wick 4, and promotional work for HBO's Lovecraft Country. Marvel and DC are on his client list too. He was born in Saint Andrew parish, Jamaica, and studied illustration in Kingston. For SHINE, in twenty nineteen, he went ninety feet wide and two stories tall right here.\n\nThe whole thing runs on jewel-toned Caribbean color \u2014 crimson, aqua, royal blue against a light background.", "rev": {"date": "2026-08-16", "note": "revised script + Rob's cloned voice"}}, {"id": 174, "artist": "Vitale Bros", "title": "", "year": 0, "aud": "https://cdn.muralquest.app/audio/174.mp3?v=2", "text": "That great horned owl in front of you comes from a family business that started on a paper napkin. Nineteen ninety-two, a sketch handed to a restaurant owner. That was the Vitale Brothers first mural.\n\nJohnny and Paul Vitale began hand-lettering signs around Tampa Bay. No formal training. Just artist parents, artist grandparents, and thirty-plus years at it. In the late nineties their warehouse studio hosted the shows that helped birth St. Pete's art scene. They've painted for the Rays, the Bucs, and the set of Spring Breakers. They also call themselves the mural police, restoring damaged walls around the city for free.\n\nLook at the eyes. Piercing orange-amber, staring straight back at you, against that dark military star and its fan of teal and coral stripes...", "rev": {"date": "2026-08-16", "note": "revised script + Rob's cloned voice"}}, {"id": 189, "artist": "Dulk", "title": "", "year": 2025, "aud": "https://cdn.muralquest.app/audio/189.mp3?v=2", "text": "Before Dulk painted this, he went up the Weeki Watch-ee River with the Florida Wildlife Corridor Foundation to see these animals in the wild. Every creature here is researched. The fantastical parts are the flourishes on top of real ecology.\n\nHe's from Valencia, Spain, where he grew up copying exotic animals out of his parents' old encyclopedias. He was studying economics \u2014 until a friend pulled him into graffiti. Within a year, he dropped economics for illustration.\n\nThis mural has two faces. On one, a Florida panther and a wild boar sprint through vegetation under a warm orange sky. Walk around to the other side and it goes underwater, deep teal, a manatee gliding through it.", "rev": {"date": "2026-08-16", "note": "revised script + Rob's cloned voice"}}, {"id": 194, "artist": "Blake Emory & Guillo Perez III", "title": "", "year": 2023, "aud": "https://cdn.muralquest.app/audio/194.mp3?v=2", "text": "Those tentacles aren't staying on the wall. Look at the corner \u2014 the octopus body sits flat on the concrete, but its arms peel forward, climbing past the wall plane and reaching out into open air. Part mural, part sculpture. Saturated color against raw industrial block.\n\nIt's a twenty twenty-three collaboration between Blake Emory and painter Guillo Perez the Third, wrapping the corner of Cage Brewing.\n\nEmory doesn't pick a lane. Neo-Renaissance figure painting, optic modernism, sculpture, set design, experimental film \u2014 all of it. In twenty twenty-five the city unveiled his life-size bronze of Babe Ruth at the called-shot moment, down on the Pier.\n\nHis murals turn up in places you don't expect around St. Pete, including a few rooftops. You find them by looking up.\n\nSo look up. Follow one tentacle to the point where it leaves the wall entirely.  Evidently this octopus plays the guitar.", "rev": {"date": "2026-08-16", "note": "revised script + Rob's cloned voice"}}];
const CB = "1787064503";
const orig = {}; DATA.forEach(r=>orig[r.id]=r.text);
document.getElementById('n').textContent = DATA.length;
const list = document.getElementById('list');
DATA.forEach(r=>{
  const c=document.createElement('div'); c.className='card'; c.dataset.id=r.id; c.dataset.rev = r.rev?'1':'0';
  c.dataset.search = ('#'+r.id+' '+r.artist+' '+(r.title||'')).toLowerCase();
  const badge = r.rev ? `<span class="rev" title="${(r.rev.note||'').replace(/"/g,'&quot;')}">✎ revised ${r.rev.date}</span>` : '';
  const cb = r.aud.includes('?')?'&':'?';
  c.innerHTML = `<div class="hdr"><label class="chk"><input type="checkbox" class="check"> reviewed</label>#${r.id} — ${r.artist}${r.title?' · "'+r.title+'"':''}${badge}</div>
    <div class="sub">${r.year||''}</div>
    <audio controls preload="none" src="${r.aud}${cb}cb=${CB}"></audio>
    <textarea>${r.text.replace(/</g,'&lt;')}</textarea>`;
  const ta=c.querySelector('textarea');
  const LS='mq_narr_'+r.id;
  const saved=localStorage.getItem(LS);
  if(saved!==null){ ta.value=saved; c.classList.toggle('changed', saved!==orig[r.id]); }
  ta.addEventListener('input',()=>{ localStorage.setItem(LS, ta.value); c.classList.toggle('changed', ta.value!==orig[r.id]); updateCount(); });
  const chk=c.querySelector('.check');
  chk.checked = localStorage.getItem('mq_narr_chk_'+r.id)==='1';
  c.classList.toggle('reviewed', chk.checked);
  chk.addEventListener('change',()=>{ localStorage.setItem('mq_narr_chk_'+r.id, chk.checked?'1':'0'); c.classList.toggle('reviewed', chk.checked); updateRevCount(); applyFilter(); });
  list.appendChild(c);
});
function updateCount(){ document.getElementById('chg').textContent = document.querySelectorAll('.card.changed').length + ' edited'; }
function updateRevCount(){ const n=document.querySelectorAll('.card .check:checked').length; document.getElementById('revcount').textContent = n+'/'+DATA.length+' reviewed'; }
function applyFilter(){
  const only=document.getElementById('only-rev').checked;
  const hide=document.getElementById('hide-checked').checked;
  const q=(document.getElementById('search').value||'').trim().toLowerCase();
  document.querySelectorAll('.card').forEach(c=>{
    const isRev=c.dataset.rev==='1'; const isChk=c.querySelector('.check').checked;
    let show=true;
    if(only&&!isRev)show=false;
    if(hide&&isChk)show=false;
    if(q&&!c.dataset.search.includes(q))show=false;
    c.style.display=show?'':'none';
  });
}
function exportEdits(){
  const out={}; document.querySelectorAll('.card.changed').forEach(c=>{ out[c.dataset.id]=c.querySelector('textarea').value.trim(); });
  const o=document.getElementById('out'); o.hidden=false; o.value=JSON.stringify(out,null,2); o.select();
}
function clearSaved(){ if(!confirm('Clear all locally-saved edits in this browser and reload? (Reviewed checkmarks are kept.)'))return; Object.keys(localStorage).filter(k=>k.startsWith('mq_narr_')&&!k.startsWith('mq_narr_chk_')).forEach(k=>localStorage.removeItem(k)); location.reload(); }
updateCount(); updateRevCount(); applyFilter();
</script></body></html>
